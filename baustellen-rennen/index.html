<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Baustellen-Rennen</title>
<meta name="description" content="Baustellen-Rennen: Kartrennen mit Mini-Baumaschinen. Wer hinten liegt, baut die Strecke um.">
<style>
:root {
  --gelb: #ffc61a; --orange: #ff7a1a; --schwarz: #17181a; --asphalt: #2a2d31; --grau: #6d7278;
  --weiss: #f5f1e6; --rot: #e0362c; --gruen: #3fb54a; --blau: #2f7fe6;
  --titel: Impact, Haettenschweiler, "Arial Narrow Bold", "Franklin Gothic Heavy", "Roboto Condensed", sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --streifen: repeating-linear-gradient(-45deg, var(--gelb) 0 14px, var(--schwarz) 14px 28px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #101214; color: var(--weiss); font-family: var(--text); font-size: 16px; -webkit-user-select: none; user-select: none; touch-action: none; }
#bild { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud, #schicht { position: fixed; inset: 0; pointer-events: none; }
#fuss { position: fixed; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 10px; letter-spacing: .08em; color: #fff; opacity: .32; pointer-events: none; z-index: 60; }
button, input, select { font: inherit; color: inherit; }
.versteckt { display: none !important; }

/* ── Menüs ───────────────────────────────────────────── */
#schicht { z-index: 40; display: flex; }
.schirm { pointer-events: auto; position: absolute; inset: 0; display: flex; padding: 3vh 4vw 5vh; overflow: auto; background: linear-gradient(90deg, rgba(16,18,20,.92) 0, rgba(16,18,20,.72) 46%, rgba(16,18,20,.08) 100%); }
.schirm.mitte { justify-content: center; background: rgba(16,18,20,.8); }
.tafel { width: min(560px, 100%); margin: auto 0; }
.schirm.mitte .tafel { margin: auto; }
.tafel.breit { width: min(920px, 100%); }
.logo { font-family: var(--titel); font-size: clamp(40px, 7.4vw, 92px); line-height: .86; letter-spacing: .01em; text-transform: uppercase; color: var(--gelb); transform: skewX(-7deg); text-shadow: 4px 4px 0 var(--schwarz), 7px 7px 0 var(--orange); margin: 0 0 6px; }
.logo small { display: block; font-size: .42em; color: var(--weiss); text-shadow: 3px 3px 0 var(--schwarz); letter-spacing: .06em; }
.band { height: 14px; background: var(--streifen); border-radius: 2px; margin: 14px 0 20px; max-width: 520px; }
h2 { font-family: var(--titel); font-weight: 400; font-size: clamp(30px, 4.6vw, 52px); text-transform: uppercase; letter-spacing: .03em; color: var(--gelb); margin: 0 0 4px; transform: skewX(-5deg); text-shadow: 3px 3px 0 var(--schwarz); }
h3 { font-family: var(--titel); font-weight: 400; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; color: var(--orange); margin: 18px 0 6px; }
p { line-height: 1.45; margin: 6px 0; max-width: 62ch; }
.knoepfe { display: grid; gap: 10px; max-width: 420px; }
.knopf { pointer-events: auto; cursor: pointer; border: 3px solid var(--schwarz); border-radius: 8px; background: var(--gelb); color: var(--schwarz); font-family: var(--titel); font-size: 24px; letter-spacing: .05em; text-transform: uppercase; padding: 9px 18px 8px; text-align: left; box-shadow: 0 5px 0 #000, inset 0 -5px 0 rgba(0,0,0,.14); transition: transform .08s, box-shadow .08s, background .12s; position: relative; }
.knopf:hover, .knopf:focus-visible { background: #ffe07a; outline: none; transform: translate(4px, -1px); }
.knopf:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
.knopf.klein { font-size: 17px; padding: 6px 12px 5px; box-shadow: 0 3px 0 #000; }
.knopf.zweit { background: var(--asphalt); color: var(--weiss); border-color: #000; }
.knopf.zweit:hover, .knopf.zweit:focus-visible { background: #3b3f45; }
.knopf.los { background: var(--orange); }
.knopf.los:hover, .knopf.los:focus-visible { background: #ff9a4f; }
.knopf:disabled { opacity: .45; cursor: default; transform: none; }
.zeile { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
.zeile > label, .zeile > .name { width: 128px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #c9c5b8; flex: none; }
.wahl { display: inline-flex; align-items: center; gap: 6px; }
.wahl b { min-width: 150px; text-align: center; font-family: var(--titel); font-weight: 400; font-size: 21px; letter-spacing: .04em; background: var(--asphalt); border: 2px solid #000; border-radius: 6px; padding: 4px 10px 3px; }
.pfeil { pointer-events: auto; cursor: pointer; width: 34px; height: 34px; border-radius: 6px; border: 2px solid #000; background: var(--gelb); color: #000; font-weight: 900; font-size: 18px; line-height: 1; box-shadow: 0 3px 0 #000; }
.pfeil:active { transform: translateY(3px); box-shadow: none; }
.feld { pointer-events: auto; background: var(--weiss); color: #111; border: 3px solid #000; border-radius: 6px; padding: 6px 10px; font-size: 18px; width: 210px; -webkit-user-select: text; user-select: text; }
.feld.code { font-family: var(--titel); font-size: 30px; letter-spacing: .3em; text-transform: uppercase; width: 190px; text-align: center; }
.farbfeld { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #000; display: inline-block; vertical-align: middle; }
input[type=range] { pointer-events: auto; width: 200px; accent-color: var(--orange); }
.hinweis { font-size: 13px; color: #b9b5a8; }
.karte { background: rgba(23,24,26,.86); border: 3px solid #000; border-left: 10px solid var(--gelb); border-radius: 8px; padding: 12px 16px; margin: 10px 0; }
.spalten { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0 28px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th { text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #b9b5a8; font-weight: 600; padding: 4px 8px; }
td { padding: 5px 8px; border-top: 1px solid rgba(255,255,255,.12); }
td.zahl, th.zahl { text-align: right; font-variant-numeric: tabular-nums; }
tr.ich td { background: rgba(255,198,26,.16); }
kbd { display: inline-block; min-width: 26px; text-align: center; background: var(--weiss); color: #111; border: 2px solid #000; border-bottom-width: 4px; border-radius: 5px; padding: 0 6px; font: 600 13px var(--text); margin: 1px; }
.abzeichen { display: inline-block; background: var(--gelb); color: #000; border: 2px solid #000; border-radius: 99px; padding: 2px 12px; font-size: 13px; font-weight: 700; margin: 3px 4px 3px 0; }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 70; background: var(--rot); color: #fff; border: 3px solid #000; border-radius: 8px; padding: 10px 18px; max-width: min(640px, 92vw); font-weight: 600; box-shadow: 0 5px 0 #000; pointer-events: auto; }
.spielerliste .zeile { background: rgba(0,0,0,.35); border-radius: 6px; padding: 5px 10px; margin: 4px 0; }
.bereit { color: var(--gruen); font-weight: 700; }

/* ── Anzeige im Rennen (pro Spieler ein .hud) ─────────── */
.hud { position: absolute; overflow: hidden; --m: 1; font-family: var(--titel); letter-spacing: .03em; text-shadow: 2px 2px 0 #000; }
.hud > div { position: absolute; }
.h-platz { left: calc(var(--m) * 16px); top: calc(var(--m) * 10px); font-size: calc(var(--m) * 78px); line-height: .9; color: var(--gelb); transform: skewX(-7deg); }
.h-platz small { font-size: .36em; color: var(--weiss); }
.h-runde { left: calc(var(--m) * 18px); top: calc(var(--m) * 86px); font-size: calc(var(--m) * 22px); }
.h-runde b { font-weight: 400; color: var(--gelb); }
.h-zeit { left: calc(var(--m) * 18px); top: calc(var(--m) * 114px); font: 600 calc(var(--m) * 14px) var(--text); letter-spacing: 0; font-variant-numeric: tabular-nums; line-height: 1.35; }
.h-karte { right: calc(var(--m) * 12px); top: calc(var(--m) * 10px); width: calc(var(--m) * 190px); height: calc(var(--m) * 190px); background: radial-gradient(circle at 50% 45%, rgba(38,44,52,.72), rgba(10,12,15,.72)); border: 1.5px solid rgba(255,255,255,.2); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.6); }
.h-karte canvas { width: 100%; height: 100%; display: block; }
.h-tempo { right: calc(var(--m) * 10px); bottom: calc(var(--m) * 8px); width: calc(var(--m) * 150px); height: calc(var(--m) * 150px); text-align: center; line-height: 1; }
.h-tempo svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
.h-tempo .scheibe { fill: rgba(12,14,17,.6); stroke: rgba(255,255,255,.16); stroke-width: 1.2; }
.h-tempo .bogen { fill: none; stroke: rgba(255,255,255,.8); stroke-width: 2.2; stroke-linecap: round; }
.h-tempo .rot { fill: none; stroke: #ff7a1a; stroke-width: 3.4; stroke-linecap: round; }
.h-tempo .strich { stroke: #fff; stroke-width: 1.7; }
.h-tempo .strich.fein { stroke: rgba(255,255,255,.55); stroke-width: 1; }
.h-tempo text { fill: #d6d2c4; font: 600 7px var(--text); text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
.h-tempo .ladegrund { fill: none; stroke: rgba(0,0,0,.5); stroke-width: 5.5; stroke-linecap: round; }
.h-tempo .lade { fill: none; stroke: var(--gelb); stroke-width: 4.2; stroke-linecap: round; stroke-dasharray: 0 200; opacity: 0; }
.h-tempo .nadel { transform-origin: 60px 60px; transform: rotate(140deg); transition: transform .08s linear; }
.h-tempo .nadel path { fill: #ff3b30; stroke: rgba(0,0,0,.5); stroke-width: .5; }
.h-tempo .nabe { fill: #e9e6dc; stroke: #000; stroke-width: 1; }
.h-tempo > span { position: absolute; left: 0; right: 0; top: 65%; font-size: calc(var(--m) * 26px); }
.h-tempo small { position: absolute; left: 0; right: 0; top: 85%; font-size: calc(var(--m) * 11px); color: #d6d2c4; }
.hud.mit-touch .h-tempo { transform: scale(.72); transform-origin: right bottom; }
.h-abstand b { font-weight: 700; color: var(--gelb); font-variant-numeric: tabular-nums; }
.h-mitte { left: 50%; top: calc(var(--m) * 8px + 38px); transform: translateX(-50%); text-align: center; white-space: nowrap; }
.h-warnung { display: inline-block; background: var(--gelb); color: #000; text-shadow: none; border: 3px solid #000; border-radius: 8px; padding: 3px 14px 2px; font-size: calc(var(--m) * 24px); box-shadow: 0 4px 0 #000; animation: blink .5s steps(2) infinite; }
.h-warnung .pf { display: inline-block; font-size: 1.25em; line-height: .8; vertical-align: -0.08em; margin: 0 4px; }
@keyframes blink { 50% { background: var(--orange); } }
.h-meldung { margin-top: 6px; font-size: calc(var(--m) * 22px); color: var(--weiss); min-height: 1.2em; transition: opacity .3s; }
.h-meldung.plus { color: var(--gelb); }
.h-gross { left: 50%; top: 36%; transform: translate(-50%, -50%) skewX(-7deg); font-size: calc(var(--m) * 150px); color: var(--gelb); text-shadow: 6px 6px 0 #000; pointer-events: none; }
.h-gross.klein { font-size: calc(var(--m) * 64px); }
.h-abstand { left: calc(var(--m) * 18px); bottom: calc(var(--m) * 14px); font: 600 calc(var(--m) * 15px) var(--text); letter-spacing: 0; line-height: 1.3; }
.h-bau { left: 50%; bottom: calc(var(--m) * 12px); transform: translateX(-50%); display: flex; align-items: flex-end; gap: calc(var(--m) * 6px); }
.h-bp { margin-right: calc(var(--m) * 8px); text-align: center; line-height: .95; }
.h-bp b { display: block; font-weight: 400; font-size: calc(var(--m) * 44px); color: var(--gelb); }
.h-bp span { font-size: calc(var(--m) * 15px); }
.h-bp .lade { width: calc(var(--m) * 56px); height: calc(var(--m) * 7px); background: rgba(0,0,0,.55); border: 2px solid #000; border-radius: 5px; overflow: hidden; margin: 3px auto 0; }
.h-bp .lade i { display: block; height: 100%; background: var(--gelb); width: 0; }
.bw { position: relative; width: calc(var(--m) * 68px); height: calc(var(--m) * 74px); background: rgba(23,24,26,.82); border: 3px solid #000; border-radius: 8px; text-align: center; text-shadow: none; color: var(--weiss); pointer-events: auto; cursor: pointer; }
.bw svg { width: 62%; height: 46%; margin-top: 8%; display: block; margin-left: auto; margin-right: auto; }
.bw .n { display: block; font: 600 calc(var(--m) * 10px) var(--text); letter-spacing: 0; white-space: nowrap; overflow: hidden; }
.bw .p { position: absolute; right: -6px; top: -8px; background: var(--gelb); color: #000; border: 2px solid #000; border-radius: 99px; font-size: calc(var(--m) * 14px); min-width: calc(var(--m) * 24px); padding: 0 3px; }
.bw .t { position: absolute; left: 3px; top: 1px; font: 700 calc(var(--m) * 11px) var(--text); color: #b9b5a8; }
.bw.zu { opacity: .38; filter: grayscale(1); }
.bw.gegen { border-top: 5px solid var(--rot); }
.bw.selbst { border-top: 5px solid var(--gruen); }
.bw.aktiv { background: var(--gelb); color: #000; transform: translateY(calc(var(--m) * -8px)); box-shadow: 0 5px 0 #000; }
.bw.aktiv .t { color: #000; }
.h-bauinfo { left: 50%; bottom: calc(var(--m) * 100px); transform: translateX(-50%); font: 600 calc(var(--m) * 13px) var(--text); letter-spacing: 0; white-space: nowrap; background: rgba(0,0,0,.45); border-radius: 99px; padding: 2px 12px; }
.h-falsch { left: 50%; top: 52%; transform: translateX(-50%); font-size: calc(var(--m) * 34px); color: var(--rot); }
#pauseknopf { position: fixed; left: 50%; top: 6px; transform: translateX(-50%); z-index: 30; pointer-events: auto; opacity: .55; }
#debug { position: fixed; left: 6px; bottom: 16px; z-index: 80; font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,.6); color: #9f9; padding: 4px 8px; border-radius: 4px; white-space: pre; pointer-events: none; }
#sim { position: fixed; inset: 0; overflow: auto; background: #17181a; padding: 24px; z-index: 90; pointer-events: auto; -webkit-user-select: text; user-select: text; }
#sim table { max-width: 900px; }
.balken { height: 16px; background: #000; border: 2px solid #000; border-radius: 6px; overflow: hidden; max-width: 520px; }
.balken i { display: block; height: 100%; background: var(--streifen); width: 0; }
.gut { color: var(--gruen); font-weight: 700; } .schlecht { color: var(--rot); font-weight: 700; }
/* Touch-Steuerung */
.touch { position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(255,255,255,.14); border: 3px solid rgba(0,0,0,.5); color: #fff; font: 400 22px var(--titel); display: flex; align-items: center; justify-content: center; text-shadow: 2px 2px 0 #000; }
@media (max-height: 520px) { .logo { font-size: 44px; } .knopf { font-size: 19px; padding: 6px 14px 5px; } .band { margin: 8px 0 10px; } }
.schau{display:grid;grid-template-columns:1.25fr 1fr;gap:6px;align-items:center;margin:8px 0;background:linear-gradient(#232931,#0e1114);border-radius:12px;overflow:hidden}
.schau canvas{width:100%;height:168px;display:block}
.schau-text{padding:10px 14px 10px 0;display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:#e9edf2;text-align:left}
.schau-text b{font-size:1.15rem;line-height:1.15}
.schau-text small,.h-los small{opacity:.7;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem}
.plus{color:#7fe08a}.minus{color:#ff9d8f}
@media(max-width:560px){.schau{grid-template-columns:1fr}.schau canvas{height:140px}.schau-text{padding:0 12px 10px}}
.h-los{position:absolute;left:50%;top:20%;transform:translateX(-50%);background:rgba(14,17,21,.88);color:#fff;border-radius:14px;padding:14px 22px;text-align:center;min-width:250px;max-width:88%;border:1px solid rgba(255,255,255,.16)}
.h-los small{display:block}.h-los b{display:block;font-size:1.7rem;margin:2px 0}.h-los span{display:block;font-size:.9rem;margin-top:4px}
/* ── Neues, ruhigeres Erscheinungsbild (überschreibt die älteren Regeln weiter oben) ── */
:root{--gold:#d8b46a;--tinte:#0f1216;--glas:rgba(16,19,24,.78);--linie:rgba(255,255,255,.12);--text:#eef1f4;--leise:#9aa3ad}
.schirm{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:linear-gradient(90deg,rgba(8,10,13,.8),rgba(8,10,13,.3) 55%,rgba(8,10,13,0))}
.tafel{background:var(--glas);border:1px solid var(--linie);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:22px 24px}
.logo,.tafel h1,.tafel h2{font-style:normal;text-transform:none;letter-spacing:-.01em;font-weight:650;color:var(--text);text-shadow:none}
.logo small{color:var(--gold);font-weight:500}
.tafel h3{font-style:normal;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:600;color:var(--gold)}
.band{height:2px;background:linear-gradient(90deg,var(--gold),transparent);border:0;opacity:.8}
.zeile label{text-transform:none;letter-spacing:0;color:var(--leise);font-size:.9rem}
.wahl b,.feld{background:rgba(255,255,255,.06);border:1px solid var(--linie);border-radius:10px;color:var(--text);box-shadow:none;font-weight:500}
.feld:focus{outline:2px solid var(--gold);outline-offset:1px}
.pfeil{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--linie);border-radius:10px;box-shadow:none}
.pfeil:hover{background:var(--gold);color:var(--tinte)}
.knopf{font-style:normal;text-transform:none;letter-spacing:.01em;font-weight:600;background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--linie);border-radius:12px;box-shadow:none;transition:background .15s,transform .15s}
.knopf:hover,.knopf:focus-visible{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.knopf.los{background:linear-gradient(180deg,#e6c47c,#c79f52);color:#1a1408;border-color:transparent}
.knopf.los:hover,.knopf.los:focus-visible{background:linear-gradient(180deg,#f0d08c,#d2aa5c)}
.knopf.zweit{background:transparent;color:var(--leise)}
.karte{background:rgba(255,255,255,.05);border:1px solid var(--linie);border-left:3px solid var(--gold);border-radius:12px;box-shadow:none;color:var(--text)}
.hinweis{color:var(--leise)}
kbd{background:rgba(255,255,255,.1);border:1px solid var(--linie);border-radius:6px;color:var(--text);box-shadow:none}
.tafel table th{color:var(--gold);font-weight:600;text-transform:none}
input[type=range]{accent-color:var(--gold)}
.schirm{overflow-y:auto;-webkit-overflow-scrolling:touch}
.schirm h1,.schirm h2{font-style:normal!important;text-transform:none!important}
.h-gross{font-style:normal;font-weight:800;letter-spacing:.02em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6)}
@media(max-height:780px){.schau canvas{height:118px}.tafel{padding:14px 18px}}
/* Siegerpodest im Ergebnis */
.schau.podest{display:block;margin:6px 0 10px;background:radial-gradient(ellipse at 50% 30%,#2b323b,#0b0d10 75%)}
.schau.podest canvas{height:200px}
@media(max-height:780px){.schau.podest canvas{height:150px}}
/* Steckbrief der Strecke in der Streckenwahl */
.streckenkarte{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;margin:4px 0 10px;padding:10px 12px 10px 10px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--linie);border-radius:12px}
.streckenkarte:empty{display:none}
.streckenkarte.neu{animation:skEin .35s ease}
.streckenkarte canvas{width:118px;height:118px;display:block;border-radius:9px;background:radial-gradient(circle at 40% 35%,rgba(120,140,110,.28),rgba(0,0,0,.3))}
.sk-text{display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--text);min-width:0;text-align:left}
.sk-text b{font-size:1.02rem;font-weight:650}
.sk-text>span{color:var(--leise);line-height:1.3}
.sk-text ul{list-style:none;margin:5px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px}
.sk-text li{display:flex;align-items:center;gap:5px;font-size:.8rem}
.sk-text svg{width:15px;height:15px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes skEin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:560px),(max-height:780px){.streckenkarte{grid-template-columns:84px 1fr}.streckenkarte canvas{width:84px;height:84px}}
.h-platz{font-style:normal;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.h-bau .bw{background:rgba(16,19,24,.72);border:1px solid var(--linie);border-radius:12px;box-shadow:none}
.h-bp b{color:var(--gold)}
/* Bestenliste (Teil 93): Tabelle mit Gold, Silber, Bronze, Bot-Zeile, Steckbrief, Anzeige im Rennen und Fenster */
.bl-kopf{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;margin-top:6px}
.bl-kopf canvas{width:150px;height:150px;display:block;border-radius:12px;background:radial-gradient(circle at 40% 35%,rgba(120,140,110,.28),rgba(0,0,0,.3))}
.bl-tabelle td,.bl-tabelle th{padding:5px 8px;vertical-align:middle}
.bl-rang{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;font-weight:700;font-size:.82rem;background:rgba(255,255,255,.08)}
.bl-p1 .bl-rang{background:linear-gradient(180deg,#f3d27a,#c9a03f);color:#1a1408}
.bl-p2 .bl-rang{background:linear-gradient(180deg,#eef0f2,#a9b0b7);color:#15181b}
.bl-p3 .bl-rang{background:linear-gradient(180deg,#e7ab7c,#a8693f);color:#1b0f06}
.bl-bot td{color:#cdd5dd}
.bl-bot small{color:var(--leise);font-size:.75rem}
.bl-robo{width:16px;height:16px;fill:var(--gold);vertical-align:-3px;margin-right:6px}
.bl-name{overflow-wrap:anywhere}
.bl-handy{display:none}
.bl-neu{margin:.2em 0 .7em;color:var(--gold);font-weight:600;line-height:1.45}
.bl-stand{margin:0 0 6px;font-size:.78rem;color:var(--leise);min-height:1em}
.sk-rekord{list-style:none;margin:6px 0 0;padding:0;font-size:.78rem;color:var(--leise);line-height:1.4}
.sk-text .sk-rekord li{display:block;font-size:inherit}
.sk-rekord li:first-child{color:var(--text)}
.sk-rekord b{color:var(--gold);font-weight:600}
.h-rekord{color:var(--gelb);font-size:.92em}
.dialog{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,7,10,.55);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
.dialog .tafel{width:min(440px,100%);margin:0}
.dialog h2{font:650 1.45rem/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-style:normal;text-transform:none;letter-spacing:-.01em;text-shadow:none;color:var(--text);margin:0 0 8px}
.dialog p{margin:0 0 10px;color:var(--leise)}
.dialog .feld{display:block;width:100%;box-sizing:border-box;font-size:1.1rem;padding:10px 12px;margin:4px 0 14px}
@media(max-width:560px){.bl-kopf{grid-template-columns:1fr}.bl-kopf canvas{width:110px;height:110px}.bl-datum{display:none}.bl-tabelle td,.bl-tabelle th{padding:4px 5px}.bl-auto,.bl-was{display:none}.bl-handy{display:block;color:var(--leise);font-size:.75rem}}
</style>
</head>
<body>
<canvas id="bild"></canvas>
<div id="hud"></div>
<div id="schicht"></div>
<div id="fuss">Erstellt von JL</div>
<script id="logik">
/* ══════════════════════════════════════════════════════════════════════════
   BAUSTELLEN-RENNEN – ein Multiplayer-Kartrennen für den Browser
   --------------------------------------------------------------------------
   Aufbau dieser Datei:
     TEIL 1  CONFIG            alle Balancing-Werte (hier darfst du schrauben!)
     TEIL 2  Hilfsfunktionen
     TEIL 3  Strecken-Daten    (Kontrollpunkte, Slots, Abkürzungen, Deko)
     TEIL 4  Strecken-Aufbau   (Kurve abtasten, Ideallinie, Slots)
     TEIL 5  Rennen            (Physik, Regeln, Baupunkte, Bauen)
     TEIL 6  Bots
     TEIL 7  Simulation        (?sim=200)
     ───── ab hier braucht es einen Browser ─────
     TEIL 8  Grafik (three.js) TEIL 9 Ton   TEIL 10 Eingabe
     TEIL 11 Netzwerk (PeerJS) TEIL 12 Anzeige und Menüs   TEIL 13 Ablauf
   Die Teile 1–7 sind reine Spiel-Logik und laufen auch ohne Grafik.
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   TEIL 1: CONFIG – alle Balancing-Werte an einem Ort
   Längen in Metern, Zeiten in Sekunden, Tempo in m/s (30 m/s = 108 km/h).
   ══════════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  version: '1.0',

  // ── Fahrphysik ──────────────────────────────────────────────────────────
  fahren: {
    vmax: 30,              // Höchsttempo auf der Fahrbahn
    beschleunigung: 31,    // Anfangs-Beschleunigung in m/s²; nimmt bis vmax ab (≈ 2,5 s bis Höchsttempo)
    bremsen: 36,           // Bremsverzögerung in m/s²
    ausrollen: 6,          // Verzögerung ohne Gas in m/s²
    rueckwaertsVmax: 9,    // Höchsttempo rückwärts
    lenkrateLangsam: 2.5,  // Drehrate bei wenig Tempo (rad/s)
    lenkrateSchnell: 0.82, // Drehrate bei Höchsttempo (rad/s); Wendekreis-Radius ≈ vmax / Drehrate
    lenkAnsprechen: 9,     // wie schnell die Lenkung dem Tastendruck folgt (1/s); höher = direkter
    kurvenVerlust: 0.07,   // Tempoverlust bei vollem Lenkeinschlag ohne Drift (Anteil von vmax)
    offroadFaktor: 0.55,   // Höchsttempo neben der Fahrbahn (Anteil von vmax)
    offroadBremse: 2.6,    // wie schnell man neben der Fahrbahn auf dieses Tempo abfällt (1/s)
    tempoAbbau: 1.5,       // wie schnell Tempo über dem Limit (z. B. nach einem Boost) abgebaut wird (1/s)
    hangEinfluss: 5,       // Einfluss von Steigungen (m/s² bei 100 % Steigung)
    schwerkraft: 28,       // Fallbeschleunigung in der Luft (m/s²)
    luftLenkung: 0.25,     // Lenkwirkung in der Luft (Anteil)
    wandAbprall: 0.35,     // wie stark man von Wänden abprallt (0 = gar nicht, 1 = voll)
    wandVerlust: 0.55,     // Tempoverlust bei frontalem Wandkontakt (Anteil)
    wandSchleifen: 0.5,    // Tempoverlust pro Sekunde beim Entlangschleifen (Anteil)
    kartRadius: 1.05,      // Kollisionsradius eines Fahrzeugs
    stoss: 0.55,           // Stärke des Schubsens zwischen Fahrzeugen
    schubAbbau: 5,         // wie schnell ein Schubs abklingt (1/s)
  },

  // ── Driften und Mini-Turbo ──────────────────────────────────────────────
  // Beläge der Fahrbahn. tempo: Anteil am Höchsttempo · lenk: Anteil an der Drehrate (kleiner = das Auto lenkt träger ein)
  // ruettel: wie stark die Federung arbeitet (nur Optik). Die Bots rechnen mit diesen Werten und bremsen früher.
  belag: {
    asphalt:  { tempo: 1.0,  lenk: 1.0,  ruettel: 1 },
    pflaster: { tempo: 0.99, lenk: 0.97, ruettel: 3.2 },   // Kopfsteinpflaster: rüttelt, etwas weniger Halt
    platten:  { tempo: 1.0,  lenk: 0.98, ruettel: 1.4 },   // grosse Steinplatten (Tempelhof): fast wie Asphalt
    schotter: { tempo: 0.97, lenk: 0.95, ruettel: 2.6 },   // Naturstrasse
    schnee:   { tempo: 0.96, lenk: 0.9,  ruettel: 1.6 },   // fester Schnee: weicher, lenkt träger
    eis:      { tempo: 1.0,  lenk: 0.74, ruettel: 0.6 },   // Eis: schnell, aber das Auto dreht nur zögernd ein
    holz:     { tempo: 1.0,  lenk: 1.0,  ruettel: 2.2 },   // Bohlen
    kies:     { tempo: 1.0,  lenk: 1.0,  ruettel: 2.6 },   // Nebenwege
    sand:     { tempo: 0.95, lenk: 0.9,  ruettel: 1.8 },   // Wüstensand: bremst, das Heck schwimmt etwas
    nass:     { tempo: 1.0,  lenk: 0.86, ruettel: 1 },     // nasser Asphalt: gleich schnell, aber weniger Halt in Kurven
    gitter:   { tempo: 1.0,  lenk: 0.94, ruettel: 2.4 },   // Gitterrost auf Brücken: summt und rüttelt
  },

  drift: {
    minTempo: 13,          // Mindesttempo, um einen Drift zu starten
    lenkMitte: 1.0,        // Drehrate im Drift ohne Lenkeinschlag (Vielfaches der normalen Drehrate)
    lenkBereich: 0.55,     // ± so viel mehr/weniger Drehrate durch Lenken im Drift
    winkel: 0.42,          // sichtbarer Schräglauf im Drift (rad)
    stufe1: 1.0,           // ab dieser Driftdauer blaue Funken → kleiner Mini-Turbo
    stufe2: 2.0,           // ab dieser Driftdauer orange Funken → grosser Mini-Turbo
    turbo1: { dauer: 0.8, staerke: 1.20 },   // Dauer (s) und Tempo-Faktor
    turbo2: { dauer: 1.4, staerke: 1.27 },
  },

  // ── Boost allgemein ─────────────────────────────────────────────────────
  boost: {
    beschleunigung: 2.6,   // im Boost beschleunigt man so viel stärker (Faktor)
    offroadFaktor: 0.85,   // im Boost ist man neben der Fahrbahn weniger langsam
  },

  // ── Boost-Felder: leuchtende Pfeilfelder auf der Fahrbahn ───────────────
  // Wer darüberfährt, bekommt einmal Schub wie ein Mini-Turbo. Die Felder liegen meist an Kurvenausgängen
  // etwas neben der Ideallinie: Wer sie nimmt, fährt einen kleinen Umweg, ist danach aber schneller.
  boostfeld: {
    anzahl: 5,             // so viele Felder setzt die Strecke selbst, wenn sie keine eigene Liste hat (4–6 sind gut)
    dauer: 1.0,            // so lange hält der Schub (s)
    staerke: 1.2,          // Tempo-Faktor im Schub (Mini-Turbo: 1.2)
    laenge: 7,             // Länge eines Feldes in Fahrtrichtung (m)
    breite: 4,             // Breite eines Feldes (m); man trifft es, wenn die Fahrzeugmitte darauf liegt (+0.7 m Toleranz)
    neben: 0.55,           // automatische Felder liegen so weit von der Ideallinie zur Mitte hin (Anteil, 0 = auf der Linie)
  },

  // ── Windschatten ────────────────────────────────────────────────────────
  windschatten: {
    zeit: 1.5,             // so lange muss man dicht hinter jemandem bleiben
    distanz: 14,           // maximaler Abstand nach vorn (m)
    breite: 2.0,           // maximaler seitlicher Versatz (m)
    bonus: 0.02,          // + so viel Höchsttempo (Anteil)
    nachlauf: 0.7,         // so lange hält der Bonus nach dem Ausscheren noch an (s)
    minTempo: 17,          // nur oberhalb dieses Tempos
  },

  // ── Baupunkte (BP) ──────────────────────────────────────────────────────
  bp: {
    start: 0,              // BP beim Start
    max: 20,               // höchstens so viele BP gleichzeitig
    ueberholen: 3,         // BP pro überholtem Fahrer
    meterProBP: 15,        // 1 BP für so viele Meter, die man auf den Vordermann gutmacht
    letzterFaktor: 1.5,    // der Letzte sammelt so viel schneller (linear vom 1. bis zum letzten Platz)
    bestwertVerfall: 1.0,  // der Aufhol-Bestwert «verjährt» mit so vielen Metern pro Sekunde
    ueberholAbstand: 2.5,  // man muss so viele Meter vorbei sein, damit es als Überholen zählt
    ueberholPause: 8,      // dasselbe Paar zählt frühestens nach so vielen Sekunden wieder
    geschenktZeit: 6,           // s: Wer in eine Baustelle gefahren ist, bringt so lange keine BP fürs Überholen/Aufholen (das wäre geschenkt)
    startPause: 8,         // s: in den ersten Sekunden nach dem Start gibt es keine BP (das Startgedränge zählt nicht als Aufholen)
    naheFaktor: 0.25,       // Lohn-Anteil direkt hinter dem Führenden (wer an der Spitze klebt, liegt nicht «hinten»)
    vollerRueckstand: 110, // m: ab so viel Rückstand auf den Führenden gibt es den vollen Lohn (0 = Rückstand egal)
    rangVerfall: 15,       // s: so lange dauert es, bis ein verlorener Platz wieder als «neu gewonnen» zählt (0 = jedes Überholen zählt voll)
    erkauftZeit: 4,        // s: nach eigener Rampe oder Abkürzung gibt es so lange keine BP (gekaufte Plätze zahlen sich nicht selbst zurück; 0 = aus)
    fuehrenderVerdient: false, // true = auch der Führende sammelt BP (nicht empfohlen)
  },

  // ── Bauen ───────────────────────────────────────────────────────────────
  bau: {
    preise: {              // Preise in BP
      rampe: 3, abkuerzung: 6, pylonen: 2, schlamm: 3, absperrung: 4, umleitung: 6,
    },
    aufbauZeit: 2.0,       // Hindernisse bauen sich so lange sichtbar auf, erst dann sind sie fest
    aufbauZeitEigen: 1.0,  // eigene Bauwerke (Rampe, Abkürzung) sind schneller fertig
    minVorlauf: 3.0,       // Hindernisse nur mit mindestens so viel Fahrzeit vor jedem Betroffenen
    minVorlaufEigen: 1.3,  // eigene Bauwerke: so viel Fahrzeit muss der Slot noch entfernt sein
    schutzZeit: 3.0,       // nach einem Treffer so lange Schutz vor weiteren Hindernissen
    maxProSpieler: 2,      // aktive Hindernisse pro Spieler
    maxGesamt: 6,          // aktive Hindernisse insgesamt
    maxSchlenker: 4,       // m: Sperren stehen so, dass die Ideallinie höchstens so weit im gesperrten Teil liegt (sonst bleibt sie frei)
    minAbstand: 55,        // Mindestabstand zwischen zwei Hindernissen (m)
    wartezeit: 4.0,        // Pause zwischen zwei Bauaktionen desselben Spielers
    lebensdauer: 30,       // Hindernisse verschwinden spätestens nach so vielen Sekunden
    umleitungDauer: 20,    // eine Umleitung sperrt den kurzen Weg so lange
    reichweite: 0.62,      // ein Hindernis muss innert dieses Streckenanteils einen Betroffenen erreichen
    eigenLebensdauer: 75,  // eigene Bauwerke verfallen spätestens nach so vielen Sekunden (≈ 1 Runde)
  },

  // ── Wirkung der Bauwerke ────────────────────────────────────────────────
  wirkung: {
    rampe: { laenge: 7, breite: 5.5, hoehe: 1.5, boostDauer: 1.5, boostStaerke: 1.30 },
    pylonen: { tempoFaktor: 0.72, radius: 0.4, treffer: 1.0, reihenAbstand: 24 },
    schlamm: { laenge: 15, tempoFaktor: 0.5, lenkFaktor: 0.55, anteil: 0.5 },
    absperrung: { anteil: 0.6, tempoFaktor: 0.42, lahmZeit: 0.6, lahmFaktor: 0.55 },
    minTempoNachTreffer: 8,   // langsamer wird man durch einen Treffer nie (man bleibt nie stehen)
    umleitungLaenge: 34,      // Länge der schrägen Leitwand (m)
  },

  // ── Die 8 Autos: jedes hat eine Stärke und eine Schwäche ────────────────
  // Alle Werte sind Faktoren zum Normalwert (1 = wie oben eingestellt). Nicht genannte Werte sind normal.
  //   vmax: Höchsttempo            beschl: Beschleunigung         lenk: Drehrate
  //   ansprechen: wie direkt die Lenkung reagiert                 kurve: Tempoverlust beim Lenken (0 = keiner)
  //   offroad: Tempo neben der Fahrbahn    schlamm: Tempo im Schlammloch    abkuerzung: Tempo auf Abkürzungen (Kies)
  //   treffer: wie stark Baustellen-Treffer bremsen               wind: Stärke des Windschattens
  //   masse: Gewicht beim Rempeln  driftLaden: Zeit bis zum Mini-Turbo      turbo: Stärke des Mini-Turbos
  //   rampe: Dauer des Rampen-Schubs       baurabatt: so viele BP kosten Bauwerke weniger (kein Faktor)
  fahrzeuge: {
    // «vmax» und «lenk» sind zusätzlich fein abgestimmt (tools/tune.js), damit alle 8 Autos auf beiden Strecken etwa gleich oft gewinnen.
    sport:       { vmax: 1.012, beschl: 0.86, lenk: 0.99, offroad: 0.7, schlamm: 0.75, abkuerzung: 0.93 },   // Stärke: Höchsttempo · Schwäche: Kies und Schlamm
    limo:        { wind: 2.5, ansprechen: 0.6, vmax: 1.001 },                                                // Stärke: Windschatten · Schwäche: träge Lenkung
    panzer:      { treffer: 0.3, schlamm: 1.5, beschl: 0.92, vmax: 1.011, lenk: 0.958 },                     // Stärke: Treffer bremsen kaum · Schwäche: Beschleunigung
    transporter: { masse: 3, kurve: 1.35, lenk: 0.992, vmax: 1.005 },                                        // Stärke: schiebt andere weg · Schwäche: enge Kurven
    gelaende:    { offroad: 1.65, abkuerzung: 1.08, schlamm: 1.3, vmax: 0.998, lenk: 0.99 },                 // Stärke: neben der Strecke und auf Abkürzungen · Schwäche: Höchsttempo
    pickup:      { baurabatt: 1, vmax: 0.997, lenk: 0.99 },                                                  // Stärke: Bauwerke 1 BP günstiger · Schwäche: etwas langsamer
    renn:        { kurve: 0.5, lenk: 1.02, turbo: 1.15, treffer: 1.5, vmax: 0.982 },                         // Stärke: Kurvenlage, Drift-Schub · Schwäche: Treffer bremsen stärker
    rallye:      { driftLaden: 0.7, rampe: 1.5, vmax: 0.973, lenk: 1.078 },                                  // Stärke: Drift lädt schneller, Rampen · Schwäche: Höchsttempo
  },

  // ── Rennen ──────────────────────────────────────────────────────────────
  rennen: {
    runden: 3,             // Standard-Rundenzahl
    maxFahrer: 8,          // Obergrenze pro Rennen (abgestimmt auf 8)
    countdown: 3,          // Sekunden bis «Los!»
    startAbstand: 3.6,     // Abstand der Startplätze in Fahrtrichtung (m)
    startSeite: 2.7,       // seitlicher Versatz der Startplätze (m)
    endeNachSieger: 40,    // so lange läuft das Rennen nach dem ersten Zieleinlauf höchstens weiter
    resetNachStillstand: 2.2, // wer so lange feststeckt, wird automatisch zurückgesetzt
    resetTiefe: 6,         // wer so tief unter die Strecke fällt, wird zurückgesetzt
    geistZeit: 1.5,        // nach dem Zurücksetzen so lange ohne Fahrzeug-Kollisionen
  },

  // ── Bots (sie fahren mit derselben Physik wie Menschen, ohne Schummeln) ──
  bots: {
    stufen: {
      //            mut: wie nah am Limit sie Kurven fahren (1 = perfekt)
      //            linie: seitliche Ungenauigkeit in m      drift: Anteil der Kurven, in denen sie driften
      //            sehen: Wahrscheinlichkeit, ein Hindernis rechtzeitig zu sehen
      //            bauen: Bau-Freude (0–1)                  fehler: Fahrfehler pro Minute
      leicht: { mut: 0.76, linie: 1.5, drift: 0.50, sehen: 0.75, bauen: 0.45, fehler: 1.6 },
      mittel: { mut: 0.83, linie: 0.9, drift: 0.90, sehen: 0.92, bauen: 0.75, fehler: 0.8 },
      // «Schwer» ist ein Profi und fast unschlagbar: perfekte Linie, keine Fehler, sieht jedes Hindernis, trifft jedes Boost-Feld,
      // bremst spät (bremsen: Verzögerung in m/s², mit der er rechnet; die anderen rechnen vorsichtig mit 22) und driftet
      // schon in sanfteren Kurven (driftAb). tempo: Tempo-Vorteil auf das Höchsttempo (1.03 = 3 %, mehr ist nicht erlaubt).
      schwer: { mut: 1.04, linie: 0, drift: 1.00, sehen: 1.0, bauen: 1.0, fehler: 0, profi: true, bremsen: 34, driftAb: 0.5, tempo: 1.03 },
    },
    zielVordermann: 0.8,   // Anteil der Hindernisse, die Bots ihrem direkten Gegner statt dem Führenden in den Weg bauen
    streuung: 0.02,        // zufällige Tagesform: ± so viel Unterschied im Mut zwischen gleich starken Bots
    ausweichWeg: 45,       // m: so weit vor einem Hindernis beginnen Bots, zur Lücke zu ziehen
    vorausHindernis: 0.8,  // vor einem Hindernis zielen Bots kürzer voraus (Anteil), damit sie die Lücke genau treffen
    vorausZeit: 0.42,      // Bots zielen auf einen Punkt, der so viele Sekunden voraus liegt
    sichtweite: 75,        // so weit voraus beachten Bots Hindernisse (m)
    boostSicht: 40,        // so weit vor einem Boost-Feld ziehen Bots langsam zu ihm hin (m)
  },

  // ── Grafik-Stufen ───────────────────────────────────────────────────────
  grafik: {
    // Beim ersten Start misst das Spiel, wie viele Millisekunden dieses Gerät für ein Bild auf «Hoch» braucht.
    // Schneller als … ms → diese Stufe; langsamer als «mittel» → «Niedrig». Software-Grafik bekommt immer «Niedrig».
    auto: { ultra: 3.5, hoch: 8, mittel: 16 },
    // Richtwerte pro Stufe mit 8 Fahrern: höchstens so viele Dreiecke und Zeichenaufrufe pro Bild (anzeigen mit ?debug=1).
    // «Niedrig» hat keine Schatten und weniger Dekoration; ab «Mittel» kommen Schatten und die Nachbearbeitung dazu.
    budget: { niedrig: [160000, 160], mittel: [460000, 370], hoch: [560000, 390], ultra: [570000, 370] },   // gemessen am 17.11.2026 («Ultra» nur Kiesgrube und Bergpass)
    // Leben in der Landschaft (Teil 7d): Grasbüschel pro Stufe, davon dieser Anteil Blumen, Abstand zur Strecke in m,
    // ab welcher Entfernung zur Kamera Gras verschwindet (m), Vögel pro Stufe (nicht nachts, nicht auf Strecken mit eigenen Vögeln)
    leben: {
      gras: { niedrig: 0, mittel: 6000, hoch: 14000, ultra: 26000 },
      blumen: 0.14,
      steine: { niedrig: 0, mittel: 1200, hoch: 2500, ultra: 4500 },   // kleine Steine auf Kies, Erde und Fels neben der Strecke (nicht in den Städten)
      ohneSteine: ['paris', 'newyork'],
      band: [4.5, 48],
      weit: 95,
      voegel: { niedrig: 0, mittel: 10, hoch: 16, ultra: 24 },
      ohneVoegel: ['aegypten'],
      passanten: { niedrig: 0, mittel: 50, hoch: 90, ultra: 140, nur: ['paris', 'newyork'] },   // Fussgänger auf den Gehsteigen der Städte
      fahnen: true,          // wehende Fahnen auf dem Start/Ziel-Bogen (Zielflaggen) und auf den Tribünen (ab «Mittel»)
    },
    // Ab dieser Entfernung (m) zur nächsten Kamera zeigt ein Auto seine einfache Fassung (weniger Dreiecke und Zeichenaufrufe); 0 = immer fein
    lod: { niedrig: 0, mittel: 30, hoch: 45, ultra: 70 },
    // Dellen nach Stössen (ab «Mittel»): erst ab diesem Aufprall in m/s, jeder Punkt der Karosserie höchstens so weit eingedrückt (m)
    delle: { ab: 3, max: 0.13 },
  },

  // ── Bestenliste (Teil 93) ─────────────────────────────────────────────
  // Pro Strecke eine Gesamtliste und eine Liste für jedes Auto. Gewertet wird die schnellste Runde (die Rundenzahl ist einstellbar,
  // Gesamtzeiten wären nicht vergleichbar). Von den Bots steht pro Liste nur der schnellste aller Zeiten drin.
  bestenliste: {
    proName: 1,            // so viele Zeiten pro Name und Liste (1 = nur die beste)
    zeigen: 10,            // so viele Plätze zeigt eine Liste

const TAU = Math.PI * 2;
const GRAFIK_NAMEN = { niedrig: 'Niedrig', mittel: 'Mittel', hoch: 'Hoch', ultra: 'Ultra' };      // Grafik-Stufen in dieser Reihenfolge
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;

// kürzeste Winkeldifferenz a − b im Bereich (−π, π]
function winkelDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU; else if (d <= -Math.PI) d += TAU;
  return d;
}

// Differenz zweier Streckenpositionen auf einer Runde der Länge L, Bereich (−L/2, L/2]
function rundenDiff(a, b, L) {
  let d = (a - b) % L;
  if (d > L / 2) d -= L; else if (d <= -L / 2) d += L;
  return d;
}

// Weg nach vorn von a nach b auf einer Runde der Länge L, Bereich [0, L)
function wegVor(a, b, L) {
  let d = (b - a) % L;
  if (d < 0) d += L;
  return d;
}

// Zufallszahlen mit Startwert (damit Simulationen wiederholbar sind)
function zufallsGenerator(startwert) {
  let a = startwert >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Zufalls-Auto: mischt die 8 Autos und teilt sie der Reihe nach zu. «vorher» (Liste der Autos im Rennen davor)
// sorgt dafür, dass möglichst niemand zweimal hintereinander dasselbe bekommt.
function loseFahrzeuge(n, zufall, vorher) {
  let wahl = [];
  for (let versuch = 0; versuch < 20; versuch++) {
    const l = FAHRZEUGE.map((f) => f.id);
    for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(zufall() * (i + 1)); const t = l[i]; l[i] = l[j]; l[j] = t; }
    wahl = [];
    for (let i = 0; i < n; i++) wahl.push(l[i % l.length]);
    if (!vorher || !wahl.some((id, i) => id === vorher[i])) break;
  }
  return wahl;
}
