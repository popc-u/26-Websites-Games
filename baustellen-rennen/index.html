// ── Fahrzeuge: Mini-Baumaschinen im Kart-Format (nur Optik, alle fahren gleich) ──
function baueFahrzeug(typ, farbeHex) {
  const gr = new THREE.Group();
  gr.rotation.order = 'YZX';
  const g = new Geo(), F = Geo.farbe;
  const farbe = F(farbeHex), hell = F(farbeHex, 1.18), dunkel = F(0x2a2d31), stahl = F(0x9a9fa6);
  const fahrer = (x) => {       // kleiner Bauarbeiter mit Weste und Helm
    g.box(x, 0.98, 0, 0.42, 0.56, 0.56, F(0xff7a1a)); g.box(x, 1.02, 0, 0.44, 0.1, 0.58, F(0xf5f1e6));
    g.box(x, 1.42, 0, 0.3, 0.3, 0.32, F(0xe8b88a)); g.box(x, 1.61, 0, 0.38, 0.16, 0.4, F(0xffffff)); g.box(x + 0.16, 1.55, 0, 0.2, 0.05, 0.4, F(0xffffff));
    g.box(x + 0.45, 0.95, 0, 0.08, 0.5, 0.08, dunkel, 0, -0.5); g.box(x + 0.58, 1.14, 0, 0.06, 0.3, 0.3, dunkel);     // Lenkrad
  };
  g.box(0, 0.42, 0, 2.3, 0.26, 1.0, dunkel);                         // Fahrgestell
  g.zyl(-1.02, 1.2, 0.36, 0.06, 0.06, 0.7, 5, dunkel);               // Auspuff
  let vorneRaeder = true, trommel = null;
  if (typ === 'walze') {
    g.box(-0.45, 0.85, 0, 1.3, 0.6, 1.1, farbe); g.box(-0.95, 1.2, 0, 0.3, 0.12, 1.1, hell);
    g.zyl(0.85, 0.52, 0, 0.52, 0.52, 1.5, 10, stahl, 'z');
    for (const s of [0.8, -0.8]) g.box(0.6, 0.9, s, 1.2, 0.12, 0.1, farbe, 0, -0.2);
    fahrer(-0.3); vorneRaeder = false;
  } else if (typ === 'dumper') {
    g.box(0.72, 1.0, 0, 1.25, 0.62, 1.38, farbe, 0, 0.12); g.box(0.74, 1.3, 0, 1.05, 0.1, 1.16, F(0x9b8257), 0, 0.12);
    g.box(-0.98, 0.8, 0, 0.6, 0.5, 0.9, hell);
    fahrer(-0.42);
  } else if (typ === 'stapler') {
    g.box(-0.5, 0.82, 0, 1.2, 0.55, 1.0, farbe); g.box(-1.08, 0.75, 0, 0.3, 0.72, 1.0, dunkel);
    for (const s of [0.32, -0.32]) { g.box(0.98, 1.3, s, 0.1, 1.95, 0.1, stahl); g.box(1.5, 0.32, s, 0.95, 0.06, 0.15, stahl); }
    g.box(0.98, 2.22, 0, 0.1, 0.1, 0.76, stahl);
    for (const q of [[0.42, 0.46], [0.42, -0.46], [-0.85, 0.46], [-0.85, -0.46]]) g.box(q[0], 1.5, q[1], 0.07, 1.0, 0.07, dunkel);
    g.box(-0.21, 2.02, 0, 1.36, 0.08, 1.02, farbe);
    fahrer(-0.25);
  } else if (typ === 'mischer') {
    g.box(0.9, 0.85, 0, 0.6, 0.55, 1.1, farbe); g.box(1.21, 0.95, 0, 0.03, 0.3, 0.9, F(0x9fd0e6));
    g.box(-0.72, 0.72, 0, 1.1, 0.3, 0.9, hell);
    const t = new Geo();
    t.zyl(0, 0, 0, 0.64, 0.4, 1.3, 8, F(0xf5f1e6), 'z'); t.zyl(0, 0, 0.2, 0.66, 0.6, 0.22, 8, farbe, 'z'); t.zyl(0, 0, -0.3, 0.6, 0.54, 0.2, 8, farbe, 'z');
    const halter = new THREE.Group();
    halter.position.set(-0.72, 1.38, 0); halter.rotation.set(0, Math.PI / 2, 0); halter.rotateX(0.2);
    trommel = t.netz(Grafik.mat, true); halter.add(trommel); gr.add(halter);
    fahrer(0.2);
  } else if (typ === 'lader') {
    g.box(-0.6, 0.85, 0, 1.2, 0.6, 1.05, farbe); g.box(-1.0, 1.22, 0, 0.4, 0.14, 1.05, hell);
    for (const s of [0.5, -0.5]) g.box(0.8, 0.82, s, 1.35, 0.14, 0.12, farbe, 0, -0.22);
    g.box(1.52, 0.56, 0, 0.5, 0.6, 1.76, stahl); g.box(1.76, 0.3, 0, 0.3, 0.08, 1.76, dunkel);
    fahrer(-0.3);
  } else {                                                           // Bagger
    g.box(-0.78, 0.82, 0, 0.9, 0.52, 1.0, farbe); g.box(0.1, 0.6, 0, 1.3, 0.12, 1.1, farbe); g.box(-1.15, 0.7, 0, 0.2, 0.5, 0.9, dunkel);
    g.box(0.72, 1.18, 0.4, 1.25, 0.17, 0.17, hell, 0, 0.78); g.box(1.34, 1.32, 0.4, 0.95, 0.14, 0.14, hell, 0, -0.62);
    g.box(1.64, 0.92, 0.4, 0.34, 0.42, 0.5, stahl);
    fahrer(-0.15);
  }
  const koerper = g.netz(Grafik.mat, true);
  gr.add(koerper);
  // Räder
  const raeder = [];
  const radGeo = new Geo();
  radGeo.zyl(0, 0, 0, 0.4, 0.4, 0.32, 9, F(0x1c1d1f), 'z'); radGeo.zyl(0, 0, 0, 0.2, 0.2, 0.34, 6, F(0xffc61a), 'z');
  const radNetz = radGeo.netz(Grafik.mat, true);
  for (const q of [[0.84, 0.72], [0.84, -0.72], [-0.84, 0.72], [-0.84, -0.72]]) {
    if (!vorneRaeder && q[0] > 0) continue;
    const r = radNetz.clone(); r.position.set(q[0], 0.4, q[1]); r.rotation.order = 'YZX'; r.userData.vorn = q[0] > 0;
    gr.add(r); raeder.push(r);
  }
  // Boost-Flamme und Schutzblase
  const flamme = new THREE.Mesh(new THREE.ConeGeometry(0.34, 1.5, 6), new THREE.MeshBasicMaterial({ color: 0xffa21a }));
  flamme.rotation.z = Math.PI / 2; flamme.position.set(-1.85, 0.62, 0); flamme.visible = false; gr.add(flamme);
  const schutz = new THREE.Mesh(new THREE.IcosahedronGeometry(1.75, 1), new THREE.MeshBasicMaterial({ color: 0x9fe8ff, transparent: true, opacity: 0.28, wireframe: true }));
  schutz.position.y = 0.8; schutz.visible = false; gr.add(schutz);
  return { gruppe: gr, raeder, flamme, schutz, trommel, radWinkel: 0, koerper };
}

// Namensschild über fremden Fahrzeugen
function baueSchildchen(text, farbeHex) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.font = '600 30px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const b = Math.min(250, x.measureText(text).width + 30);
  x.fillStyle = 'rgba(16,18,20,.72)'; x.beginPath(); x.roundRect ? x.roundRect(128 - b / 2, 8, b, 48, 12) : x.rect(128 - b / 2, 8, b, 48); x.fill();
  x.fillStyle = '#' + farbeHex.toString(16).padStart(6, '0'); x.fillRect(128 - b / 2, 50, b, 6);
  x.fillStyle = '#fff'; x.fillText(text, 128, 31);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  s.scale.set(4.4, 1.1, 1); s.renderOrder = 5;
  return s;
}

// ── Teilchen: Staub, Funken, Flammen, Splitter (ein einziges Instanz-Netz) ──
const Teilchen = {
  max: 420, grenze: 260, n: 0,
  init(szene) {
    this.d = new Float32Array(this.max * 9);     // x y z vx vy vz leben groesse schwer
    this.f = new Float32Array(this.max * 3);
    this.netz = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial(), this.max);
    this.netz.frustumCulled = false; this.netz.count = 0;
    this.netz.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(this.max * 3), 3);
    this.hilf = new THREE.Object3D();
    szene.add(this.netz);
  },
  neu(x, y, z, vx, vy, vz, leben, groesse, hex, schwer) {
    let i = this.n;
    if (i >= this.grenze) i = Math.floor(Math.random() * this.grenze); else this.n++;
    const d = this.d, o = i * 9;
    d[o] = x; d[o + 1] = y; d[o + 2] = -z; d[o + 3] = vx; d[o + 4] = vy; d[o + 5] = -vz; d[o + 6] = leben; d[o + 7] = groesse; d[o + 8] = schwer;
    const c = Geo.farbe(hex);
    this.f[i * 3] = c[0]; this.f[i * 3 + 1] = c[1]; this.f[i * 3 + 2] = c[2];
  },
  // Wolke aus «anzahl» Teilchen
  wolke(x, y, z, anzahl, tempo, hex, groesse, leben, schwer) {
    for (let q = 0; q < anzahl; q++) {
      const w = Math.random() * TAU, t = tempo * (0.3 + Math.random() * 0.7);
      this.neu(x, y, z, Math.cos(w) * t, Math.random() * tempo * 0.8, Math.sin(w) * t, leben * (0.6 + Math.random() * 0.6), groesse * (0.6 + Math.random() * 0.8), hex, schwer);
    }
  },
  update(dt) {
    const d = this.d, f = this.f, h = this.hilf, farben = this.netz.instanceColor.array;
    let i = 0;
    while (i < this.n) {
      const o = i * 9;
      d[o + 6] -= dt;
      if (d[o + 6] <= 0) {
        this.n--;
        const l = this.n * 9;
        for (let q = 0; q < 9; q++) d[o + q] = d[l + q];
        f[i * 3] = f[this.n * 3]; f[i * 3 + 1] = f[this.n * 3 + 1]; f[i * 3 + 2] = f[this.n * 3 + 2];
        continue;
      }
      d[o + 4] -= d[o + 8] * dt;
      d[o] += d[o + 3] * dt; d[o + 1] += d[o + 4] * dt; d[o + 2] += d[o + 5] * dt;
      const g = d[o + 7] * Math.min(1, d[o + 6] * 3);
      h.position.set(d[o], d[o + 1], d[o + 2]); h.scale.set(g, g, g); h.rotation.set(d[o + 6] * 3, d[o + 6] * 2, 0); h.updateMatrix();
      this.netz.setMatrixAt(i, h.matrix);
      farben[i * 3] = f[i * 3]; farben[i * 3 + 1] = f[i * 3 + 1]; farben[i * 3 + 2] = f[i * 3 + 2];
      i++;
    }
    this.netz.count = this.n;
    this.netz.instanceMatrix.needsUpdate = true;
    this.netz.instanceColor.needsUpdate = true;
  },
};

// ── Rennen darstellen: Fahrzeuge, Bauwerke, Kameras ───────────────────────
Object.assign(Grafik, {
  truemmer: [],

  neuesRennen(R) {
    for (const o of this.kartObjekte) { this.szene.remove(o.gruppe); this.szene.remove(o.schatten); this.szene.remove(o.schild); }
    for (const id in this.bauObjekte) this.entferneBauwerk(+id);
    for (const t of this.truemmer) this.szene.remove(t.netz);
    this.truemmer = [];
    this.kartObjekte = R.karts.map((k) => {
      const o = baueFahrzeug(k.fahrzeug, FARBEN[k.farbe % FARBEN.length].hex);
      o.schatten = new THREE.Mesh(new THREE.CircleGeometry(1.35, 12), this.matSchatten);
      o.schatten.rotation.x = -Math.PI / 2;
      o.schild = baueSchildchen(k.name, FARBEN[k.farbe % FARBEN.length].hex);
      this.szene.add(o.gruppe); this.szene.add(o.schatten); this.szene.add(o.schild);
      return o;
    });
    if (!this.zielMarke) {
      this.zielMarke = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 16, 14, 1, true), new THREE.MeshBasicMaterial({ color: 0x3fb54a, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false }));
      this.szene.add(this.zielMarke);
    }
    this.zielMarke.visible = false;
  },

  // Ansichten (geteilter Bildschirm): Liste von Kart-Nummern, −1 = freie Kamera
  setzeAnsichten(liste) {
    const n = liste.length;
    this.ansichten = liste.map((kart, i) => {
      let x = 0, y = 0, w = 1, h = 1;
      if (n === 2) { h = 0.5; y = i * 0.5; }
      else if (n > 2) { w = 0.5; h = 0.5; x = (i % 2) * 0.5; y = Math.floor(i / 2) * 0.5; }
      return { kart, x, y, w, h, kamera: new THREE.PerspectiveCamera(64, 1, 0.5, 1400), yaw: null, hy: 0, fov: 64, dreh: 0 };
    });
  },

  // Pro Bild: Fahrzeuge bewegen, Effekte, Bauwerke. alpha = Anteil zwischen zwei Rechenschritten.
  aktualisiere(R, alpha, dt) {
    this.zeit += dt;
    if (!R) { Teilchen.update(dt); return; }
    const F = CONFIG.fahren;
    for (const k of R.karts) {
      const o = this.kartObjekte[k.idx];
      if (!o) continue;
      const x = lerp(k.px, k.x, alpha), z = lerp(k.pz, k.z, alpha), y = lerp(k.py, k.y, alpha);
      const blick = k.pblick + winkelDiff(k.blick, k.pblick) * alpha;
      k.sx = x; k.sy = y; k.sz = z; k.sblick = blick;           // dargestellte Position (für Kamera und Anzeige)
      const hop = k.hop > 0 ? Math.sin((1 - k.hop / 0.18) * Math.PI) * 0.28 : 0;
      o.gruppe.position.set(x, y + hop, -z);
      const neigung = k.luft ? clamp(k.vy / 30, -0.35, 0.35) : Math.atan(k.steigung);
      o.gruppe.rotation.set(-k.lenk * 0.05 - k.drift * 0.1, blick, neigung);
      o.gruppe.visible = !(k.geistZeit > 0 && Math.floor(this.zeit * 12) % 2 === 0);
      o.radWinkel += (k.v * dt) / 0.4;
      for (const r of o.raeder) r.rotation.set(0, r.userData.vorn ? k.lenk * 0.45 : 0, -o.radWinkel);
      if (o.trommel) o.trommel.rotation.z += dt * (1.5 + k.v * 0.15);
      const boost = k.boostZeit > 0;
      o.flamme.visible = boost;
      if (boost) o.flamme.scale.set(0.8 + Math.random() * 0.5, 0.7 + Math.random() * 0.8, 0.8 + Math.random() * 0.5);
      o.schutz.visible = k.schutzZeit > 0 && Math.floor(this.zeit * 8) % 2 === 0;
      o.schatten.position.set(x, Math.max(k.bodenY, -50) + 0.06, -z);
      o.schatten.visible = this.qualitaet === 'niedrig' || k.luft;
      o.schild.position.set(x, y + 3.1, -z);
      // Teilchen
      const cx = Math.cos(k.richtung), cz = Math.sin(k.richtung);
      const hx = x - cx * 1.0, hz = z - cz * 1.0;
      if (k.drift && !k.luft) {
        const farbe = k.driftStufe === 2 ? 0xff8a1a : k.driftStufe === 1 ? 0x4db8ff : 0xfff0a8;
        for (let q = 0; q < 2; q++) {
          const s = q ? 0.7 : -0.7;
          Teilchen.neu(hx - cz * s, y + 0.15, hz + cx * s, -cx * 3 + (Math.random() - 0.5) * 5, 2 + Math.random() * 4, -cz * 3 + (Math.random() - 0.5) * 5, 0.25 + k.driftStufe * 0.08, 0.14 + k.driftStufe * 0.05, farbe, 14);
        }
      }

      case 'bp': this.ton(784, 0.09, 'triangle', 0.16); this.ton(1175, 0.14, 'triangle', 0.16, 0, 0.08); break;
      case 'bau': for (let i = 0; i < 4; i++) { this.krach(0.07, 0.3, 2400, i * 0.16); this.ton(300, 0.05, 'square', 0.12, 0, i * 0.16); } break;   // Hämmern
      case 'fertig': this.ton(392, 0.1, 'square', 0.13); this.ton(523, 0.1, 'square', 0.13, 0, 0.1); this.ton(659, 0.2, 'square', 0.13, 0, 0.2); break;
      case 'warnung': this.ton(988, 0.11, 'square', 0.15); this.ton(740, 0.11, 'square', 0.15, 0, 0.14); this.ton(988, 0.11, 'square', 0.15, 0, 0.28); break;
      case 'nein': this.ton(160, 0.14, 'sawtooth', 0.14, 110); break;
      case 'runde': this.ton(660, 0.1, 'square', 0.14); this.ton(990, 0.2, 'square', 0.14, 0, 0.1); break;
      case 'ziel': [523, 659, 784, 1047].forEach((f, i) => this.ton(f, 0.22, 'square', 0.16, 0, i * 0.13)); break;
      case 'reset': this.ton(300, 0.3, 'sine', 0.2, 900); break;
    }
  },

  // Motoren: pro lokalem Spieler ein Brummen, dessen Tonhöhe dem Tempo folgt
  motorAn(n) {
    this.motorAus();
    const c = this.ctx; if (!c) return;
    for (let i = 0; i < n; i++) {
      const o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 400; g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
      const q = c.createBufferSource(); q.buffer = this.rauschen; q.loop = true;
      const qf = c.createBiquadFilter(); qf.type = 'bandpass'; qf.frequency.value = 2100; qf.Q.value = 1.4;
      const qg = c.createGain(); qg.gain.value = 0;
      q.connect(qf); qf.connect(qg); qg.connect(this.master);
      o1.start(); o2.start(); q.start();
      this.motoren.push({ o1, o2, f, g, q, qf, qg, teiler: Math.sqrt(n) });
    }
  },
  // tempo 0…1.3; aus = stumm (Pause)
  motor(i, tempo, gas, drift, boost, gelaende, aus) {
    const m = this.motoren[i]; if (!m) return;
    const t = this.ctx.currentTime, hz = 52 + tempo * 105 + (gas ? 8 : 0) + (boost ? 22 : 0);
    m.o1.frequency.setTargetAtTime(hz, t, 0.05); m.o2.frequency.setTargetAtTime(hz * 0.5, t, 0.05);
    m.f.frequency.setTargetAtTime(350 + tempo * 1300 + (gas ? 300 : 0), t, 0.08);
    m.g.gain.setTargetAtTime(aus ? 0 : (0.045 + tempo * 0.05 + (gas ? 0.025 : 0)) / m.teiler, t, 0.08);
    m.qg.gain.setTargetAtTime(aus ? 0 : (drift ? 0.11 : gelaende ? 0.06 : 0) / m.teiler, t, 0.05);
    m.qf.frequency.setTargetAtTime(drift ? 2100 : 500, t, 0.05);
  },
  motorAus() {
    for (const m of this.motoren) { try { m.o1.stop(); m.o2.stop(); m.q.stop(); } catch (e) { /* schon gestoppt */ } m.g.disconnect(); m.qg.disconnect(); }
    this.motoren = [];
  },

  // Einfache Musikschleife (eigene Tonfolge): Bass, Hi-Hat, Pauke und eine kleine Melodie
  musik(an) {
    this.musikGewollt = an;
    if (!this.ctx) return;
    if (this.musikTakt) { clearInterval(this.musikTakt); this.musikTakt = null; }
    if (!an) return;
    this.musikZeit = this.ctx.currentTime + 0.1; this.musikSchritt = 0;
    this.musikTakt = setInterval(() => this.musikPlane(), 110);
  },
  musikPlane() {
    const c = this.ctx, dauer = 60 / 132 / 2;            // Achtelnoten bei 132 Schlägen pro Minute
    const BASS = [110, 0, 110, 165, 0, 110, 146.8, 165, 98, 0, 98, 146.8, 0, 98, 130.8, 146.8, 87.3, 0, 87.3, 130.8, 0, 87.3, 110, 130.8, 98, 0, 98, 146.8, 123.5, 0, 146.8, 196];
    const MEL = [440, 0, 523.3, 0, 659.3, 587.3, 523.3, 0, 392, 0, 493.9, 0, 587.3, 523.3, 493.9, 0, 349.2, 0, 440, 0, 523.3, 587.3, 523.3, 440, 392, 493.9, 587.3, 0, 784, 0, 587.3, 0];
    if (this.musikZeit < c.currentTime - 0.5) this.musikZeit = c.currentTime + 0.05;       // nach einer Pause (Tab im Hintergrund) neu ansetzen
    while (this.musikZeit < c.currentTime + 0.3) {
      const i = this.musikSchritt % 32, wann = this.musikZeit - c.currentTime, zweite = Math.floor(this.musikSchritt / 32) % 2 === 1;
      if (BASS[i]) this.ton(BASS[i], dauer * 0.9, 'square', 0.15, 0, wann, this.musikGain);
      if (zweite && MEL[i]) this.ton(MEL[i], dauer * 1.4, 'triangle', 0.13, 0, wann, this.musikGain);
      this.krach(0.04, i % 4 === 2 ? 0.15 : 0.06, 6000, wann, this.musikGain);
      if (i % 8 === 0 || i % 8 === 5) this.ton(120, 0.12, 'sine', 0.3, 45, wann, this.musikGain);
      this.musikZeit += dauer; this.musikSchritt++;
    }
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 10: Eingabe – Tastatur, Gamepad, Touch
   Jedes Eingabegerät liefert dieselben «Tasten» wie in LEERE_EINGABE.
   Geräte:  'tasten1' = WASD-Seite,  'tasten2' = Pfeiltasten-Seite,
            'tasten'  = beide zusammen (Einzelspieler),  'pad0'…'pad3' = Gamepads,  'touch'
   ══════════════════════════════════════════════════════════════════════════ */
const TASTEN = {
  // Spieler links                         Spieler rechts
  tasten1: { links: ['KeyA'], rechts: ['KeyD'], gas: ['KeyW'], bremse: ['KeyS'], drift: ['Space', 'ShiftLeft'],
             bauWechsel: ['KeyQ'], bauen: ['KeyE'], slot: ['KeyF'], reset: ['KeyR'] },
  tasten2: { links: ['ArrowLeft'], rechts: ['ArrowRight'], gas: ['ArrowUp'], bremse: ['ArrowDown'], drift: ['ShiftRight', 'ControlRight', 'Enter'],
             bauWechsel: ['Comma'], bauen: ['Period'], slot: ['Slash', 'Minus'], reset: ['Backspace'] },
};
const TASTEN_NAMEN = {
  KeyA: 'A', KeyD: 'D', KeyW: 'W', KeyS: 'S', Space: 'Leertaste', ShiftLeft: 'Shift links', KeyQ: 'Q', KeyE: 'E', KeyF: 'F', KeyR: 'R',
  ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', ShiftRight: 'Shift rechts', ControlRight: 'Ctrl rechts', Enter: 'Enter',
  Comma: ',', Period: '.', Slash: '-', Minus: '-', Backspace: '⌫',
};

const Eingabe = {
  unten: {},            // gerade gedrückte Tasten (event.code)
  neu: {},              // seit dem letzten Lesen neu gedrückt
  padVorher: [{}, {}, {}, {}],
  touch: { lenk: 0, drift: false, bremse: false, neu: {} },
  ziffer: 0,            // zuletzt gedrückte Zahlentaste 1–6

  start() {
    window.addEventListener('keydown', (ev) => {
      if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT')) return;
      if (!this.unten[ev.code]) this.neu[ev.code] = true;
      this.unten[ev.code] = true;
      const m = /^Digit([1-6])$/.exec(ev.code);
      if (m && !ev.repeat) this.ziffer = +m[1];
      if (App.imRennen() && /^(Arrow|Space|Tab|Backspace|Slash|Quote)/.test(ev.code)) ev.preventDefault();
      App.taste(ev);
    });
    window.addEventListener('keyup', (ev) => { this.unten[ev.code] = false; });
    window.addEventListener('blur', () => { this.unten = {}; });
  },

  gedrueckt(liste) { for (const c of liste) if (this.unten[c]) return true; return false; },
  frisch(liste) { for (const c of liste) if (this.neu[c]) return true; return false; },

  // Liest ein Gerät aus und füllt «e». «einmalig» = Tastendrücke (Bauen usw.) dürfen jetzt zählen.
  lies(geraet, e, einmalig) {
    e.lenk = 0; e.gas = 0; e.bremse = 0; e.drift = false;
    e.wahl = 0; e.bauWechsel = 0; e.slotWechsel = 0; e.bauen = false; e.reset = false;
    const seiten = geraet === 'tasten' ? [TASTEN.tasten1, TASTEN.tasten2] : geraet === 'tasten1' ? [TASTEN.tasten1] : geraet === 'tasten2' ? [TASTEN.tasten2] : [];
    for (const T of seiten) {
      if (this.gedrueckt(T.links)) e.lenk += 1;
      if (this.gedrueckt(T.rechts)) e.lenk -= 1;
      if (this.gedrueckt(T.gas)) e.gas = 1;
      if (this.gedrueckt(T.bremse)) e.bremse = 1;
      if (this.gedrueckt(T.drift)) e.drift = true;
      if (einmalig) {
        if (this.frisch(T.bauWechsel)) e.bauWechsel = 1;
        if (this.frisch(T.bauen)) e.bauen = true;
        if (this.frisch(T.slot)) e.slotWechsel = 1;
        if (this.frisch(T.reset)) e.reset = true;
      }
    }
    if (geraet === 'tasten' && einmalig && this.ziffer) e.wahl = this.ziffer;
    if (geraet.startsWith('pad')) this.liesPad(+geraet.slice(3), e, einmalig);
    if (geraet === 'touch' || (geraet === 'tasten' && this.touch.aktiv)) {
      const t = this.touch;
      if (t.aktiv) {
        if (t.lenk) e.lenk = t.lenk;
        if (!t.bremse) e.gas = 1; else e.bremse = 1;      // am Handy gibt das Fahrzeug von selbst Gas
        if (t.drift) e.drift = true;
        if (einmalig) {
          if (t.neu.bauen) e.bauen = true;
          if (t.neu.bauWechsel) e.bauWechsel = 1;
          if (t.neu.slot) e.slotWechsel = 1;
          if (t.neu.reset) e.reset = true;
          if (t.neu.wahl) e.wahl = t.neu.wahl;
        }
      }
    }
    e.lenk = clamp(e.lenk, -1, 1);
    return e;
  },

  // Gamepad (Standard-Belegung): Stick lenken, A/RT Gas, B/LT Bremse, X/RB Drift,
  // Steuerkreuz ←/→ Bauwerk, ↑ Slot, Y/↓ bauen, Select zurücksetzen
  liesPad(nr, e, einmalig) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const p = pads[nr];
    if (!p) return;
    const B = (i) => (p.buttons[i] ? p.buttons[i].value || (p.buttons[i].pressed ? 1 : 0) : 0);
    const x = p.axes[0] || 0;
    if (Math.abs(x) > 0.14) e.lenk = -Math.sign(x) * Math.min(1, (Math.abs(x) - 0.14) / 0.7);
    e.gas = Math.max(B(0), B(7));
    e.bremse = Math.max(B(1), B(6));
    e.drift = B(2) > 0.5 || B(5) > 0.5;
    const v = this.padVorher[nr];
    const neu = (i) => B(i) > 0.5 && !v[i];
    if (einmalig) {
      if (neu(15) || neu(4)) e.bauWechsel = 1;
      if (neu(14)) e.bauWechsel = -1;
      if (neu(12)) e.slotWechsel = 1;
      if (neu(3) || neu(13)) e.bauen = true;
      if (neu(8)) e.reset = true;
      if (neu(9)) App.pauseUmschalten();
      for (let i = 0; i < 16; i++) v[i] = B(i) > 0.5;
    }
  },

  // nach jedem Bild aufrufen: «neu gedrückt» zurücksetzen
  fertig() { this.neu = {}; this.ziffer = 0; this.touch.neu = {}; },

  angeschlossenePads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const liste = [];
    for (let i = 0; i < pads.length && i < 4; i++) if (pads[i]) liste.push(i);
    return liste;
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 10b: Online-Modus ohne eigenen Server (WebRTC über PeerJS)
   Der Host ist Schiedsrichter: Er startet das Rennen, zählt Runden, Plätze und
   Baupunkte, prüft Bau-Anfragen und lässt die Bots fahren. Jeder Mitspieler
   rechnet nur sein eigenes Fahrzeug und schickt dessen Zustand 20-mal pro Sekunde.
   Fremde Fahrzeuge werden mit 100 ms Verzögerung weich nachgezeichnet.
   Nachrichten sind kleine Listen: ['z', …] Zustand, ['s', …] Bild vom Host, ['bw', …] Bauwerk usw.
   ══════════════════════════════════════════════════════════════════════════ */
const PEER_QUELLEN = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
const RAUM_VORSATZ = 'bsr26-';
const CODE_ZEICHEN = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';      // ohne 0/O und 1/I (leicht zu verwechseln)
const r2 = (x) => Math.round(x * 100) / 100, r3 = (x) => Math.round(x * 1000) / 1000;

const Online = {
  peer: null, host: false, code: '', gaeste: {}, zumHost: null, zumHostZ: null, meineId: '', lobby: null, imRennen: false, bereit: false,
  versatz: 0, rtt: 0, bestRtt: 1e9, t0: 0, schrittNr: 0, puffer: [], bekannt: {}, letzterEmpfang: 0, meinKart: -1, endeGesendet: false, takte: [], zeitlimit: null,

  profil() { const D = Speicher.daten; return { name: D.name, fahrzeug: D.fahrzeug, farbe: D.farbe }; },
  jetzt() { return performance.now() + (this.host ? 0 : this.versatz); },           // gemeinsame Uhr (die des Hosts)
  peerOptionen() {
    const p = App.parameter.get('peer');            // nur für Tests: eigener Vermittlungs-Server, z. B. ?peer=localhost:9000
    if (p) { const t = p.split(':'); return { host: t[0], port: +t[1] || 9000, path: '/', secure: false, debug: 1 }; }
    return { debug: 1 };
  },
  ladeBibliothek(fertig) {
    if (window.Peer) { fertig(); return; }
    ladeSkript(PEER_QUELLEN, fertig, () => this.fehler('Die Netzwerk-Bibliothek (PeerJS) konnte nicht geladen werden. Prüfe deine Internetverbindung.'));
  },
  fehlerText(e) {
    const t = e && e.type;
    if (t === 'peer-unavailable') return 'Diesen Raum gibt es nicht (mehr). Prüfe den Code oder bitte den Host um einen neuen Link.';
    if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return 'Der Vermittlungs-Server ist gerade nicht erreichbar. Versuch es in ein paar Minuten nochmals.';
    if (t === 'browser-incompatible') return 'Dein Browser unterstützt keine direkten Verbindungen (WebRTC).';
    if (t === 'webrtc') return 'Die direkte Verbindung kam nicht zustande. Manche Firmen- und Schulnetze blockieren das.';
    return 'Verbindungsfehler' + (t ? ' (' + t + ')' : '') + '.';
  },
  // Verständliche Fehlermeldung mit Hinweis auf die Modi, die immer gehen
  fehler(text) {
    this.verlassen();
    if (!Spiel.demo) Spiel.starteDemo();
    Menue.wahlen = {};
    Menue.zeige('fehler', '<div class="tafel"><h2>Online-Spiel</h2><div class="karte" style="border-left-color:var(--rot)"><p>' + text + '</p><p class="hinweis">Gegen Bots und lokal am selben Gerät kannst du jederzeit spielen.</p></div>' +
      '<div class="knoepfe"><button class="knopf" data-a="zurueck">Zum Menü</button></div></div>', { zurueck: () => Menue.haupt() });
  },
  verlassen() {
    for (const t of this.takte) clearInterval(t);
    this.takte = [];
    clearTimeout(this.zeitlimit);
    const p = this.peer; this.peer = null;
    if (p) { try { p.destroy(); } catch (e) { /* schon geschlossen */ } }
    this.gaeste = {}; this.zumHost = null; this.zumHostZ = null; this.imRennen = false; this.bereit = false; this.lobby = null; this.bestRtt = 1e9;
    Spiel.netz = null; Menue.beiProfil = null;
  },

  // ── Host: Raum erstellen ────────────────────────────────────────────────
  erstellen() {
    Menue.laden('Erstelle einen Raum …');
    this.ladeBibliothek(() => {
      const D = Speicher.daten;
      let versuche = 0;
      const neu = () => {
        let code = '';
        for (let i = 0; i < CONFIG.netz.codeLaenge; i++) code += CODE_ZEICHEN[Math.floor(Math.random() * CODE_ZEICHEN.length)];
        const p = new Peer(RAUM_VORSATZ + code, this.peerOptionen());
        this.peer = p; this.host = true; this.code = code; this.gaeste = {};
        clearTimeout(this.zeitlimit);
        this.zeitlimit = setTimeout(() => { if (this.peer === p && !p.open) this.fehler('Der Vermittlungs-Server antwortet nicht. Prüfe deine Internetverbindung und versuch es nochmals.'); }, CONFIG.netz.verbindenTimeout * 1000);
        p.on('open', () => {
          clearTimeout(this.zeitlimit);
          this.lobby = { code, strecke: D.strecke, runden: D.runden, bots: Math.min(D.bots, 6), stufe: D.stufe, spieler: [] };
          this.zeigeLobby();
          this.takte.push(setInterval(() => this.sendeLobby(), 2000));
        });
        p.on('connection', (c) => this.neuerGast(c));
        p.on('error', (e) => {
          if (this.peer !== p) return;
          if (e.type === 'unavailable-id' && versuche++ < 5) { this.peer = null; try { p.destroy(); } catch (x) { /* egal */ } neu(); }     // Code schon vergeben: neuen würfeln
          else if (!p.open || e.type === 'browser-incompatible') this.fehler(this.fehlerText(e));
        });
        // Fällt nur der Vermittler aus, bleiben die Spieler trotzdem direkt verbunden
        p.on('disconnected', () => { if (this.peer === p && !p.destroyed) { try { p.reconnect(); } catch (e) { /* egal */ } } });
      };
      neu();
    });
  },
  neuerGast(c) {
    c.on('open', () => {
      if (c.label === 'z') { const g = this.gaeste[c.peer]; if (g) { g.z = c; c.on('data', (d) => this.vomGast(c.peer, d)); } return; }
      const nein = (text) => { try { c.send(['nein', text]); } catch (e) { /* egal */ } setTimeout(() => { try { c.close(); } catch (e) { /* egal */ } }, 800); };
      if (this.imRennen) { nein('In diesem Raum läuft gerade ein Rennen. Versuch es in ein paar Minuten nochmals.'); return; }
      if (Object.keys(this.gaeste).length >= CONFIG.rennen.maxFahrer - 1) { nein('Der Raum ist voll (höchstens ' + CONFIG.rennen.maxFahrer + ' Fahrer).'); return; }
      this.gaeste[c.peer] = { id: c.peer, k: c, z: null, name: 'Gast', fahrzeug: 0, farbe: 1, bereit: false, ping: 0, kart: -1, zuletzt: performance.now() };
      c.on('data', (d) => this.vomGast(c.peer, d));
      c.on('close', () => this.gastWeg(c.peer));
      c.on('error', () => this.gastWeg(c.peer));
    });
  },
  gastWeg(id) {
    const g = this.gaeste[id];
    if (!g) return;
    delete this.gaeste[id];
    try { g.k.close(); } catch (e) { /* egal */ }
    const R = Spiel.R;
    if (this.imRennen && g.kart >= 0 && R && !R.fertig && Spiel.netz === this) {
      // Verbindung weg: ein Bot übernimmt das Fahrzeug
      const k = R.karts[g.kart];
      k.typ = 'bot'; k.stufe = 'mittel'; k.bot = new Bot(R, k, 'mittel');
      App.toast(g.name + ' hat die Verbindung verloren. Ein Bot fährt weiter.');
    }
    this.sendeLobby();
  },
  vomGast(id, d) {
    const g = this.gaeste[id];
    if (!g || !Array.isArray(d)) return;
    g.zuletzt = performance.now();
    const R = Spiel.R, imRennen = this.imRennen && g.kart >= 0 && R && Spiel.netz === this && !R.fertig;
    switch (d[0]) {
      case 'hallo': case 'profil':
        g.name = String((d[1] && d[1].name) || 'Gast').slice(0, 14); g.fahrzeug = clamp(d[1].fahrzeug | 0, 0, FAHRZEUGE.length - 1); g.farbe = clamp(d[1].farbe | 0, 0, FARBEN.length - 1);
        this.sendeLobby(); break;
      case 'bereit': g.bereit = !!d[1]; this.sendeLobby(); break;
      case 'p': g.ping = d[2] | 0; try { g.k.send(['q', d[1], performance.now()]); } catch (e) { /* egal */ } break;
      case 'z': if (imRennen && R.karts[g.kart].typ === 'fern') this.merkeZustand(g.kart, d.slice(1)); break;
      case 'bau': if (imRennen) R.bauen(R.karts[g.kart], String(d[1]), d[2] | 0); break;                    // der Host prüft die Anfrage wie bei jedem anderen
      case 'treffer': if (imRennen) R.registriereTreffer(g.kart, d[1] | 0, d[2] | 0); break;
      case 'benutzt': if (imRennen) { const bw = R.bauwerke.find((b) => b.id === d[1]); if (bw && bw.besitzer === g.kart) { bw.benutzt = true; bw.tEnde = Math.min(bw.tEnde, R.zeit + 1.2); } } break;
    }
  },
  sendeAlle(d, schnell) {
    for (const id in this.gaeste) {
      const g = this.gaeste[id], c = schnell && g.z && g.z.open ? g.z : g.k;
      try { if (c.open) c.send(d); } catch (e) { /* Verbindung gerade weg */ }
    }
  },
  spielerListe() {
    const P = this.profil();
    const l = [{ id: 'host', name: P.name, fahrzeug: P.fahrzeug, farbe: P.farbe, bereit: true, ping: 0, host: true }];
    for (const id in this.gaeste) { const g = this.gaeste[id]; l.push({ id, name: g.name, fahrzeug: g.fahrzeug, farbe: g.farbe, bereit: g.bereit, ping: g.ping, host: false }); }
    return l;
  },
  sendeLobby() {
    if (!this.host || !this.lobby) return;
    this.lobby.spieler = this.spielerListe();
    this.sendeAlle(['lobby', this.lobby]);
    this.aktualisiereLobby();
  },
  hostStart() {
    const L = this.lobby, gaeste = Object.keys(this.gaeste).map((id) => this.gaeste[id]), P = this.profil();
    if (gaeste.some((g) => !g.bereit)) { App.toast('Es sind noch nicht alle bereit.'); return; }
    Menue.nameLesen(); Speicher.sichern();
    const fahrer = [{ peer: 'host', typ: 'mensch', name: P.name, fahrzeug: FAHRZEUGE[P.fahrzeug].id, farbe: P.farbe }];
    for (const g of gaeste) fahrer.push({ peer: g.id, typ: 'mensch', name: g.name, fahrzeug: FAHRZEUGE[g.fahrzeug].id, farbe: g.farbe });
    for (const b of Menue.botFahrer(Math.min(L.bots, CONFIG.rennen.maxFahrer - fahrer.length), L.stufe, fahrer.map((f) => f.farbe))) { b.peer = ''; fahrer.push(b); }
    const p = fahrer.map((_, i) => i);
    for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const h = p[i]; p[i] = p[j]; p[j] = h; }
    fahrer.forEach((f, i) => { f.platz = p[i]; });
    for (const g of gaeste) g.kart = fahrer.findIndex((f) => f.peer === g.id);
    const daten = { strecke: L.strecke, runden: L.runden, fahrer, seed: (Math.random() * 1e9) | 0, t0: performance.now() + 2500 };     // t0: gemeinsamer Startzeitpunkt (Host-Uhr)
    this.sendeAlle(['start', daten]);
    this.starteRennen(daten);
  },

  // ── Gast: Raum beitreten ────────────────────────────────────────────────
  beitretenDialog(code) {
    Menue.wahlen = {}; Menue.beiProfil = null;
    const n = CONFIG.netz.codeLaenge;
    Menue.zeige('beitreten', '<div class="tafel"><h2>Raum beitreten</h2><p>Gib den Code ein, den dir der Host geschickt hat.</p>' +
      '<div class="zeile"><label for="f-code">Code</label><input class="feld code" id="f-code" maxlength="' + n + '" autocomplete="off" value="' + esc(code || '') + '"></div>' + Menue.fahrerZeilen() +
      '<div class="knoepfe" style="margin-top:14px"><button class="knopf los" data-a="los">Beitreten</button><button class="knopf zweit" data-a="zurueck">Zurück</button></div></div>', {
      los: () => {
        Menue.nameLesen(); Speicher.sichern();
        const c = $('f-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (c.length !== n) { App.toast('Der Code hat ' + n + ' Zeichen.'); return; }
        this.beitreten(c);
      },
      zurueck: () => { try { history.replaceState(null, '', location.href.split('?')[0]); } catch (e) { /* bei file:// nicht möglich */ } Menue.haupt(); },
    });
    $('f-code').onkeydown = (ev) => { if (ev.key === 'Enter') Menue.aktionen.los(); };
  },
  beitreten(code) {
    Menue.laden('Verbinde mit Raum ' + code + ' …');
    this.ladeBibliothek(() => {
      const p = new Peer(this.peerOptionen());
      this.peer = p; this.host = false; this.code = code; this.bereit = false; this.bestRtt = 1e9;
      clearTimeout(this.zeitlimit);
      this.zeitlimit = setTimeout(() => { if (this.peer === p && !this.lobby) this.fehler('Der Raum ' + code + ' antwortet nicht. Prüfe den Code. Vielleicht hat der Host das Spiel schon geschlossen.'); }, CONFIG.netz.verbindenTimeout * 1000);
      p.on('open', () => {
        this.meineId = p.id;
        const c = p.connect(RAUM_VORSATZ + code, { reliable: true, label: 'k', serialization: 'json' });
        this.zumHost = c;
        c.on('open', () => {
          this.letzterEmpfang = performance.now();
          c.send(['hallo', this.profil()]);
          // zweiter, ungeordneter Kanal für die häufigen Zustands-Pakete (ein verlorenes Paket hält dann nichts auf)
          const z = p.connect(RAUM_VORSATZ + code, { reliable: false, label: 'z', serialization: 'json' });
          z.on('open', () => { this.zumHostZ = z; });
          z.on('data', (d) => this.vomHost(d));
          this.takte.push(setInterval(() => this.zumHostSenden(['p', performance.now(), Math.round(this.rtt)]), 1500));
          this.zumHostSenden(['p', performance.now(), 0]);
        });
        c.on('data', (d) => this.vomHost(d));
        c.on('close', () => this.hostWeg());
      });
      p.on('error', (e) => { if (this.peer === p && !this.imRennen && (!this.lobby || e.type === 'peer-unavailable')) this.fehler(this.fehlerText(e)); });
    });
  },
  zumHostSenden(d, schnell) {
    const c = schnell && this.zumHostZ && this.zumHostZ.open ? this.zumHostZ : this.zumHost;
    try { if (c && c.open) c.send(d); } catch (e) { /* Verbindung gerade weg */ }
  },
  hostWeg() {
    if (!this.peer || this.host) return;
    this.fehler('Die Verbindung zum Host ist abgebrochen oder der Host hat das Spiel verlassen. Das Online-Spiel ist damit beendet.');
  },
  vomHost(d) {
    if (!Array.isArray(d) || !this.peer) return;
    this.letzterEmpfang = performance.now();
    const R = Spiel.R, imRennen = this.imRennen && Spiel.netz === this && R;
    switch (d[0]) {
      case 'lobby': this.lobby = d[1]; clearTimeout(this.zeitlimit); if (!this.imRennen) { if (Menue.offen === 'lobby') this.aktualisiereLobby(); else if (Menue.offen === 'laden') this.zeigeLobby(); } break;
      case 'q': {      // Antwort auf unser Ping: Laufzeit messen und die Uhr des Hosts schätzen
        const jetzt = performance.now(), rtt = jetzt - d[1];
        this.rtt = rtt; this.bestRtt += 0.5;
        if (rtt <= this.bestRtt) { this.bestRtt = rtt; this.versatz = d[2] + rtt / 2 - jetzt; }
        break;
      }
      case 'nein': this.fehler(esc(d[1])); break;
      case 'start': this.starteRennen(d[1]); break;
      case 's': if (imRennen) this.empfangeBild(R, d); break;
      case 'bw':
        if (imRennen && !R.bauwerke.some((b) => b.id === d[1].id)) { const bw = R.neuesBauwerk(d[1]); R.bauwerke.push(bw); Spiel.ereignis({ typ: 'bau', k: bw.besitzer, a: bw.id, zeit: R.zeit }); }
        break;
      case 'bwWeg': if (imRennen) { const i = R.bauwerke.findIndex((b) => b.id === d[1]); if (i >= 0) R.bauwerke.splice(i, 1); } break;
      case 'e':
        if (imRennen) {
          const e = { typ: d[1], k: d[2], a: d[3], b: d[4], zeit: R.zeit };
          if (e.typ === 'treffer') { const bw = R.bauwerke.find((x) => x.id === e.a); if (bw && e.b >= 0 && bw.teile && bw.teile[e.b]) bw.teile[e.b].weg = true; }
          else if (e.typ === 'runde') { const k = R.karts[e.k]; k.rundenZeiten.push(e.b); k.rundeStart += e.b; }
          Spiel.ereignis(e);
        }
        break;
      case 'ende':
        if (imRennen) {
          d[1].karts.forEach((q, i) => { const k = R.karts[i]; k.endZeit = q[0]; k.geschaetzt = q[1]; k.rundenZeiten = q[2]; k.bpVerdient = q[3]; k.bpAusgegeben = q[4]; k.ueberholt = q[5]; k.gebaut = q[6]; k.treffer = q[7]; k.trefferErzielt = q[8]; k.schlechtesterRang = q[9]; k.resets = q[10]; k.rang = q[11]; });
          R.reihenfolge = d[1].reihenfolge; R.phase = 'ende'; R.fertig = true;
        }
        break;
      case 'zurLobby': if (this.imRennen) this.zurLobby(); break;
    }
  },

  // ── Lobby (für Host und Gäste) ──────────────────────────────────────────
  zeigeLobby() {
    const L = this.lobby, D = Speicher.daten, host = this.host;
    if (!L) return;
    if (host) L.spieler = this.spielerListe();
    Menue.wahlen = {};
    Menue.beiProfil = () => this.sendeProfil();
    const link = location.href.split('?')[0].split('#')[0] + '?raum=' + this.code;
    let rennen = '<p id="lobby-info"></p>';
    if (host) rennen = Menue.wahlZeile('Strecke', 'strecke', Object.keys(STRECKEN).map((id) => ({ wert: id, text: STRECKEN[id].name })), L.strecke, (v) => { L.strecke = D.strecke = v; Spiel.starteDemo(v); this.sendeLobby(); }) +
      Menue.wahlZeile('Runden', 'runden', zahlen(1, 7), L.runden, (v) => { L.runden = D.runden = v; this.sendeLobby(); }) +
      Menue.wahlZeile('Bots', 'gegner', zahlen(0, CONFIG.rennen.maxFahrer - 1), L.bots, (v) => { L.bots = v; this.sendeLobby(); }) +
      Menue.wahlZeile('Stärke', 'stufe', STUFEN_LISTE, L.stufe, (v) => { L.stufe = v; this.sendeLobby(); });
    Menue.zeige('lobby', '<div class="tafel breit"><h2>Raum ' + this.code + '</h2>' +
      '<div class="zeile"><input class="feld" id="f-link" readonly value="' + esc(link) + '" style="width:min(430px,100%);font-size:14px"><button class="knopf klein" data-a="kopieren">Link kopieren</button></div>' +
      '<div class="spalten"><div><h3>Fahrer</h3><div class="spielerliste" id="lobby-liste"></div><p class="hinweis">' +
      (host ? 'Schick den Link oder den Code an deine Mitspieler. Du bist der Host: Verlässt du das Spiel, endet es für alle.' : 'Der Host startet das Rennen, sobald alle bereit sind.') + '</p></div>' +
      '<div><h3>Du</h3>' + Menue.fahrerZeilen() + '<h3>Rennen</h3>' + rennen + '</div></div>' +
      '<div class="zeile" style="margin-top:12px">' + (host ? '<button class="knopf los" data-a="start">Rennen starten</button>' : '<button class="knopf los" data-a="bereit" id="k-bereit">Bereit</button>') +
      '<button class="knopf zweit" data-a="zurueck">Verlassen</button></div></div>', {
      kopieren: () => {
        const fertig = () => App.toast('Link kopiert. Schick ihn deinen Mitspielern.', 2500);
        const alt = () => { const f = $('f-link'); f.focus(); f.select(); try { document.execCommand('copy'); fertig(); } catch (e) { App.toast('Markiere den Link und kopiere ihn von Hand.'); } };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(fertig, alt); else alt();
      },
      start: () => this.hostStart(),
      bereit: () => { this.bereit = !this.bereit; this.zumHostSenden(['bereit', this.bereit]); this.aktualisiereLobby(); },
      zurueck: () => App.zumMenue(),
    });
    const f = $('f-name'); if (f) f.onchange = () => this.sendeProfil();
    this.aktualisiereLobby();
  },
  aktualisiereLobby() {
    const L = this.lobby, liste = $('lobby-liste');
    if (Menue.offen !== 'lobby' || !L || !liste) return;
    const bots = Math.max(0, Math.min(L.bots, CONFIG.rennen.maxFahrer - L.spieler.length));
    const stufe = (STUFEN_LISTE.find((s) => s.wert === L.stufe) || STUFEN_LISTE[1]).text;
    liste.innerHTML = L.spieler.map((s) => '<div class="zeile"><span class="farbfeld" style="background:' + hexCss(FARBEN[s.farbe % FARBEN.length].hex) + '"></span><b>' + esc(s.name) + '</b><span class="hinweis">' + FAHRZEUGE[s.fahrzeug % FAHRZEUGE.length].name + '</span>' +
      '<span style="margin-left:auto" class="' + (s.bereit ? 'bereit' : 'hinweis') + '">' + (s.host ? 'Host' : s.bereit ? 'bereit' : 'wartet') + '</span>' + (s.host ? '' : '<span class="hinweis">' + (s.ping | 0) + ' ms</span>') + '</div>').join('') +
      (bots ? '<div class="zeile"><span class="hinweis">dazu ' + bots + (bots === 1 ? ' Bot' : ' Bots') + ' (' + stufe + ')</span></div>' : '');
    const info = $('lobby-info');
    if (info) info.innerHTML = 'Strecke: <b>' + (STRECKEN[L.strecke] ? STRECKEN[L.strecke].name : '?') + '</b><br>Runden: <b>' + L.runden + '</b><br>Bots: <b>' + bots + '</b> (' + stufe + ')';
    const kb = $('k-bereit'); if (kb) kb.textContent = this.bereit ? 'Doch nicht bereit' : 'Bereit';
    if (!this.host && Spiel.demo && STRECKEN[L.strecke] && Grafik.strecke && Grafik.strecke.id !== L.strecke) Spiel.starteDemo(L.strecke);
  },
  sendeProfil() {
    Menue.nameLesen(); Speicher.sichern();
    if (this.host) this.sendeLobby(); else this.zumHostSenden(['profil', this.profil()]);
  },
  zurLobby() {
    if (!this.peer || !this.lobby) { App.zumMenue(); return; }
    this.imRennen = false; Spiel.netz = null;
    if (this.host) { this.sendeAlle(['zurLobby']); for (const id in this.gaeste) this.gaeste[id].bereit = false; }
    else { this.bereit = false; this.zumHostSenden(['bereit', false]); }
    Spiel.starteDemo(this.lobby.strecke);
    this.zeigeLobby();
    if (this.host) this.sendeLobby();
  },
  revanche() { if (this.host) this.hostStart(); },

  // ── Im Rennen ───────────────────────────────────────────────────────────
  starteRennen(daten) {
    const ich = this.host ? 'host' : this.meineId;
    const fahrer = daten.fahrer.map((f) => ({ name: f.name, fahrzeug: f.fahrzeug, farbe: f.farbe, stufe: f.stufe, platz: f.platz, geraet: 'tasten',
      typ: f.peer === ich ? 'mensch' : this.host && f.typ === 'bot' ? 'bot' : 'fern' }));
    this.t0 = daten.t0; this.imRennen = true; this.schrittNr = 0; this.puffer = fahrer.map(() => []); this.bekannt = {}; this.endeGesendet = false;
    this.meinKart = daten.fahrer.findIndex((f) => f.peer === ich);
    this.letzterEmpfang = performance.now();
    for (const id in this.gaeste) this.gaeste[id].zuletzt = performance.now();
    Spiel.starte({ modus: 'online', host: this.host, strecke: daten.strecke, runden: daten.runden, fahrer, seed: daten.seed, schiri: this.host, plaetzeFest: true });
    Spiel.netz = this;
    Spiel.R.netz = {
      bauWunsch: (k, art, slot) => this.zumHostSenden(['bau', art, slot]),
      treffer: (k, id, teil) => this.zumHostSenden(['treffer', id, teil]),
      benutzt: (k, id) => this.zumHostSenden(['benutzt', id]),
      nachOrten: this.host ? (R) => this.nachOrten(R) : null,
    };
  },
  // Wie viel Rennzeit fehlt bis zur gemeinsamen Uhr? (ersetzt im Online-Spiel den normalen Zeit-Zähler)
  takt(R) {
    const soll = (this.jetzt() - this.t0) / 1000 - CONFIG.rennen.countdown;
    return clamp(soll - R.zeit, 0, 0.3);
  },
  zustand(R, k) {
    const f = (k.luft ? 1 : 0) | (k.drift > 0 ? 2 : k.drift < 0 ? 4 : 0) | ((k.driftStufe & 3) << 3) | (k.boostZeit > 0 ? 32 : 0) | (k.windAktiv ? 64 : 0) | (k.schutzZeit > 0 ? 128 : 0) | (k.geistZeit > 0 ? 256 : 0) | (k.schlamm ? 1024 : 0);
    return [r3(R.zeit), r2(k.x), r2(k.z), r2(k.y), r3(k.richtung), r3(k.blick), r2(k.v), r2(k.lenk), f, r2(k.strecke)];
  },
  merkeZustand(kart, z) {
    if (!Array.isArray(z) || z.length < 10 || z.some((x) => typeof x !== 'number' || !isFinite(x))) return;
    const P = this.puffer[kart];
    if (P.length && z[0] <= P[P.length - 1][0]) return;            // veraltet (Pakete können sich überholen)
    P.push(z); if (P.length > 14) P.shift();
  },
  // Fremde Fahrzeuge zwischen zwei empfangenen Zuständen weich bewegen (100 ms in der Vergangenheit)
  vorSchritt(R) {
    const tr = R.zeit + SCHRITT - CONFIG.netz.puffer;
    for (const k of R.karts) {
      if (k.typ !== 'fern') continue;
      const P = this.puffer[k.idx];
      if (!P || !P.length) continue;
      while (P.length > 2 && P[1][0] <= tr) P.shift();
      const a = P[0], b = P[1] || a, dt = b[0] - a[0];
      const u = dt > 0.001 ? clamp((tr - a[0]) / dt, 0, 1 + 0.25 / dt) : 0;      // höchstens 0.25 s über das letzte Paket hinaus weiterrechnen
      const w = Math.min(u, 1);
      k.x = a[1] + (b[1] - a[1]) * u; k.z = a[2] + (b[2] - a[2]) * u; k.y = a[3] + (b[3] - a[3]) * w;
      k.richtung = a[4] + winkelDiff(b[4], a[4]) * w; k.blick = a[5] + winkelDiff(b[5], a[5]) * w;
      k.v = b[6]; k.lenk = b[7];
      const f = b[8];
      k.luft = !!(f & 1); k.drift = f & 2 ? 1 : f & 4 ? -1 : 0; k.driftStufe = (f >> 3) & 3; k.boostZeit = f & 32 ? 0.2 : 0; k.windAktiv = !!(f & 64);
      k.schutzZeit = f & 128 ? 0.2 : 0; k.geistZeit = f & 256 ? 0.2 : 0; k.schlamm = f & 1024 ? 1 : 0;
    }
  },
  // Host: Für Platzierung und Zieleinlauf zählt der frischeste gemeldete Stand (gleicht die Verzögerung aus)
  nachOrten(R) {
    for (const k of R.karts) {
      if (k.typ !== 'fern') continue;
      const P = this.puffer[k.idx], n = P && P[P.length - 1];
      if (n) k.strecke = n[9] + n[6] * clamp(R.zeit - n[0], 0, 0.25);
    }
  },
  ereignisVomSchiri(e) {
    if (e.typ === 'ueberholt' || e.typ === 'bp' || e.typ === 'runde' || e.typ === 'ziel' || e.typ === 'treffer') this.sendeAlle(['e', e.typ, e.k, e.a, e.b]);
  },
  nachSchritt(R) {
    this.schrittNr++;
    const senden = this.schrittNr % Math.max(1, Math.round(60 / CONFIG.netz.sendeRate)) === 0;
    if (this.host) {
      // neue und abgebaute Bauwerke melden
      for (const bw of R.bauwerke) if (!this.bekannt[bw.id]) { this.bekannt[bw.id] = true; this.sendeAlle(['bw', { id: bw.id, art: bw.art, slot: bw.slot, besitzer: bw.besitzer, t0: bw.t0, betroffen: bw.betroffen }]); }
      for (const id in this.bekannt) if (!R.bauwerke.some((b) => b.id === +id)) { delete this.bekannt[id]; this.sendeAlle(['bwWeg', +id]); }
      if (senden) {
        const karts = R.karts.map((k) => { const P = this.puffer[k.idx]; return k.typ === 'fern' && P.length ? P[P.length - 1] : this.zustand(R, k); });
        const ref = R.karts.map((k) => [k.rang, Math.round(k.bp * 10) / 10, k.runde, k.zielZeit, Math.round(Math.max(0, k.bauSperre) * 10) / 10]);
        this.sendeAlle(['s', r3(R.zeit), karts, ref], true);
      }
      if (this.schrittNr % 60 === 0) {       // wer zu lange schweigt, gilt als ausgefallen
        const jetzt = performance.now();
        for (const id in this.gaeste) if (jetzt - this.gaeste[id].zuletzt > CONFIG.netz.ausfallTimeout * 1000) this.gastWeg(id);
      }
      if (R.fertig && !this.endeGesendet) {
        this.endeGesendet = true;
        this.sendeAlle(['ende', { reihenfolge: R.reihenfolge, karts: R.karts.map((k) => [k.endZeit, k.geschaetzt, k.rundenZeiten, k.bpVerdient, k.bpAusgegeben, k.ueberholt, k.gebaut, k.treffer, k.trefferErzielt, k.schlechtesterRang, k.resets, k.rang]) }]);
      }
    } else {
      for (const bw of R.bauwerke) if (!bw.fertig && R.zeit >= bw.tFest) { bw.fertig = true; Spiel.ereignis({ typ: 'fertig', k: bw.besitzer, a: bw.id, zeit: R.zeit }); }
      if (senden) this.zumHostSenden(['z'].concat(this.zustand(R, R.karts[this.meinKart])), true);
      if (performance.now() - this.letzterEmpfang > CONFIG.netz.ausfallTimeout * 1000) this.hostWeg();
    }
  },
  // Gast: Bild vom Host übernehmen (fremde Fahrzeuge + Schiedsrichter-Daten für alle)
  empfangeBild(R, d) {
    const karts = d[2], ref = d[3];
    if (!Array.isArray(karts) || !Array.isArray(ref)) return;
    for (let i = 0; i < R.n; i++) {
      const k = R.karts[i], q = ref[i];
      if (k.typ === 'fern' && karts[i]) this.merkeZustand(i, karts[i]);
      if (!q) continue;
      k.rang = q[0]; k.bp = q[1]; k.runde = q[2];
      if (q[3] != null && k.zielZeit == null) k.zielZeit = q[3];
      if (i === this.meinKart) k.bauSperre = Math.max(k.bauSperre, q[4]);
    }
    R.reihenfolge = R.karts.map((k) => k.idx).sort((a, b) => R.karts[a].rang - R.karts[b].rang);
  },
  debugText() {
    return 'Netz: Raum ' + this.code + ' · ' + (this.host ? 'Host mit ' + Object.keys(this.gaeste).length + ' Gästen' : 'Gast · Ping ' + Math.round(this.rtt) + ' ms · Uhr ' + Math.round(this.versatz) + ' ms') +
      ' · Puffer ' + this.puffer.map((p) => p.length).join('/');
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 11: Einstellungen, Anzeige im Rennen (HUD) und Spielablauf
   ══════════════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
function zeitText(t) {
  if (t == null || !isFinite(t)) return '–';
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hexCss(h) { return '#' + h.toString(16).padStart(6, '0'); }
function kartFarbe(k) { return hexCss(FARBEN[k.farbe % FARBEN.length].hex); }
// Beschriftung der Bau-Tasten je Eingabegerät
function tastenText(g) {
  if (g === 'tasten2') return { bauen: '.', slot: '-', wechsel: ',' };
  if (g && g.startsWith('pad')) return { bauen: 'Y', slot: 'Steuerkreuz ↑', wechsel: 'Steuerkreuz ← →' };
  return { bauen: 'E', slot: 'F', wechsel: 'Q' };
}

  daten: {
    name: 'Spieler', fahrzeug: 0, farbe: 0, lautstaerke: 0.7, musik: 0.4, stumm: false, grafik: 'mittel', erklaert: false,
    strecke: 'kiesgrube', runden: CONFIG.rennen.runden, bots: 7, stufe: 'mittel', lokalAnzahl: 2,
    lokal: [{ name: 'Spieler 1', geraet: 'tasten1', fahrzeug: 0, farbe: 0 }, { name: 'Spieler 2', geraet: 'tasten2', fahrzeug: 1, farbe: 3 },
      { name: 'Spieler 3', geraet: 'pad0', fahrzeug: 2, farbe: 5 }, { name: 'Spieler 4', geraet: 'pad1', fahrzeug: 3, farbe: 7 }],
  },
  laden() {
    try {

    } catch (e) { /* kein Speicher (z. B. privates Fenster): Standardwerte */ }
    const d = this.daten;
    if (!STRECKEN[d.strecke]) d.strecke = Object.keys(STRECKEN)[0];
    if (!Array.isArray(d.lokal) || d.lokal.length < 4) d.lokal = Speicher.standardLokal;
    d.fahrzeug = clamp(d.fahrzeug | 0, 0, FAHRZEUGE.length - 1); d.farbe = clamp(d.farbe | 0, 0, FARBEN.length - 1);
    d.runden = clamp(d.runden | 0, 1, 9); d.bots = clamp(d.bots | 0, 0, CONFIG.rennen.maxFahrer - 1);
    if (!CONFIG.bots.stufen[d.stufe]) d.stufe = 'mittel';
  },
  sichern() { try { localStorage.setItem('baustellenrennen', JSON.stringify(this.daten)); } catch (e) { /* egal */ } },
};
Speicher.standardLokal = JSON.parse(JSON.stringify(Speicher.daten.lokal));
