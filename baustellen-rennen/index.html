<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Baustellen-Rennen</title>
<meta name="description" content="Baustellen-Rennen: Kartrennen mit Mini-Baumaschinen. Wer hinten liegt, baut die Strecke um.">
<style>
:root {
  --gelb: #ffc61a; --orange: #ff7a1a; --schwarz: #17181a; --asphalt: #2a2d31; --grau: #6d7278;
  --weiss: #f5f1e6; --rot: #e0362c; --gruen: #3fb54a; --blau: #2f7fe6;
  --titel: Impact, Haettenschweiler, "Arial Narrow Bold", "Franklin Gothic Heavy", "Roboto Condensed", sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --streifen: repeating-linear-gradient(-45deg, var(--gelb) 0 14px, var(--schwarz) 14px 28px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #101214; color: var(--weiss); font-family: var(--text); font-size: 16px; -webkit-user-select: none; user-select: none; touch-action: none; }
#bild { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud, #schicht { position: fixed; inset: 0; pointer-events: none; }
#fuss { position: fixed; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 10px; letter-spacing: .08em; color: #fff; opacity: .32; pointer-events: none; z-index: 60; }
button, input, select { font: inherit; color: inherit; }
.versteckt { display: none !important; }

/* ── Menüs ───────────────────────────────────────────── */
#schicht { z-index: 40; display: flex; }
.schirm { pointer-events: auto; position: absolute; inset: 0; display: flex; padding: 3vh 4vw 5vh; overflow: auto; background: linear-gradient(90deg, rgba(16,18,20,.92) 0, rgba(16,18,20,.72) 46%, rgba(16,18,20,.08) 100%); }
.schirm.mitte { justify-content: center; background: rgba(16,18,20,.8); }
.tafel { width: min(560px, 100%); margin: auto 0; }
.schirm.mitte .tafel { margin: auto; }
.tafel.breit { width: min(920px, 100%); }
.logo { font-family: var(--titel); font-size: clamp(40px, 7.4vw, 92px); line-height: .86; letter-spacing: .01em; text-transform: uppercase; color: var(--gelb); transform: skewX(-7deg); text-shadow: 4px 4px 0 var(--schwarz), 7px 7px 0 var(--orange); margin: 0 0 6px; }
.logo small { display: block; font-size: .42em; color: var(--weiss); text-shadow: 3px 3px 0 var(--schwarz); letter-spacing: .06em; }
.band { height: 14px; background: var(--streifen); border-radius: 2px; margin: 14px 0 20px; max-width: 520px; }
h2 { font-family: var(--titel); font-weight: 400; font-size: clamp(30px, 4.6vw, 52px); text-transform: uppercase; letter-spacing: .03em; color: var(--gelb); margin: 0 0 4px; transform: skewX(-5deg); text-shadow: 3px 3px 0 var(--schwarz); }
h3 { font-family: var(--titel); font-weight: 400; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; color: var(--orange); margin: 18px 0 6px; }
p { line-height: 1.45; margin: 6px 0; max-width: 62ch; }
.knoepfe { display: grid; gap: 10px; max-width: 420px; }
.knopf { pointer-events: auto; cursor: pointer; border: 3px solid var(--schwarz); border-radius: 8px; background: var(--gelb); color: var(--schwarz); font-family: var(--titel); font-size: 24px; letter-spacing: .05em; text-transform: uppercase; padding: 9px 18px 8px; text-align: left; box-shadow: 0 5px 0 #000, inset 0 -5px 0 rgba(0,0,0,.14); transition: transform .08s, box-shadow .08s, background .12s; position: relative; }
.knopf:hover, .knopf:focus-visible { background: #ffe07a; outline: none; transform: translate(4px, -1px); }
.knopf:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
.knopf.klein { font-size: 17px; padding: 6px 12px 5px; box-shadow: 0 3px 0 #000; }
.knopf.zweit { background: var(--asphalt); color: var(--weiss); border-color: #000; }
.knopf.zweit:hover, .knopf.zweit:focus-visible { background: #3b3f45; }
.knopf.los { background: var(--orange); }
.knopf.los:hover, .knopf.los:focus-visible { background: #ff9a4f; }
.knopf:disabled { opacity: .45; cursor: default; transform: none; }
.zeile { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
.zeile > label, .zeile > .name { width: 128px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #c9c5b8; flex: none; }
.wahl { display: inline-flex; align-items: center; gap: 6px; }
.wahl b { min-width: 150px; text-align: center; font-family: var(--titel); font-weight: 400; font-size: 21px; letter-spacing: .04em; background: var(--asphalt); border: 2px solid #000; border-radius: 6px; padding: 4px 10px 3px; }
.pfeil { pointer-events: auto; cursor: pointer; width: 34px; height: 34px; border-radius: 6px; border: 2px solid #000; background: var(--gelb); color: #000; font-weight: 900; font-size: 18px; line-height: 1; box-shadow: 0 3px 0 #000; }
.pfeil:active { transform: translateY(3px); box-shadow: none; }
.feld { pointer-events: auto; background: var(--weiss); color: #111; border: 3px solid #000; border-radius: 6px; padding: 6px 10px; font-size: 18px; width: 210px; -webkit-user-select: text; user-select: text; }
.feld.code { font-family: var(--titel); font-size: 30px; letter-spacing: .3em; text-transform: uppercase; width: 190px; text-align: center; }
.farbfeld { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #000; display: inline-block; vertical-align: middle; }
input[type=range] { pointer-events: auto; width: 200px; accent-color: var(--orange); }
.hinweis { font-size: 13px; color: #b9b5a8; }
.karte { background: rgba(23,24,26,.86); border: 3px solid #000; border-left: 10px solid var(--gelb); border-radius: 8px; padding: 12px 16px; margin: 10px 0; }
.spalten { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0 28px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th { text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #b9b5a8; font-weight: 600; padding: 4px 8px; }
td { padding: 5px 8px; border-top: 1px solid rgba(255,255,255,.12); }
td.zahl, th.zahl { text-align: right; font-variant-numeric: tabular-nums; }
tr.ich td { background: rgba(255,198,26,.16); }
kbd { display: inline-block; min-width: 26px; text-align: center; background: var(--weiss); color: #111; border: 2px solid #000; border-bottom-width: 4px; border-radius: 5px; padding: 0 6px; font: 600 13px var(--text); margin: 1px; }
.abzeichen { display: inline-block; background: var(--gelb); color: #000; border: 2px solid #000; border-radius: 99px; padding: 2px 12px; font-size: 13px; font-weight: 700; margin: 3px 4px 3px 0; }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 70; background: var(--rot); color: #fff; border: 3px solid #000; border-radius: 8px; padding: 10px 18px; max-width: min(640px, 92vw); font-weight: 600; box-shadow: 0 5px 0 #000; pointer-events: auto; }
.spielerliste .zeile { background: rgba(0,0,0,.35); border-radius: 6px; padding: 5px 10px; margin: 4px 0; }
.bereit { color: var(--gruen); font-weight: 700; }

/* ── Anzeige im Rennen (pro Spieler ein .hud) ─────────── */
.hud { position: absolute; overflow: hidden; --m: 1; font-family: var(--titel); letter-spacing: .03em; text-shadow: 2px 2px 0 #000; }
.hud > div { position: absolute; }
.h-platz { left: calc(var(--m) * 16px); top: calc(var(--m) * 10px); font-size: calc(var(--m) * 78px); line-height: .9; color: var(--gelb); transform: skewX(-7deg); }
.h-platz small { font-size: .36em; color: var(--weiss); }
.h-runde { left: calc(var(--m) * 18px); top: calc(var(--m) * 86px); font-size: calc(var(--m) * 22px); }
.h-runde b { font-weight: 400; color: var(--gelb); }
.h-zeit { left: calc(var(--m) * 18px); top: calc(var(--m) * 114px); font: 600 calc(var(--m) * 14px) var(--text); letter-spacing: 0; font-variant-numeric: tabular-nums; line-height: 1.35; }
.h-karte { right: calc(var(--m) * 12px); top: calc(var(--m) * 10px); width: calc(var(--m) * 190px); height: calc(var(--m) * 190px); background: rgba(16,18,20,.5); border: 2px solid rgba(0,0,0,.7); border-radius: 10px; }
.h-karte canvas { width: 100%; height: 100%; display: block; }
.h-tempo { right: calc(var(--m) * 14px); bottom: calc(var(--m) * 14px); font-size: calc(var(--m) * 40px); text-align: right; line-height: 1; }
.h-tempo small { font-size: .4em; color: #d6d2c4; }
.h-tempo .lade { display: block; margin: 4px 0 0 auto; width: calc(var(--m) * 120px); height: calc(var(--m) * 9px); background: rgba(0,0,0,.55); border: 2px solid #000; border-radius: 6px; overflow: hidden; }
.h-tempo .lade i { display: block; height: 100%; width: 0; background: var(--gelb); }
.h-mitte { left: 50%; top: calc(var(--m) * 8px + 38px); transform: translateX(-50%); text-align: center; white-space: nowrap; }
.h-warnung { display: inline-block; background: var(--gelb); color: #000; text-shadow: none; border: 3px solid #000; border-radius: 8px; padding: 3px 14px 2px; font-size: calc(var(--m) * 24px); box-shadow: 0 4px 0 #000; animation: blink .5s steps(2) infinite; }
.h-warnung .pf { display: inline-block; font-size: 1.25em; line-height: .8; vertical-align: -0.08em; margin: 0 4px; }
@keyframes blink { 50% { background: var(--orange); } }
.h-meldung { margin-top: 6px; font-size: calc(var(--m) * 22px); color: var(--weiss); min-height: 1.2em; transition: opacity .3s; }
.h-meldung.plus { color: var(--gelb); }
.h-gross { left: 50%; top: 36%; transform: translate(-50%, -50%) skewX(-7deg); font-size: calc(var(--m) * 150px); color: var(--gelb); text-shadow: 6px 6px 0 #000; pointer-events: none; }
.h-gross.klein { font-size: calc(var(--m) * 64px); }
.h-abstand { left: calc(var(--m) * 18px); bottom: calc(var(--m) * 14px); font: 600 calc(var(--m) * 15px) var(--text); letter-spacing: 0; line-height: 1.3; }
.h-bau { left: 50%; bottom: calc(var(--m) * 12px); transform: translateX(-50%); display: flex; align-items: flex-end; gap: calc(var(--m) * 6px); }
.h-bp { margin-right: calc(var(--m) * 8px); text-align: center; line-height: .95; }
.h-bp b { display: block; font-weight: 400; font-size: calc(var(--m) * 44px); color: var(--gelb); }
.h-bp span { font-size: calc(var(--m) * 15px); }
.h-bp .lade { width: calc(var(--m) * 56px); height: calc(var(--m) * 7px); background: rgba(0,0,0,.55); border: 2px solid #000; border-radius: 5px; overflow: hidden; margin: 3px auto 0; }
.h-bp .lade i { display: block; height: 100%; background: var(--gelb); width: 0; }
.bw { position: relative; width: calc(var(--m) * 68px); height: calc(var(--m) * 74px); background: rgba(23,24,26,.82); border: 3px solid #000; border-radius: 8px; text-align: center; text-shadow: none; color: var(--weiss); pointer-events: auto; cursor: pointer; }
.bw svg { width: 62%; height: 46%; margin-top: 8%; display: block; margin-left: auto; margin-right: auto; }
.bw .n { display: block; font: 600 calc(var(--m) * 10px) var(--text); letter-spacing: 0; white-space: nowrap; overflow: hidden; }
.bw .p { position: absolute; right: -6px; top: -8px; background: var(--gelb); color: #000; border: 2px solid #000; border-radius: 99px; font-size: calc(var(--m) * 14px); min-width: calc(var(--m) * 24px); padding: 0 3px; }
.bw .t { position: absolute; left: 3px; top: 1px; font: 700 calc(var(--m) * 11px) var(--text); color: #b9b5a8; }
.bw.zu { opacity: .38; filter: grayscale(1); }
.bw.gegen { border-top: 5px solid var(--rot); }
.bw.selbst { border-top: 5px solid var(--gruen); }
.bw.aktiv { background: var(--gelb); color: #000; transform: translateY(calc(var(--m) * -8px)); box-shadow: 0 5px 0 #000; }
.bw.aktiv .t { color: #000; }
.h-bauinfo { left: 50%; bottom: calc(var(--m) * 100px); transform: translateX(-50%); font: 600 calc(var(--m) * 13px) var(--text); letter-spacing: 0; white-space: nowrap; background: rgba(0,0,0,.45); border-radius: 99px; padding: 2px 12px; }
.h-falsch { left: 50%; top: 52%; transform: translateX(-50%); font-size: calc(var(--m) * 34px); color: var(--rot); }
#pauseknopf { position: fixed; left: 50%; top: 6px; transform: translateX(-50%); z-index: 30; pointer-events: auto; opacity: .55; }
#debug { position: fixed; left: 6px; bottom: 16px; z-index: 80; font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; background: rgba(0,0,0,.6); color: #9f9; padding: 4px 8px; border-radius: 4px; white-space: pre; pointer-events: none; }
#sim { position: fixed; inset: 0; overflow: auto; background: #17181a; padding: 24px; z-index: 90; pointer-events: auto; -webkit-user-select: text; user-select: text; }
#sim table { max-width: 900px; }
.balken { height: 16px; background: #000; border: 2px solid #000; border-radius: 6px; overflow: hidden; max-width: 520px; }
.balken i { display: block; height: 100%; background: var(--streifen); width: 0; }
.gut { color: var(--gruen); font-weight: 700; } .schlecht { color: var(--rot); font-weight: 700; }
/* Touch-Steuerung */
.touch { position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(255,255,255,.14); border: 3px solid rgba(0,0,0,.5); color: #fff; font: 400 22px var(--titel); display: flex; align-items: center; justify-content: center; text-shadow: 2px 2px 0 #000; }
@media (max-height: 520px) { .logo { font-size: 44px; } .knopf { font-size: 19px; padding: 6px 14px 5px; } .band { margin: 8px 0 10px; } }
.schau{display:grid;grid-template-columns:1.25fr 1fr;gap:6px;align-items:center;margin:8px 0;background:linear-gradient(#232931,#0e1114);border-radius:12px;overflow:hidden}
.schau canvas{width:100%;height:168px;display:block}
.schau-text{padding:10px 14px 10px 0;display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:#e9edf2;text-align:left}
.schau-text b{font-size:1.15rem;line-height:1.15}
.schau-text small,.h-los small{opacity:.7;text-transform:uppercase;letter-spacing:.08em;font-size:.68rem}
.plus{color:#7fe08a}.minus{color:#ff9d8f}
@media(max-width:560px){.schau{grid-template-columns:1fr}.schau canvas{height:140px}.schau-text{padding:0 12px 10px}}
.h-los{position:absolute;left:50%;top:20%;transform:translateX(-50%);background:rgba(14,17,21,.88);color:#fff;border-radius:14px;padding:14px 22px;text-align:center;min-width:250px;max-width:88%;border:1px solid rgba(255,255,255,.16)}
.h-los small{display:block}.h-los b{display:block;font-size:1.7rem;margin:2px 0}.h-los span{display:block;font-size:.9rem;margin-top:4px}
/* ── Neues, ruhigeres Erscheinungsbild (überschreibt die älteren Regeln weiter oben) ── */
:root{--gold:#d8b46a;--tinte:#0f1216;--glas:rgba(16,19,24,.78);--linie:rgba(255,255,255,.12);--text:#eef1f4;--leise:#9aa3ad}
.schirm{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:linear-gradient(90deg,rgba(8,10,13,.8),rgba(8,10,13,.3) 55%,rgba(8,10,13,0))}
.tafel{background:var(--glas);border:1px solid var(--linie);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:22px 24px}
.logo,.tafel h1,.tafel h2{font-style:normal;text-transform:none;letter-spacing:-.01em;font-weight:650;color:var(--text);text-shadow:none}
.logo small{color:var(--gold);font-weight:500}
.tafel h3{font-style:normal;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:600;color:var(--gold)}
.band{height:2px;background:linear-gradient(90deg,var(--gold),transparent);border:0;opacity:.8}
.zeile label{text-transform:none;letter-spacing:0;color:var(--leise);font-size:.9rem}
.wahl b,.feld{background:rgba(255,255,255,.06);border:1px solid var(--linie);border-radius:10px;color:var(--text);box-shadow:none;font-weight:500}
.feld:focus{outline:2px solid var(--gold);outline-offset:1px}
.pfeil{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--linie);border-radius:10px;box-shadow:none}
.pfeil:hover{background:var(--gold);color:var(--tinte)}
.knopf{font-style:normal;text-transform:none;letter-spacing:.01em;font-weight:600;background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--linie);border-radius:12px;box-shadow:none;transition:background .15s,transform .15s}
.knopf:hover,.knopf:focus-visible{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.knopf.los{background:linear-gradient(180deg,#e6c47c,#c79f52);color:#1a1408;border-color:transparent}
.knopf.los:hover,.knopf.los:focus-visible{background:linear-gradient(180deg,#f0d08c,#d2aa5c)}
.knopf.zweit{background:transparent;color:var(--leise)}
.karte{background:rgba(255,255,255,.05);border:1px solid var(--linie);border-left:3px solid var(--gold);border-radius:12px;box-shadow:none;color:var(--text)}
.hinweis{color:var(--leise)}
kbd{background:rgba(255,255,255,.1);border:1px solid var(--linie);border-radius:6px;color:var(--text);box-shadow:none}
.tafel table th{color:var(--gold);font-weight:600;text-transform:none}
input[type=range]{accent-color:var(--gold)}
.schirm{overflow-y:auto;-webkit-overflow-scrolling:touch}
.schirm h1,.schirm h2{font-style:normal!important;text-transform:none!important}
.h-gross{font-style:normal;font-weight:800;letter-spacing:.02em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6)}
@media(max-height:780px){.schau canvas{height:118px}.tafel{padding:14px 18px}}
.h-platz{font-style:normal;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.h-bau .bw{background:rgba(16,19,24,.72);border:1px solid var(--linie);border-radius:12px;box-shadow:none}
.h-bp b{color:var(--gold)}
</style>
</head>
<body>
<canvas id="bild"></canvas>
<div id="hud"></div>
<div id="schicht"></div>
<div id="fuss">Erstellt von JL</div>
<script id="logik">
/* ══════════════════════════════════════════════════════════════════════════
   BAUSTELLEN-RENNEN – ein Multiplayer-Kartrennen für den Browser
   --------------------------------------------------------------------------
   Aufbau dieser Datei:
     TEIL 1  CONFIG            alle Balancing-Werte (hier darfst du schrauben!)
     TEIL 2  Hilfsfunktionen
     TEIL 3  Strecken-Daten    (Kontrollpunkte, Slots, Abkürzungen, Deko)
     TEIL 4  Strecken-Aufbau   (Kurve abtasten, Ideallinie, Slots)
     TEIL 5  Rennen            (Physik, Regeln, Baupunkte, Bauen)
     TEIL 6  Bots
     TEIL 7  Simulation        (?sim=200)
     ───── ab hier braucht es einen Browser ─────
     TEIL 8  Grafik (three.js) TEIL 9 Ton   TEIL 10 Eingabe
     TEIL 11 Netzwerk (PeerJS) TEIL 12 Anzeige und Menüs   TEIL 13 Ablauf
   Die Teile 1–7 sind reine Spiel-Logik und laufen auch ohne Grafik.
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   TEIL 1: CONFIG – alle Balancing-Werte an einem Ort
   Längen in Metern, Zeiten in Sekunden, Tempo in m/s (30 m/s = 108 km/h).
   ══════════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  version: '1.0',

  // ── Fahrphysik ──────────────────────────────────────────────────────────
  fahren: {
    vmax: 30,              // Höchsttempo auf der Fahrbahn
    beschleunigung: 31,    // Anfangs-Beschleunigung in m/s²; nimmt bis vmax ab (≈ 2,5 s bis Höchsttempo)
    bremsen: 36,           // Bremsverzögerung in m/s²
    ausrollen: 6,          // Verzögerung ohne Gas in m/s²
    rueckwaertsVmax: 9,    // Höchsttempo rückwärts
    lenkrateLangsam: 2.5,  // Drehrate bei wenig Tempo (rad/s)
    lenkrateSchnell: 0.82, // Drehrate bei Höchsttempo (rad/s); Wendekreis-Radius ≈ vmax / Drehrate
    lenkAnsprechen: 9,     // wie schnell die Lenkung dem Tastendruck folgt (1/s); höher = direkter
    kurvenVerlust: 0.07,   // Tempoverlust bei vollem Lenkeinschlag ohne Drift (Anteil von vmax)
    offroadFaktor: 0.55,   // Höchsttempo neben der Fahrbahn (Anteil von vmax)
    offroadBremse: 2.6,    // wie schnell man neben der Fahrbahn auf dieses Tempo abfällt (1/s)
    tempoAbbau: 1.5,       // wie schnell Tempo über dem Limit (z. B. nach einem Boost) abgebaut wird (1/s)
    hangEinfluss: 5,       // Einfluss von Steigungen (m/s² bei 100 % Steigung)
    schwerkraft: 28,       // Fallbeschleunigung in der Luft (m/s²)
    luftLenkung: 0.25,     // Lenkwirkung in der Luft (Anteil)
    wandAbprall: 0.35,     // wie stark man von Wänden abprallt (0 = gar nicht, 1 = voll)
    wandVerlust: 0.55,     // Tempoverlust bei frontalem Wandkontakt (Anteil)
    wandSchleifen: 0.5,    // Tempoverlust pro Sekunde beim Entlangschleifen (Anteil)
    kartRadius: 1.05,      // Kollisionsradius eines Fahrzeugs
    stoss: 0.55,           // Stärke des Schubsens zwischen Fahrzeugen
    schubAbbau: 5,         // wie schnell ein Schubs abklingt (1/s)
  },

  // ── Driften und Mini-Turbo ──────────────────────────────────────────────
  drift: {

const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;

// kürzeste Winkeldifferenz a − b im Bereich (−π, π]
function winkelDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU; else if (d <= -Math.PI) d += TAU;
  return d;
}

// Differenz zweier Streckenpositionen auf einer Runde der Länge L, Bereich (−L/2, L/2]
function rundenDiff(a, b, L) {
  let d = (a - b) % L;
  if (d > L / 2) d -= L; else if (d <= -L / 2) d += L;
  return d;
}

// Weg nach vorn von a nach b auf einer Runde der Länge L, Bereich [0, L)
function wegVor(a, b, L) {
  let d = (b - a) % L;
  if (d < 0) d += L;
  return d;
}

// Zufallszahlen mit Startwert (damit Simulationen wiederholbar sind)
function zufallsGenerator(startwert) {
  let a = startwert >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Zufalls-Auto: mischt die 8 Autos und teilt sie der Reihe nach zu. «vorher» (Liste der Autos im Rennen davor)
// sorgt dafür, dass möglichst niemand zweimal hintereinander dasselbe bekommt.
function loseFahrzeuge(n, zufall, vorher) {
  let wahl = [];
  for (let versuch = 0; versuch < 20; versuch++) {
    const l = FAHRZEUGE.map((f) => f.id);
    for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(zufall() * (i + 1)); const t = l[i]; l[i] = l[j]; l[j] = t; }
    wahl = [];
    for (let i = 0; i < n; i++) wahl.push(l[i % l.length]);
    if (!vorher || !wahl.some((id, i) => id === vorher[i])) break;
  }
  return wahl;
}
