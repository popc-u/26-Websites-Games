function zahlen(von, bis) { const l = []; for (let i = von; i <= bis; i++) l.push({ wert: i, text: String(i) }); return l; }

const Menue = {
  el: null, offen: null, aktionen: {}, wahlen: {}, beiProfil: null,

  zeige(name, html, aktionen, klasse) {
    this.offen = name; this.aktionen = aktionen || {};
    this.el.innerHTML = '<div class="schirm ' + (klasse || '') + '">' + html + '</div>';
    this.el.querySelectorAll('[data-a]').forEach((b) => {
      b.onclick = (ev) => {
        Ton.start(); Ton.spiele('klick');
        if (b.dataset.a === 'wahl') {
          const w = this.wahlen[b.dataset.w];
          w.i = (w.i + +b.dataset.r + w.liste.length) % w.liste.length;
          $('w-' + b.dataset.w).innerHTML = w.liste[w.i].text;
          w.beiWechsel(w.liste[w.i].wert);
          return;
        }
        const f = this.aktionen[b.dataset.a];
        if (f) f(b, ev);
      };
    });
    Schauraum.schliesse(); clearInterval(this.schauTakt);
    if ($('schau')) { Schauraum.oeffne($('schau')); this.schau(); }
    if ($('streckenkarte')) this.streckenKarte(Speicher.daten.strecke);
    const erster = this.el.querySelector('.knopf');
    if (erster && !('ontouchstart' in window)) erster.focus();
  },
  schliesse() { this.offen = null; this.aktionen = {}; this.el.innerHTML = ''; Schauraum.schliesse(); clearInterval(this.schauTakt); },

  // Auswahlzeile mit ◀ ▶
  wahlZeile(titel, id, liste, wert, beiWechsel) {
    let i = liste.findIndex((o) => o.wert === wert); if (i < 0) i = 0;
    this.wahlen[id] = { liste, i, beiWechsel };
    return '<div class="zeile"><label>' + titel + '</label><span class="wahl"><button class="pfeil" data-a="wahl" data-w="' + id + '" data-r="-1" aria-label="' + titel + ' zurück">◀</button><b id="w-' + id + '">' + liste[i].text +
      '</b><button class="pfeil" data-a="wahl" data-w="' + id + '" data-r="1" aria-label="' + titel + ' weiter">▶</button></span></div>';
  },
  streckenZeilen() {
    const D = Speicher.daten;
    return this.wahlZeile('Strecke', 'strecke', Object.keys(STRECKEN).map((id) => ({ wert: id, text: STRECKEN[id].name })), D.strecke, (v) => { D.strecke = v; Spiel.starteDemo(v); this.streckenKarte(v); }) +
      '<div class="streckenkarte" id="streckenkarte"></div>' +
      this.wahlZeile('Runden', 'runden', zahlen(1, 7), D.runden, (v) => { D.runden = v; });
  },
  // Steckbrief der gewählten Strecke: Karte wie im Rennen (Höhenschatten, Abkürzungen grün, Boost-Felder, Sehenswürdigkeiten),
  // Beschreibung, Länge, Beläge, Tageszeit, Abkürzungen und Boost-Felder. Dahinter läuft die Strecke selbst in 3D (Vorführrennen).
  streckenKarte(id) {
    const el = $('streckenkarte');
    if (!el || !STRECKEN[id]) return;
    const S = holeStrecke(id), def = STRECKEN[id], arten = [];
    for (const a of S.belagArt.concat((def.wege || []).map((w) => w.belag || 'kies'))) if (!arten.includes(a)) arten.push(a);
    const abk = (def.wege || []).filter((w) => w.art === 'abkuerzung').length, boost = (S.boostfelder || []).length, tz = TAGESZEIT[id] || ['tag', 'Tag'];
    const fakt = (sym, text) => '<li>' + symbol(sym) + '<span>' + text + '</span></li>';
    el.innerHTML = '<canvas width="236" height="236" aria-label="Karte der Strecke ' + esc(def.name) + '"></canvas><div class="sk-text"><b>' + esc(def.name) + '</b><span>' + esc(def.text || '') + '</span><ul>' +
      fakt('laenge', (S.laenge / 1000).toFixed(2).replace('.', ',') + ' km') + fakt(tz[0], tz[1]) + fakt('belag', arten.map((a) => BELAG_NAMEN[a] || a).join(', ')) +
      (abk ? fakt('abkuerzung', abk + (abk > 1 ? ' Abkürzungen' : ' Abkürzung')) : '') + (boost ? fakt('boost', boost + ' Boost-Felder') : '') + '</ul>' + Bestenliste.steckbrief(id) + '</div>';
    const k = {}; Hud.zeichneKartenGrund.call(k, S);                // eigene Leinwand: die Karte im Rennen bleibt unberührt
    el.querySelector('canvas').getContext('2d').drawImage(k.grund, 0, 0, 236, 236);
    el.classList.remove('neu'); void el.offsetWidth; el.classList.add('neu');          // kleine Einblend-Animation bei jedem Wechsel
  },
  fahrerZeilen(immerWahl) {
    const D = Speicher.daten, neu = () => { if (this.beiProfil) this.beiProfil(); this.schau(); };
    this.schauZufall = D.zufallsAuto && !immerWahl;
    return '<div class="zeile"><label for="f-name">Name</label><input class="feld" id="f-name" maxlength="14" autocomplete="off" value="' + esc(D.name) + '"></div>' +
      '<div class="schau"><canvas id="schau"></canvas><div class="schau-text" id="schau-text"></div></div>' +
      (this.schauZufall ? '' : this.wahlZeile('Auto', 'fahrzeug', FAHRZEUG_LISTE, D.fahrzeug, (v) => { D.fahrzeug = v; neu(); })) +
      this.wahlZeile('Lack', 'farbe', FARB_LISTE, D.farbe, (v) => { D.farbe = v; neu(); });
  },
  // Showroom: gewähltes Auto mit Stärke und Schwäche. Bei Zufalls-Auto wechseln die 8 Autos durch, man wählt nur den Lack.
  schau() {
    const D = Speicher.daten, t = $('schau-text');
    if (!$('schau') || this.offen === 'ergebnis') return;           // im Ergebnis zeigt der Schauraum das Siegerpodest
    clearInterval(this.schauTakt);
    const zeig = (i, zufall) => {
      const f = FAHRZEUGE[i]; Schauraum.zeige(f.id, D.farbe);
      if (t) t.innerHTML = zufall ? '<small>Zufalls-Auto</small><b>' + f.name + '?</b><span>Vor jedem Rennen wird dir eines der 8 Autos zugelost. Hier wählst du nur den Lack.</span>'
        : '<small>' + f.klasse + '</small><b>' + f.name + '</b><span class="plus">▲ ' + f.plus + '</span><span class="minus">▼ ' + f.minus + '</span>';
    };
    if (this.schauZufall) { let i = Math.floor(Math.random() * FAHRZEUGE.length); zeig(i, true); this.schauTakt = setInterval(() => { i = (i + 1) % FAHRZEUGE.length; zeig(i, true); }, 2600); }
    else zeig(D.fahrzeug, false);
  },
  nameLesen() { const f = $('f-name'); if (f) Speicher.daten.name = (f.value.trim() || 'Spieler').slice(0, 14); },

  // Bots mit zufälligen Namen und noch freien Farben
  botFahrer(anzahl, stufe, belegt) {
    const liste = [], namen = BOT_NAMEN.slice();
    for (let i = 0; i < anzahl; i++) {
      let farbe = 0; while (belegt.includes(farbe) && farbe < FARBEN.length - 1) farbe++;
      belegt.push(farbe);
      liste.push({ name: namen.splice(Math.floor(Math.random() * namen.length), 1)[0], typ: 'bot', stufe, fahrzeug: FAHRZEUGE[Math.floor(Math.random() * FAHRZEUGE.length)].id, farbe });
    }
    return liste;
  },

  laden(text) { this.zeige('laden', '<div class="tafel"><h1 class="logo">Baustellen-<small>Rennen</small></h1><div class="band"></div><p>' + (text || 'Lade …') + '</p></div>'); },
  fehler(text) {
    this.zeige('fehler', '<div class="tafel"><h1 class="logo">Baustellen-<small>Rennen</small></h1><div class="band"></div><div class="karte" style="border-left-color:var(--rot)"><h3 style="margin-top:0">Das hat nicht geklappt</h3><p>' + text + '</p></div>' +
      '<div class="knoepfe"><button class="knopf" data-a="neu">Nochmals versuchen</button></div></div>', { neu: () => location.reload() });
  },

  haupt() {
    this.wahlen = {}; this.beiProfil = null;
    const D = Speicher.daten;
    let html = '<div class="tafel"><h1 class="logo">Baustellen-<small>Rennen</small></h1><div class="band"></div>';
    if (!D.erklaert) {        // erster Start: zuerst die Bau-Regel in drei Sätzen
      this.zeige('haupt', html + '<div class="karte"><h3 style="margin-top:0">So geht’s</h3><p>Wer hinten liegt, darf die Strecke umbauen: Rampen und Abkürzungen für sich selbst, Baustellen gegen die Fahrer davor. ' +
        'Bezahlt wird mit Baupunkten (BP), und die verdienst du nur durch Aufholen und Überholen. Der Führende verdient nichts und kann nicht bauen – Zufalls-Items gibt es keine.</p></div>' +
        '<div class="knoepfe"><button class="knopf los" data-a="ok">Verstanden, los!</button></div></div>', { ok: () => { D.erklaert = true; Speicher.sichern(); this.haupt(); } });
      return;
    }
    html += '<div class="knoepfe"><button class="knopf los" data-a="bots">Gegen Bots</button><button class="knopf" data-a="lokal">Lokal am selben Gerät</button>' +
      '<button class="knopf" data-a="erstellen">Online: Raum erstellen</button><button class="knopf" data-a="beitreten">Online: Raum beitreten</button>' +
      '<button class="knopf zweit" data-a="bestenliste">Bestenlisten</button><button class="knopf zweit" data-a="steuerung">Steuerung</button><button class="knopf zweit" data-a="einstellungen">Einstellungen</button></div></div>';
    const online = (f) => { if (typeof Online !== 'undefined') f(); else App.toast('Der Online-Modus ist in dieser Version noch nicht eingebaut.'); };
    this.zeige('haupt', html, {
      bots: () => this.bots(), lokal: () => this.lokal(),
      erstellen: () => online(() => Online.erstellen()), beitreten: () => online(() => Online.beitretenDialog()),
      steuerung: () => this.steuerung(() => this.haupt()), einstellungen: () => this.einstellungen(), bestenliste: () => Bestenliste.seite(D.strecke, ''),
    });
  },

  bots() {
    this.wahlen = {};
    const D = Speicher.daten;
    this.zeige('bots', '<div class="tafel"><h2>Gegen Bots</h2>' + this.streckenZeilen() +
      this.wahlZeile('Gegner', 'gegner', zahlen(0, CONFIG.rennen.maxFahrer - 1), D.bots, (v) => { D.bots = v; }) +
      this.wahlZeile('Stärke', 'stufe', STUFEN_LISTE, D.stufe, (v) => { D.stufe = v; }) + this.wahlZeile('Zufalls-Auto', 'zufall', EIN_AUS, D.zufallsAuto, (v) => { this.nameLesen(); D.zufallsAuto = v; this.bots(); }) + '<h3>Dein Auto</h3>' + this.fahrerZeilen() +
      '<div class="knoepfe" style="margin-top:16px"><button class="knopf los" data-a="start">Rennen starten</button><button class="knopf zweit" data-a="zurueck">Zurück</button></div></div>', {
      start: () => {
        this.nameLesen(); Speicher.sichern();
        const ich = { name: D.name, typ: 'mensch', fahrzeug: FAHRZEUGE[D.fahrzeug].id, farbe: D.farbe, geraet: 'tasten' };
        Spiel.starte({ modus: 'bots', zufall: D.zufallsAuto, strecke: D.strecke, runden: D.runden, fahrer: [ich].concat(this.botFahrer(D.bots, D.stufe, [D.farbe])) });
      },
      zurueck: () => { this.nameLesen(); Speicher.sichern(); this.haupt(); },
    });
  },

  lokalLesen() {
    const D = Speicher.daten;
    for (let i = 0; i < 4; i++) { const f = $('f-name' + i); if (f) D.lokal[i].name = (f.value.trim() || 'Spieler ' + (i + 1)).slice(0, 14); }
  },
  lokal() {
    this.wahlen = {};
    const D = Speicher.daten;
    let html = '<div class="tafel breit"><h2>Lokal am selben Gerät</h2><p class="hinweis">Zwei Spieler teilen sich die Tastatur (W A S D und Pfeiltasten), der Bildschirm wird geteilt. Mit Gamepads fahren bis zu vier.</p>' +
      this.wahlZeile('Spieler', 'anzahl', zahlen(2, 4), D.lokalAnzahl, (v) => { this.lokalLesen(); D.lokalAnzahl = v; this.lokal(); }) +
      this.wahlZeile('Zufalls-Auto', 'zufall', EIN_AUS, D.zufallsAuto, (v) => { this.lokalLesen(); D.zufallsAuto = v; this.lokal(); }) + '<div class="spalten">';
    for (let i = 0; i < D.lokalAnzahl; i++) {
      const p = D.lokal[i];
      html += '<div class="karte"><div class="zeile"><label for="f-name' + i + '">Spieler ' + (i + 1) + '</label><input class="feld" id="f-name' + i + '" maxlength="14" autocomplete="off" value="' + esc(p.name) + '"></div>' +
        this.wahlZeile('Steuerung', 'g' + i, GERAETE_LISTE, p.geraet, (v) => { p.geraet = v; }) +
        (D.zufallsAuto ? '' : this.wahlZeile('Auto', 'fz' + i, FAHRZEUG_LISTE, p.fahrzeug, (v) => { p.fahrzeug = v; })) +
        this.wahlZeile('Lack', 'fb' + i, FARB_LISTE, p.farbe, (v) => { p.farbe = v; }) + '</div>';
    }
    html += '</div><div class="spalten"><div>' + this.streckenZeilen() + '</div><div>' +
      this.wahlZeile('Bots dazu', 'gegner', zahlen(0, CONFIG.rennen.maxFahrer - D.lokalAnzahl), Math.min(D.bots, CONFIG.rennen.maxFahrer - D.lokalAnzahl), (v) => { D.bots = v; }) +
      this.wahlZeile('Stärke', 'stufe', STUFEN_LISTE, D.stufe, (v) => { D.stufe = v; }) + '</div></div>' +
      '<div class="knoepfe" style="margin-top:14px"><button class="knopf los" data-a="start">Rennen starten</button><button class="knopf zweit" data-a="zurueck">Zurück</button></div></div>';
    this.zeige('lokal', html, {
      start: () => {
        this.lokalLesen(); Speicher.sichern();
        const sp = D.lokal.slice(0, D.lokalAnzahl), pads = Eingabe.angeschlossenePads();
        for (let i = 0; i < sp.length; i++) {
          if (sp.findIndex((q) => q.geraet === sp[i].geraet) !== i) { App.toast('Zwei Spieler haben dieselbe Steuerung gewählt.'); return; }
          if (sp[i].geraet.startsWith('pad') && !pads.includes(+sp[i].geraet.slice(3))) { App.toast('Gamepad ' + (+sp[i].geraet.slice(3) + 1) + ' wurde nicht gefunden. Schliesse es an und drücke eine Taste darauf.'); return; }
        }
        const fahrer = sp.map((p) => ({ name: p.name, typ: 'mensch', fahrzeug: FAHRZEUGE[p.fahrzeug].id, farbe: p.farbe, geraet: p.geraet }));
        const bots = Math.min(D.bots, CONFIG.rennen.maxFahrer - fahrer.length);
        Spiel.starte({ modus: 'lokal', zufall: D.zufallsAuto, strecke: D.strecke, runden: D.runden, fahrer: fahrer.concat(this.botFahrer(bots, D.stufe, sp.map((p) => p.farbe))) });
      },
      zurueck: () => { this.lokalLesen(); Speicher.sichern(); this.haupt(); },
    });
  },

  steuerung(zurueck) {
    this.wahlen = {};
    const z = (a, b, c, d) => '<tr><td>' + a + '</td><td>' + b + '</td><td>' + c + '</td><td>' + d + '</td></tr>';
    const k = (...t) => t.map((x) => '<kbd>' + x + '</kbd>').join(' ');
    const P = CONFIG.bau.preise;
    this.zeige('steuerung', '<div class="tafel breit"><h2>Steuerung</h2><table><tr><th>Aktion</th><th>Tastatur links</th><th>Tastatur rechts</th><th>Gamepad</th></tr>' +
      z('Lenken', k('A', 'D'), k('←', '→'), 'linker Stick') + z('Gas', k('W'), k('↑'), 'A oder RT') + z('Bremsen, rückwärts', k('S'), k('↓'), 'B oder LT') +
      z('Driften', k('Leertaste'), k('Shift rechts') + ' oder ' + k('Enter'), 'X oder RB') + z('Bauwerk wählen', k('Q') + ' oder ' + k('1') + '–' + k('6'), k(','), 'Steuerkreuz ← →') +
      z('Bauplatz wechseln', k('F'), k('-'), 'Steuerkreuz ↑') + z('Bauen', k('E'), k('.'), 'Y') + z('Zurück auf die Strecke', k('R'), k('⌫'), 'Select') + z('Pause', k('Esc') + ' oder ' + k('P'), '', 'Start') +
      '</table><p class="hinweis">Allein gelten beide Tastatur-Hälften. Zahlentasten: einmal drücken wählt das Bauwerk, nochmals drücken baut es. <kbd>M</kbd> schaltet den Ton aus.</p>' +
      '<div class="spalten"><div><h3>Fahren</h3><p><b>Drift:</b> Taste in der Kurve halten. Nach 1 s sprühen blaue, nach 2 s orange Funken – beim Loslassen gibt es einen Mini-Turbo.</p>' +
      '<p><b>Windschatten:</b> Etwa 1,5 s dicht hinter einem Fahrzeug bleiben, dann wirst du schneller.</p></div>' +
      '<div><h3>Bauen</h3><p><b>Baupunkte</b> gibt es fürs Überholen (+' + CONFIG.bp.ueberholen + ') und fürs Aufholen (+1 pro ' + CONFIG.bp.meterProBP + ' m). Wer führt, verdient nichts und baut nicht. Je grösser dein Rückstand auf den Führenden, desto mehr gibt es; in den ersten ' + CONFIG.bp.startPause + ' s nach dem Start noch nichts.</p>' +
      '<p>Für dich: Rampe (' + P.rampe + ' BP), Abkürzung (' + P.abkuerzung + '). Gegen die Fahrer vor dir: Pylonen (' + P.pylonen + '), Schlammloch (' + P.schlamm + '), Absperrung (' + P.absperrung + '), Umleitung (' + P.umleitung + '). ' +
      'Durchsichtige Baustellen gelten nicht für dich.</p></div></div>' +
      '<div class="knoepfe"><button class="knopf" data-a="zurueck">Zurück</button></div></div>', { zurueck });
  },

  einstellungen() {
    this.wahlen = {};
    const D = Speicher.daten;
    this.zeige('einstellungen', '<div class="tafel"><h2>Einstellungen</h2>' + this.fahrerZeilen(true) +
      '<div class="zeile"><label for="f-laut">Effekte</label><input type="range" id="f-laut" min="0" max="100" value="' + Math.round(D.lautstaerke * 100) + '"></div>' +
      '<div class="zeile"><label for="f-musik">Musik</label><input type="range" id="f-musik" min="0" max="100" value="' + Math.round(D.musik * 100) + '"></div>' +
      this.wahlZeile('Ton', 'stumm', [{ wert: false, text: 'An' }, { wert: true, text: 'Stumm' }], D.stumm, (v) => { D.stumm = v; App.tonSetzen(); }) +
      this.wahlZeile('Grafik', 'grafik', Object.keys(GRAFIK_NAMEN).map((q) => ({ wert: q, text: GRAFIK_NAMEN[q] })), D.grafik, (v) => { D.grafik = v; D.grafikGemessen = true; Grafik.setzeQualitaet(v); Spiel.starteDemo(D.strecke); }) +
      '<p class="hinweis">Beim ersten Start wählt das Spiel die Stufe nach einer kurzen Messung selbst. Ruckelt es, nimm eine tiefere Stufe. «Ultra» braucht eine starke Grafikkarte. Die Einstellungen bleiben in diesem Browser gespeichert.</p>' +
      '<div class="knoepfe"><button class="knopf" data-a="zurueck">Fertig</button><button class="knopf zweit" data-a="loeschen">Bestenliste löschen</button></div></div>', {
        zurueck: () => { this.nameLesen(); Speicher.sichern(); this.haupt(); }, loeschen: () => Bestenliste.loeschenDialog(),
      });
    $('f-laut').oninput = (ev) => { D.lautstaerke = ev.target.value / 100; App.tonSetzen(); };
    $('f-musik').oninput = (ev) => { D.musik = ev.target.value / 100; App.tonSetzen(); };
  },

  pause(online) {
    this.wahlen = {};
    this.zeige('pause', '<div class="tafel"><h2>' + (online ? 'Menü' : 'Pause') + '</h2><div class="knoepfe"><button class="knopf los" data-a="weiter">Weiterfahren</button>' +
      (online ? '' : '<button class="knopf" data-a="neu">Neu starten</button>') + '<button class="knopf zweit" data-a="steuerung">Steuerung</button><button class="knopf zweit" data-a="menue">Zum Hauptmenü</button></div></div>', {
      weiter: () => App.pauseUmschalten(), zurueck: () => App.pauseUmschalten(), neu: () => Spiel.starte(Spiel.konfig),
      steuerung: () => this.steuerung(() => this.pause(online)), menue: () => App.zumMenue(),
    }, 'mitte');
  },

  // Ergebnis mit Rangliste, Statistik und Auszeichnungen
  ergebnis(R, konfig) {
    this.wahlen = {};
    const lokal = Spiel.spieler.map((s) => s.kart);
    const reihe = R.reihenfolge.map((i) => R.karts[i]), sieger = reihe[0];
    let zeilen = '';
    reihe.forEach((k, r) => {
      const zeit = r === 0 ? zeitText(k.endZeit) : '+' + Math.max(0, k.endZeit - sieger.endZeit).toFixed(2) + ' s';
      zeilen += '<tr class="' + (lokal.includes(k.idx) ? 'ich' : '') + '"><td class="zahl">' + (r + 1) + '.</td><td><span class="farbfeld" style="background:' + kartFarbe(k) + '"></span> ' + esc(k.name) + '</td><td class="zahl">' + (k.geschaetzt ? 'ca. ' : '') + zeit +
        '</td><td class="zahl">' + (k.rundenZeiten.length ? zeitText(Math.min.apply(null, k.rundenZeiten)) : '–') + '</td><td class="zahl">' + Math.round(k.bpVerdient) + ' / ' + Math.round(k.bpAusgegeben) +
        '</td><td class="zahl">' + k.ueberholt + '</td><td class="zahl">' + k.gebaut + '</td><td class="zahl">' + k.treffer + '</td></tr>';
    });
    const beste = (wert, min) => { let b = null, w = min; for (const k of reihe) { const v = wert(k); if (v > w) { w = v; b = k; } } return b; };
    const bauer = beste((k) => k.trefferErzielt * 2 + k.gebaut, 0.5);
    const jagd = beste((k) => k.schlechtesterRang - k.rang, 1.5);
    const sauber = beste((k) => 100 - (k.treffer + k.resets) * 3 - k.rang * 0.01, 96.5);
    let preise = '';
    if (bauer) preise += '<span class="abzeichen">Bester Bauer: ' + esc(bauer.name) + '</span>';
    if (jagd) preise += '<span class="abzeichen">Grösste Aufholjagd: ' + esc(jagd.name) + ' (von Platz ' + jagd.schlechtesterRang + ' auf ' + jagd.rang + ')</span>';
    if (sauber) preise += '<span class="abzeichen">Saubere Fahrt: ' + esc(sauber.name) + '</span>';
    const titel = lokal.length === 1 ? 'Platz ' + R.karts[lokal[0]].rang + ' von ' + R.n : 'Ergebnis';
    const online = konfig && konfig.modus === 'online';
    this.zeige('ergebnis', '<div class="tafel breit"><h2>' + titel + '</h2><p class="hinweis">' + esc(R.S.def.name) + ' · ' + R.runden + (R.runden === 1 ? ' Runde' : ' Runden') + '</p>' +
      '<div class="schau podest"><canvas id="schau" aria-label="Siegerpodest"></canvas></div>' +
      '<div class="karte" style="overflow:auto"><table><tr><th class="zahl">Platz</th><th>Fahrer</th><th class="zahl">Zeit</th><th class="zahl">Beste Runde</th><th class="zahl">BP verdient / ausgegeben</th><th class="zahl">Überholt</th><th class="zahl">Bauwerke</th><th class="zahl">Treffer</th></tr>' + zeilen + '</table></div>' +
      '<div>' + preise + '</div>' + Bestenliste.ergebnisHtml() + '<div class="zeile" style="margin-top:14px">' + (online && !konfig.host ? '' : '<button class="knopf los" data-a="revanche">Revanche</button>') +
      '<button class="knopf" data-a="lobby">Lobby</button><button class="knopf zweit" data-a="menue">Menü</button></div></div>', {
      revanche: () => { if (online) Online.revanche(); else Spiel.starte(konfig); },
      lobby: () => { if (online) { Online.zurLobby(); return; } Spiel.starteDemo(konfig.strecke); if (konfig.modus === 'lokal') this.lokal(); else this.bots(); },
      menue: () => App.zumMenue(),
    }, 'mitte');
    Schauraum.podest(reihe.slice(0, 3).map((k) => ({ typ: k.fahrzeug, farbe: k.farbe })));
  },
};

// ── Simulations-Seite (?sim=200): Bot-Rennen im Zeitraffer, danach die Messwerte ──
const SimSeite = {
  start(n) {
    const el = document.createElement('div'); el.id = 'sim'; document.body.appendChild(el);
    el.innerHTML = '<h2>Balancing-Simulation</h2><p id="sim-text">Starte …</p><div class="balken"><i id="sim-balken"></i></div><div id="sim-aus"></div>';
    const gleich = [], stark = [], nStark = Math.max(10, Math.round(n / 2)), gesamt = n + nStark, t0 = performance.now();
    let nr = 0;
    const weiter = () => {
      const ende = performance.now() + 60;
      while (nr < gesamt && performance.now() < ende) { if (nr < n) gleich.push(simEinzel('gleich', nr)); else stark.push(simEinzel('stark', nr - n)); nr++; }
      $('sim-balken').style.width = (100 * nr) / gesamt + '%';
      $('sim-text').textContent = nr + ' von ' + gesamt + ' Rennen simuliert …';
      if (nr < gesamt) setTimeout(weiter, 0); else this.zeige(gleich, stark, (performance.now() - t0) / 1000);
    };
    setTimeout(weiter, 30);
  },
  zeige(gleich, stark, dauer) {
    const A = simAuswertung(gleich), B = simAuswertung(stark);
    window.SIM_ERGEBNIS = { gleich: A, stark: B };
    const pz = (x) => Math.round(x * 100) + ' %';
    const ok = (b) => '<td class="' + (b ? 'gut">erfüllt' : 'schlecht">verfehlt') + '</td>';
    const starkSiege = (B.siegNachStufe.schwer || 0) / B.rennen;
    let maxVerlust = 0, verlustZeilen = '';
    for (const quelle of [A, B]) for (const art in quelle.verlust) maxVerlust = Math.max(maxVerlust, quelle.verlust[art].p95);
    for (const art in A.verlust) { const v = A.verlust[art]; verlustZeilen += '<tr><td>' + BAUWERKE[BAUWERK_INDEX[art]].name + '</td><td class="zahl">' + v.anzahl + '</td><td class="zahl">' + v.mittel.toFixed(2) + ' s</td><td class="zahl">' + v.p95.toFixed(2) + ' s</td><td class="zahl">' + v.max.toFixed(2) + ' s</td></tr>'; }
    const steh = Math.max(A.maxSteh, B.maxSteh);
    $('sim-text').textContent = gleich.length + ' Rennen mit 8 gleich starken Bots und ' + stark.length + ' Rennen «1 starker gegen 7 mittlere» in ' + dauer.toFixed(1) + ' s. Strecken: ' + Object.keys(STRECKEN).map((id) => STRECKEN[id].name).join(', ') + '.';
    $('sim-aus').innerHTML = '<h3>Ziele</h3><table><tr><th>Ziel</th><th class="zahl">Soll</th><th class="zahl">Gemessen</th><th></th></tr>' +
      '<tr><td>Führender nach Runde 1 gewinnt</td><td class="zahl">35–60 %</td><td class="zahl">' + pz(A.fuehrerGewinnt) + '</td>' + ok(A.fuehrerGewinnt >= 0.35 && A.fuehrerGewinnt <= 0.6) + '</tr>' +
      '<tr><td>Feld kommt innerhalb von 8 s ins Ziel</td><td class="zahl">meistens</td><td class="zahl">' + pz(A.streuungUnter8) + ' (Median ' + A.streuungMedian.toFixed(1) + ' s)</td>' + ok(A.streuungUnter8 >= 0.6) + '</tr>' +
      '<tr><td>Ein starker Bot gewinnt gegen 7 mittlere</td><td class="zahl">≥ 50 %</td><td class="zahl">' + pz(starkSiege) + '</td>' + ok(starkSiege >= 0.5) + '</tr>' +
      '<tr><td>Zeitverlust pro Hindernis (95 % der Treffer)</td><td class="zahl">≤ 2 s</td><td class="zahl">' + maxVerlust.toFixed(2) + ' s</td>' + ok(maxVerlust <= 2) + '</tr>' +
      '<tr><td>Kein Bot steckt länger als 3 s fest</td><td class="zahl">≤ 3 s</td><td class="zahl">' + steh.toFixed(1) + ' s</td>' + ok(steh <= 3) + '</tr></table>' +
      '<h3>Pro Rennen (8 gleich starke Bots)</h3><table><tr><th>Wert</th><th class="zahl">Mittel</th></tr>' +
      '<tr><td>Rundenzeit</td><td class="zahl">' + A.rundenZeit.toFixed(1) + ' s</td></tr><tr><td>Überholmanöver</td><td class="zahl">' + A.ueberholt.toFixed(1) + '</td></tr>' +
      '<tr><td>BP verdient / ausgegeben pro Fahrer</td><td class="zahl">' + A.bpVerdient.toFixed(1) + ' / ' + A.bpAusgegeben.toFixed(1) + '</td></tr>' +
      '<tr><td>Bauwerke</td><td class="zahl">' + A.gebaut.toFixed(1) + '</td></tr><tr><td>Hindernis-Treffer</td><td class="zahl">' + A.treffer.toFixed(1) + '</td></tr>' +
      '<tr><td>Zurücksetzer</td><td class="zahl">' + A.resets.toFixed(2) + '</td></tr></table>' +
      '<h3>Zeitverlust nach Hindernis</h3><table><tr><th>Hindernis</th><th class="zahl">Treffer</th><th class="zahl">Mittel</th><th class="zahl">95 %</th><th class="zahl">Maximum</th></tr>' + verlustZeilen + '</table>' +
      '<h3>Siege nach Startplatz (gleich starke Bots)</h3><p>' + Object.keys(A.siegNachStart).sort((a, b) => a - b).map((p) => 'Platz ' + p + ': ' + A.siegNachStart[p]).join(' · ') + '</p>' +

// Die 3D-Bibliothek kommt von einem CDN (feste Version). Fällt eines aus, wird das nächste versucht.
const THREE_QUELLEN = ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js', 'https://unpkg.com/three@0.160.0/build/three.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js'];
function ladeSkript(quellen, fertig, fehler) {
  let i = 0;
  const naechste = () => {
    if (i >= quellen.length) { fehler(); return; }
    const s = document.createElement('script');
    s.src = quellen[i++]; s.onload = fertig; s.onerror = () => { s.remove(); naechste(); };
    document.head.appendChild(s);
  };
  naechste();
}

const App = {
  letzte: 0, fps: 0, fpsBilder: 0, fpsZeit: 0, debug: false, parameter: new URLSearchParams(location.search), toastTakt: null,

  imRennen() { return !!Spiel.R && !Spiel.demo && !Spiel.pause && Menue.offen == null; },

  taste(ev) {
    Ton.start();
    if (ev.repeat) return;
    if (ev.code === 'Escape' || (ev.code === 'KeyP' && !Spiel.demo)) {
      if (!Spiel.demo && !Spiel.ergebnisGezeigt) this.pauseUmschalten();
      else if (Menue.offen && Menue.aktionen.zurueck) Menue.aktionen.zurueck();
    } else if (ev.code === 'KeyM') {
      Speicher.daten.stumm = !Speicher.daten.stumm; this.tonSetzen(); Speicher.sichern();
      this.toast(Speicher.daten.stumm ? 'Ton aus' : 'Ton an', 900);
    }
  },

  pauseUmschalten() {
    if (Spiel.demo || Spiel.ergebnisGezeigt || !Spiel.R) return;
    const online = !!Spiel.netz;
    if (Menue.offen) { if (Menue.offen === 'pause') { Menue.schliesse(); Spiel.pause = false; } return; }
    if (!online) Spiel.pause = true;                  // online läuft das Rennen weiter

  },

  zumMenue() {
    if (typeof Online !== 'undefined') Online.verlassen();
    Spiel.starteDemo(); Menue.haupt();
  },

  tonSetzen() {
    const D = Speicher.daten;
    Ton.stumm = D.stumm; Ton.laut = D.lautstaerke; Ton.musikLaut = D.musik; Ton.setze();
  },

  toast(text, ms) {
    let t = $('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); t.onclick = () => t.classList.add('versteckt'); }
    t.textContent = text; t.classList.remove('versteckt');
    clearTimeout(this.toastTakt);

  },

  start() {
    Speicher.laden();
    Menue.el = $('schicht');
    const sim = this.parameter.get('sim');
    if (sim != null) { SimSeite.start(Math.max(1, parseInt(sim, 10) || 200)); return; }
    this.debug = this.parameter.get('debug') === '1';
    Eingabe.start();
    window.addEventListener('pointerdown', () => Ton.start());
    window.addEventListener('resize', () => Hud.groesse());
    const pk = document.createElement('button');
    pk.id = 'pauseknopf'; pk.className = 'knopf klein zweit versteckt'; pk.textContent = 'II'; pk.tabIndex = -1; pk.title = 'Pause (Esc)';
    pk.onclick = () => { pk.blur(); this.pauseUmschalten(); };
    document.body.appendChild(pk);
    if (this.debug) { const d = document.createElement('div'); d.id = 'debug'; document.body.appendChild(d); }
    Menue.laden();
    ladeSkript(THREE_QUELLEN, () => this.bereit(), () => Menue.fehler('Die 3D-Bibliothek (three.js) konnte nicht geladen werden. Für den ersten Start braucht das Spiel eine Internetverbindung. Prüfe die Verbindung und lade die Seite neu.'));
  },

  bereit() {
    const D = Speicher.daten, fest = this.parameter.get('grafik');      // ?grafik=hoch legt die Stufe für diesen Besuch fest (für Tests)
    const messen = !(fest && GRAFIK_NAMEN[fest]) && !D.grafikGemessen;   // erster Start: Stufe selbst wählen
    if (!GRAFIK_NAMEN[D.grafik]) D.grafik = 'mittel';
    try { Grafik.qualitaet = fest && GRAFIK_NAMEN[fest] ? fest : messen ? 'hoch' : D.grafik; Grafik.init($('bild')); }
    catch (e) { Menue.fehler('Dein Browser kann hier keine 3D-Grafik (WebGL) anzeigen. Versuche es mit einem aktuellen Chrome, Firefox, Edge oder Safari.'); return; }
    this.tonSetzen(); Ton.musikGewollt = true;
    Spiel.starteDemo(Speicher.daten.strecke);
    if (messen) {
      // kurz messen, wie schnell dieses Gerät die Vorschau-Szene zeichnet, und die Grafik-Stufe danach wählen
      let q = 'mittel';
      try { q = Grafik.messeStufe(); } catch (e) { /* Messung nicht möglich: «Mittel» */ }
      D.grafik = q; D.grafikGemessen = true; Speicher.sichern();
      if (q !== Grafik.qualitaet) { Grafik.setzeQualitaet(q); Spiel.starteDemo(D.strecke); }
      setTimeout(() => this.toast('Grafik «' + GRAFIK_NAMEN[q] + '» automatisch gewählt. Ändern kannst du sie in den Einstellungen.', 4500), 1500);
    }
    const raum = this.parameter.get('raum');
    if (raum && typeof Online !== 'undefined') Online.beitretenDialog(raum); else Menue.haupt();
    requestAnimationFrame((t) => { this.letzte = t; this.bild(t); });

  bild(t) {
    requestAnimationFrame((x) => this.bild(x));
    const dt = Math.min(0.1, Math.max(0, (t - this.letzte) / 1000));
    this.letzte = t;
    Spiel.bild(dt);
    Grafik.zeichne(Spiel.R);
    this.fpsBilder++; this.fpsZeit += dt;
    if (this.fpsZeit >= 0.5) { this.fps = this.fpsBilder / this.fpsZeit; this.fpsBilder = 0; this.fpsZeit = 0; if (this.debug) this.debugText(); }
  },

  // ?debug=1: Bildrate, Zustand des ersten lokalen Fahrzeugs, Netzwerk
  debugText() {
    const R = Spiel.R, k = R && R.karts[Spiel.spieler.length ? Spiel.spieler[0].kart : R.reihenfolge[0]];
    let s = 'FPS ' + this.fps.toFixed(0) + ' · Grafik ' + Grafik.qualitaet + ' · Dreiecke ' + Grafik.renderer.info.render.triangles;
    if (k) s += '\nZeit ' + R.zeit.toFixed(1) + ' · ' + R.phase + ' · Bauwerke ' + R.bauwerke.length +
      '\n' + k.name + ': s ' + k.sHaupt.toFixed(0) + ' d ' + k.d.toFixed(1) + ' v ' + k.v.toFixed(1) + ' Pfad ' + k.pfad + ' Rang ' + k.rang + ' BP ' + k.bp.toFixed(1) + (k.aufStrasse ? '' : ' (neben der Strasse)');
    if (Spiel.netz) s += '\n' + Spiel.netz.debugText();
    $('debug').textContent = s;
  },
  // ?debug=1: Ideallinie der Bots in die Welt zeichnen (die Bauplätze haben ohnehin Schilder)
  debugWelt(S) {
    if (Grafik.debugLinie && Grafik.debugLinie.parent) Grafik.debugLinie.parent.remove(Grafik.debugLinie);
    const H = S.haupt, o = {}, pkt = [];
    for (let i = 0; i <= H.n; i++) { H.ort((i % H.n) * H.ds, S.ideal[i % H.n], o); pkt.push(new THREE.Vector3(o.x, o.y + 0.35, -o.z)); }
    Grafik.debugLinie = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pkt), new THREE.LineBasicMaterial({ color: 0xff00ff }));
    Grafik.welt.add(Grafik.debugLinie);
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 13: Bestenliste – schnellste Runden pro Strecke, gesamt und für jedes Auto
   ══════════════════════════════════════════════════════════════════════════ */
// Gespeichert wird im Browser unter einem eigenen Schlüssel (CONFIG.bestenliste.schluessel), mit Versionsnummer:
//   { v: 1, strecken: { kiesgrube: { menschen: [{ n, z, a, d, m }], bots: { renn: { n, z, a, s, d, m } } } } }
//   n = Name, z = Rundenzeit in s, a = Auto (id), d = Datum (ms seit 1970), m = Modus (bots, lokal, online), s = Stärke des Bots.
// Menschen: pro Name und Auto die besten Zeiten (CONFIG.bestenliste.proName). Bots: pro Auto nur der schnellste Bot aller Zeiten.
// Die Liste eines Autos zeigt dessen Zeiten und den schnellsten Bot mit diesem Auto. Die Gesamtliste nimmt pro Name die beste
// Zeit über alle Autos und genau einen Bot: den schnellsten, der je auf dieser Strecke gefahren ist.
const BL_VERSION = 1;
const BL_STUFE = { leicht: 'Leicht', mittel: 'Mittel', schwer: 'Schwer' };
const BL_ARTIKEL = { limo: 'der' };                 // «mit der Limousine», sonst «mit dem …»
const BL_ROBOTER = '<svg class="bl-robo" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2v3h4a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h4zM8.5 9.5a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zm7 0a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zM9 15h6v1.6H9zM1 10h2v5H1zm20 0h2v5h-2z"/></svg>';

// Kleines Fenster im Stil des Spiels (statt Browser-Dialog): Text, Knöpfe, auf Wunsch ein Eingabefeld
const Dialog = {
  // knoepfe: [{ text, klasse, f(wertDesFeldes), abbruch }] – der erste Knopf gilt bei Enter im Feld, «abbruch» bei Escape
  zeige(html, knoepfe) {
    this.zu();
    const d = document.createElement('div'); d.id = 'dialog'; d.className = 'dialog';
    d.innerHTML = '<div class="tafel" role="dialog" aria-modal="true">' + html + '<div class="knoepfe">' +
      knoepfe.map((k, i) => '<button class="knopf ' + (k.klasse || '') + '" data-i="' + i + '">' + esc(k.text) + '</button>').join('') + '</div></div>';
    const waehle = (k) => { const feld = d.querySelector('input'), wert = feld ? feld.value : null; this.zu(); if (k && k.f) k.f(wert); };
    d.addEventListener('keydown', (ev) => {
      ev.stopPropagation();                                       // Tasten gehören dem Fenster, nicht dem Spiel dahinter
      if (ev.key === 'Escape') waehle(knoepfe.find((k) => k.abbruch));
      else if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') waehle(knoepfe[0]);
    });
    d.querySelectorAll('[data-i]').forEach((b) => { b.onclick = () => { Ton.start(); Ton.spiele('klick'); waehle(knoepfe[+b.dataset.i]); }; });
    document.body.appendChild(d);
    const fokus = d.querySelector('input') || d.querySelector('.knopf.zweit') || d.querySelector('.knopf');
    if (fokus) fokus.focus();
  },
  zu() { const d = $('dialog'); if (d) d.remove(); },
};

const Bestenliste = {
  daten: null, aktiv: false, fahrer: [], modus: '', streckenId: '', neu: [], rekordText: '', ohneSpeicher: false,
  blStrecke: '', blAuto: '', kartenId: null,
  netz: {}, quelle: 'alle', sendet: false, schlangeMem: null, erstesFertig: false,   // gemeinsame Liste (siehe unten)

  // ── Speicher ───────────────────────────────────────────────────────────
  laden() {
    let d = null;
    try { const t = localStorage.getItem(CONFIG.bestenliste.schluessel); if (t) d = JSON.parse(t); } catch (e) { d = null; }
    this.daten = this.pruefe(d);
    return this.daten;
  },
  // Alte oder kaputte Daten führen nie zu einem Fehler: nur gültige Einträge bleiben, sonst beginnt die Liste leer
  pruefe(d) {
    const neu = { v: BL_VERSION, strecken: {} };
    if (!d || typeof d !== 'object' || d.v !== BL_VERSION || !d.strecken || typeof d.strecken !== 'object') return neu;
    const gut = (e) => e && typeof e === 'object' && typeof e.n === 'string' && e.n.trim() !== '' && typeof e.a === 'string' && typeof e.z === 'number' && isFinite(e.z) && e.z > 0;
    for (const id of Object.keys(d.strecken)) {
      const s = d.strecken[id];
      if (!s || typeof s !== 'object') continue;
      const eigen = (e, x) => ((e.o === 0 || e.o === 1) ? Object.assign(x, { o: e.o }) : x);   // o: 1 = auf diesem Gerät gefahren (fehlt bei alten Einträgen)
      const menschen = Array.isArray(s.menschen) ? s.menschen.filter(gut).map((e) => eigen(e, { n: e.n.trim().slice(0, 14), z: e.z, a: e.a, d: +e.d || 0, m: String(e.m || '') })) : [];
      const bots = {};
      if (s.bots && typeof s.bots === 'object') for (const a of Object.keys(s.bots)) { const e = s.bots[a]; if (gut(e)) bots[e.a] = eigen(e, { n: e.n.trim().slice(0, 20), z: e.z, a: e.a, s: String(e.s || ''), d: +e.d || 0, m: String(e.m || '') }); }
      neu.strecken[id] = { menschen, bots };
    }
    return neu;
  },
  sichern() {
    try { localStorage.setItem(CONFIG.bestenliste.schluessel, JSON.stringify(this.daten)); this.ohneSpeicher = false; }
    catch (e) { this.ohneSpeicher = true; }               // privates Fenster o. Ä.: Die Liste gilt dann bis zum Neuladen
  },
  strecke(id) {
    if (!this.daten) this.laden();
    return this.daten.strecken[id] || (this.daten.strecken[id] = { menschen: [], bots: {} });
  },
  schluessel(n) { return String(n == null ? '' : n).trim().toLowerCase(); },     // gleicher Name: Gross/klein und Leerzeichen am Rand egal
  autoName(a) { const f = FAHRZEUGE.find((x) => x.id === a); return f ? f.name : String(a); },
  mitAuto(a) { return 'mit ' + (BL_ARTIKEL[a] || 'dem') + ' ' + this.autoName(a); },
  datum(d) { return d ? new Date(d).toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '–'; },

  // ── Listen ─────────────────────────────────────────────────────────────
  // Sortierte Liste einer Kategorie: auto = '' für die Gesamtliste, sonst die id eines Autos
  // quelle: 'alle' = dieses Gerät und die gemeinsame Liste (sobald geladen), 'geraet' = nur dieses Gerät
  liste(id, auto, quelle) {
    const proName = Math.max(1, CONFIG.bestenliste.proName | 0);
    // stabil sortiert: Bei gleicher Zeit kommt der Eintrag dieses Geräts vor dem gleichen aus der gemeinsamen Liste
    const alle = this.eintraege(id, quelle).filter((e) => !auto || e.a === auto).sort((x, y) => x.z - y.z);
    const zahl = {}, aus = [];
    let bot = null;
    for (const e of alle) {
      if (e.bot) { if (!bot) bot = e; continue; }
      const k = this.schluessel(e.n); zahl[k] = (zahl[k] || 0) + 1; if (zahl[k] <= proName) aus.push(e);
    }
    if (bot) aus.push(bot);
    return aus.sort((x, y) => x.z - y.z);
  },
  eintraege(id, quelle) {
    const S = this.strecke(id), l = S.menschen.slice(), N = this.netz[id];
    for (const a of Object.keys(S.bots)) l.push(Object.assign({ bot: true }, S.bots[a]));
    if (quelle !== 'geraet' && N && N.eintraege) for (const e of N.eintraege) l.push(e);
    return l;
  },
  platz(id, auto, e) { const i = this.liste(id, auto).indexOf(e); return i + 1; },     // 0 = nicht (mehr) in der Liste
  // Liste eines Autos aufräumen: pro Name höchstens proName Zeiten, höchstens CONFIG.bestenliste.speichern Plätze
  ordne(id, auto) {
    const S = this.strecke(id), C = CONFIG.bestenliste, proName = Math.max(1, C.proName | 0);
    const andere = S.menschen.filter((e) => e.a !== auto), diese = S.menschen.filter((e) => e.a === auto).sort((x, y) => x.z - y.z);
    const zahl = {}, bleiben = [];
    for (const e of diese) { const k = this.schluessel(e.n); zahl[k] = (zahl[k] || 0) + 1; if (zahl[k] <= proName && bleiben.length < C.speichern) bleiben.push(e); }
    S.menschen = andere.concat(bleiben);
  },
  merkeRekord() {
    const l = this.streckenId ? this.liste(this.streckenId, '') : [];
    this.rekordText = l.length ? zeitText(l[0].z) + ' ' + l[0].n + (l[0].bot ? ' (Bot)' : '') : '';
  },

  // ── Rennen ─────────────────────────────────────────────────────────────
  // Beim Start: wer fährt (Mensch oder Bot, Name, Auto)? Simulationen, Vorführrennen und der Debug-Modus zählen nicht.
  beginne(R, konfig) {
    this.laden();
    this.neu = []; this.modus = (konfig && konfig.modus) || ''; this.streckenId = R.S.id;
    this.aktiv = !App.debug && ['bots', 'lokal', 'online'].includes(this.modus);
    this.fahrer = R.karts.map((k, i) => {
      const f = (konfig && konfig.fahrer[i]) || {}, bot = f.typ === 'bot' || !!f.istBot;   // online kommen Bots beim Gast als «fern» mit istBot
      return { kart: i, name: String(k.name || f.name || '').trim() || (bot ? 'Bot' : 'Spieler'), auto: k.fahrzeug, stufe: f.stufe || '', bot, lokal: f.typ === 'mensch' };
    });
    this.merkeRekord();
    if (this.aktiv) this.ladeNetz(this.streckenId);         // Rekord aus der gemeinsamen Liste, kommt während des Countdowns
  },
  // Jede fertig gefahrene Runde (Ereignis «runde»: e.k = Fahrer, e.b = Rundenzeit). Gibt für Menschen die Meldung zurück.
  runde(R, e) {
    if (!this.aktiv || Spiel.demo || !R || R !== Spiel.R) return null;
    const f = this.fahrer[e.k], z = +e.b;
    if (!f || !isFinite(z) || z < CONFIG.bestenliste.minRunde) return null;
    return this.trage(this.streckenId, f, z);
  },
  trage(id, f, z) {
    const S = this.strecke(id), proName = Math.max(1, CONFIG.bestenliste.proName | 0), jetzt = Date.now();
    z = Math.round(z * 1000) / 1000;
    if (f.bot) {                                                    // Bots: pro Auto nur der schnellste aller Zeiten
      const alt = S.bots[f.auto];
      if (alt && alt.z <= z) return null;
      const eigen = this.modus !== 'online' || Online.host;          // Bot-Zeiten lädt nur das Gerät hoch, das das Rennen leitet
      S.bots[f.auto] = { n: f.name.slice(0, 20), z, a: f.auto, s: f.stufe, d: jetzt, m: this.modus, o: eigen ? 1 : 0 };
      if (eigen) this.vormerken(id, S.bots[f.auto], true);
      this.sichern(); this.merkeRekord();
      return null;
    }
    const k = this.schluessel(f.name), meine = (auto) => this.liste(id, auto).filter((x) => !x.bot && this.schluessel(x.n) === k);
    const vorG = meine(''), vorA = meine(f.auto);
    if (vorA.length >= proName && z >= vorA[vorA.length - 1].z) return null;      // nicht besser als die eigenen Zeiten mit diesem Auto
    const besserG = vorG.length < proName || z < vorG[vorG.length - 1].z;
    const e = { n: f.name.slice(0, 14), z, a: f.auto, d: jetzt, m: this.modus, o: f.lokal ? 1 : 0 };
    S.menschen.push(e);
    if (f.lokal) this.vormerken(id, e, false);                     // online lädt jeder nur seine eigenen Zeiten hoch
    this.ordne(id, f.auto); this.sichern(); this.merkeRekord();
    this.neu.push({ id, e, kart: f.kart, lokal: f.lokal });
    const r = { besserG, platzG: this.platz(id, '', e), platzA: this.platz(id, f.auto, e), auto: f.auto, persoenlich: vorG.length > 0 && besserG };
    r.text = this.meldung(r);
    return r;
  },
  meldung(r) {
    const C = CONFIG.bestenliste;
    if (r.besserG && r.platzG === 1) return 'Neuer Rekord!';
    if (r.platzA === 1) return 'Rekord ' + this.mitAuto(r.auto) + '!';
    if (r.besserG && r.platzG > 0 && r.platzG <= C.zeigen) return 'Platz ' + r.platzG + ' in der Bestenliste';
    if (r.platzA > 0 && r.platzA <= C.zeigen) return 'Platz ' + r.platzA + ' ' + this.mitAuto(r.auto);
    if (r.persoenlich) return 'Persönliche Bestzeit!';
    return '';
  },

  // ── Nach dem Rennen: Abschnitt im Ergebnis und einmal nach dem Namen fragen ──
  ergebnisHtml() {
    if (!this.aktiv) return '';
    const id = this.streckenId, def = STRECKEN[id], neuGesetzt = new Set(this.neu.map((x) => x.e)), zeilen = [];
    for (const f of this.fahrer) {
      if (f.bot) continue;
      const eig = this.neu.filter((x) => x.kart === f.kart && this.platz(id, x.e.a, x.e) > 0);
      if (!eig.length) continue;
      const best = eig.reduce((a, b) => (b.e.z < a.e.z ? b : a)).e;
      const pG = this.platz(id, '', best), pA = this.platz(id, best.a, best);
      zeilen.push('<span class="bl-name">' + esc(best.n) + '</span>: ' + zeitText(best.z) + ' ' + esc(this.mitAuto(best.a)) + ' · ' +
        (pG ? 'Platz ' + pG + ' gesamt · ' : '') + 'Platz ' + pA + ' in der Liste «' + esc(this.autoName(best.a)) + '»');
    }
    return '<div class="karte bl-ergebnis"><h3>Bestenliste ' + esc(def ? def.name : id) + ' · schnellste Runde</h3>' +
      (zeilen.length ? '<p class="bl-neu">Neu in der Liste: ' + zeilen.join('<br>') + '</p>' : '') +
      this.tabelle(this.liste(id, '').slice(0, 5), (e) => neuGesetzt.has(e)) +
      (this.ohneSpeicher ? '<p class="hinweis">Dieser Browser speichert nichts: Die Liste gilt nur bis zum Neuladen.</p>' : '') + '</div>';
  },
  nachRennen() {
    const D = Speicher.daten, ich = this.neu.filter((x) => x.lokal);
    if (this.aktiv && this.modus === 'bots' && ich.length && this.schluessel(D.name) === 'spieler' && !D.nameGefragt) this.frageName(ich);
    if (this.aktiv) this.sende();
  },
  frageName(eintraege) {
    const D = Speicher.daten;
    D.nameGefragt = true; Speicher.sichern();                       // nur einmal fragen
    Dialog.zeige('<h2>Neu in der Bestenliste!</h2><p>Wie heisst du? Dein Name steht dann bei deinen Zeiten.</p>' +
      '<input class="feld" id="dlg-name" maxlength="14" autocomplete="off" placeholder="Dein Name" aria-label="Dein Name">', [
      { text: 'Speichern', klasse: 'los', f: (wert) => {
        const n = String(wert || '').trim().slice(0, 14);
        if (!n) return;
        D.name = n; Speicher.sichern(); this.umbenennen(eintraege, n);
        for (const x of eintraege) this.vormerken(x.id, x.e, false);   // erst mit richtigem Namen in die gemeinsame Liste
        this.sende();
      } },
      { text: 'Später', klasse: 'zweit', abbruch: true },
    ]);
  },
  // Die Einträge aus diesem Rennen bekommen den neuen Namen (ältere Einträge behalten ihren)
  umbenennen(eintraege, n) {
    for (const x of eintraege) { x.e.n = n; const f = this.fahrer[x.kart]; if (f) f.name = n; }
    for (const x of eintraege) this.ordne(x.id, x.e.a);
    this.sichern(); this.merkeRekord();
    const el = document.querySelector('.bl-ergebnis');
    if (el) el.outerHTML = this.ergebnisHtml();
  },

  // ── Gemeinsame Liste für alle Geräte (Online-Datenbank) ──────────────────
  // Gelesen wird pro Strecke die ganze Liste. Hochgeladen wird nur, was auf diesem Gerät gefahren wurde (online jeder seine
  // eigenen Zeiten, Bot-Zeiten nur der Host). Ohne Verbindung warten die Zeiten in einer Schlange im Browser.
  mitNetz() { return !!(CONFIG.bestenliste.server || '').trim() && typeof fetch === 'function'; },
  adresse(id) { const C = CONFIG.bestenliste; return C.server.trim().replace(/\/+$/, '') + '/' + C.pfad + '/' + encodeURIComponent(id) + '.json'; },
  // Anfrage mit Zeitlimit; nie ein Fehler nach aussen: { ok, status, j } (status 0 = keine Verbindung)
  async anfrage(url, opt) {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const uhr = setTimeout(() => { if (ctl) ctl.abort(); }, CONFIG.bestenliste.zeitlimit * 1000);
    try {
      const r = await fetch(url, Object.assign({ cache: 'no-store', signal: ctl ? ctl.signal : undefined }, opt));
      let j; try { j = JSON.parse(await r.text()); } catch (e) { j = undefined; }
      return { ok: r.ok, status: r.status, j };
    } catch (e) { return { ok: false, status: 0, j: undefined }; }
    finally { clearTimeout(uhr); }
  },
  verboten(n) { const k = this.schluessel(n); return (CONFIG.bestenliste.verboten || []).some((w) => w && k.includes(w)); },
  mindestZeit(id) {
    let L = 0; try { L = holeStrecke(id).laenge || 0; } catch (e) { L = 0; }
    return Math.max(CONFIG.bestenliste.minRunde, L / (CONFIG.fahren.vmax * CONFIG.bestenliste.mindestTempo));
  },
  // Antwort der Datenbank prüfen: nur gültige, mögliche Zeiten mit bekanntem Auto und erlaubtem Namen
  ausNetz(id, j) {
    const aus = [], min = this.mindestZeit(id);
    if (!j || typeof j !== 'object') return aus;
    for (const v of Object.values(j)) {
      if (!v || typeof v !== 'object' || typeof v.n !== 'string' || typeof v.z !== 'number' || !isFinite(v.z) || typeof v.a !== 'string') continue;
      const bot = v.b === true, n = v.n.trim();
      if (!n || n.length > (bot ? 20 : 14) || v.z < min || v.z > 600 || !FAHRZEUGE.some((f) => f.id === v.a) || this.verboten(n)) continue;
      aus.push({ n, z: Math.round(v.z * 1000) / 1000, a: v.a, d: +v.d || 0, s: bot ? String(v.s || '').slice(0, 10) : '', bot, netz: true });
    }
    return aus;
  },
  // Liste einer Strecke laden: höchstens alle CONFIG.bestenliste.frisch Sekunden (nach einem Fehler alle «nochmals» Sekunden),
  // sofort mit «Aktualisieren». Vorher wartende Zeiten hochladen. Ergebnis: true, wenn eine Antwort (oder ein Fehler) neu da ist.
  ladeNetz(id, sofort) {
    if (!this.mitNetz() || !STRECKEN[id]) return Promise.resolve(false);
    const C = CONFIG.bestenliste, N = this.netz[id] || (this.netz[id] = { ok: false, zeit: 0, versuch: 0, eintraege: null });
    if (N.laedt) return N.laedt;
    if (!sofort && N.versuch && Date.now() - N.versuch < (N.ok ? C.frisch : C.nochmals) * 1000) return Promise.resolve(false);
    this.erstesHochladen();
    N.versuch = Date.now();
    N.laedt = this.sende().then(() => this.anfrage(this.adresse(id))).then((r) => {
      if (r.ok && (r.j === null || typeof r.j === 'object')) { N.ok = true; N.zeit = Date.now(); N.eintraege = this.ausNetz(id, r.j); }
      else N.ok = false;                                        // alte Liste bleiben lassen, Stand-Zeile sagt «keine Verbindung»
      N.laedt = null;
      if (id === this.streckenId) this.merkeRekord();
      return true;
    });
    return N.laedt;
  },
  aktualisieren() {
    const id = this.blStrecke;
    this.ladeNetz(id, true).then(() => { if (this.blStrecke === id && $('bl-liste')) this.zeichneSeite(); });
    this.zeigeStand();
  },
  zeigeStand() {
    const el = $('bl-stand');
    if (!el) return;
    if (!this.mitNetz()) { el.textContent = ''; return; }
    const N = this.netz[this.blStrecke] || {}, n = this.schlange().length;
    const uhr = (t) => new Date(t).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    let t = this.quelle === 'geraet' ? 'Nur die Zeiten auf diesem Gerät' : N.laedt ? 'Alle Spieler · wird geladen …' :
      N.ok ? 'Alle Spieler · Stand ' + uhr(N.zeit) : N.zeit ? 'Keine Verbindung · Stand ' + uhr(N.zeit) : 'Keine Verbindung: nur dieses Gerät';
    if (n) t += ' · ' + n + (n === 1 ? ' Zeit wartet' : ' Zeiten warten') + ' aufs Hochladen';
    el.textContent = t;
  },
  // Warteschlange zum Hochladen (im Browser gespeichert, ohne Speicher bis zum Neuladen)
  schlange() {
    if (this.schlangeMem) return this.schlangeMem;
    let l = [];
    try { const j = JSON.parse(localStorage.getItem(CONFIG.bestenliste.schluessel + '-senden') || '[]'); if (Array.isArray(j)) l = j; } catch (e) { l = []; }
    this.schlangeMem = l.filter((x) => x && typeof x === 'object' && typeof x.id === 'string' && typeof x.n === 'string' && typeof x.z === 'number' && isFinite(x.z) && typeof x.a === 'string');
    return this.schlangeMem;
  },
  schlangeSichern() { try { localStorage.setItem(CONFIG.bestenliste.schluessel + '-senden', JSON.stringify(this.schlange())); } catch (e) { /* ohne Speicher */ } },
  // «Spieler» (noch kein eigener Name) und unerwünschte Namen kommen nicht in die gemeinsame Liste
  vormerken(id, e, bot) {
    if (!this.mitNetz() || (!bot && this.schluessel(e.n) === 'spieler') || this.verboten(e.n)) return;
    this.schlange().push({ id, n: e.n, z: e.z, a: e.a, b: !!bot, s: bot ? String(e.s || '') : '' });
    this.schlangeSichern();
  },
  // Beim ersten Start mit eingetragener Datenbank die bisherigen eigenen Zeiten dieses Geräts einmal hochladen
  erstesHochladen() {
    const C = CONFIG.bestenliste, merker = C.schluessel + '-hochgeladen';
    if (this.erstesFertig) return;
    this.erstesFertig = true;
    let war = ''; try { war = localStorage.getItem(merker) || ''; } catch (e) { war = ''; }
    if (war === C.server.trim()) return;
    const D = Speicher.daten, ich = new Set([this.schluessel(D.name)].concat((D.lokal || []).map((p) => this.schluessel(p && p.name))));
    const daten = this.daten || this.laden();
    for (const id of Object.keys(daten.strecken)) {
      const S = daten.strecken[id];
      // ältere Einträge ohne Merker: alles ausser Online-Rennen, dort nur die eigenen Namen
      for (const e of S.menschen) if (e.o === 1 || (e.o === undefined && (e.m !== 'online' || ich.has(this.schluessel(e.n))))) this.vormerken(id, e, false);
      for (const a of Object.keys(S.bots)) { const e = S.bots[a]; if (e.o === 1 || (e.o === undefined && e.m !== 'online')) this.vormerken(id, e, true); }
    }
    try { localStorage.setItem(merker, C.server.trim()); } catch (e) { /* egal */ }
  },
  // Schlange abarbeiten: angenommene und von den Regeln abgelehnte Einträge fallen weg, ohne Verbindung später nochmals.
  // Ohne «Content-Type» ist es eine einfache Anfrage (keine Vorab-Anfrage nötig); die Datenbank liest den Text als JSON.
  async sende() {
    if (!this.mitNetz() || this.sendet) return;
    const l = this.schlange();
    if (!l.length) return;
    this.sendet = true;
    try {
      while (l.length) {
        const x = l[0];
        const r = await this.anfrage(this.adresse(x.id), { method: 'POST', body: JSON.stringify({ n: x.n, z: x.z, a: x.a, b: x.b, s: x.s, d: { '.sv': 'timestamp' } }) });
        if (!r.ok && (r.status === 0 || r.status === 429 || r.status >= 500)) break;
        l.splice(0, 1); this.schlangeSichern();
        const N = this.netz[x.id];
        if (r.ok && N && N.eintraege) N.eintraege.push({ n: x.n, z: x.z, a: x.a, d: Date.now(), s: x.s, bot: x.b, netz: true });
      }
    } finally { this.sendet = false; }
    this.zeigeStand();
  },

  // ── Anzeige ────────────────────────────────────────────────────────────
  // Tabelle: Platz (die ersten drei in Gold, Silber, Bronze), Name (Bots mit Symbol), Zeit, Auto, Datum
  tabelle(l, hervor) {
    if (!l.length) return '<p class="hinweis">Noch keine Zeiten. Fahr die erste Runde!</p>';
    let h = '<table class="bl-tabelle"><tr><th class="zahl">Platz</th><th>Name</th><th class="zahl">Runde</th><th class="bl-auto">Auto</th><th class="bl-datum">Datum</th></tr>';
    l.forEach((e, i) => {
      const p = i + 1, cls = [p <= 3 ? 'bl-p' + p : '', e.bot ? 'bl-bot' : '', hervor && hervor(e) ? 'ich' : ''].filter(Boolean).join(' ');
      const bot = e.bot ? 'Bot' + (BL_STUFE[e.s] ? ' · ' + BL_STUFE[e.s] : '') : '', auto = esc(this.autoName(e.a));
      // Auf dem Handy fällt die Spalte «Auto» weg: Auto (und bei Bots «Bot · Stärke») stehen dann klein unter dem Namen
      h += '<tr class="' + cls + '"><td class="zahl"><span class="bl-rang">' + p + '</span></td><td>' + (e.bot ? BL_ROBOTER : '') + '<span class="bl-name">' + esc(e.n) + '</span>' +
        (bot ? ' <small class="bl-was">' + bot + '</small>' : '') + '<small class="bl-handy">' + (bot ? bot + ' · ' : '') + auto + '</small></td><td class="zahl">' + zeitText(e.z) +
        '</td><td class="bl-auto">' + auto + '</td><td class="bl-datum">' + this.datum(e.d) + '</td></tr>';
    });
    return h + '</table>';
  },
  // Steckbrief in der Streckenwahl: Rundenrekord mit Name und Auto, dazu die ersten drei
  steckbrief(id) {
    if (this.mitNetz()) this.ladeNetz(id).then((neu) => {
      const el = document.querySelector('#streckenkarte .sk-rekord');
      if (neu && el && Speicher.daten.strecke === id) el.outerHTML = this.steckbriefHtml(id);
    });
    return this.steckbriefHtml(id);
  },
  steckbriefHtml(id) {
    const l = this.liste(id, '').slice(0, 3);
    if (!l.length) return '<div class="sk-rekord">Noch kein Rundenrekord: Fahr die erste Runde!</div>';
    return '<ol class="sk-rekord" aria-label="Rundenrekord und die ersten drei">' + l.map((e, i) => '<li>' + (i ? (i + 1) + '. ' : 'Rekord ') + '<b>' + zeitText(e.z) + '</b> ' + esc(e.n) +
      (e.bot ? ' (Bot)' : '') + ' · ' + esc(this.autoName(e.a)) + '</li>').join('') + '</ol>';
  },
  // Seite «Bestenlisten» im Hauptmenü: Strecke und Liste (gesamt oder ein Auto) mit ◀ ▶ wechseln
  seite(id, auto) {
    Menue.wahlen = {}; Menue.beiProfil = null;
    this.blStrecke = STRECKEN[id] ? id : Object.keys(STRECKEN)[0]; this.blAuto = auto || ''; this.kartenId = null;
    const kategorien = [{ wert: '', text: 'Gesamt' }].concat(FAHRZEUGE.map((f) => ({ wert: f.id, text: f.name })));
    const netz = this.mitNetz();
    Menue.zeige('bestenliste', '<div class="tafel breit"><h2>Bestenlisten</h2><p class="hinweis">Schnellste Runde auf jeder Strecke, gesamt und für jedes Auto' +
      (netz ? ', von allen Spielern' : '') + '. Jeder Name steht einmal da. Von den Bots steht nur der schnellste aller Zeiten in der Liste.</p>' +
      Menue.wahlZeile('Strecke', 'blStrecke', Object.keys(STRECKEN).map((s) => ({ wert: s, text: STRECKEN[s].name })), this.blStrecke, (v) => { this.blStrecke = v; this.zeichneSeite(); }) +
      Menue.wahlZeile('Liste', 'blAuto', kategorien, this.blAuto, (v) => { this.blAuto = v; this.zeichneSeite(); }) +
      (netz ? Menue.wahlZeile('Zeigen', 'blQuelle', [{ wert: 'alle', text: 'Alle Spieler' }, { wert: 'geraet', text: 'Dieses Gerät' }], this.quelle, (v) => { this.quelle = v; this.zeichneSeite(); }) : '') +
      '<div class="bl-kopf"><canvas id="bl-karte" width="236" height="236" aria-label="Karte der Strecke"></canvas><div><p class="bl-stand" id="bl-stand" aria-live="polite"></p><div id="bl-liste"></div></div></div>' +
      '<div class="knoepfe" style="margin-top:14px">' + (netz ? '<button class="knopf zweit" data-a="aktualisieren">Aktualisieren</button>' : '') +
      '<button class="knopf zweit" data-a="zurueck">Zurück</button></div></div>', { zurueck: () => Menue.haupt(), aktualisieren: () => this.aktualisieren() }, 'mitte');
    this.zeichneSeite();
  },
  zeichneSeite() {
    const el = $('bl-liste'), id = this.blStrecke;
    if (!el) return;
    const ich = this.schluessel(Speicher.daten.name), quelle = this.mitNetz() ? this.quelle : 'geraet';
    el.innerHTML = this.tabelle(this.liste(id, this.blAuto, quelle).slice(0, CONFIG.bestenliste.zeigen), (e) => !e.bot && ich !== 'spieler' && this.schluessel(e.n) === ich);
    this.zeigeStand();
    if (quelle === 'alle') this.ladeNetz(id).then((neu) => { if (neu && this.blStrecke === id && $('bl-liste')) this.zeichneSeite(); });
    const c = $('bl-karte');
    if (c && this.kartenId !== id) {
      this.kartenId = id;
      const k = {}; Hud.zeichneKartenGrund.call(k, holeStrecke(id));         // eigene Leinwand: die Karte im Rennen bleibt unberührt
      const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); g.drawImage(k.grund, 0, 0, c.width, c.height);
    }
  },
  // Einstellungen: eine Strecke oder alle löschen, mit Rückfrage
  loeschenDialog() {
    const id = Speicher.daten.strecke, name = STRECKEN[id] ? STRECKEN[id].name : id;
    const weg = (nur) => { const l = this.schlange(); for (let i = l.length - 1; i >= 0; i--) if (!nur || l[i].id === nur) l.splice(i, 1); this.schlangeSichern(); };
    Dialog.zeige('<h2>Bestenliste löschen?</h2><p>Gelöschte Zeiten lassen sich nicht zurückholen.' +
      (this.mitNetz() ? ' Gelöscht wird nur die Liste dieses Geräts, die gemeinsame Liste aller Spieler bleibt.' : '') + '</p>', [
      { text: 'Nur ' + name + ' löschen', f: () => { this.strecke(id); delete this.daten.strecken[id]; weg(id); this.sichern(); App.toast('Bestenliste ' + name + ' gelöscht.', 2200); } },
      { text: 'Alle Strecken löschen', f: () => { this.daten = { v: BL_VERSION, strecken: {} }; weg(''); this.sichern(); App.toast('Alle Bestenlisten gelöscht.', 2200); } },
      { text: 'Abbrechen', klasse: 'zweit', abbruch: true },
    ]);
  },
};
App.start();
</script>
</body>
</html>
