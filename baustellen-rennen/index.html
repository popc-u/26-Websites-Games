  motorAus() {
    for (const m of this.motoren) {
      try { m.o1.stop(); m.o2.stop(); m.o3.stop(); m.pf.stop(); for (const r of [m.ansaug, m.quietsch, m.roll, m.wind]) { r.s.stop(); r.g.disconnect(); } } catch (e) { /* schon gestoppt */ }
      m.g.disconnect(); m.pg.disconnect();
    }
    for (const s of this.fremdStimmen) { try { s.o1.stop(); s.o2.stop(); } catch (e) { /* schon gestoppt */ } s.p.disconnect(); }
    this.motoren = []; this.fremdStimmen = [];
  },

  // ── Musik (eigene Tonfolgen): «menue» ruhig, «rennen» treibend, «final» schneller und dichter für die letzte Runde ──
  musikArt(art) { if (this.art !== art) { this.art = art; this.musikSchritt = 0; } },
  musik(an) {
    this.musikGewollt = an;
    if (!this.ctx) return;
    if (this.musikTakt) { clearInterval(this.musikTakt); this.musikTakt = null; }
    if (!an) return;
    this.musikZeit = this.ctx.currentTime + 0.1; this.musikSchritt = 0;
    this.musikTakt = setInterval(() => this.musikPlane(), 100);
  },
  musikPlane() {
    const c = this.ctx, A = this.art, Z = this.musikGain;
    const dauer = 60 / (A === 'menue' ? 92 : A === 'final' ? 142 : 128) / 4;               // eine Sechzehntelnote
    const GRUND = [110, 87.31, 130.81, 98], TERZ = [1.189, 1.26, 1.26, 1.26];              // a-Moll, F-Dur, C-Dur, G-Dur
    const MEL = [[4, 0, 3, 0, 2, 0, 3, 4, 0, 0, 5, 0, 4, 0, 2, 0], [2, 0, 3, 0, 4, 0, 3, 2, 0, 0, 1, 0, 2, 0, 4, 0], [4, 0, 5, 0, 6, 0, 5, 4, 0, 0, 3, 0, 4, 0, 6, 0], [3, 0, 4, 0, 5, 0, 4, 3, 0, 0, 2, 0, 3, 5, 6, 0]];
    if (this.musikZeit < c.currentTime - 0.5) this.musikZeit = c.currentTime + 0.05;       // nach einer Pause (Tab im Hintergrund) neu ansetzen
    while (this.musikZeit < c.currentTime + 0.3) {
      const n = this.musikSchritt, i = n % 16, takt = Math.floor(n / 16), ak = takt % 4, g = GRUND[ak], wann = this.musikZeit - c.currentTime;
      const dreiklang = [g * 2, g * 2 * TERZ[ak], g * 3, g * 4];
      if (A === 'menue') {
        if (i === 0) for (const f of dreiklang.slice(0, 3)) { this.ton(f, dauer * 15, 'sine', 0.07, 0, wann, Z, 0.5); this.ton(f * 1.003, dauer * 15, 'triangle', 0.04, 0, wann, Z, 0.7); }     // Flächen
        if (i % 4 === 0) this.ton(dreiklang[(i / 4 + takt) % 4] * 2, dauer * 3, 'triangle', 0.07, 0, wann, Z);                                                                             // perlende Töne
        if (i === 0 || i === 10) this.ton(g, dauer * 5, 'sine', 0.2, 0, wann, Z, 0.03);
        if (i % 8 === 4) this.krach(0.05, 0.03, 5000, wann, Z);
      } else {
        const fin = A === 'final';
        if (i % 2 === 0) this.ton(g * (i % 8 === 6 ? 2 : 1), dauer * 1.7, 'square', 0.13, 0, wann, Z);                               // Bass
        if (i % 4 === 0) this.ton(130, 0.13, 'sine', 0.34, 42, wann, Z);                                                              // Pauke
        if (i % 8 === 4) { this.krach(0.11, 0.16, 1800, wann, Z); this.ton(190, 0.08, 'triangle', 0.1, 120, wann, Z); }               // Schlag auf 2 und 4
        if (fin || i % 4 === 2) this.krach(0.03, i % 4 === 2 ? 0.1 : 0.05, 7000, wann, Z);                                            // Hi-Hat
        if ((fin || takt % 8 >= 4) && MEL[ak][i]) this.ton(g * 4 * Math.pow(2, [0, 0, 2, 3, 5, 7, 8, 10][MEL[ak][i]] / 12) * (ak === 0 ? 1 : 1), dauer * 1.8, 'triangle', 0.11, 0, wann, Z);    // Melodie
        if (fin && i % 2 === 1) this.ton(dreiklang[((i - 1) / 2) % 4] * 2, dauer * 0.9, 'square', 0.035, 0, wann, Z);                 // schnelle Begleitung in der letzten Runde
      }
      this.musikZeit += dauer; this.musikSchritt++;
    }
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 10: Eingabe – Tastatur, Gamepad, Touch
   Jedes Eingabegerät liefert dieselben «Tasten» wie in LEERE_EINGABE.
   Geräte:  'tasten1' = WASD-Seite,  'tasten2' = Pfeiltasten-Seite,
            'tasten'  = beide zusammen (Einzelspieler),  'pad0'…'pad3' = Gamepads,  'touch'
   ══════════════════════════════════════════════════════════════════════════ */
const TASTEN = {
  // Spieler links                         Spieler rechts
  tasten1: { links: ['KeyA'], rechts: ['KeyD'], gas: ['KeyW'], bremse: ['KeyS'], drift: ['Space', 'ShiftLeft'],
             bauWechsel: ['KeyQ'], bauen: ['KeyE'], slot: ['KeyF'], reset: ['KeyR'] },
  tasten2: { links: ['ArrowLeft'], rechts: ['ArrowRight'], gas: ['ArrowUp'], bremse: ['ArrowDown'], drift: ['ShiftRight', 'ControlRight', 'Enter'],
             bauWechsel: ['Comma'], bauen: ['Period'], slot: ['Slash', 'Minus'], reset: ['Backspace'] },
};
const TASTEN_NAMEN = {
  KeyA: 'A', KeyD: 'D', KeyW: 'W', KeyS: 'S', Space: 'Leertaste', ShiftLeft: 'Shift links', KeyQ: 'Q', KeyE: 'E', KeyF: 'F', KeyR: 'R',
  ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', ShiftRight: 'Shift rechts', ControlRight: 'Ctrl rechts', Enter: 'Enter',
  Comma: ',', Period: '.', Slash: '-', Minus: '-', Backspace: '⌫',
};

const Eingabe = {
  unten: {},            // gerade gedrückte Tasten (event.code)
  neu: {},              // seit dem letzten Lesen neu gedrückt
  padVorher: [{}, {}, {}, {}],
  touch: { lenk: 0, drift: false, bremse: false, neu: {} },
  ziffer: 0,            // zuletzt gedrückte Zahlentaste 1–6

  start() {
    window.addEventListener('keydown', (ev) => {
      if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT')) return;
      if (!this.unten[ev.code]) this.neu[ev.code] = true;
      this.unten[ev.code] = true;
      const m = /^Digit([1-6])$/.exec(ev.code);
      if (m && !ev.repeat) this.ziffer = +m[1];
      if (App.imRennen() && /^(Arrow|Space|Tab|Backspace|Slash|Quote)/.test(ev.code)) ev.preventDefault();
      App.taste(ev);
    });
    window.addEventListener('keyup', (ev) => { this.unten[ev.code] = false; });
    window.addEventListener('blur', () => { this.unten = {}; });
  },

  gedrueckt(liste) { for (const c of liste) if (this.unten[c]) return true; return false; },
  frisch(liste) { for (const c of liste) if (this.neu[c]) return true; return false; },

  // Liest ein Gerät aus und füllt «e». «einmalig» = Tastendrücke (Bauen usw.) dürfen jetzt zählen.
  lies(geraet, e, einmalig) {
    e.lenk = 0; e.gas = 0; e.bremse = 0; e.drift = false;
    e.wahl = 0; e.bauWechsel = 0; e.slotWechsel = 0; e.bauen = false; e.reset = false;
    const seiten = geraet === 'tasten' ? [TASTEN.tasten1, TASTEN.tasten2] : geraet === 'tasten1' ? [TASTEN.tasten1] : geraet === 'tasten2' ? [TASTEN.tasten2] : [];
    for (const T of seiten) {
      if (this.gedrueckt(T.links)) e.lenk += 1;
      if (this.gedrueckt(T.rechts)) e.lenk -= 1;
      if (this.gedrueckt(T.gas)) e.gas = 1;
      if (this.gedrueckt(T.bremse)) e.bremse = 1;
      if (this.gedrueckt(T.drift)) e.drift = true;
      if (einmalig) {
        if (this.frisch(T.bauWechsel)) e.bauWechsel = 1;
        if (this.frisch(T.bauen)) e.bauen = true;
        if (this.frisch(T.slot)) e.slotWechsel = 1;
        if (this.frisch(T.reset)) e.reset = true;
      }
    }
    if (geraet === 'tasten' && einmalig && this.ziffer) e.wahl = this.ziffer;
    if (geraet.startsWith('pad')) this.liesPad(+geraet.slice(3), e, einmalig);
    if (geraet === 'touch' || (geraet === 'tasten' && this.touch.aktiv)) {
      const t = this.touch;
      if (t.aktiv) {
        if (t.lenk) e.lenk = t.lenk;
        if (!t.bremse) e.gas = 1; else e.bremse = 1;      // am Handy gibt das Fahrzeug von selbst Gas
        if (t.drift) e.drift = true;
        if (einmalig) {
          if (t.neu.bauen) e.bauen = true;
          if (t.neu.bauWechsel) e.bauWechsel = 1;
          if (t.neu.slot) e.slotWechsel = 1;
          if (t.neu.reset) e.reset = true;
          if (t.neu.wahl) e.wahl = t.neu.wahl;
        }
      }
    }
    e.lenk = clamp(e.lenk, -1, 1);
    return e;
  },

  // Gamepad (Standard-Belegung): Stick lenken, A/RT Gas, B/LT Bremse, X/RB Drift,
  // Steuerkreuz ←/→ Bauwerk, ↑ Slot, Y/↓ bauen, Select zurücksetzen
  liesPad(nr, e, einmalig) {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const p = pads[nr];
    if (!p) return;
    const B = (i) => (p.buttons[i] ? p.buttons[i].value || (p.buttons[i].pressed ? 1 : 0) : 0);
    const x = p.axes[0] || 0;
    if (Math.abs(x) > 0.14) e.lenk = -Math.sign(x) * Math.min(1, (Math.abs(x) - 0.14) / 0.7);
    e.gas = Math.max(B(0), B(7));
    e.bremse = Math.max(B(1), B(6));
    e.drift = B(2) > 0.5 || B(5) > 0.5;
    const v = this.padVorher[nr];
    const neu = (i) => B(i) > 0.5 && !v[i];
    if (einmalig) {
      if (neu(15) || neu(4)) e.bauWechsel = 1;
      if (neu(14)) e.bauWechsel = -1;
      if (neu(12)) e.slotWechsel = 1;
      if (neu(3) || neu(13)) e.bauen = true;
      if (neu(8)) e.reset = true;
      if (neu(9)) App.pauseUmschalten();
      for (let i = 0; i < 16; i++) v[i] = B(i) > 0.5;
    }
  },

  // nach jedem Bild aufrufen: «neu gedrückt» zurücksetzen
  fertig() { this.neu = {}; this.ziffer = 0; this.touch.neu = {}; },

  angeschlossenePads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const liste = [];
    for (let i = 0; i < pads.length && i < 4; i++) if (pads[i]) liste.push(i);
    return liste;
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 10b: Online-Modus ohne eigenen Server (WebRTC über PeerJS)
   Der Host ist Schiedsrichter: Er startet das Rennen, zählt Runden, Plätze und
   Baupunkte, prüft Bau-Anfragen und lässt die Bots fahren. Jeder Mitspieler
   rechnet nur sein eigenes Fahrzeug und schickt dessen Zustand 20-mal pro Sekunde.
   Fremde Fahrzeuge werden mit 100 ms Verzögerung weich nachgezeichnet.
   Nachrichten sind kleine Listen: ['z', …] Zustand, ['s', …] Bild vom Host, ['bw', …] Bauwerk usw.
   ══════════════════════════════════════════════════════════════════════════ */
const PEER_QUELLEN = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
const RAUM_VORSATZ = 'bsr26-';

const r2 = (x) => Math.round(x * 100) / 100, r3 = (x) => Math.round(x * 1000) / 1000;

const Online = {
  peer: null, host: false, code: '', gaeste: {}, zumHost: null, zumHostZ: null, meineId: '', lobby: null, imRennen: false, bereit: false,
  versatz: 0, rtt: 0, bestRtt: 1e9, t0: 0, schrittNr: 0, puffer: [], bekannt: {}, letzterEmpfang: 0, meinKart: -1, endeGesendet: false, takte: [], zeitlimit: null, verstecktSeit: 0, lauf: 0,

  profil() { const D = Speicher.daten; return { name: D.name, fahrzeug: D.fahrzeug, farbe: D.farbe }; },
  jetzt() { return performance.now() + (this.host ? 0 : this.versatz); },           // gemeinsame Uhr (die des Hosts)
  peerOptionen() {
    const o = { debug: 1, config: { iceServers: CONFIG.netz.iceServer, sdpSemantics: 'unified-plan' } };
    const p = App.parameter.get('peer');            // nur für Tests: eigener Vermittlungs-Server, z. B. ?peer=localhost:9000
    if (p) { const t = p.split(':'); o.host = t[0]; o.port = +t[1] || 9000; o.path = '/'; o.secure = false; }
    return o;
  },
  ladeBibliothek(fertig) {
    if (window.Peer) { fertig(); return; }
    ladeSkript(PEER_QUELLEN, fertig, () => this.fehler('Die Netzwerk-Bibliothek (PeerJS) konnte nicht geladen werden. Prüfe deine Internetverbindung.'));
  },
  fehlerText(e) {
    const t = e && e.type;
    if (t === 'peer-unavailable') return 'Diesen Raum gibt es nicht (mehr). Prüfe den Code. Stimmt er, hat der Host das Spiel geschlossen oder sein Gerät ist eingeschlafen: Dann soll er das Spiel wieder nach vorne holen oder einen neuen Raum erstellen.';

    if (t === 'webrtc') return 'Die direkte Verbindung kam nicht zustande. Manche Firmen- und Schulnetze blockieren das.';

  },
  // Verständliche Fehlermeldung mit Hinweis auf die Modi, die immer gehen
  // code: Raum, bei dem «Nochmals versuchen» angeboten wird · diagnose: klein gedruckte Zeile für die Fehlersuche
  fehler(text, code, diagnose) {

    if (!Spiel.demo) Spiel.starteDemo();
    Menue.wahlen = {};
    Menue.zeige('fehler', '<div class="tafel"><h2>Online-Spiel</h2><div class="karte" style="border-left-color:var(--rot)"><p>' + text + '</p>' +
      (diagnose ? '<p class="hinweis" id="netz-diagnose" style="font-size:12px;word-break:break-word">' + esc(diagnose) + '</p>' : '') +
      '<p class="hinweis">Gegen Bots und lokal am selben Gerät kannst du jederzeit spielen.</p></div>' +
      '<div class="knoepfe">' + (code ? '<button class="knopf los" data-a="nochmals">Nochmals versuchen</button>' : '') + '<button class="knopf' + (code ? ' zweit' : '') + '" data-a="zurueck">Zum Menü</button></div></div>',
      { nochmals: () => this.beitreten(code), zurueck: () => Menue.haupt() });
  },
  // Warte-Bild mit «Abbrechen» (heisst wie das normale Lade-Bild, damit die Lobby es ablösen kann)
  warte(text, hinweis) {
    Menue.zeige('laden', '<div class="tafel"><h1 class="logo">Baustellen-<small>Rennen</small></h1><div class="band"></div><p id="netz-warte">' + text + '</p>' + (hinweis ? '<p class="hinweis">' + hinweis + '</p>' : '') +
      '<div class="knoepfe"><button class="knopf zweit" data-a="zurueck">Abbrechen</button></div></div>', { zurueck: () => App.zumMenue() });
    const k = Menue.el.querySelector('.knopf'); if (k) k.blur();      // sonst bricht eine noch gedrückte Enter-Taste gleich wieder ab
  },
  verlassen() {
    this.lauf++;                                    // ein noch laufender Beitritt (Bibliothek lädt gerade) gilt damit als abgebrochen
    for (const t of this.takte) clearInterval(t);
    this.takte = [];
    clearTimeout(this.zeitlimit);
    const p = this.peer; this.peer = null;
    if (p) { try { p.destroy(); } catch (e) { /* schon geschlossen */ } }
    this.gaeste = {}; this.zumHost = null; this.zumHostZ = null; this.imRennen = false; this.bereit = false; this.lobby = null; this.bestRtt = 1e9;
    Spiel.netz = null; Menue.beiProfil = null;
  },
  // Handys und Tablets frieren Seiten im Hintergrund ein. Kommt das Fenster des Hosts zurück, meldet sich der Raum frisch beim Vermittler an,
  // damit neue Mitspieler ihn sicher wieder finden. Bestehende direkte Verbindungen bleiben dabei bestehen.
  sichtbar() {
    if (document.hidden) { this.verstecktSeit = Date.now(); return; }
    const p = this.peer, weg = this.verstecktSeit ? (Date.now() - this.verstecktSeit) / 1000 : 0;
    this.verstecktSeit = 0;

      if (!p.disconnected && weg >= CONFIG.netz.neuAnmelden) p.disconnect();
      if (p.disconnected) p.reconnect();

  },

  // ── Host: Raum erstellen ────────────────────────────────────────────────
  erstellen() {

        clearTimeout(this.zeitlimit);

        p.on('open', () => {
          if (this.peer !== p || this.lobby) return;      // nach einer Neu-Anmeldung beim Vermittler kommt «open» nochmals: Dann bleibt alles, wie es ist
          clearTimeout(this.zeitlimit);
          this.lobby = { code, strecke: D.strecke, runden: D.runden, bots: Math.min(D.bots, 6), stufe: D.stufe, spieler: [] };
          this.zeigeLobby();

          else if (!this.lobby || e.type === 'browser-incompatible') this.fehler(this.fehlerText(e));
        });

        p.on('disconnected', () => { setTimeout(() => { if (this.peer === p && !p.destroyed && p.disconnected) { try { p.reconnect(); } catch (e) { /* egal */ } } }, 2000); });
      };

    });
  },
  neuerGast(c) {
    c.on('open', () => {
      if (c.label === 'z') { const g = this.gaeste[c.peer]; if (g) { g.z = c; c.on('data', (d) => this.vomGast(c.peer, d)); } return; }
      const nein = (text) => { try { c.send(['nein', text]); } catch (e) { /* egal */ } setTimeout(() => { try { c.close(); } catch (e) { /* egal */ } }, 800); };
      const alt = this.gaeste[c.peer];           // derselbe Gast nochmals (zweiter Verbindungsversuch): nur die Leitung tauschen
      if (!alt && this.imRennen) { nein('In diesem Raum läuft gerade ein Rennen. Versuch es in ein paar Minuten nochmals.'); return; }
      if (!alt && Object.keys(this.gaeste).length >= CONFIG.rennen.maxFahrer - 1) { nein('Der Raum ist voll (höchstens ' + CONFIG.rennen.maxFahrer + ' Fahrer).'); return; }
      if (alt) { const k = alt.k; alt.k = c; alt.zuletzt = performance.now(); try { k.close(); } catch (e) { /* egal */ } }
      else this.gaeste[c.peer] = { id: c.peer, k: c, z: null, name: 'Gast', fahrzeug: 0, farbe: 1, bereit: false, ping: 0, kart: -1, zuletzt: performance.now() };
      const weg = () => { const g = this.gaeste[c.peer]; if (g && g.k === c) this.gastWeg(c.peer); };      // eine abgelöste alte Leitung darf den Gast nicht abmelden
      c.on('data', (d) => { const g = this.gaeste[c.peer]; if (g && g.k === c) this.vomGast(c.peer, d); });
      c.on('close', weg);
      c.on('error', weg);

  },
  gastWeg(id) {
    const g = this.gaeste[id];
    if (!g) return;
    delete this.gaeste[id];
    try { g.k.close(); } catch (e) { /* egal */ }
    const R = Spiel.R;
    if (this.imRennen && g.kart >= 0 && R && !R.fertig && Spiel.netz === this) {

      const k = R.karts[g.kart];

  },
  vomGast(id, d) {
    const g = this.gaeste[id];
    if (!g || !Array.isArray(d)) return;
    g.zuletzt = performance.now();
    const R = Spiel.R, imRennen = this.imRennen && g.kart >= 0 && R && Spiel.netz === this && !R.fertig;
    switch (d[0]) {
      case 'hallo': case 'profil':
        g.name = String((d[1] && d[1].name) || 'Gast').slice(0, 14); g.fahrzeug = clamp(d[1].fahrzeug | 0, 0, FAHRZEUGE.length - 1); g.farbe = clamp(d[1].farbe | 0, 0, FARBEN.length - 1);

      case 'bereit': g.bereit = !!d[1]; this.sendeLobby(); break;
      case 'p': g.ping = d[2] | 0; try { g.k.send(['q', d[1], performance.now()]); } catch (e) { /* egal */ } break;
      case 'z': if (imRennen && R.karts[g.kart].typ === 'fern') this.merkeZustand(g.kart, d.slice(1)); break;
      case 'bau': if (imRennen) R.bauen(R.karts[g.kart], String(d[1]), d[2] | 0); break;                    // der Host prüft die Anfrage wie bei jedem anderen
      case 'treffer': if (imRennen) R.registriereTreffer(g.kart, d[1] | 0, d[2] | 0); break;
      case 'benutzt': if (imRennen) { const bw = R.bauwerke.find((b) => b.id === d[1]); if (bw && bw.besitzer === g.kart) { bw.benutzt = true; bw.tEnde = Math.min(bw.tEnde, R.zeit + 1.2); } } break;
    }
  },
  sendeAlle(d, schnell) {
    for (const id in this.gaeste) {
      const g = this.gaeste[id], c = schnell && g.z && g.z.open ? g.z : g.k;
      try { if (c.open) c.send(d); } catch (e) { /* Verbindung gerade weg */ }
    }
  },
  spielerListe() {
    const P = this.profil();
    const l = [{ id: 'host', name: P.name, fahrzeug: P.fahrzeug, farbe: P.farbe, bereit: true, ping: 0, host: true }];
    for (const id in this.gaeste) { const g = this.gaeste[id]; l.push({ id, name: g.name, fahrzeug: g.fahrzeug, farbe: g.farbe, bereit: g.bereit, ping: g.ping, host: false }); }
    return l;
  },
  sendeLobby() {
    if (!this.host || !this.lobby) return;
    this.lobby.spieler = this.spielerListe();
    this.sendeAlle(['lobby', this.lobby]);
    this.aktualisiereLobby();
  },
  hostStart() {
    const L = this.lobby, gaeste = Object.keys(this.gaeste).map((id) => this.gaeste[id]), P = this.profil();
    if (gaeste.some((g) => !g.bereit)) { App.toast('Es sind noch nicht alle bereit.'); return; }
    Menue.nameLesen(); Speicher.sichern();
    const fahrer = [{ peer: 'host', typ: 'mensch', name: P.name, fahrzeug: FAHRZEUGE[P.fahrzeug].id, farbe: P.farbe }];
    for (const g of gaeste) fahrer.push({ peer: g.id, typ: 'mensch', name: g.name, fahrzeug: FAHRZEUGE[g.fahrzeug].id, farbe: g.farbe });
    for (const b of Menue.botFahrer(Math.min(L.bots, CONFIG.rennen.maxFahrer - fahrer.length), L.stufe, fahrer.map((f) => f.farbe))) { b.peer = ''; fahrer.push(b); }
    const zufall = L.zufall == null ? Speicher.daten.zufallsAuto !== false : !!L.zufall;
    if (zufall) Spiel.loseAutos(fahrer);                 // der Host lost für alle im Raum
    const p = fahrer.map((_, i) => i);
    for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const h = p[i]; p[i] = p[j]; p[j] = h; }
    fahrer.forEach((f, i) => { f.platz = p[i]; });
    for (const g of gaeste) g.kart = fahrer.findIndex((f) => f.peer === g.id);
    const daten = { strecke: L.strecke, runden: L.runden, fahrer, zufall, seed: (Math.random() * 1e9) | 0, t0: performance.now() + 2500 + (zufall ? 3400 : 0) };     // t0: gemeinsamer Startzeitpunkt (Host-Uhr)
    this.sendeAlle(['start', daten]);
    this.starteRennen(daten);
  },

  // ── Gast: Raum beitreten ────────────────────────────────────────────────
  beitretenDialog(code) {
    Menue.wahlen = {}; Menue.beiProfil = null;
    const n = CONFIG.netz.codeLaenge;
    Menue.zeige('beitreten', '<div class="tafel"><h2>Raum beitreten</h2><p>Gib den Code ein, den dir der Host geschickt hat.</p>' +
      '<div class="zeile"><label for="f-code">Code</label><input class="feld code" id="f-code" maxlength="' + n + '" autocomplete="off" value="' + esc(code || '') + '"></div>' + Menue.fahrerZeilen(true) +
      '<div class="knoepfe" style="margin-top:14px"><button class="knopf los" data-a="los">Beitreten</button><button class="knopf zweit" data-a="zurueck">Zurück</button></div></div>', {
      los: () => {
        Menue.nameLesen(); Speicher.sichern();
        const c = $('f-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (c.length !== n) { App.toast('Der Code hat ' + n + ' Zeichen.'); return; }
        this.beitreten(c);
      },
      zurueck: () => { try { history.replaceState(null, '', location.href.split('?')[0]); } catch (e) { /* bei file:// nicht möglich */ } Menue.haupt(); },
    });
    $('f-code').onkeydown = (ev) => { if (ev.key === 'Enter') Menue.aktionen.los(); };
  },
  // Der Beitritt läuft in Stufen, damit die Fehlermeldung sagen kann, woran es liegt:
  // 1 Anmeldung beim Vermittler · 2 direkte Verbindung zum Host (mehrere Versuche) · 3 Raum-Daten vom Host
  beitreten(code) {
    this.warte('Verbinde mit dem Vermittlungs-Server …');
    const lauf = ++this.lauf;
    this.ladeBibliothek(() => {
      if (lauf !== this.lauf) return;               // inzwischen abgebrochen
      const N = CONFIG.netz, p = new Peer(this.peerOptionen());
      this.peer = p; this.host = false; this.code = code; this.bereit = false; this.bestRtt = 1e9;
      const laeuft = () => this.peer === p && !this.lobby && !this.imRennen;
      const frist = (sekunden, dann) => { clearTimeout(this.zeitlimit); this.zeitlimit = setTimeout(() => { if (laeuft()) dann(); }, sekunden * 1000); };
      let versuch = 0;
      const verbinde = () => {
        versuch++;
        this.warte('Verbinde mit Raum ' + code + ' …', versuch > 1 ? 'Versuch ' + versuch + ' von ' + N.verbindenVersuche + '. Der Host muss die Lobby offen und im Vordergrund haben.' : '');
        const c = p.connect(RAUM_VORSATZ + code, { reliable: true, label: 'k', serialization: 'json' });
        if (!c) return;                               // Vermittler gerade getrennt: Die Meldung dazu kommt über p.on('error')
        this.zumHost = c;
        c.on('open', () => {
          if (!laeuft() || this.zumHost !== c) return;
          this.letzterEmpfang = performance.now();
          c.send(['hallo', this.profil()]);
          // zweiter, ungeordneter Kanal für die häufigen Zustands-Pakete (ein verlorenes Paket hält dann nichts auf)
          const z = p.connect(RAUM_VORSATZ + code, { reliable: false, label: 'z', serialization: 'json' });
          if (z) { z.on('open', () => { this.zumHostZ = z; }); z.on('data', (d) => this.vomHost(d)); }
          this.takte.push(setInterval(() => this.zumHostSenden(['p', performance.now(), Math.round(this.rtt)]), 1500));
          this.zumHostSenden(['p', performance.now(), 0]);
          frist(N.lobbyTimeout, () => this.beitrittFehler(code, 'lobby', c, versuch));
        });
        c.on('data', (d) => { if (this.zumHost === c) this.vomHost(d); });
        c.on('close', () => { if (this.zumHost === c) this.hostWeg(); });
        frist(N.verbindenTimeout, () => {
          const pc = c.peerConnection, antwort = !!(pc && pc.remoteDescription);       // hat das Gerät des Hosts auf die Anfrage geantwortet?
          // Ohne Antwort lohnt sich Warten (der Host holt das Spiel vielleicht gerade nach vorne), bei blockiertem Netz kaum
          if (versuch < (antwort ? Math.min(2, N.verbindenVersuche) : N.verbindenVersuche)) { this.zumHost = null; try { c.close(); } catch (e) { /* egal */ } verbinde(); }
          else this.beitrittFehler(code, antwort ? 'direkt' : 'stumm', c, versuch);
        });
      };
      frist(N.vermittlerTimeout, () => this.beitrittFehler(code, 'vermittler', null, 0));
      p.on('open', () => { this.meineId = p.id; if (laeuft() && !versuch) verbinde(); });
      p.on('error', (e) => {
        if (this.peer === p && !this.imRennen && (!this.lobby || e.type === 'peer-unavailable')) this.fehler(this.fehlerText(e), code, 'Diagnose: ' + (e && e.type) + (versuch ? ' · Versuch ' + versuch : ''));
      });
    });
  },
  // Beitritt gescheitert: sagen, an welcher Stelle es hängt, und eine Zeile für die Fehlersuche dazuschreiben
  beitrittFehler(code, stufe, c, versuche) {
    const pc = c && c.peerConnection;
    const texte = {
      vermittler: 'Der Vermittlungs-Server antwortet nicht. Prüfe deine Internetverbindung und versuch es nochmals.',
      stumm: 'Der Raum ' + code + ' ist angemeldet, aber das Gerät des Hosts antwortet nicht. Meistens ist das Spiel dort nicht mehr im Vordergrund (anderer Tab, andere App oder Bildschirm aus). Der Host soll die Lobby offen und sichtbar lassen, dann versuchst du es nochmals.',
      direkt: 'Der Host hat geantwortet, aber die direkte Verbindung zwischen den beiden Geräten kam nicht zustande. Das liegt am Netz: Gäste-WLAN, VPN und manche Mobilfunk-, Schul- und Firmennetze lassen sie nicht durch. Am ehesten klappt es, wenn beide Geräte im selben WLAN sind (ohne VPN).',
      lobby: 'Die Verbindung zum Host steht, aber er schickt keine Raum-Daten. Der Host soll einen neuen Raum erstellen.',
    };
    let diagnose = 'Diagnose: ' + stufe + (versuche ? ' · Versuche ' + versuche : '');
    if (pc) diagnose += ' · ICE ' + pc.iceConnectionState + '/' + pc.iceGatheringState + ' · Signal ' + pc.signalingState;
    if (pc) {
      // Welche Adressen kennen die beiden Seiten voneinander? host = im selben Netz · srflx = öffentliche Adresse · relay = Umleitung über einen TURN-Server
      const adressen = (b) => {
        const n = {};
        String((b && b.sdp) || '').replace(/a=candidate:[^\r\n]* typ (\w+)/g, (_, art) => { n[art] = (n[art] || 0) + 1; return ''; });
        return ['host', 'srflx', 'prflx', 'relay'].filter((a) => n[a]).map((a) => a + ' ' + n[a]).join(', ') || 'keine';
      };
      try { diagnose += ' · eigene Adressen: ' + adressen(pc.localDescription) + ' · Adressen des Hosts: ' + adressen(pc.remoteDescription); } catch (e) { /* nur eine Zusatz-Angabe */ }
    }
    this.fehler(texte[stufe], code, diagnose);
  },
  zumHostSenden(d, schnell) {
    const c = schnell && this.zumHostZ && this.zumHostZ.open ? this.zumHostZ : this.zumHost;
    try { if (c && c.open) c.send(d); } catch (e) { /* Verbindung gerade weg */ }
  },
  hostWeg() {
    if (!this.peer || this.host) return;
    this.fehler('Die Verbindung zum Host ist abgebrochen oder der Host hat das Spiel verlassen. Das Online-Spiel ist damit beendet.');
  },
  vomHost(d) {
    if (!Array.isArray(d) || !this.peer) return;
    this.letzterEmpfang = performance.now();
    const R = Spiel.R, imRennen = this.imRennen && Spiel.netz === this && R;
    switch (d[0]) {
      case 'lobby': this.lobby = d[1]; clearTimeout(this.zeitlimit); if (!this.imRennen) { if (Menue.offen === 'lobby') this.aktualisiereLobby(); else if (Menue.offen === 'laden') this.zeigeLobby(); } break;
      case 'q': {      // Antwort auf unser Ping: Laufzeit messen und die Uhr des Hosts schätzen
        const jetzt = performance.now(), rtt = jetzt - d[1];
        this.rtt = rtt; this.bestRtt += 0.5;
        if (rtt <= this.bestRtt) { this.bestRtt = rtt; this.versatz = d[2] + rtt / 2 - jetzt; }
        break;
      }
      case 'nein': this.fehler(esc(d[1])); break;
      case 'start': this.starteRennen(d[1]); break;
      case 's': if (imRennen) this.empfangeBild(R, d); break;
      case 'bw':
        if (imRennen && !R.bauwerke.some((b) => b.id === d[1].id)) { const bw = R.neuesBauwerk(d[1]); R.bauwerke.push(bw); Spiel.ereignis({ typ: 'bau', k: bw.besitzer, a: bw.id, zeit: R.zeit }); }
        break;
      case 'bwWeg': if (imRennen) { const i = R.bauwerke.findIndex((b) => b.id === d[1]); if (i >= 0) R.bauwerke.splice(i, 1); } break;
      case 'e':
        if (imRennen) {
          const e = { typ: d[1], k: d[2], a: d[3], b: d[4], zeit: R.zeit };
          if (e.typ === 'treffer') { const bw = R.bauwerke.find((x) => x.id === e.a); if (bw && e.b >= 0 && bw.teile && bw.teile[e.b]) bw.teile[e.b].weg = true; }
          else if (e.typ === 'runde') { const k = R.karts[e.k]; k.rundenZeiten.push(e.b); k.rundeStart += e.b; }
          Spiel.ereignis(e);
        }
        break;
      case 'ende':
        if (imRennen) {
          d[1].karts.forEach((q, i) => { const k = R.karts[i]; k.endZeit = q[0]; k.geschaetzt = q[1]; k.rundenZeiten = q[2]; k.bpVerdient = q[3]; k.bpAusgegeben = q[4]; k.ueberholt = q[5]; k.gebaut = q[6]; k.treffer = q[7]; k.trefferErzielt = q[8]; k.schlechtesterRang = q[9]; k.resets = q[10]; k.rang = q[11]; });
          R.reihenfolge = d[1].reihenfolge; R.phase = 'ende'; R.fertig = true;
        }
        break;
      case 'zurLobby': if (this.imRennen) this.zurLobby(); break;
    }
  },

  // ── Lobby (für Host und Gäste) ──────────────────────────────────────────
  zeigeLobby() {
    const L = this.lobby, D = Speicher.daten, host = this.host;
    if (!L) return;
    if (host) L.spieler = this.spielerListe();
    Menue.wahlen = {};
    Menue.beiProfil = () => this.sendeProfil();
    const link = location.href.split('?')[0].split('#')[0] + '?raum=' + this.code;
    let rennen = '<p id="lobby-info"></p>';
    if (host) rennen = Menue.wahlZeile('Strecke', 'strecke', Object.keys(STRECKEN).map((id) => ({ wert: id, text: STRECKEN[id].name })), L.strecke, (v) => { L.strecke = D.strecke = v; Spiel.starteDemo(v); this.sendeLobby(); }) +
      Menue.wahlZeile('Runden', 'runden', zahlen(1, 7), L.runden, (v) => { L.runden = D.runden = v; this.sendeLobby(); }) +
      Menue.wahlZeile('Bots', 'gegner', zahlen(0, CONFIG.rennen.maxFahrer - 1), L.bots, (v) => { L.bots = v; this.sendeLobby(); }) +
      Menue.wahlZeile('Stärke', 'stufe', STUFEN_LISTE, L.stufe, (v) => { L.stufe = v; this.sendeLobby(); });
    Menue.zeige('lobby', '<div class="tafel breit"><h2>Raum ' + this.code + '</h2>' +
      '<div class="zeile"><input class="feld" id="f-link" readonly value="' + esc(link) + '" style="width:min(430px,100%);font-size:14px"><button class="knopf klein" data-a="kopieren">Link kopieren</button></div>' +
      '<div class="spalten"><div><h3>Fahrer</h3><div class="spielerliste" id="lobby-liste"></div><p class="hinweis">' +
      (host ? 'Schick den Link oder den Code an deine Mitspieler und komm gleich wieder hierher zurück: Ist dieses Fenster im Hintergrund, kann auf Handys und Tablets niemand beitreten. Du bist der Host: Verlässt du das Spiel, endet es für alle.' :'Der Host startet das Rennen, sobald alle bereit sind.') + '</p></div>' +
      '<div><h3>Du</h3>' + Menue.fahrerZeilen(true) + '<h3>Rennen</h3>' + rennen + '</div></div>' +
      '<div class="zeile" style="margin-top:12px">' + (host ? '<button class="knopf los" data-a="start">Rennen starten</button>' : '<button class="knopf los" data-a="bereit" id="k-bereit">Bereit</button>') +
      '<button class="knopf zweit" data-a="zurueck">Verlassen</button></div></div>', {
      kopieren: () => {
        const fertig = () => App.toast('Link kopiert. Schick ihn deinen Mitspielern.', 2500);
        const alt = () => { const f = $('f-link'); f.focus(); f.select(); try { document.execCommand('copy'); fertig(); } catch (e) { App.toast('Markiere den Link und kopiere ihn von Hand.'); } };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(fertig, alt); else alt();
      },
      start: () => this.hostStart(),
      bereit: () => { this.bereit = !this.bereit; this.zumHostSenden(['bereit', this.bereit]); this.aktualisiereLobby(); },
      zurueck: () => App.zumMenue(),
    });
    const f = $('f-name'); if (f) f.onchange = () => this.sendeProfil();
    this.aktualisiereLobby();
  },
  aktualisiereLobby() {
    const L = this.lobby, liste = $('lobby-liste');
    if (Menue.offen !== 'lobby' || !L || !liste) return;
    if (this.host && L.zufall == null) L.zufall = Speicher.daten.zufallsAuto !== false;
    const bots = Math.max(0, Math.min(L.bots, CONFIG.rennen.maxFahrer - L.spieler.length));
    const stufe = (STUFEN_LISTE.find((s) => s.wert === L.stufe) || STUFEN_LISTE[1]).text;
    liste.innerHTML = L.spieler.map((s) => '<div class="zeile"><span class="farbfeld" style="background:' + hexCss(FARBEN[s.farbe % FARBEN.length].hex) + '"></span><b>' + esc(s.name) + '</b><span class="hinweis">' + (L.zufall ? 'Zufalls-Auto' : FAHRZEUGE[s.fahrzeug % FAHRZEUGE.length].name) + '</span>' +
      '<span style="margin-left:auto" class="' + (s.bereit ? 'bereit' : 'hinweis') + '">' + (s.host ? 'Host' : s.bereit ? 'bereit' : 'wartet') + '</span>' + (s.host ? '' : '<span class="hinweis">' + (s.ping | 0) + ' ms</span>') + '</div>').join('') +
      (bots ? '<div class="zeile"><span class="hinweis">dazu ' + bots + (bots === 1 ? ' Bot' : ' Bots') + ' (' + stufe + ')</span></div>' : '');
    const info = $('lobby-info');
    if (info) info.innerHTML = 'Strecke: <b>' + (STRECKEN[L.strecke] ? STRECKEN[L.strecke].name : '?') + '</b><br>Runden: <b>' + L.runden + '</b><br>Bots: <b>' + bots + '</b> (' + stufe + ')<br>Zufalls-Auto: <b>' + (L.zufall ? 'Ein' : 'Aus') + '</b>' + (this.host ? ' <button class="pfeil" id="k-zufall" aria-label="Zufalls-Auto umschalten">⇄</button>' : ' (legt der Host fest)');
    const kz = $('k-zufall'); if (kz) kz.onclick = () => { L.zufall = !L.zufall; Speicher.daten.zufallsAuto = L.zufall; Speicher.sichern(); this.sendeLobby(); };
    const kb = $('k-bereit'); if (kb) kb.textContent = this.bereit ? 'Doch nicht bereit' : 'Bereit';
    if (!this.host && Spiel.demo && STRECKEN[L.strecke] && Grafik.strecke && Grafik.strecke.id !== L.strecke) Spiel.starteDemo(L.strecke);
  },
  sendeProfil() {
    Menue.nameLesen(); Speicher.sichern();
    if (this.host) this.sendeLobby(); else this.zumHostSenden(['profil', this.profil()]);
  },
  zurLobby() {
    if (!this.peer || !this.lobby) { App.zumMenue(); return; }
    this.imRennen = false; Spiel.netz = null;
    if (this.host) { this.sendeAlle(['zurLobby']); for (const id in this.gaeste) this.gaeste[id].bereit = false; }
    else { this.bereit = false; this.zumHostSenden(['bereit', false]); }
    Spiel.starteDemo(this.lobby.strecke);
    this.zeigeLobby();
    if (this.host) this.sendeLobby();
  },
  revanche() { if (this.host) this.hostStart(); },

  // ── Im Rennen ───────────────────────────────────────────────────────────
  starteRennen(daten) {
    const ich = this.host ? 'host' : this.meineId;
    const fahrer = daten.fahrer.map((f) => ({ name: f.name, fahrzeug: f.fahrzeug, farbe: f.farbe, stufe: f.stufe, platz: f.platz, geraet: 'tasten',
      typ: f.peer === ich ? 'mensch' : this.host && f.typ === 'bot' ? 'bot' : 'fern' }));
    this.t0 = daten.t0; this.imRennen = true; this.schrittNr = 0; this.puffer = fahrer.map(() => []); this.bekannt = {}; this.endeGesendet = false;
    this.meinKart = daten.fahrer.findIndex((f) => f.peer === ich);
    this.letzterEmpfang = performance.now();
    for (const id in this.gaeste) this.gaeste[id].zuletzt = performance.now();
    Spiel.starte({ modus: 'online', zufall: !!daten.zufall, host: this.host, strecke: daten.strecke, runden: daten.runden, fahrer, seed: daten.seed, schiri: this.host, plaetzeFest: true });
    Spiel.netz = this;
    Spiel.R.netz = {
      bauWunsch: (k, art, slot) => this.zumHostSenden(['bau', art, slot]),
      treffer: (k, id, teil) => this.zumHostSenden(['treffer', id, teil]),
      benutzt: (k, id) => this.zumHostSenden(['benutzt', id]),
      nachOrten: this.host ? (R) => this.nachOrten(R) : null,
    };
  },
  // Wie viel Rennzeit fehlt bis zur gemeinsamen Uhr? (ersetzt im Online-Spiel den normalen Zeit-Zähler)
  takt(R) {
    const soll = (this.jetzt() - this.t0) / 1000 - CONFIG.rennen.countdown;
    return clamp(soll - R.zeit, 0, 0.3);
  },
  zustand(R, k) {
    const f = (k.luft ? 1 : 0) | (k.drift > 0 ? 2 : k.drift < 0 ? 4 : 0) | ((k.driftStufe & 3) << 3) | (k.boostZeit > 0 ? 32 : 0) | (k.windAktiv ? 64 : 0) | (k.schutzZeit > 0 ? 128 : 0) | (k.geistZeit > 0 ? 256 : 0) | (k.schlamm ? 1024 : 0);
    return [r3(R.zeit), r2(k.x), r2(k.z), r2(k.y), r3(k.richtung), r3(k.blick), r2(k.v), r2(k.lenk), f, r2(k.strecke)];
  },
  merkeZustand(kart, z) {
    if (!Array.isArray(z) || z.length < 10 || z.some((x) => typeof x !== 'number' || !isFinite(x))) return;
    const P = this.puffer[kart];
    if (P.length && z[0] <= P[P.length - 1][0]) return;            // veraltet (Pakete können sich überholen)
    P.push(z); if (P.length > 14) P.shift();
  },
  // Fremde Fahrzeuge zwischen zwei empfangenen Zuständen weich bewegen (100 ms in der Vergangenheit)
  vorSchritt(R) {
    const tr = R.zeit + SCHRITT - CONFIG.netz.puffer;
    for (const k of R.karts) {
      if (k.typ !== 'fern') continue;
      const P = this.puffer[k.idx];
      if (!P || !P.length) continue;
      while (P.length > 2 && P[1][0] <= tr) P.shift();
      const a = P[0], b = P[1] || a, dt = b[0] - a[0];
      const u = dt > 0.001 ? clamp((tr - a[0]) / dt, 0, 1 + 0.25 / dt) : 0;      // höchstens 0.25 s über das letzte Paket hinaus weiterrechnen
      const w = Math.min(u, 1);
      k.x = a[1] + (b[1] - a[1]) * u; k.z = a[2] + (b[2] - a[2]) * u; k.y = a[3] + (b[3] - a[3]) * w;
      k.richtung = a[4] + winkelDiff(b[4], a[4]) * w; k.blick = a[5] + winkelDiff(b[5], a[5]) * w;
      k.v = b[6]; k.lenk = b[7];
      const f = b[8];
      k.luft = !!(f & 1); k.drift = f & 2 ? 1 : f & 4 ? -1 : 0; k.driftStufe = (f >> 3) & 3; k.boostZeit = f & 32 ? 0.2 : 0; k.windAktiv = !!(f & 64);
      k.schutzZeit = f & 128 ? 0.2 : 0; k.geistZeit = f & 256 ? 0.2 : 0; k.schlamm = f & 1024 ? 1 : 0;
    }
  },
  // Host: Für Platzierung und Zieleinlauf zählt der frischeste gemeldete Stand (gleicht die Verzögerung aus)
  nachOrten(R) {
    for (const k of R.karts) {
      if (k.typ !== 'fern') continue;
      const P = this.puffer[k.idx], n = P && P[P.length - 1];
      if (n) k.strecke = n[9] + n[6] * clamp(R.zeit - n[0], 0, 0.25);
    }
  },
  ereignisVomSchiri(e) {
    if (e.typ === 'ueberholt' || e.typ === 'bp' || e.typ === 'runde' || e.typ === 'ziel' || e.typ === 'treffer') this.sendeAlle(['e', e.typ, e.k, e.a, e.b]);
  },
  nachSchritt(R) {
    this.schrittNr++;

    if (this.host) {
      // neue und abgebaute Bauwerke melden
      for (const bw of R.bauwerke) if (!this.bekannt[bw.id]) { this.bekannt[bw.id] = true; this.sendeAlle(['bw', { id: bw.id, art: bw.art, slot: bw.slot, besitzer: bw.besitzer, t0: bw.t0, betroffen: bw.betroffen }]); }
      for (const id in this.bekannt) if (!R.bauwerke.some((b) => b.id === +id)) { delete this.bekannt[id]; this.sendeAlle(['bwWeg', +id]); }
      if (senden) {
        const karts = R.karts.map((k) => { const P = this.puffer[k.idx]; return k.typ === 'fern' && P.length ? P[P.length - 1] : this.zustand(R, k); });
        const ref = R.karts.map((k) => [k.rang, Math.round(k.bp * 10) / 10, k.runde, k.zielZeit, Math.round(Math.max(0, k.bauSperre) * 10) / 10]);
        this.sendeAlle(['s', r3(R.zeit), karts, ref], true);
      }
      if (this.schrittNr % 60 === 0) {       // wer zu lange schweigt, gilt als ausgefallen
        const jetzt = performance.now();
        for (const id in this.gaeste) if (jetzt - this.gaeste[id].zuletzt > CONFIG.netz.ausfallTimeout * 1000) this.gastWeg(id);
      }
      if (R.fertig && !this.endeGesendet) {
        this.endeGesendet = true;
        this.sendeAlle(['ende', { reihenfolge: R.reihenfolge, karts: R.karts.map((k) => [k.endZeit, k.geschaetzt, k.rundenZeiten, k.bpVerdient, k.bpAusgegeben, k.ueberholt, k.gebaut, k.treffer, k.trefferErzielt, k.schlechtesterRang, k.resets, k.rang]) }]);
      }
    } else {
      for (const bw of R.bauwerke) if (!bw.fertig && R.zeit >= bw.tFest) { bw.fertig = true; Spiel.ereignis({ typ: 'fertig', k: bw.besitzer, a: bw.id, zeit: R.zeit }); }
      if (senden) this.zumHostSenden(['z'].concat(this.zustand(R, R.karts[this.meinKart])), true);

  },
  // Gast: Bild vom Host übernehmen (fremde Fahrzeuge + Schiedsrichter-Daten für alle)
  empfangeBild(R, d) {

    for (let i = 0; i < R.n; i++) {
      const k = R.karts[i], q = ref[i];
      if (k.typ === 'fern' && karts[i]) this.merkeZustand(i, karts[i]);
      if (!q) continue;
      k.rang = q[0]; k.bp = q[1]; k.runde = q[2];
      if (q[3] != null && k.zielZeit == null) k.zielZeit = q[3];

  // Die Strecke wird einmal auf eine kleine Karte gezeichnet; Fahrzeuge und Bauwerke kommen pro Bild dazu.
  zeichneKartenGrund(S) {

    const g = S.grenzen, rand = 16, f = Math.min((256 - 2 * rand) / (g.x1 - g.x0), (256 - 2 * rand) / (g.z1 - g.z0));
    this.kf = f; this.kx = 128 - ((g.x0 + g.x1) / 2) * f; this.ky = 128 + ((g.z0 + g.z1) / 2) * f;     // Bildpunkt = (kx + x·f, ky − z·f)

  zeichneKarte(t, R, k) {

      else if (k.boostZeit > 0) { lade = clamp(k.boostZeit / 1.5, 0, 1); farbe = '#ff7a1a'; }

      // Abstand

        if (k.zielZeit != null) info = '';
        else if (!R.bauenAn) info = '';
        else if (k.rang === 1) info = 'Du führst: Bauen gesperrt, deine BP bleiben erhalten';
        else if (s.ok) {
          const sl = R.S.slots[s.slot];
          info = b.name + ' auf Platz ' + sl.id + ' in ' + Math.round(wegVor(k.sHaupt, sl.s, R.L) / 10) * 10 + ' m · ' + (tipp ? 'nochmals antippen' : '<kbd>' + T.bauen + '</kbd>') + ' baut' +
            (s.anzahl > 1 ? ' · ' + (tipp ? '«Slot»' : '<kbd>' + T.slot + '</kbd>') + ' anderer Platz' : '');
        } else {
          info = b.name + ': ' + (s.grund === 'zu wenig BP' ? 'kostet ' + s.preis + ' BP' : s.grund === 'kein Slot' ? 'gerade kein passender Bauplatz' : s.grund === 'Pause' ? 'Baupause ' + Math.ceil(Math.max(0, k.bauSperre)) + ' s' : s.grund);
        }
        setze(t.bauinfo, 'info', info);
        zeige(t.bauinfo, 'infoAn', info !== '');
      }
      // Warnung vor der nächsten Baustelle, die für diesen Fahrer fest ist
      let warn = null, wd = 160;
      if (k.zielZeit == null) for (const bw of R.bauwerke) {
        if (bw.eigen || bw.weg || !((bw.betroffen >> k.idx) & 1)) continue;
        const d = wegVor(k.sHaupt, bw.s, R.L);
        if (d < wd) { wd = d; warn = bw; }
      }
      if (warn) {
        // Pfeil zeigt auf die freie Seite (links = positives d)
        const pf = warn.art === 'pylonen' ? '◆' : warn.art === 'umleitung' ? (warn.seite > 0 ? '←' : '→') : (warn.seite > 0 ? '→' : '←');
        setze(t.warnung, 'warn', '<span class="pf">' + pf + '</span> Baustelle in ' + Math.max(10, Math.round(wd / 10) * 10) + ' m! <span class="pf">' + pf + '</span>');
        if (t.warnBw !== warn.id) { t.warnBw = warn.id; Ton.spiele('warnung'); }
      }
      zeige(t.warnung, 'warnAn', !!warn);
      zeige(t.falsch, 'falsch', k.falschZeit > 1 && k.zielZeit == null);
      if (t.meldZeit > 0) { t.meldZeit -= dt; if (t.meldZeit <= 0) t.meldung.textContent = ''; }
      // Countdown und grosse Einblendungen
      if (R.phase === 'countdown') { const z = Math.ceil(-R.zeit); this.setzeGross(t, z >= 1 && z <= 3 ? String(z) : '', false); }
      else if (t.grossZeit > 0) { t.grossZeit -= dt; if (t.grossZeit <= 0) this.setzeGross(t, '', false); }
      if (this.bild % 2 === 0) this.zeichneKarte(t, R, k);
    }
  },
};

// ── Touch-Steuerung (Handy/Tablet): links lenken, rechts Drift, Bremse und Bauen ──
const Touch = {
  baue(el) {
    const t = Eingabe.touch, knoepfe = [];
    const mk = (text, css, an, aus) => {
      const b = document.createElement('div'); b.className = 'touch versteckt'; b.textContent = text; b.style.cssText = css;
      b.addEventListener('touchstart', (ev) => { ev.preventDefault(); an(ev); }, { passive: false });
      if (aus) { b.addEventListener('touchend', (ev) => { ev.preventDefault(); aus(ev); }, { passive: false }); b.addEventListener('touchcancel', aus); }
      el.appendChild(b); knoepfe.push(b); return b;
    };
    const lenk = mk('◀ lenken ▶', 'left:3%;bottom:17%;width:40%;height:36%;border-radius:22px;', (ev) => { t.x0 = ev.changedTouches[0].clientX; t.id = ev.changedTouches[0].identifier; }, () => { t.lenk = 0; });
    lenk.addEventListener('touchmove', (ev) => { ev.preventDefault(); for (const p of ev.changedTouches) if (p.identifier === t.id) t.lenk = clamp((t.x0 - p.clientX) / 55, -1, 1); }, { passive: false });
    mk('Drift', 'right:4%;bottom:19%;width:96px;height:96px;', () => { t.drift = true; }, () => { t.drift = false; });
    mk('Bremse', 'right:calc(4% + 108px);bottom:17%;width:76px;height:76px;font-size:16px;', () => { t.bremse = true; }, () => { t.bremse = false; });
    mk('Bauen', 'right:4%;bottom:calc(19% + 108px);width:76px;height:76px;font-size:17px;background:rgba(255,198,26,.45);', () => { t.neu.bauen = true; });
    mk('Slot', 'right:calc(4% + 88px);bottom:calc(19% + 100px);width:62px;height:62px;font-size:15px;', () => { t.neu.slot = true; });
    mk('↺', 'left:3%;top:38%;width:52px;height:52px;', () => { t.neu.reset = true; });
    const zeige = () => { for (const b of knoepfe) b.classList.toggle('versteckt', !t.aktiv); };
    // Erst beim ersten Antippen einschalten (ein Laptop mit Touch-Bildschirm fährt sonst von selbst los)
    if (!this.lauscht) {
      this.lauscht = true;
      window.addEventListener('touchstart', () => { if (!t.aktiv) { t.aktiv = true; if (Touch.zeige) Touch.zeige(); } }, { passive: true });
    }
    this.zeige = zeige; zeige();
  },
};

// ── Spielablauf: ein Rennen starten, pro Bild weiterrechnen, Ereignisse verteilen ──
const Spiel = {
  letzteAutos: {}, losAn: false,
  R: null, netz: null, demo: true, pause: false, akk: 0, spieler: [], eingaben: [], konfig: null, zielSeit: -1, cdZahl: 0, ergebnisGezeigt: false,

  // Hintergrund für das Menü: ein paar Bots drehen ihre Runden
  starteDemo(streckenId) {
    const ids = Object.keys(STRECKEN), id = streckenId && STRECKEN[streckenId] ? streckenId : ids[Math.floor(Math.random() * ids.length)];
    const S = holeStrecke(id);
    if (Grafik.strecke !== S) Grafik.baueWelt(S);
    const fahrer = [];
    for (let i = 0; i < 6; i++) fahrer.push({ name: BOT_NAMEN[i], typ: 'bot', stufe: 'mittel', fahrzeug: FAHRZEUGE[i % FAHRZEUGE.length].id, farbe: i });
    this.R = new Rennen(S, fahrer, { runden: 99, meldungen: false });
    this.R.zeit = -0.4;
    this.demo = true; this.pause = false; this.spieler = []; this.akk = 0; this.konfig = null; this.ergebnisGezeigt = false; this.netz = null;
    Grafik.neuesRennen(this.R); Grafik.setzeAnsichten([-1]);
    $('hud').innerHTML = ''; $('hud').classList.remove('versteckt'); Hud.teile = [];
    Ton.motorAus(); Ton.musikArt('menue');
    const pk = $('pauseknopf'); if (pk) pk.classList.add('versteckt');
  },

  // Zufalls-Auto: jedem Fahrer eines der 8 Autos zulosen (nie dasselbe wie im Rennen davor)
  loseAutos(fahrer) {
    const autos = loseFahrzeuge(fahrer.length, Math.random, fahrer.map((f) => this.letzteAutos[f.name]));
    fahrer.forEach((f, i) => { f.fahrzeug = autos[i]; });
  },

  // konfig: { modus, zufall, strecke, runden, fahrer: [{ name, typ: 'mensch'|'bot'|'fern', stufe, fahrzeug, farbe, geraet }], seed, schiri, plaetzeFest }
  starte(konfig) {
    const S = holeStrecke(konfig.strecke);
    if (Grafik.strecke !== S) Grafik.baueWelt(S);
    const n = konfig.fahrer.length;
    if (konfig.zufall && !konfig.plaetzeFest) this.loseAutos(konfig.fahrer);
    konfig.fahrer.forEach((f) => { this.letzteAutos[f.name] = f.fahrzeug; });
    if (!konfig.plaetzeFest) {                      // Startaufstellung auslosen
      const p = konfig.fahrer.map((_, i) => i);
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const h = p[i]; p[i] = p[j]; p[j] = h; }
      konfig.fahrer.forEach((f, i) => { f.platz = p[i]; });
    }
    const R = new Rennen(S, konfig.fahrer, { runden: konfig.runden, seed: konfig.seed, schiri: konfig.schiri !== false });
    this.R = R; this.konfig = konfig; this.demo = false; this.pause = false; this.akk = 0; this.zielSeit = -1; this.cdZahl = 0; this.ergebnisGezeigt = false; this.netz = null;
    this.spieler = [];
    R.karts.forEach((k, i) => {
      if (k.typ !== 'mensch') return;
      k.bot = new Bot(R, k, 'mittel');              // übernimmt nach der Zieldurchfahrt das Ausrollen
      const g = konfig.fahrer[i].geraet || 'tasten';
      this.spieler.push({ kart: i, geraet: g, e: Object.assign({}, LEERE_EINGABE), tasten: tastenText(g) });
    });
    this.eingaben = new Array(n).fill(null);
    Grafik.neuesRennen(R); Grafik.setzeAnsichten(this.spieler.length ? this.spieler.map((s) => s.kart) : [-1]);
    Hud.baue(R, this.spieler);
    this.losAn = !!konfig.zufall && this.spieler.length > 0;
    if (this.losAn) { if (konfig.modus !== 'online') R.zeit = -(CONFIG.rennen.countdown + 3.4); Hud.auslosung(R); }     // kurze Auslosung vor dem Countdown
    Menue.schliesse();
    Ton.start(); Ton.motorAn(this.spieler.map((s) => R.karts[s.kart].fahrzeug)); Ton.musikArt('rennen'); Ton.musik(true);
    Eingabe.fertig();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    $('pauseknopf').classList.remove('versteckt');
    if (App.debug) App.debugWelt(S);
  },

  // ein Rechenschritt (1/60 s). «erster» = erster Schritt in diesem Bild: nur dann zählen einmalige Tastendrücke.
  schritt(erster) {
    const R = this.R;
    for (const sp of this.spieler) { Eingabe.lies(sp.geraet, sp.e, erster); this.eingaben[sp.kart] = sp.e; }
    if (this.netz) this.netz.vorSchritt(R);
    R.step(SCHRITT, this.eingaben);
    if (R.ereignisse.length) { for (const e of R.ereignisse) this.ereignis(e); R.ereignisse.length = 0; }
    if (this.netz) this.netz.nachSchritt(R);
  },

  bild(dt) {
    const R = this.R;
    if (!R) return;
    if (!this.pause) {
      // Sind alle lokalen Fahrer im Ziel, läuft der Rest im Zeitraffer, bis auch die Bots fertig sind
      const raffer = !this.demo && !this.netz && this.zielSeit >= 0 && R.zeit - this.zielSeit > 2.5 && !R.fertig;
      if (this.netz) this.akk = this.netz.takt(R); else this.akk += dt * (raffer ? 6 : 1);     // online gibt die gemeinsame Uhr den Takt vor
      let erster = true, max = 12;
      while (this.akk >= SCHRITT && max-- > 0 && !R.fertig) { this.schritt(erster); erster = false; this.akk -= SCHRITT; }
      if (this.akk >= SCHRITT) this.akk = 0;
      if (!erster) Eingabe.fertig();
      if (this.demo) { if (R.fertig || R.zeit > 900) this.starteDemo(R.S.id); }
      else {
        if (R.phase === 'countdown') { const z = Math.ceil(-R.zeit); if (z !== this.cdZahl && z >= 1 && z <= 3) { this.cdZahl = z; Ton.spiele('tick'); } }
        if (this.zielSeit < 0 && this.spieler.length && this.spieler.every((s) => R.karts[s.kart].zielZeit != null)) this.zielSeit = R.zeit;
        if (R.fertig && !this.ergebnisGezeigt) { this.ergebnisGezeigt = true; this.endeRennen(); }
      }
    } else {
      // In der Pause weiter auf die Start-Taste der Gamepads hören
      for (const sp of this.spieler) if (sp.geraet.startsWith('pad')) Eingabe.lies(sp.geraet, sp.e, true);
    }
    Grafik.aktualisiere(this.R, this.pause ? 1 : clamp(this.akk / SCHRITT, 0, 1), this.pause ? 0 : dt);
    if (!this.demo && this.R === R) {
      Hud.aktualisiere(R, dt);
      if (this.losAn && R.zeit > -2.3) { this.losAn = false; Hud.auslosungWeg(); }
      const still = this.pause || this.ergebnisGezeigt;
      this.spieler.forEach((sp, i) => {
        const k = R.karts[sp.kart];
        Ton.motor(i, clamp(Math.abs(k.v) / CONFIG.fahren.vmax, 0, 1.3), k.eingabe.gas > 0, k.drift !== 0 && !k.luft, k.boostZeit > 0, !k.aufStrasse && Math.abs(k.v) > 5, still,
          R.S.bruecke[Math.floor(k.sHaupt / R.S.haupt.ds) % R.S.haupt.n] ? 1 : 0);
      });
      if (this.spieler.length === 1) Ton.fremde(R, this.spieler[0].kart, dt, still);
    }
  },

  // Ereignisse aus der Spiellogik → Effekte, Töne, Meldungen
  ereignis(e) {
    const R = this.R;
    if (this.netz && this.netz.host) this.netz.ereignisVomSchiri(e);
    Grafik.ereignis(e, R);
    const lokal = (idx) => Hud.teile.find((q) => q.sp.kart === idx);
    const t = e.k >= 0 ? lokal(e.k) : null;
    const name = e.k >= 0 ? R.karts[e.k].name : '';
    switch (e.typ) {
      case 'los': Ton.spiele('los'); Ton.jubel(1); for (const q of Hud.teile) Hud.gross(q, 'Los!', false, 1.1); break;
      case 'turbo': if (t) { Ton.spiele('turbo'); Hud.meldung(t, e.a === 2 ? 'Super-Turbo!' : 'Mini-Turbo!', true); } break;
      case 'rampe': if (t) { Ton.spiele('boost'); Hud.meldung(t, 'Rampe! Boost!', true); } break;
      case 'abkuerzung': if (t) { Ton.spiele('boost'); Hud.meldung(t, 'Abkürzung genommen!', true); } break;
      case 'landung': if (t && e.a > 6) Ton.spiele('landung'); break;
      case 'wand': if (t) Ton.spiele('wand'); break;
      case 'rempler': if (t || lokal(e.a)) Ton.spiele('rempler'); break;
      case 'reset': if (t) { Ton.spiele('reset'); Hud.meldung(t, 'Zurück auf die Strecke'); } break;
      case 'wind': if (t) Hud.meldung(t, 'Windschatten!', true); break;
      case 'bp': if (t) { Ton.spiele(e.b === 'aufholen' ? 'bp' : 'vorbei'); Hud.meldung(t, (e.b === 'aufholen' ? 'Aufgeholt' : 'Überholt') + ': jetzt ' + e.a + ' BP', true); } break;
      case 'ueberholt': { const o = lokal(e.a); if (o) { Ton.spiele('ueberholt'); Hud.meldung(o, name + ' hat dich überholt'); } break; }
      case 'bau': {
        const bw = R.bauwerke.find((b) => b.id === e.a); if (!bw) break;
        const b = BAUWERKE[BAUWERK_INDEX[bw.art]];
        for (const q of Hud.teile) {
          if (q.sp.kart === e.k) { Ton.spiele('bau'); Hud.meldung(q, b.name + ' wird gebaut (−' + R.preis(R.karts[e.k], bw.art) + ' BP)', true); }
          else if (!bw.eigen && ((bw.betroffen >> q.sp.kart) & 1)) { Ton.spiele('warnung'); Hud.meldung(q, name + ' baut gegen dich: ' + b.name + '!'); }
        }
        break;
      }
      case 'fertig': if (t) Ton.spiele('fertig'); break;
      case 'treffer': {
        const bw = R.bauwerke.find((b) => b.id === e.a);
        if (t) { Ton.spiele('treffer'); Hud.meldung(t, 'Autsch! ' + (bw ? BAUWERKE[BAUWERK_INDEX[bw.art]].name : 'Baustelle') + ' erwischt'); }
        const o = bw ? lokal(bw.besitzer) : null;
        if (o && o !== t) Hud.meldung(o, name + ' fährt in deine Baustelle!', true);
        break;
      }
      case 'runde': if (t && e.a > 1 && e.a <= R.runden) { Ton.jubel(0.5); if (e.a === R.runden) { Ton.spiele('letzte'); Ton.musikArt('final'); } else Ton.spiele('runde'); Hud.meldung(t, (e.a === R.runden ? 'Letzte Runde! ' : '') + 'Rundenzeit ' + zeitText(e.b), true); } break;
      case 'ziel': if (t) { Ton.spiele('ziel'); Ton.jubel(1.2); Hud.gross(t, 'Ziel! Platz ' + R.karts[e.k].rang, true, 999); } break;
    }
  },

  endeRennen() {
    Ton.motorAus(); Ton.musikArt('menue');
    $('pauseknopf').classList.add('versteckt'); $('hud').classList.add('versteckt');
    Menue.ergebnis(this.R, this.konfig);
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 12: Menüs, Ergebnis, Simulations-Seite und Programmstart
   ══════════════════════════════════════════════════════════════════════════ */
const STUFEN_LISTE = [{ wert: 'leicht', text: 'Leicht' }, { wert: 'mittel', text: 'Mittel' }, { wert: 'schwer', text: 'Schwer' }];
const GERAETE_LISTE = [{ wert: 'tasten1', text: 'Tastatur W A S D' }, { wert: 'tasten2', text: 'Tastatur Pfeile' }, { wert: 'pad0', text: 'Gamepad 1' }, { wert: 'pad1', text: 'Gamepad 2' }, { wert: 'pad2', text: 'Gamepad 3' }, { wert: 'pad3', text: 'Gamepad 4' }];
const FARB_LISTE = FARBEN.map((f, i) => ({ wert: i, text: '<span class="farbfeld" style="background:' + hexCss(f.hex) + '"></span> ' + f.name }));
const FAHRZEUG_LISTE = FAHRZEUGE.map((f, i) => ({ wert: i, text: f.klasse + ' · ' + f.name }));
const EIN_AUS = [{ wert: true, text: 'Ein' }, { wert: false, text: 'Aus' }];
function zahlen(von, bis) { const l = []; for (let i = von; i <= bis; i++) l.push({ wert: i, text: String(i) }); return l; }

const Menue = {
  el: null, offen: null, aktionen: {}, wahlen: {}, beiProfil: null,

  zeige(name, html, aktionen, klasse) {
    this.offen = name; this.aktionen = aktionen || {};
    this.el.innerHTML = '<div class="schirm ' + (klasse || '') + '">' + html + '</div>';
    this.el.querySelectorAll('[data-a]').forEach((b) => {
      b.onclick = (ev) => {
        Ton.start(); Ton.spiele('klick');
        if (b.dataset.a === 'wahl') {
          const w = this.wahlen[b.dataset.w];
          w.i = (w.i + +b.dataset.r + w.liste.length) % w.liste.length;
          $('w-' + b.dataset.w).innerHTML = w.liste[w.i].text;
          w.beiWechsel(w.liste[w.i].wert);
          return;
        }
        const f = this.aktionen[b.dataset.a];
        if (f) f(b, ev);
      };
    });
    Schauraum.schliesse(); clearInterval(this.schauTakt);
    if ($('schau')) { Schauraum.oeffne($('schau')); this.schau(); }
    const erster = this.el.querySelector('.knopf');
    if (erster && !('ontouchstart' in window)) erster.focus();
  },
  schliesse() { this.offen = null; this.aktionen = {}; this.el.innerHTML = ''; Schauraum.schliesse(); clearInterval(this.schauTakt); },

  // Auswahlzeile mit ◀ ▶
  wahlZeile(titel, id, liste, wert, beiWechsel) {
    let i = liste.findIndex((o) => o.wert === wert); if (i < 0) i = 0;
    this.wahlen[id] = { liste, i, beiWechsel };
    return '<div class="zeile"><label>' + titel + '</label><span class="wahl"><button class="pfeil" data-a="wahl" data-w="' + id + '" data-r="-1" aria-label="' + titel + ' zurück">◀</button><b id="w-' + id + '">' + liste[i].text +
      '</b><button class="pfeil" data-a="wahl" data-w="' + id + '" data-r="1" aria-label="' + titel + ' weiter">▶</button></span></div>';
  },
  streckenZeilen() {
    const D = Speicher.daten;
    return this.wahlZeile('Strecke', 'strecke', Object.keys(STRECKEN).map((id) => ({ wert: id, text: STRECKEN[id].name })), D.strecke, (v) => { D.strecke = v; Spiel.starteDemo(v); }) +
      this.wahlZeile('Runden', 'runden', zahlen(1, 7), D.runden, (v) => { D.runden = v; });
  },
  fahrerZeilen(immerWahl) {
    const D = Speicher.daten, neu = () => { if (this.beiProfil) this.beiProfil(); this.schau(); };
    this.schauZufall = D.zufallsAuto && !immerWahl;
    return '<div class="zeile"><label for="f-name">Name</label><input class="feld" id="f-name" maxlength="14" autocomplete="off" value="' + esc(D.name) + '"></div>' +
      '<div class="schau"><canvas id="schau"></canvas><div class="schau-text" id="schau-text"></div></div>' +
      (this.schauZufall ? '' : this.wahlZeile('Auto', 'fahrzeug', FAHRZEUG_LISTE, D.fahrzeug, (v) => { D.fahrzeug = v; neu(); })) +
      this.wahlZeile('Lack', 'farbe', FARB_LISTE, D.farbe, (v) => { D.farbe = v; neu(); });
  },
  // Showroom: gewähltes Auto mit Stärke und Schwäche. Bei Zufalls-Auto wechseln die 8 Autos durch, man wählt nur den Lack.
  schau() {
    const D = Speicher.daten, t = $('schau-text');
    if (!$('schau')) return;
    clearInterval(this.schauTakt);
    const zeig = (i, zufall) => {
      const f = FAHRZEUGE[i]; Schauraum.zeige(f.id, D.farbe);
      if (t) t.innerHTML = zufall ? '<small>Zufalls-Auto</small><b>' + f.name + '?</b><span>Vor jedem Rennen wird dir eines der 8 Autos zugelost. Hier wählst du nur den Lack.</span>'
        : '<small>' + f.klasse + '</small><b>' + f.name + '</b><span class="plus">▲ ' + f.plus + '</span><span class="minus">▼ ' + f.minus + '</span>';
    };
    if (this.schauZufall) { let i = Math.floor(Math.random() * FAHRZEUGE.length); zeig(i, true); this.schauTakt = setInterval(() => { i = (i + 1) % FAHRZEUGE.length; zeig(i, true); }, 2600); }
    else zeig(D.fahrzeug, false);
  },
  nameLesen() { const f = $('f-name'); if (f) Speicher.daten.name = (f.value.trim() || 'Spieler').slice(0, 14); },

  // Bots mit zufälligen Namen und noch freien Farben
  botFahrer(anzahl, stufe, belegt) {
    const liste = [], namen = BOT_NAMEN.slice();
    for (let i = 0; i < anzahl; i++) {
      let farbe = 0; while (belegt.includes(farbe) && farbe < FARBEN.length - 1) farbe++;
      belegt.push(farbe);

  ergebnis(R, konfig) {
    this.wahlen = {};
    const lokal = Spiel.spieler.map((s) => s.kart);
    const reihe = R.reihenfolge.map((i) => R.karts[i]), sieger = reihe[0];
    let zeilen = '';
    reihe.forEach((k, r) => {
      const zeit = r === 0 ? zeitText(k.endZeit) : '+' + Math.max(0, k.endZeit - sieger.endZeit).toFixed(2) + ' s';
      zeilen += '<tr class="' + (lokal.includes(k.idx) ? 'ich' : '') + '"><td class="zahl">' + (r + 1) + '.</td><td><span class="farbfeld" style="background:' + kartFarbe(k) + '"></span> ' + esc(k.name) + '</td><td class="zahl">' + (k.geschaetzt ? 'ca. ' : '') + zeit +
        '</td><td class="zahl">' + (k.rundenZeiten.length ? zeitText(Math.min.apply(null, k.rundenZeiten)) : '–') + '</td><td class="zahl">' + Math.round(k.bpVerdient) + ' / ' + Math.round(k.bpAusgegeben) +
        '</td><td class="zahl">' + k.ueberholt + '</td><td class="zahl">' + k.gebaut + '</td><td class="zahl">' + k.treffer + '</td></tr>';
    });
    const beste = (wert, min) => { let b = null, w = min; for (const k of reihe) { const v = wert(k); if (v > w) { w = v; b = k; } } return b; };
    const bauer = beste((k) => k.trefferErzielt * 2 + k.gebaut, 0.5);
    const jagd = beste((k) => k.schlechtesterRang - k.rang, 1.5);
    const sauber = beste((k) => 100 - (k.treffer + k.resets) * 3 - k.rang * 0.01, 96.5);
    let preise = '';
    if (bauer) preise += '<span class="abzeichen">Bester Bauer: ' + esc(bauer.name) + '</span>';
    if (jagd) preise += '<span class="abzeichen">Grösste Aufholjagd: ' + esc(jagd.name) + ' (von Platz ' + jagd.schlechtesterRang + ' auf ' + jagd.rang + ')</span>';
    if (sauber) preise += '<span class="abzeichen">Saubere Fahrt: ' + esc(sauber.name) + '</span>';
    const titel = lokal.length === 1 ? 'Platz ' + R.karts[lokal[0]].rang + ' von ' + R.n : 'Ergebnis';
    const online = konfig && konfig.modus === 'online';
    this.zeige('ergebnis', '<div class="tafel breit"><h2>' + titel + '</h2><p class="hinweis">' + esc(R.S.def.name) + ' · ' + R.runden + (R.runden === 1 ? ' Runde' : ' Runden') + '</p>' +
      '<div class="karte" style="overflow:auto"><table><tr><th class="zahl">Platz</th><th>Fahrer</th><th class="zahl">Zeit</th><th class="zahl">Beste Runde</th><th class="zahl">BP verdient / ausgegeben</th><th class="zahl">Überholt</th><th class="zahl">Bauwerke</th><th class="zahl">Treffer</th></tr>' + zeilen + '</table></div>' +
      '<div>' + preise + '</div><div class="zeile" style="margin-top:14px">' + (online && !konfig.host ? '' : '<button class="knopf los" data-a="revanche">Revanche</button>') +
      '<button class="knopf" data-a="lobby">Lobby</button><button class="knopf zweit" data-a="menue">Menü</button></div></div>', {
      revanche: () => { if (online) Online.revanche(); else Spiel.starte(konfig); },
      lobby: () => { if (online) { Online.zurLobby(); return; } Spiel.starteDemo(konfig.strecke); if (konfig.modus === 'lokal') this.lokal(); else this.bots(); },
      menue: () => App.zumMenue(),
    }, 'mitte');
  },
};

// ── Simulations-Seite (?sim=200): Bot-Rennen im Zeitraffer, danach die Messwerte ──
const SimSeite = {
  start(n) {
    const el = document.createElement('div'); el.id = 'sim'; document.body.appendChild(el);
    el.innerHTML = '<h2>Balancing-Simulation</h2><p id="sim-text">Starte …</p><div class="balken"><i id="sim-balken"></i></div><div id="sim-aus"></div>';
    const gleich = [], stark = [], nStark = Math.max(10, Math.round(n / 2)), gesamt = n + nStark, t0 = performance.now();
    let nr = 0;
    const weiter = () => {
      const ende = performance.now() + 60;
      while (nr < gesamt && performance.now() < ende) { if (nr < n) gleich.push(simEinzel('gleich', nr)); else stark.push(simEinzel('stark', nr - n)); nr++; }
      $('sim-balken').style.width = (100 * nr) / gesamt + '%';
      $('sim-text').textContent = nr + ' von ' + gesamt + ' Rennen simuliert …';
      if (nr < gesamt) setTimeout(weiter, 0); else this.zeige(gleich, stark, (performance.now() - t0) / 1000);
    };
    setTimeout(weiter, 30);
  },
  zeige(gleich, stark, dauer) {
    const A = simAuswertung(gleich), B = simAuswertung(stark);
    window.SIM_ERGEBNIS = { gleich: A, stark: B };
    const pz = (x) => Math.round(x * 100) + ' %';
    const ok = (b) => '<td class="' + (b ? 'gut">erfüllt' : 'schlecht">verfehlt') + '</td>';
    const starkSiege = (B.siegNachStufe.schwer || 0) / B.rennen;
    let maxVerlust = 0, verlustZeilen = '';
    for (const quelle of [A, B]) for (const art in quelle.verlust) maxVerlust = Math.max(maxVerlust, quelle.verlust[art].p95);
    for (const art in A.verlust) { const v = A.verlust[art]; verlustZeilen += '<tr><td>' + BAUWERKE[BAUWERK_INDEX[art]].name + '</td><td class="zahl">' + v.anzahl + '</td><td class="zahl">' + v.mittel.toFixed(2) + ' s</td><td class="zahl">' + v.p95.toFixed(2) + ' s</td><td class="zahl">' + v.max.toFixed(2) + ' s</td></tr>'; }
    const steh = Math.max(A.maxSteh, B.maxSteh);
    $('sim-text').textContent = gleich.length + ' Rennen mit 8 gleich starken Bots und ' + stark.length + ' Rennen «1 starker gegen 7 mittlere» in ' + dauer.toFixed(1) + ' s. Strecken: ' + Object.keys(STRECKEN).map((id) => STRECKEN[id].name).join(', ') + '.';
    $('sim-aus').innerHTML = '<h3>Ziele</h3><table><tr><th>Ziel</th><th class="zahl">Soll</th><th class="zahl">Gemessen</th><th></th></tr>' +
      '<tr><td>Führender nach Runde 1 gewinnt</td><td class="zahl">35–60 %</td><td class="zahl">' + pz(A.fuehrerGewinnt) + '</td>' + ok(A.fuehrerGewinnt >= 0.35 && A.fuehrerGewinnt <= 0.6) + '</tr>' +
      '<tr><td>Feld kommt innerhalb von 8 s ins Ziel</td><td class="zahl">meistens</td><td class="zahl">' + pz(A.streuungUnter8) + ' (Median ' + A.streuungMedian.toFixed(1) + ' s)</td>' + ok(A.streuungUnter8 >= 0.6) + '</tr>' +
      '<tr><td>Ein starker Bot gewinnt gegen 7 mittlere</td><td class="zahl">≥ 50 %</td><td class="zahl">' + pz(starkSiege) + '</td>' + ok(starkSiege >= 0.5) + '</tr>' +
      '<tr><td>Zeitverlust pro Hindernis (95 % der Treffer)</td><td class="zahl">≤ 2 s</td><td class="zahl">' + maxVerlust.toFixed(2) + ' s</td>' + ok(maxVerlust <= 2) + '</tr>' +
      '<tr><td>Kein Bot steckt länger als 3 s fest</td><td class="zahl">≤ 3 s</td><td class="zahl">' + steh.toFixed(1) + ' s</td>' + ok(steh <= 3) + '</tr></table>' +
      '<h3>Pro Rennen (8 gleich starke Bots)</h3><table><tr><th>Wert</th><th class="zahl">Mittel</th></tr>' +
      '<tr><td>Rundenzeit</td><td class="zahl">' + A.rundenZeit.toFixed(1) + ' s</td></tr><tr><td>Überholmanöver</td><td class="zahl">' + A.ueberholt.toFixed(1) + '</td></tr>' +
      '<tr><td>BP verdient / ausgegeben pro Fahrer</td><td class="zahl">' + A.bpVerdient.toFixed(1) + ' / ' + A.bpAusgegeben.toFixed(1) + '</td></tr>' +
      '<tr><td>Bauwerke</td><td class="zahl">' + A.gebaut.toFixed(1) + '</td></tr><tr><td>Hindernis-Treffer</td><td class="zahl">' + A.treffer.toFixed(1) + '</td></tr>' +
      '<tr><td>Zurücksetzer</td><td class="zahl">' + A.resets.toFixed(2) + '</td></tr></table>' +
      '<h3>Zeitverlust nach Hindernis</h3><table><tr><th>Hindernis</th><th class="zahl">Treffer</th><th class="zahl">Mittel</th><th class="zahl">95 %</th><th class="zahl">Maximum</th></tr>' + verlustZeilen + '</table>' +
      '<h3>Siege nach Startplatz (gleich starke Bots)</h3><p>' + Object.keys(A.siegNachStart).sort((a, b) => a - b).map((p) => 'Platz ' + p + ': ' + A.siegNachStart[p]).join(' · ') + '</p>' +
      '<p class="hinweis">Alle Werte lassen sich oben im Code im Objekt CONFIG einstellen. <a href="?" style="color:var(--gelb)">Zum Spiel</a></p>';
  },
};

// ── Programmstart ─────────────────────────────────────────────────────────
// Die 3D-Bibliothek kommt von einem CDN (feste Version). Fällt eines aus, wird das nächste versucht.
const THREE_QUELLEN = ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js', 'https://unpkg.com/three@0.160.0/build/three.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js'];
function ladeSkript(quellen, fertig, fehler) {
  let i = 0;
  const naechste = () => {
    if (i >= quellen.length) { fehler(); return; }
    const s = document.createElement('script');
    s.src = quellen[i++]; s.onload = fertig; s.onerror = () => { s.remove(); naechste(); };
    document.head.appendChild(s);
  };
  naechste();
}

const App = {
  letzte: 0, fps: 0, fpsBilder: 0, fpsZeit: 0, debug: false, parameter: new URLSearchParams(location.search), toastTakt: null,

  imRennen() { return !!Spiel.R && !Spiel.demo && !Spiel.pause && Menue.offen == null; },

  taste(ev) {
    Ton.start();
    if (ev.repeat) return;
    if (ev.code === 'Escape' || (ev.code === 'KeyP' && !Spiel.demo)) {
      if (!Spiel.demo && !Spiel.ergebnisGezeigt) this.pauseUmschalten();
      else if (Menue.offen && Menue.aktionen.zurueck) Menue.aktionen.zurueck();
    } else if (ev.code === 'KeyM') {
      Speicher.daten.stumm = !Speicher.daten.stumm; this.tonSetzen(); Speicher.sichern();
      this.toast(Speicher.daten.stumm ? 'Ton aus' : 'Ton an', 900);
    }
  },

  pauseUmschalten() {
    if (Spiel.demo || Spiel.ergebnisGezeigt || !Spiel.R) return;
    const online = !!Spiel.netz;
    if (Menue.offen) { if (Menue.offen === 'pause') { Menue.schliesse(); Spiel.pause = false; } return; }
    if (!online) Spiel.pause = true;                  // online läuft das Rennen weiter
    Menue.pause(online);
  },

  zumMenue() {
    if (typeof Online !== 'undefined') Online.verlassen();
    Spiel.starteDemo(); Menue.haupt();
  },

  tonSetzen() {
    const D = Speicher.daten;
    Ton.stumm = D.stumm; Ton.laut = D.lautstaerke; Ton.musikLaut = D.musik; Ton.setze();
  },

  toast(text, ms) {
    let t = $('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); t.onclick = () => t.classList.add('versteckt'); }
    t.textContent = text; t.classList.remove('versteckt');
    clearTimeout(this.toastTakt);
    this.toastTakt = setTimeout(() => t.classList.add('versteckt'), ms || 4500);
  },

  start() {
    Speicher.laden();
    Menue.el = $('schicht');
    const sim = this.parameter.get('sim');
    if (sim != null) { SimSeite.start(Math.max(1, parseInt(sim, 10) || 200)); return; }
    this.debug = this.parameter.get('debug') === '1';
    Eingabe.start();
    window.addEventListener('pointerdown', () => Ton.start());
    window.addEventListener('resize', () => Hud.groesse());
    const pk = document.createElement('button');
    pk.id = 'pauseknopf'; pk.className = 'knopf klein zweit versteckt'; pk.textContent = 'II'; pk.tabIndex = -1; pk.title = 'Pause (Esc)';
    pk.onclick = () => { pk.blur(); this.pauseUmschalten(); };
    document.body.appendChild(pk);
    if (this.debug) { const d = document.createElement('div'); d.id = 'debug'; document.body.appendChild(d); }
    Menue.laden();
    ladeSkript(THREE_QUELLEN, () => this.bereit(), () => Menue.fehler('Die 3D-Bibliothek (three.js) konnte nicht geladen werden. Für den ersten Start braucht das Spiel eine Internetverbindung. Prüfe die Verbindung und lade die Seite neu.'));
  },

  bereit() {
    try { Grafik.qualitaet = Speicher.daten.grafik; Grafik.init($('bild')); }
    catch (e) { Menue.fehler('Dein Browser kann hier keine 3D-Grafik (WebGL) anzeigen. Versuche es mit einem aktuellen Chrome, Firefox, Edge oder Safari.'); return; }
    this.tonSetzen(); Ton.musikGewollt = true;
    Spiel.starteDemo(Speicher.daten.strecke);
    const raum = this.parameter.get('raum');
    if (raum && typeof Online !== 'undefined') Online.beitretenDialog(raum); else Menue.haupt();
    requestAnimationFrame((t) => { this.letzte = t; this.bild(t); });
  },

  bild(t) {
    requestAnimationFrame((x) => this.bild(x));
    const dt = Math.min(0.1, Math.max(0, (t - this.letzte) / 1000));
    this.letzte = t;
    Spiel.bild(dt);
    Grafik.zeichne(Spiel.R);
    this.fpsBilder++; this.fpsZeit += dt;
    if (this.fpsZeit >= 0.5) { this.fps = this.fpsBilder / this.fpsZeit; this.fpsBilder = 0; this.fpsZeit = 0; if (this.debug) this.debugText(); }
  },

  // ?debug=1: Bildrate, Zustand des ersten lokalen Fahrzeugs, Netzwerk
  debugText() {
    const R = Spiel.R, k = R && R.karts[Spiel.spieler.length ? Spiel.spieler[0].kart : R.reihenfolge[0]];
    let s = 'FPS ' + this.fps.toFixed(0) + ' · Grafik ' + Grafik.qualitaet + ' · Dreiecke ' + Grafik.renderer.info.render.triangles;
    if (k) s += '\nZeit ' + R.zeit.toFixed(1) + ' · ' + R.phase + ' · Bauwerke ' + R.bauwerke.length +
      '\n' + k.name + ': s ' + k.sHaupt.toFixed(0) + ' d ' + k.d.toFixed(1) + ' v ' + k.v.toFixed(1) + ' Pfad ' + k.pfad + ' Rang ' + k.rang + ' BP ' + k.bp.toFixed(1) + (k.aufStrasse ? '' : ' (neben der Strasse)');
    if (Spiel.netz) s += '\n' + Spiel.netz.debugText();
    $('debug').textContent = s;
  },
  // ?debug=1: Ideallinie der Bots in die Welt zeichnen (die Bauplätze haben ohnehin Schilder)
  debugWelt(S) {
    if (Grafik.debugLinie && Grafik.debugLinie.parent) Grafik.debugLinie.parent.remove(Grafik.debugLinie);
    const H = S.haupt, o = {}, pkt = [];
    for (let i = 0; i <= H.n; i++) { H.ort((i % H.n) * H.ds, S.ideal[i % H.n], o); pkt.push(new THREE.Vector3(o.x, o.y + 0.35, -o.z)); }
    Grafik.debugLinie = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pkt), new THREE.LineBasicMaterial({ color: 0xff00ff }));
    Grafik.welt.add(Grafik.debugLinie);
  },
};
App.start();
</script>
