/* ══════════════════════════════════════════════════════════════════════════
   TEIL 4: Strecken-Aufbau
   Aus den Kontrollpunkten wird eine dicht abgetastete Kurve («Pfad»).
   Jede Position auf der Strecke lässt sich dann als (s, d) angeben:
     s = Meter entlang der Mittellinie, d = Meter seitlich (links positiv).
   ══════════════════════════════════════════════════════════════════════════ */

// Catmull-Rom-Kurve (zentripetal): Punkt zwischen p1 und p2 bei u ∈ [0, 1].
// Punkte sind Arrays [x, z, y, breite]; das Ergebnis landet in «aus».
function kurvenPunkt(p0, p1, p2, p3, u, aus) {
  const t0 = 0;
  const t1 = t0 + Math.max(1e-3, Math.sqrt(hyp(p1[0] - p0[0], p1[1] - p0[1])));
  const t2 = t1 + Math.max(1e-3, Math.sqrt(hyp(p2[0] - p1[0], p2[1] - p1[1])));
  const t3 = t2 + Math.max(1e-3, Math.sqrt(hyp(p3[0] - p2[0], p3[1] - p2[1])));
  const t = t1 + (t2 - t1) * u;
  for (let c = 0; c < 4; c++) {
    const a1 = ((t1 - t) * p0[c] + (t - t0) * p1[c]) / (t1 - t0);
    const a2 = ((t2 - t) * p1[c] + (t - t1) * p2[c]) / (t2 - t1);
    const a3 = ((t3 - t) * p2[c] + (t - t2) * p3[c]) / (t3 - t2);
    const b1 = ((t2 - t) * a1 + (t - t0) * a2) / (t2 - t0);
    const b2 = ((t3 - t) * a2 + (t - t1) * a3) / (t3 - t1);
    aus[c] = ((t2 - t) * b1 + (t - t1) * b2) / (t2 - t1);
  }
}

class Pfad {
  // punkte: [[x, z, y, breite], …]   geschlossen: Rundkurs?   abstand: Abstand der Abtastpunkte in m
  constructor(punkte, geschlossen, abstand) {
    this.geschlossen = geschlossen;
    const m = punkte.length;
    const hole = (i) => {
      if (geschlossen) return punkte[((i % m) + m) % m];
      if (i < 0) return punkte[0].map((v, c) => 2 * v - punkte[1][c]);          // gespiegelter Hilfspunkt
      if (i >= m) return punkte[m - 1].map((v, c) => 2 * v - punkte[m - 2][c]);
      return punkte[i];
    };
    // 1. Kurve dicht abtasten
    const roh = [];
    const U = 24;
    const segmente = geschlossen ? m : m - 1;
    const tmp = [0, 0, 0, 0];
    for (let i = 0; i < segmente; i++) {
      for (let j = 0; j < U; j++) {
        kurvenPunkt(hole(i - 1), hole(i), hole(i + 1), hole(i + 2), j / U, tmp);
        roh.push(tmp.slice());
      }
    }
    roh.push(geschlossen ? roh[0].slice() : punkte[m - 1].slice());
    const kum = [0];
    for (let i = 1; i < roh.length; i++) kum.push(kum[i - 1] + hyp(roh[i][0] - roh[i - 1][0], roh[i][1] - roh[i - 1][1]));
    const L = kum[kum.length - 1];
    // 2. In gleichmässigen Abständen neu abtasten
    const n = geschlossen ? Math.max(8, Math.round(L / abstand)) : Math.max(2, Math.round(L / abstand) + 1);
    const ds = geschlossen ? L / n : L / (n - 1);
    this.n = n; this.ds = ds; this.laenge = L;
    this.x = new Float64Array(n); this.z = new Float64Array(n); this.y = new Float64Array(n);
    this.hb = new Float64Array(n);                    // halbe Fahrbahnbreite
    this.tx = new Float64Array(n); this.tz = new Float64Array(n);   // Fahrtrichtung
    this.nx = new Float64Array(n); this.nz = new Float64Array(n);   // Normale nach links
    this.kr = new Float64Array(n);                    // Krümmung (links positiv) in 1/m
    this.steig = new Float64Array(n);                 // Steigung (Höhenmeter pro Meter)
    let j = 0;
    for (let i = 0; i < n; i++) {
      const s = Math.min(i * ds, L);
      while (j < roh.length - 2 && kum[j + 1] < s) j++;
      const u = clamp((s - kum[j]) / Math.max(1e-9, kum[j + 1] - kum[j]), 0, 1);
      this.x[i] = lerp(roh[j][0], roh[j + 1][0], u);
      this.z[i] = lerp(roh[j][1], roh[j + 1][1], u);
      this.y[i] = lerp(roh[j][2], roh[j + 1][2], u);
      this.hb[i] = lerp(roh[j][3], roh[j + 1][3], u) / 2;
    }
    this.berechneRichtungen();
    this._p = { i: 0, t: 0, s: 0, d: 0, vorAnfang: false, nachEnde: false };
  }

  berechneRichtungen() {
    const n = this.n;
    for (let i = 0; i < n; i++) {
      const a = this.idx(i - 1), b = this.idx(i + 1);
      let dx = this.x[b] - this.x[a], dz = this.z[b] - this.z[a];
      const l = hyp(dx, dz) || 1;
      dx /= l; dz /= l;
      this.tx[i] = dx; this.tz[i] = dz;
      this.nx[i] = -dz; this.nz[i] = dx;
      this.steig[i] = (this.y[b] - this.y[a]) / l;
    }
    const roh = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const a = this.idx(i - 1), b = this.idx(i + 1);
      const w = winkelDiff(Math.atan2(this.tz[b], this.tx[b]), Math.atan2(this.tz[a], this.tx[a]));
      roh[i] = w / (2 * this.ds);
    }
    for (let i = 0; i < n; i++) this.kr[i] = (roh[this.idx(i - 1)] + 2 * roh[i] + roh[this.idx(i + 1)]) / 4;
  }

  // Index in den gültigen Bereich bringen (Rundkurs: umlaufend, offener Weg: begrenzen)
  idx(i) {
    const n = this.n;
    if (this.geschlossen) return ((i % n) + n) % n;
    return i < 0 ? 0 : i >= n ? n - 1 : i;
  }

  // Wert eines Arrays an der Stelle s (zwischen den Abtastpunkten linear interpoliert)
  bei(arr, s) {
    const f = s / this.ds;
    const i = Math.floor(f);
    const t = f - i;
    const a = this.idx(i), b = this.idx(i + 1);
    return arr[a] + (arr[b] - arr[a]) * t;
  }

  // Weltposition zu (s, d); schreibt aus.x, aus.z, aus.y
  ort(s, d, aus) {
    const f = s / this.ds;
    const i = Math.floor(f);
    const t = f - i;
    const a = this.idx(i), b = this.idx(i + 1);
    const nx = lerp(this.nx[a], this.nx[b], t), nz = lerp(this.nz[a], this.nz[b], t);
    aus.x = lerp(this.x[a], this.x[b], t) + nx * d;
    aus.z = lerp(this.z[a], this.z[b], t) + nz * d;
    aus.y = lerp(this.y[a], this.y[b], t);
    return aus;
  }

  // Nächsten Punkt auf dem Pfad suchen. «hinweis» ist der zuletzt bekannte Index
  // (−1 = überall suchen), «fenster» die Suchweite in Abtastpunkten.
  // Ergebnis in this._p: i, t (Anteil bis zum nächsten Punkt), s, d (seitlich, links positiv).
  projiziere(x, z, hinweis, fenster) {
    const n = this.n, X = this.x, Z = this.z;
    let von, bis;
    if (hinweis < 0) { von = 0; bis = this.geschlossen ? n - 1 : n - 2; }
    else if (this.geschlossen) { von = hinweis - fenster; bis = hinweis + fenster; }
    else { von = Math.max(0, hinweis - fenster); bis = Math.min(n - 2, hinweis + fenster); }
    let bestD2 = Infinity, bi = 0, bt = 0, bRoh = 0;
    for (let q = von; q <= bis; q++) {
      const i = this.geschlossen ? ((q % n) + n) % n : q;
      const i2 = this.geschlossen ? (i + 1) % n : i + 1;
      const ax = X[i], az = Z[i];
      const bx = X[i2] - ax, bz = Z[i2] - az;
      const roh = ((x - ax) * bx + (z - az) * bz) / (bx * bx + bz * bz);
      const t = roh < 0 ? 0 : roh > 1 ? 1 : roh;
      const dx = x - (ax + bx * t), dz = z - (az + bz * t);
      const d2 = dx * dx + dz * dz;
      if (d2 < bestD2) { bestD2 = d2; bi = i; bt = t; bRoh = roh; }
    }
    const p = this._p;
    const i2 = this.geschlossen ? (bi + 1) % n : Math.min(bi + 1, n - 1);
    const sx = X[i2] - X[bi], sz = Z[i2] - Z[bi];
    const px = X[bi] + sx * bt, pz = Z[bi] + sz * bt;
    // Vorzeichen: links der Fahrtrichtung positiv
    const kreuz = sx * (z - pz) - sz * (x - px);
    p.i = bi; p.t = bt;
    p.s = (bi + bt) * this.ds;
    p.d = (kreuz >= 0 ? 1 : -1) * Math.sqrt(bestD2);
    p.vorAnfang = !this.geschlossen && bi === 0 && bRoh < 0;
    p.nachEnde = !this.geschlossen && bi === n - 2 && bRoh > 1;
    return p;
  }
}

class Strecke {
  constructor(def, id) {
    this.def = def;
    this.id = id;
    this.name = def.name;
    const B = def.breite;
    this.haupt = new Pfad(def.punkte.map((p) => [p[0], p[1], p[2] || 0, p[3] || B]), true, 2);
    const H = this.haupt;
    this.laenge = H.laenge;
    const n = H.n;

    // Seitenstreifen (Kies/Wiese) links und rechts; 0 = Wand direkt am Fahrbahnrand
    this.randL = new Float64Array(n).fill(def.rand);
    this.randR = new Float64Array(n).fill(def.rand);
    // offene Ränder ohne Wand (man kann hinunterfallen): 1 = offen
    this.offenL = new Uint8Array(n);
    this.offenR = new Uint8Array(n);
    // Brücken: schmaler Rand mit Geländer
    this.bruecke = new Uint8Array(n);
    for (const b of def.bruecken || []) this.fuerBereich(b.von, b.bis, (i) => { this.bruecke[i] = 1; this.randL[i] = this.randR[i] = 0.5; });
    for (const o of def.offen || []) this.fuerBereich(o.von, o.bis, (i) => {
      if (o.seite >= 0) { this.offenL[i] = 1; this.randL[i] = Math.min(this.randL[i], o.rand != null ? o.rand : 1.5); }
      if (o.seite <= 0) { this.offenR[i] = 1; this.randR[i] = Math.min(this.randR[i], o.rand != null ? o.rand : 1.5); }
    });
    for (const r of def.raender || []) this.fuerBereich(r.von, r.bis, (i) => {
      if (r.seite >= 0) this.randL[i] = r.rand;
      if (r.seite <= 0) this.randR[i] = r.rand;
    });

    // feste Sprungschanzen der Strecke
    this.schanzen = (def.schanzen || []).map((sch) => {
      const p = H.projiziere(sch.pos[0], sch.pos[1], -1, 0);
      return { s: p.s, laenge: sch.laenge, hoehe: sch.hoehe };
    });

    // Nebenwege: Abkürzungen und Umleitungen
    this.wege = (def.wege || []).map((w, i) => this.baueWeg(w, i));

    this.berechneIdeallinie();

    // Bau-Slots
    this.slots = [];
    for (const sd of def.slots || []) this.slots.push(this.baueSlot(sd, this.slots.length));

    // Startplätze hinter der Startlinie (s = 0)
    const R = CONFIG.rennen;
    this.startplaetze = [];
    for (let j = 0; j < 24; j++) {
      const s = this.laenge - (7 + j * R.startAbstand);
      this.startplaetze.push({ s, d: (j % 2 === 0 ? 1 : -1) * R.startSeite });
    }

    // Grenzen (für Minikarte und Gelände)
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    const erweitere = (P) => { for (let i = 0; i < P.n; i++) { x0 = Math.min(x0, P.x[i]); x1 = Math.max(x1, P.x[i]); z0 = Math.min(z0, P.z[i]); z1 = Math.max(z1, P.z[i]); } };
    erweitere(H);
    for (const w of this.wege) erweitere(w.pfad);
    this.grenzen = { x0, x1, z0, z1 };
  }

  // führt fn(i) für alle Abtastpunkte zwischen zwei Weltpunkten aus (in Fahrtrichtung)
  fuerBereich(von, bis, fn) {
    const H = this.haupt;
    const a = H.projiziere(von[0], von[1], -1, 0).i;
    const b = H.projiziere(bis[0], bis[1], -1, 0).i;
    for (let i = a; ; i = (i + 1) % H.n) { fn(i); if (i === b) break; }
  }

  baueWeg(w, idx) {
    const H = this.haupt;
    const roh = w.punkte;
    const pa = H.projiziere(roh[0][0], roh[0][1], -1, 0);
    const von = pa.s, iVon = pa.i, yVon = H.bei(H.y, pa.s);
    const pe = H.projiziere(roh[roh.length - 1][0], roh[roh.length - 1][1], -1, 0);
    const bis = pe.s, iBis = pe.i, yBis = H.bei(H.y, pe.s);
    // Höhen: wo keine angegeben ist, gleichmässig zwischen Anfang und Ende
    const sehne = [0];
    for (let i = 1; i < roh.length; i++) sehne.push(sehne[i - 1] + hyp(roh[i][0] - roh[i - 1][0], roh[i][1] - roh[i - 1][1]));
    const pts = roh.map((p, i) => [p[0], p[1], p[2] != null ? p[2] : lerp(yVon, yBis, sehne[i] / sehne[sehne.length - 1]), p[3] || w.breite]);
    pts[0][2] = yVon; pts[pts.length - 1][2] = yBis;
    const pfad = new Pfad(pts, false, 2);
    const spanne = wegVor(von, bis, this.laenge);
    const weg = {
      idx, id: w.id, art: w.art, name: w.name || '', pfad, von, bis, iVon, iBis, spanne,
      laenge: pfad.laenge, rand: w.rand != null ? w.rand : 1.0, belag: w.belag || 'kies',
      ersparnis: spanne - pfad.laenge,
      hinweisVon: 0, hinweisBis: 0, seite: 1, nase: null, sperre: null,
    };
    // Auf welcher Seite der Hauptstrecke zweigt der Weg ab?
    const mitte = Math.min(pfad.n - 1, Math.round(20 / pfad.ds));
    const pm = H.projiziere(pfad.x[mitte], pfad.z[mitte], iVon, 30);
    weg.seite = pm.d >= 0 ? 1 : -1;
    // «Nase»: der Punkt, an dem sich Haupt- und Nebenweg vollständig getrennt haben
    for (let j = 1; j < pfad.n; j++) {
      const ex = pfad.x[j] - weg.seite * pfad.nx[j] * (pfad.hb[j] + weg.rand);
      const ez = pfad.z[j] - weg.seite * pfad.nz[j] * (pfad.hb[j] + weg.rand);
      const p = H.projiziere(ex, ez, iVon, 60);
      const rand = weg.seite > 0 ? this.randL[p.i] : this.randR[p.i];
      if (Math.abs(p.d) > H.hb[p.i] + rand + 0.2) { weg.nase = { x: ex, z: ez, s: p.s, j }; break; }
    }
    if (!weg.nase) weg.nase = { x: pfad.x[pfad.n >> 1], z: pfad.z[pfad.n >> 1], s: von + 30, j: pfad.n >> 1 };
    // Umleitung: schräge Leitwand, die den kurzen (Haupt-)Weg sperrt und auf den Nebenweg lenkt
    if (w.art === 'umleitung') {
      const sA = (weg.nase.s - CONFIG.wirkung.umleitungLaenge + this.laenge) % this.laenge;
      const iA = Math.floor(sA / H.ds) % H.n;
      const randA = weg.seite > 0 ? this.randR[iA] : this.randL[iA];
      const dA = -weg.seite * (H.hb[iA] + randA);
      weg.sperre = { ax: H.x[iA] + H.nx[iA] * dA, az: H.z[iA] + H.nz[iA] * dA, bx: weg.nase.x, bz: weg.nase.z, sA, sB: weg.nase.s };
    }
    return weg;
  }

  // Ideallinie: seitlicher Versatz pro Abtastpunkt, per «Gummiband» geglättet (kürzester, runder Weg)
  berechneIdeallinie() {
    const H = this.haupt, n = H.n;
    const o = new Float64Array(n);
    const sicherheit = 1.7;      // Abstand zum Fahrbahnrand
    for (const K of [14, 9, 6, 4, 2]) {
      for (let iter = 0; iter < 160; iter++) {
        for (let i = 0; i < n; i++) {
          const a = (i - K + n) % n, b = (i + K) % n;
          const mx = (H.x[a] + H.nx[a] * o[a] + H.x[b] + H.nx[b] * o[b]) / 2;
          const mz = (H.z[a] + H.nz[a] * o[a] + H.z[b] + H.nz[b] * o[b]) / 2;
          const lim = H.hb[i] - sicherheit;
          const ziel = clamp((mx - H.x[i]) * H.nx[i] + (mz - H.z[i]) * H.nz[i], -lim, lim);
          o[i] += (ziel - o[i]) * 0.5;
        }
      }
    }
    this.ideal = o;
    // Krümmung der Ideallinie
    const kr = new Float64Array(n);
    const M = 3;
    for (let i = 0; i < n; i++) {
      const a = (i - M + n) % n, c = (i + M) % n;
      const ax = H.x[a] + H.nx[a] * o[a], az = H.z[a] + H.nz[a] * o[a];
      const bx = H.x[i] + H.nx[i] * o[i], bz = H.z[i] + H.nz[i] * o[i];
      const cx = H.x[c] + H.nx[c] * o[c], cz = H.z[c] + H.nz[c] * o[c];
      const kreuz = (bx - ax) * (cz - bz) - (bz - az) * (cx - bx);
      const l = hyp(bx - ax, bz - az) * hyp(cx - bx, cz - bz) * hyp(cx - ax, cz - az);
      kr[i] = l > 1e-9 ? (2 * kreuz) / l : 0;
    }
    this.idealKr = new Float64Array(n);
    for (let i = 0; i < n; i++) this.idealKr[i] = (kr[(i - 1 + n) % n] + 2 * kr[i] + kr[(i + 1) % n]) / 4;
  }

  baueSlot(sd, idx) {
    const H = this.haupt;
    const slot = { idx, id: sd.id, art: sd.art, s: 0, i: 0, seite: 1, weg: -1, bahn: 0, x: 0, z: 0, y: 0 };
    if (sd.art === 'abkuerzung' || sd.art === 'umleitung') {
      const weg = this.wege.find((w) => w.id === sd.weg);
      if (!weg) throw new Error('Slot ' + sd.id + ': Weg ' + sd.weg + ' fehlt');
      slot.weg = weg.idx;
      slot.s = sd.art === 'umleitung' ? weg.sperre.sA : weg.von;
      slot.seite = weg.seite;
    } else {
      const p = H.projiziere(sd.pos[0], sd.pos[1], -1, 0);
      slot.s = p.s;
    }
    slot.i = Math.floor(slot.s / H.ds) % H.n;
    const id = this.ideal[slot.i];
    if (sd.art === 'hindernis') slot.seite = sd.seite != null ? sd.seite : (Math.abs(id) > 1 ? Math.sign(id) : (idx % 2 ? 1 : -1));
    if (sd.art === 'rampe') slot.bahn = sd.bahn != null ? sd.bahn : clamp(id, -(H.hb[slot.i] - 3.2), H.hb[slot.i] - 3.2);
    const o = H.ort(slot.s, slot.bahn, {});
    slot.x = o.x; slot.z = o.z; slot.y = o.y;
    slot.hb = H.hb[slot.i];
    return slot;
  }

  // Ist die Hauptstrecken-Position s im Bereich [von, bis] (in Fahrtrichtung, umlaufend)?
  imBereich(s, von, bis) {
    return wegVor(von, s, this.laenge) <= wegVor(von, bis, this.laenge);
  }
}

// alle Strecken einmal aufbauen und merken
const STRECKEN_CACHE = {};
function holeStrecke(id) {
  if (!STRECKEN_CACHE[id]) STRECKEN_CACHE[id] = new Strecke(STRECKEN[id], id);
  return STRECKEN_CACHE[id];
}
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 5: Rennen – Physik, Regeln, Baupunkte und Bauen
   Ein «Rennen» kennt keine Grafik. Es wird in festen Schritten von 1/60 s
   weitergerechnet (step) und meldet Ereignisse (für Ton, Effekte, Netzwerk).
   Fahrer-Typen:  'mensch' und 'bot' werden hier gerechnet,
                  'fern' sind Fahrzeuge anderer Spieler im Online-Modus.
   ══════════════════════════════════════════════════════════════════════════ */
const SCHRITT = 1 / 60;
const LEERE_EINGABE = { lenk: 0, gas: 0, bremse: 0, drift: false, wahl: 0, bauWechsel: 0, slotWechsel: 0, bauen: false, reset: false };

class Rennen {
  // fahrer: [{ name, fahrzeug, farbe, typ: 'mensch'|'bot'|'fern', stufe }] in Startreihenfolge
  constructor(strecke, fahrer, opt) {
    opt = opt || {};
    this.S = strecke;
    this.L = strecke.laenge;
    this.runden = opt.runden || CONFIG.rennen.runden;
    this.schiri = opt.schiri !== false;          // false = Mitspieler im Online-Modus (der Host entscheidet)
    this.bauenAn = opt.bauen !== false;
    this.meldungenAn = opt.meldungen !== false;
    this.zufall = zufallsGenerator(opt.seed != null ? opt.seed : (Math.random() * 1e9) | 0);
    this.zeit = -CONFIG.rennen.countdown;
    this.phase = 'countdown';                    // 'countdown' → 'rennen' → 'ende'
    this.ereignisse = [];
    this.bauwerke = [];
    this.naechsteBauId = 1;
    this.siegerZeit = null;
    this.fertig = false;
    this.trefferLog = [];                        // für die Simulation: jeder Hindernis-Treffer
    this.netz = null;                            // Online: Rückrufe { bauWunsch, treffer, benutzt }
    const n = fahrer.length;
    this.n = n;
    this.karts = fahrer.map((f, i) => this.neuesKart(f, i, f.platz != null ? f.platz : i));
    this.vorne = new Int8Array(n * n);           // vorne[a*n+b] = 1: a liegt vor b
    this.ueberholZeit = new Float64Array(n * n).fill(-99);
    for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) this.vorne[a * n + b] = this.karts[a].strecke > this.karts[b].strecke ? 1 : 0;
    this.reihenfolge = this.karts.map((k) => k.idx);
    this.ordne();
    for (const k of this.karts) if (k.typ === 'bot') k.bot = new Bot(this, k, k.stufe || 'mittel');
  }

  neuesKart(f, idx, platz) {
    const H = this.S.haupt, sp = this.S.startplaetze[platz];
    const o = H.ort(sp.s, sp.d, {});
    const i = Math.floor(sp.s / H.ds) % H.n;
    const w = Math.atan2(H.tz[i], H.tx[i]);
    return {
      idx, name: f.name || 'Fahrer ' + (idx + 1), fahrzeug: f.fahrzeug || 'bagger', farbe: f.farbe || 0, typ: f.typ || 'bot', stufe: f.stufe || 'mittel',
      bot: null,
      // Bewegung
      x: o.x, z: o.z, y: o.y, vy: 0, luft: false, luftZeit: 0,
      richtung: w, blick: w, v: 0, lenk: 0, schubX: 0, schubZ: 0,
      px: o.x, pz: o.z, py: o.y, pblick: w,     // Zustand vor dem letzten Schritt (für weiche Darstellung)
      drift: 0, driftZeit: 0, driftStufe: 0, driftGesperrt: false, hop: 0,
      boostZeit: 0, boostStaerke: 1, windZeit: 0, windAktiv: false,
      schutzZeit: 0, lahmZeit: 0, schlamm: 0, geistZeit: 0, wandZeit: 0,
      // Position auf der Strecke
      pfad: 0, mi: i, wi: 0, wegHinweis: this.S.wege.map(() => -1),
      s: sp.s, d: sp.d, sHaupt: sp.s, strecke: sp.s - this.L,
      aufStrasse: true, bodenY: o.y, streckenY: o.y, steigung: 0, absturz: false, rampeBereit: 0,
      runde: 0, rundeStart: 0, rundenZeiten: [], zielZeit: null, rang: platz + 1, startRang: platz + 1, schlechtesterRang: platz + 1,
      falschZeit: 0, stehZeit: 0, resetSperre: 0, sicher: { pfad: 0, s: sp.s }, resets: 0, maxStehZeit: 0,
      // Baupunkte und Bauen
      bp: CONFIG.bp.start, bpVerdient: 0, bpAusgegeben: 0, ueberholt: 0, treffer: 0, trefferErzielt: 0, gebaut: 0,
      trefferZeit: -99, vordermann: -1, bestAbstand: Infinity, bauWahl: 0, slotWahl: 0, bauSperre: 0,
      eingabe: LEERE_EINGABE,
    };
  }

  melde(typ, k, a, b) {
    if (this.meldungenAn) this.ereignisse.push({ typ, k, a, b, zeit: this.zeit });
  }

  // ── ein Zeitschritt ─────────────────────────────────────────────────────
  step(dt, eingaben) {
    this.zeit += dt;
    if (this.phase === 'countdown' && this.zeit >= 0) { this.phase = 'rennen'; this.melde('los', -1); }
    const frei = this.phase !== 'countdown';
    for (const k of this.karts) {
      k.px = k.x; k.pz = k.z; k.py = k.y; k.pblick = k.blick;
      if (k.typ === 'fern') continue;
      let e = (eingaben && eingaben[k.idx]) || LEERE_EINGABE;
      if (k.bot && (k.typ === 'bot' || k.zielZeit != null)) e = k.bot.steuere(this, k, dt);
      k.eingabe = e;
      if (frei) {
        if (e.wahl) { if (k.bauWahl === e.wahl - 1 && k.typ === 'mensch') this.bauen(k, BAUWERKE[k.bauWahl].art, this.zielSlot(k)); else { k.bauWahl = e.wahl - 1; k.slotWahl = 0; } }
        if (e.bauWechsel) { k.bauWahl = (k.bauWahl + e.bauWechsel + BAUWERKE.length) % BAUWERKE.length; k.slotWahl = 0; }
        if (e.slotWechsel) k.slotWahl++;
        if (e.bauen) this.bauen(k, BAUWERKE[k.bauWahl].art, this.zielSlot(k));
        if (e.bauArt) { this.bauen(k, e.bauArt, e.bauSlot); e.bauArt = null; }
        if (e.reset && k.resetSperre <= 0 && k.zielZeit == null) this.zuruecksetzen(k);
      }
      this.fahre(k, frei ? e : LEERE_EINGABE, dt);
    }
    for (const k of this.karts) this.orte(k, dt, k.typ === 'fern');
    this.kollisionen();
    for (const k of this.karts) if (k.typ !== 'fern') this.bauwerkWirkung(k, dt);
    for (const k of this.karts) {
      if (k.bauSperre > 0) k.bauSperre -= dt;
      if (k.typ !== 'fern') this.ueberwache(k, dt);
    }
    if (this.netz && this.netz.nachOrten) this.netz.nachOrten(this);     // Online-Host: gemeldete Streckenmeter der Mitspieler übernehmen
    if (this.schiri) this.regeln(dt);
  }

  // ── Fahrphysik eines Fahrzeugs ──────────────────────────────────────────
  fahre(k, e, dt) {
    const F = CONFIG.fahren, D = CONFIG.drift, W = CONFIG.windschatten;
    if (k.boostZeit > 0) k.boostZeit -= dt;
    if (k.schutzZeit > 0) k.schutzZeit -= dt;
    if (k.lahmZeit > 0) k.lahmZeit -= dt;
    if (k.geistZeit > 0) k.geistZeit -= dt;
    if (k.resetSperre > 0) k.resetSperre -= dt;
    if (k.hop > 0) k.hop -= dt;
    if (k.wandZeit > 0) k.wandZeit -= dt;

    // Die Lenkung folgt der Eingabe mit kleiner Verzögerung (fühlt sich direkt, aber nicht zappelig an)
    const lenkZiel = clamp(e.lenk, -1, 1);
    const lenkTempo = F.lenkAnsprechen * dt;
    k.lenk += clamp(lenkZiel - k.lenk, -lenkTempo, lenkTempo);

    const boost = k.boostZeit > 0;
    const amBoden = !k.luft;

    // erlaubtes Höchsttempo je nach Untergrund und Zustand
    let vmax = F.vmax;
    if (boost) vmax *= k.boostStaerke;
    if (k.windAktiv) vmax *= 1 + W.bonus;
    if (!k.aufStrasse) vmax *= boost ? CONFIG.boost.offroadFaktor : F.offroadFaktor;
    if (k.schlamm) vmax *= CONFIG.wirkung.schlamm.tempoFaktor;
    if (k.lahmZeit > 0) vmax *= CONFIG.wirkung.absperrung.lahmFaktor;
    if (!k.drift) vmax *= 1 - F.kurvenVerlust * Math.abs(k.lenk) * clamp(k.v / F.vmax, 0, 1);
    if (k.zielZeit != null) vmax *= 0.6;       // nach dem Ziel ausrollen

    if (amBoden) {
      const gas = clamp(e.gas, 0, 1), bremse = clamp(e.bremse, 0, 1);
      if (gas > 0 && k.v < vmax) {
        const a = F.beschleunigung * (boost ? CONFIG.boost.beschleunigung : 1) * gas * Math.max(0.07, 1 - k.v / vmax);
        k.v = Math.min(vmax, k.v + a * dt);
      }
      if (k.v > vmax) {
        const rate = k.aufStrasse && !k.schlamm ? F.tempoAbbau : F.offroadBremse;
        k.v = Math.max(vmax, k.v - (k.v - vmax) * Math.min(1, rate * dt) - 1.5 * dt);
      }
      if (bremse > 0) {
        if (k.v > 0.3) k.v = Math.max(0, k.v - F.bremsen * bremse * dt);
        else if (gas === 0) k.v = Math.max(-F.rueckwaertsVmax, k.v - F.beschleunigung * 0.5 * bremse * dt);
      } else if (gas === 0) {
        k.v = k.v > 0 ? Math.max(0, k.v - F.ausrollen * dt) : Math.min(0, k.v + F.ausrollen * dt);
      }
      if (k.v > 1) k.v -= F.hangEinfluss * k.steigung * dt;
    }

    // Drift: Taste in der Kurve halten, beim Loslassen gibt es je nach Dauer einen Mini-Turbo
    if (k.drift === 0) {
      if (!e.drift) k.driftGesperrt = false;
      else if (!k.driftGesperrt && amBoden && k.v > D.minTempo && Math.abs(lenkZiel) > 0.25) {
        k.drift = lenkZiel > 0 ? 1 : -1; k.driftZeit = 0; k.driftStufe = 0; k.hop = 0.18;
        this.melde('driftStart', k.idx);
      }
    } else if (!e.drift) {
      if (k.driftStufe > 0) {
        const T = k.driftStufe === 2 ? D.turbo2 : D.turbo1;
        this.gibBoost(k, T.dauer, T.staerke);
        this.melde('turbo', k.idx, k.driftStufe);
      }
      k.drift = 0; k.driftZeit = 0; k.driftStufe = 0;
    } else if (k.v < D.minTempo * 0.75 || (k.luft && k.luftZeit > 0.5)) {
      this.driftAbbruch(k);
    } else {
      if (amBoden) k.driftZeit += dt;
      const st = k.driftZeit >= D.stufe2 ? 2 : k.driftZeit >= D.stufe1 ? 1 : 0;
      if (st !== k.driftStufe) { k.driftStufe = st; this.melde('driftStufe', k.idx, st); }
    }

    // Drehen
    const anteil = clamp(Math.abs(k.v) / F.vmax, 0, 1);
    const omega = lerp(F.lenkrateLangsam, F.lenkrateSchnell, anteil) * clamp(Math.abs(k.v) / 5, 0, 1);
    let rate = k.drift ? k.drift * omega * (D.lenkMitte + D.lenkBereich * k.lenk * k.drift) : k.lenk * omega;
    if (k.luft) rate *= F.luftLenkung;
    if (k.schlamm) rate *= CONFIG.wirkung.schlamm.lenkFaktor;
    if (k.v < 0) rate = -rate;
    k.richtung += rate * dt;
    const blickZiel = k.richtung + k.drift * D.winkel + (k.drift ? 0 : k.lenk * 0.08 * anteil);
    k.blick += winkelDiff(blickZiel, k.blick) * Math.min(1, 11 * dt);

    // Windschatten: dicht hinter einem anderen Fahrzeug
    let imWind = false;
    const cx = Math.cos(k.richtung), cz = Math.sin(k.richtung);
    if (amBoden && k.v > W.minTempo) {
      for (const o of this.karts) {
        if (o === k || o.zielZeit != null) continue;
        const dx = o.x - k.x, dz = o.z - k.z;
        const vor = dx * cx + dz * cz;
        if (vor < 2.2 || vor > W.distanz) continue;
        if (Math.abs(dz * cx - dx * cz) > W.breite || o.v < W.minTempo * 0.8 || Math.abs(o.y - k.y) > 2) continue;
        imWind = true; break;
      }
    }
    if (imWind) k.windZeit = Math.min(W.zeit + W.nachlauf, k.windZeit + dt);
    else k.windZeit = Math.max(0, k.windZeit - dt * (k.windZeit > W.zeit ? 1 : 2));
    const aktiv = k.windZeit >= W.zeit;
    if (aktiv && !k.windAktiv) this.melde('wind', k.idx);
    k.windAktiv = aktiv;

    // Bewegen
    k.x += (cx * k.v + k.schubX) * dt;
    k.z += (cz * k.v + k.schubZ) * dt;
    const ab = Math.exp(-F.schubAbbau * dt);
    k.schubX *= ab; k.schubZ *= ab;
  }

  gibBoost(k, dauer, staerke) {
    if (k.boostZeit <= 0 || staerke >= k.boostStaerke) k.boostStaerke = staerke;
    k.boostZeit = Math.max(k.boostZeit, dauer);
  }

  driftAbbruch(k) {
    if (k.drift) { k.drift = 0; k.driftZeit = 0; k.driftStufe = 0; k.driftGesperrt = true; }
  }

  // ── Ortung: Wo auf der Strecke ist das Fahrzeug? Dazu Wände, Boden und Sprünge ──
  orte(k, dt, nurOrten) {
    const S = this.S, H = S.haupt, L = this.L;
    let P, i, t, s, d, hb, rand, sHaupt, aufStrasse, offen = false;
    let wegW = null, wegAussen = Infinity, wegS = 0, wegD = 0, wegI = 0, wegT = 0;

    if (k.pfad > 0) {
      // auf einem Nebenweg
      const w = S.wege[k.pfad - 1], Q = w.pfad;
      const pw = Q.projiziere(k.x, k.z, k.wi, 8);
      const hint = pw.s < w.laenge / 2 ? w.iVon + Math.round(pw.s / H.ds) : w.iBis - Math.round((w.laenge - pw.s) / H.ds);
      const pm = H.projiziere(k.x, k.z, ((hint % H.n) + H.n) % H.n, 10);
      const aufHauptbahn = Math.abs(pm.d) <= H.hb[pm.i] - 0.3;
      const amEnde = pw.s > w.laenge - 16, amAnfang = pw.s < 16;
      if (pw.nachEnde || pw.vorAnfang || (aufHauptbahn && (amEnde || amAnfang))) {
        // zurück auf die Hauptstrecke
        if (amEnde && w.art === 'abkuerzung') this.abkuerzungBenutzt(k, w);
        k.pfad = 0; k.mi = pm.i; k.wegHinweis[w.idx] = pw.i;
        return this.orte(k, dt, nurOrten);
      }
      k.wi = pw.i;
      P = Q; i = pw.i; t = pw.t; s = pw.s; d = pw.d; hb = Q.hb[i]; rand = w.rand;
      sHaupt = (w.von + (s / w.laenge) * w.spanne) % L;
      aufStrasse = Math.abs(d) <= hb + 0.25 || aufHauptbahn;
      const aussen = Math.abs(d) - (hb + rand);
      if (aussen > 0 && !nurOrten) {
        // Wand des Nebenwegs – ausser man ist dort gerade im Korridor der Hauptstrecke
        const randM = pm.d >= 0 ? S.randL[pm.i] : S.randR[pm.i];
        const aussenM = Math.abs(pm.d) - (H.hb[pm.i] + randM);
        if (aussenM > 0 || !(amEnde || amAnfang)) {
          const zeichen = d > 0 ? -1 : 1;
          this.wandStoss(k, Q.nx[i] * zeichen, Q.nz[i] * zeichen, aussen, dt);
        }
      }
    } else {
      const pm = H.projiziere(k.x, k.z, k.mi, 6);
      k.mi = pm.i;
      P = H; i = pm.i; t = pm.t; s = pm.s; d = pm.d; hb = H.hb[i];
      rand = d >= 0 ? S.randL[i] : S.randR[i];
      sHaupt = s;
      // offene Nebenwege in der Nähe
      for (const w of S.wege) {
        if (wegVor((w.von - 12 + L) % L, s, L) > w.spanne + 24) { k.wegHinweis[w.idx] = -1; continue; }
        if (!this.wegOffen(k, w)) continue;
        const hw = k.wegHinweis[w.idx];
        const pw = w.pfad.projiziere(k.x, k.z, hw, hw < 0 ? 0 : 8);
        k.wegHinweis[w.idx] = pw.i;
        const a = pw.vorAnfang || pw.nachEnde ? 99 : Math.abs(pw.d) - (w.pfad.hb[pw.i] + w.rand);
        if (a < wegAussen) { wegAussen = a; wegW = w; wegS = pw.s; wegD = pw.d; wegI = pw.i; wegT = pw.t; }
      }
      aufStrasse = Math.abs(d) <= hb + 0.25 || (wegW !== null && Math.abs(wegD) <= wegW.pfad.hb[wegI] && wegAussen < 0);
      if (wegW && wegAussen < 0 && Math.abs(d) > hb + 0.3) {
        // Wechsel auf den Nebenweg
        k.pfad = wegW.idx + 1; k.wi = wegI;
        P = wegW.pfad; i = wegI; t = wegT; s = wegS; d = wegD; hb = P.hb[i]; rand = wegW.rand;
        sHaupt = (wegW.von + (s / wegW.laenge) * wegW.spanne) % L;
      } else {
        const aussen = Math.abs(d) - (hb + rand);
        if (aussen > 0 && wegAussen > 0) {
          offen = d >= 0 ? S.offenL[i] === 1 : S.offenR[i] === 1;
          if (offen) { if (aussen > 0.4) k.absturz = true; }
          else if (!nurOrten) {
            if (aussen <= wegAussen) { const z = d > 0 ? -1 : 1; this.wandStoss(k, H.nx[i] * z, H.nz[i] * z, aussen, dt); }
            else { const z = wegD > 0 ? -1 : 1; this.wandStoss(k, wegW.pfad.nx[wegI] * z, wegW.pfad.nz[wegI] * z, wegAussen, dt); }
          }
        }
      }
    }
    k.s = s; k.d = d; k.aufStrasse = aufStrasse;

    // Fortschritt. Sprünge von mehr als 40 m zählen nicht (Checkpoint-Schutz gegen Abkürzen und Fehlortung).
    const ds = rundenDiff(sHaupt, k.sHaupt, L);
    if (Math.abs(ds) < 40) k.strecke += ds;
    k.sHaupt = sHaupt;

    // Bodenhöhe: Strecke, feste Schanzen und eigene Rampen
    const i2 = P.idx(i + 1);
    let bodenY = P.y[i] + (P.y[i2] - P.y[i]) * t;
    let steigung = P.steig[i];
    if (k.pfad === 0) {
      for (const sch of S.schanzen) {
        const r = wegVor(sch.s, s, L);
        if (r < sch.laenge) { bodenY += (sch.hoehe * r) / sch.laenge; steigung += sch.hoehe / sch.laenge; }
      }
      let aufRampe = 0;
      const RA = CONFIG.wirkung.rampe;
      for (const bw of this.bauwerke) {
        if (bw.art !== 'rampe' || bw.besitzer !== k.idx || !bw.fertig || bw.benutzt) continue;
        const sl = S.slots[bw.slot];
        const r = wegVor(sl.s, s, L);
        if (r < RA.laenge && Math.abs(d - sl.bahn) < RA.breite / 2) {
          bodenY += (RA.hoehe * r) / RA.laenge; steigung += RA.hoehe / RA.laenge;
          aufRampe = bw.id;
          if (r > RA.laenge * 0.55 && !k.luft) k.rampeBereit = bw.id;
        }
      }
      if (k.rampeBereit && !aufRampe) {
        // über die Kante der eigenen Rampe gefahren → Sprung und Boost
        const bw = this.bauwerke.find((b) => b.id === k.rampeBereit);
        k.rampeBereit = 0;
        if (bw && !bw.benutzt && k.v > 6) {
          this.gibBoost(k, RA.boostDauer, RA.boostStaerke);
          this.melde('rampe', k.idx, bw.id);
          this.benutzt(k, bw);
        }
      }
    }
    k.streckenY = bodenY; k.steigung = steigung;
    if (k.absturz) bodenY = -999;
    k.bodenY = bodenY;
    if (nurOrten) return;

    // Senkrechte Bewegung: am Boden folgt das Fahrzeug der Strecke, sonst fliegt es
    const g = CONFIG.fahren.schwerkraft;
    if (k.luft) {
      k.vy -= g * dt; k.y += k.vy * dt; k.luftZeit += dt;
      if (k.y <= bodenY) {
        if (k.luftZeit > 0.15) this.melde('landung', k.idx, -k.vy);
        k.y = bodenY; k.luft = false; k.vy = 0;
      }
    } else {
      const vyBoden = (bodenY - k.y) / dt;
      if (vyBoden < k.vy - g * dt - 1.2) {
        // der Boden fällt schneller weg, als das Fahrzeug fallen kann → es hebt ab
        k.luft = true; k.luftZeit = 0;
        k.vy -= g * dt; k.y += k.vy * dt;
        if (k.y <= bodenY) { k.y = bodenY; k.luft = false; k.vy = 0; }
      } else {
        k.vy = clamp(vyBoden, -40, Math.abs(k.v) * 0.5 + 2);
        k.y = bodenY;
      }
    }
  }

  // Abprallen an einer Wand. (nx, nz) zeigt zurück auf die Strecke, «tiefe» ist die Eindringtiefe.
  wandStoss(k, nx, nz, tiefe, dt) {
    const F = CONFIG.fahren;
    k.x += nx * tiefe; k.z += nz * tiefe;
    const vx = Math.cos(k.richtung) * k.v, vz = Math.sin(k.richtung) * k.v;
    const vn = vx * nx + vz * nz;
    if (vn >= 0) return;                       // bewegt sich schon von der Wand weg
    const tempo = Math.abs(k.v);
    const aufprall = clamp(-vn / Math.max(tempo, 1), 0, 1);     // 0 = streifen, 1 = frontal
    k.wandZeit = 0.25;
    if (aufprall * tempo > 3) this.melde('wand', k.idx, aufprall * tempo);
    if (aufprall > 0.8) {
      // frontal: zurückprallen, Blickrichtung bleibt
      k.v = -k.v * 0.25;
      if (k.drift) this.driftAbbruch(k);
      return;
    }
    // schräg: an der Wand entlang abgelenkt
    const rx = vx - nx * vn * (1 + F.wandAbprall), rz = vz - nz * vn * (1 + F.wandAbprall);
    const neu = tempo * (1 - F.wandVerlust * aufprall) * (1 - F.wandSchleifen * dt);
    if (k.v >= 0) { k.richtung = Math.atan2(rz, rx); k.v = neu; }
    else { k.richtung = Math.atan2(-rz, -rx); k.v = -neu; }
    if (aufprall > 0.35 && k.drift) this.driftAbbruch(k);
  }

  // Fahrzeuge schubsen sich leicht
  kollisionen() {
    const F = CONFIG.fahren, K = this.karts, R2 = 4 * F.kartRadius * F.kartRadius;
    for (let i = 0; i < K.length; i++) {
      const a = K[i];
      if (a.geistZeit > 0) continue;
      for (let j = i + 1; j < K.length; j++) {
        const b = K[j];
        if (b.geistZeit > 0 || (a.typ === 'fern' && b.typ === 'fern')) continue;
        const dx = b.x - a.x, dz = b.z - a.z;
        const d2 = dx * dx + dz * dz;
        if (d2 >= R2 || d2 < 1e-6 || Math.abs(a.y - b.y) > 1.6) continue;
        const dist = Math.sqrt(d2), nx = dx / dist, nz = dz / dist;
        const ueber = 2 * F.kartRadius - dist;
        const anteilA = a.typ === 'fern' ? 0 : b.typ === 'fern' ? 1 : 0.5;
        a.x -= nx * ueber * anteilA; a.z -= nz * ueber * anteilA;
        b.x += nx * ueber * (1 - anteilA); b.z += nz * ueber * (1 - anteilA);
        const rel = (Math.cos(a.richtung) * a.v + a.schubX - Math.cos(b.richtung) * b.v - b.schubX) * nx
                  + (Math.sin(a.richtung) * a.v + a.schubZ - Math.sin(b.richtung) * b.v - b.schubZ) * nz;
        if (rel > 0) {
          const imp = Math.min(rel * F.stoss, 5);
          if (a.typ !== 'fern') { a.schubX -= nx * imp * 0.5; a.schubZ -= nz * imp * 0.5; }
          if (b.typ !== 'fern') { b.schubX += nx * imp * 0.5; b.schubZ += nz * imp * 0.5; }
          if (rel > 2.5) this.melde('rempler', a.idx, b.idx, rel);
        }
      }
    }
  }

  // Feststecken, Abstürze und falsche Fahrtrichtung überwachen
  ueberwache(k, dt) {
    const R = CONFIG.rennen, H = this.S.haupt;
    if (this.phase === 'countdown') return;
    const P = k.pfad > 0 ? this.S.wege[k.pfad - 1].pfad : H;
    const i = k.pfad > 0 ? k.wi : k.mi;
    // sichere Position merken (mittig auf der Fahrbahn, am Boden, in Fahrt)
    if (!k.luft && !k.absturz && k.v > 6 && Math.abs(k.d) < P.hb[i] * 0.7) { k.sicher.pfad = k.pfad; k.sicher.s = k.s; }
    // falsche Richtung?
    const richtig = Math.cos(k.richtung) * P.tx[i] + Math.sin(k.richtung) * P.tz[i];
    k.falschZeit = richtig < -0.3 && Math.abs(k.v) > 2 ? k.falschZeit + dt : 0;
    // Stillstand
    const willFahren = k.typ === 'bot' || k.eingabe.gas > 0 || k.zielZeit != null;
    if (Math.abs(k.v) < 1.5 && k.zielZeit == null) {
      k.stehZeit += dt;
      if (k.stehZeit > k.maxStehZeit) k.maxStehZeit = k.stehZeit;
    } else k.stehZeit = 0;
    const steckt = k.stehZeit > R.resetNachStillstand && willFahren;
    const gefallen = k.y < k.streckenY - R.resetTiefe;
    const verirrt = k.typ === 'bot' && k.falschZeit > 2.5;
    if (steckt || gefallen || verirrt) this.zuruecksetzen(k);
  }

  zuruecksetzen(k) {
    const S = this.S, L = this.L;
    let P, s;
    if (k.sicher.pfad > 0) { P = S.wege[k.sicher.pfad - 1].pfad; s = clamp(k.sicher.s - 2, 0, P.laenge - 0.5); }
    else { P = S.haupt; s = (k.sicher.s - 2 + L) % L; }
    const o = P.ort(s, 0, {});
    const i = Math.min(P.n - 1, Math.floor(s / P.ds));
    k.x = o.x; k.z = o.z; k.y = o.y; k.vy = 0; k.luft = false; k.v = 0;
    k.richtung = k.blick = Math.atan2(P.tz[i], P.tx[i]);
    k.pfad = k.sicher.pfad;
    if (k.pfad > 0) k.wi = i; else k.mi = i;
    k.schubX = k.schubZ = 0; k.drift = 0; k.driftZeit = 0; k.driftStufe = 0; k.boostZeit = 0; k.lenk = 0;
    k.absturz = false; k.stehZeit = 0; k.falschZeit = 0; k.rampeBereit = 0; k.schlamm = 0;
    k.geistZeit = CONFIG.rennen.geistZeit; k.resetSperre = 1.5; k.resets++;
    this.melde('reset', k.idx);
  }

  // ── Bauwerke: Wirkung auf ein Fahrzeug ──────────────────────────────────
  bauwerkWirkung(k, dt) {
    const W = CONFIG.wirkung, L = this.L, r = CONFIG.fahren.kartRadius;
    let imSchlamm = 0;
    for (const bw of this.bauwerke) {
      if (!bw.fertig || bw.eigen || !(bw.betroffen & (1 << k.idx))) continue;
      if (bw.art === 'umleitung') {
        // schräge Leitwand: Kreis gegen Strecke
        const g = bw.wand;
        const ex = g.bx - g.ax, ez = g.bz - g.az;
        const u = clamp(((k.x - g.ax) * ex + (k.z - g.az) * ez) / (ex * ex + ez * ez), 0, 1);
        const dx = k.x - (g.ax + ex * u), dz = k.z - (g.az + ez * u);
        const dist = hyp(dx, dz);
        if (dist < r + 0.3 && dist > 1e-4 && Math.abs(k.y - k.streckenY) < 1.5) {
          this.wandStoss(k, dx / dist, dz / dist, r + 0.3 - dist, dt);
          if (!bw.gestreift[k.idx]) { bw.gestreift[k.idx] = 1; this.treffer(k, bw, -1); }
        }
        continue;
      }
      if (k.pfad !== 0) continue;
      const rel = rundenDiff(k.s, bw.s, L);          // Meter hinter (−) oder nach (+) dem Slot
      if (rel < -3 || rel > 30) continue;
      if (bw.art === 'schlamm') {
        if (rel > 0 && rel < W.schlamm.laenge && k.d > bw.d0 && k.d < bw.d1 && !k.luft) {
          if (k.schlamm === bw.id) imSchlamm = bw.id;
          else if (k.schutzZeit <= 0) { imSchlamm = bw.id; this.treffer(k, bw, 0); }
        }
        continue;
      }
      if (k.schutzZeit > 0 || k.luft) continue;
      if (bw.art === 'pylonen') {
        for (let q = 0; q < bw.teile.length; q++) {
          const p = bw.teile[q];
          if (p.weg) continue;
          const dx = k.x - p.x, dz = k.z - p.z;
          if (dx * dx + dz * dz < (r + W.pylonen.radius) * (r + W.pylonen.radius)) { this.treffer(k, bw, q); break; }
        }
      } else if (bw.art === 'absperrung') {
        if (Math.abs(rel) > 1.0) continue;
        for (let q = 0; q < bw.teile.length; q++) {
          const p = bw.teile[q];
          if (!p.weg && k.d > p.d0 - 0.75 && k.d < p.d1 + 0.75) { this.treffer(k, bw, q); break; }
        }
      }
    }
    k.schlamm = imSchlamm;
  }

  // Ein Fahrzeug hat ein Hindernis getroffen: sofort abbremsen (lokal), dann dem Schiedsrichter melden.
  treffer(k, bw, teil) {
    const W = CONFIG.wirkung;
    const mindest = Math.min(k.v, W.minTempoNachTreffer);
    if (bw.art === 'pylonen') k.v = Math.max(mindest, k.v * W.pylonen.tempoFaktor);
    else if (bw.art === 'absperrung') { k.v = Math.max(mindest, k.v * W.absperrung.tempoFaktor); k.lahmZeit = W.absperrung.lahmZeit; }
    if (bw.art !== 'umleitung') {
      k.schutzZeit = CONFIG.bau.schutzZeit;
      k.boostZeit = 0;
      this.driftAbbruch(k);
    }
    if (this.schiri) this.registriereTreffer(k.idx, bw.id, teil);
    else if (this.netz) this.netz.treffer(k.idx, bw.id, teil);
  }

  registriereTreffer(kIdx, bwId, teil) {
    const bw = this.bauwerke.find((b) => b.id === bwId);
    if (!bw) return;
    if (teil >= 0 && bw.teile && bw.teile[teil]) bw.teile[teil].weg = true;
    const k = this.karts[kIdx];
    k.treffer++; k.trefferZeit = this.zeit;
    this.karts[bw.besitzer].trefferErzielt++;
    this.trefferLog.push({ k: kIdx, art: bw.art, zeit: this.zeit, strecke: k.strecke });
    this.melde('treffer', kIdx, bwId, teil);
  }

  // eigenes Bauwerk (Rampe, Abkürzung) wurde benutzt
  benutzt(k, bw) {
    if (this.schiri) { bw.benutzt = true; bw.tEnde = Math.min(bw.tEnde, this.zeit + 1.2); }
    else { bw.benutzt = true; if (this.netz) this.netz.benutzt(k.idx, bw.id); }
  }

  abkuerzungBenutzt(k, w) {
    for (const bw of this.bauwerke) {
      if (bw.art === 'abkuerzung' && bw.besitzer === k.idx && this.S.slots[bw.slot].weg === w.idx && !bw.benutzt) {
        this.melde('abkuerzung', k.idx, bw.id);
        if (k.typ !== 'fern' || this.schiri) this.benutzt(k, bw);
      }
    }
  }

  // Darf das Fahrzeug diesen Nebenweg befahren?
  wegOffen(k, w) {
    if (w.art === 'umleitung') return true;
    if (k.pfad === w.idx + 1) return true;
    for (const bw of this.bauwerke) {
      if (bw.art === 'abkuerzung' && bw.besitzer === k.idx && bw.fertig && !bw.benutzt && this.S.slots[bw.slot].weg === w.idx) return true;
    }
    return false;
  }

  // ── Regeln (nur der Schiedsrichter): Rangliste, Runden, Baupunkte, Lebensdauer der Bauwerke ──
  ordne() {
    const K = this.karts;
    this.reihenfolge.sort((a, b) => {
      const ka = K[a], kb = K[b];
      if (ka.zielZeit != null || kb.zielZeit != null) {
        if (ka.zielZeit != null && kb.zielZeit != null) return ka.zielZeit - kb.zielZeit;
        return ka.zielZeit != null ? -1 : 1;
      }
      return kb.strecke - ka.strecke;
    });
    for (let p = 0; p < this.reihenfolge.length; p++) {
      const k = K[this.reihenfolge[p]];
      k.rang = p + 1;
      if (k.rang > k.schlechtesterRang) k.schlechtesterRang = k.rang;
    }
  }

  regeln(dt) {
    const K = this.karts, n = this.n, L = this.L, B = CONFIG.bp;
    if (this.phase === 'countdown') return;

    // Runden und Zieleinlauf
    for (const k of K) {
      if (k.zielZeit != null) continue;
      while (k.strecke >= (k.runde + 1) * L) {
        const ueber = k.strecke - (k.runde + 1) * L;
        const t = this.zeit - (k.v > 1 ? ueber / k.v : 0);       // genauer Zeitpunkt der Linienüberfahrt
        k.rundenZeiten.push(t - k.rundeStart);
        k.rundeStart = t; k.runde++;
        this.melde('runde', k.idx, k.runde, k.rundenZeiten[k.rundenZeiten.length - 1]);
        if (k.runde === 1 && this.fuehrerRunde1 == null) this.fuehrerRunde1 = k.idx;
        if (k.runde >= this.runden) {
          k.zielZeit = t;
          if (this.siegerZeit == null) this.siegerZeit = t;
          if (!k.bot) k.bot = new Bot(this, k, 'mittel');     // nach dem Ziel fährt ein Autopilot aus
          this.melde('ziel', k.idx, t);
          break;
        }
      }
    }
    const rangVorher = K.map((k) => k.rang);
    this.ordne();

    // Überholen: +BP, sobald man klar vorbei ist (mit Abstand und Pause gegen Hin-und-her-Zählen)
    if (this.phase === 'rennen') {
      for (let a = 0; a < n; a++) {
        const ka = K[a];
        if (ka.zielZeit != null) continue;
        for (let b = 0; b < n; b++) {
          if (a === b || K[b].zielZeit != null) continue;
          const diff = ka.strecke - K[b].strecke;
          const q = a * n + b;
          if (this.vorne[q] === 0 && diff > B.ueberholAbstand) {
            this.vorne[q] = 1; this.vorne[b * n + a] = 0;
            if (this.zeit - this.ueberholZeit[q] > B.ueberholPause && this.zeit > 1) {
              this.ueberholZeit[q] = this.zeit;
              ka.ueberholt++;
              // Kein Lohn, wenn der Überholte gerade in eine Baustelle gefahren ist (sonst füttert jeder Treffer neue Baustellen)
              if (this.zeit - K[b].trefferZeit > B.geschenktZeit) this.gibBP(ka, B.ueberholen, rangVorher[a], 'ueberholt');
              this.melde('ueberholt', a, b);
            }
          }
        }
      }
      // Aufholen: +1 BP pro 15 m, die man auf den Vordermann gutmacht (nur neue Bestwerte)
      for (let p = 1; p < n; p++) {
        const k = K[this.reihenfolge[p]], vm = K[this.reihenfolge[p - 1]];
        if (k.zielZeit != null || vm.zielZeit != null) { k.vordermann = -1; continue; }
        const abstand = vm.strecke - k.strecke;
        if (k.vordermann !== vm.idx) { k.vordermann = vm.idx; k.bestAbstand = abstand; continue; }
        if (abstand < k.bestAbstand) {
          if (this.zeit - vm.trefferZeit > B.geschenktZeit) this.gibBP(k, (k.bestAbstand - abstand) / B.meterProBP, k.rang, 'aufholen');
          k.bestAbstand = abstand;
        } else {
          k.bestAbstand = Math.min(abstand, k.bestAbstand + B.bestwertVerfall * dt);   // Bestwert verjährt langsam
        }
      }
      K[this.reihenfolge[0]].vordermann = -1;
    }

    // Bauwerke: fertigstellen, ablaufen lassen, entfernen
    let entfernt = false;
    for (const bw of this.bauwerke) {
      if (!bw.fertig && this.zeit >= bw.tFest) { bw.fertig = true; this.melde('fertig', bw.besitzer, bw.id); }
      let weg = this.zeit >= bw.tEnde;
      if (bw.eigen) {
        const b = K[bw.besitzer];
        if (b.strecke > bw.verfall || b.zielZeit != null) weg = weg || !(bw.art === 'abkuerzung' && b.pfad === this.S.slots[bw.slot].weg + 1);
      } else if (bw.fertig) {
        for (let a = 0; a < n; a++) {
          if (bw.offen & (1 << a)) { if (K[a].strecke > bw.zielStrecke[a] || K[a].zielZeit != null) bw.offen &= ~(1 << a); }
        }
        if (bw.offen === 0) weg = true;
      }
      if (weg) { bw.weg = true; entfernt = true; this.melde('abbau', bw.besitzer, bw.id); }
    }
    if (entfernt) this.bauwerke = this.bauwerke.filter((b) => !b.weg);

    // Rennende: alle im Ziel oder Zeit nach dem Sieger abgelaufen
    if (this.phase === 'rennen' && this.siegerZeit != null) {
      let alle = true, menschen = true;
      for (const k of K) if (k.zielZeit == null) { alle = false; if (k.typ !== 'bot') menschen = false; }
      if (alle || (menschen && this.endeBeiMenschen) || this.zeit > this.siegerZeit + CONFIG.rennen.endeNachSieger) this.beende();
    }
  }

  beende() {
    this.phase = 'ende';
    this.fertig = true;
    // Wer noch nicht im Ziel ist, bekommt eine geschätzte Zeit (nach Rückstand)
    for (const k of this.karts) {
      k.geschaetzt = false;
      if (k.zielZeit == null) {
        const rest = this.runden * this.L - k.strecke;
        k.endZeit = this.zeit + rest / Math.max(15, CONFIG.fahren.vmax * 0.8);
        k.geschaetzt = true;
      } else k.endZeit = k.zielZeit;
    }
    this.melde('ende', -1);
  }

  // Baupunkte gutschreiben. Je weiter hinten, desto mehr (bis letzterFaktor auf dem letzten Platz).
  gibBP(k, menge, rang, grund) {
    const B = CONFIG.bp;
    if (!this.bauenAn) return;
    if (grund === 'aufholen' && k.rang === 1 && !B.fuehrenderVerdient) return;
    const faktor = this.n > 1 ? 1 + (B.letzterFaktor - 1) * (rang - 1) / (this.n - 1) : 1;
    const neu = Math.min(B.max, k.bp + menge * faktor);
    k.bpVerdient += neu - k.bp;
    if (Math.floor(neu) > Math.floor(k.bp)) this.melde('bp', k.idx, Math.floor(neu), grund);
    k.bp = neu;
  }

  // ── Bauen ───────────────────────────────────────────────────────────────
  slotBelegt(slotIdx) {
    for (const bw of this.bauwerke) if (bw.slot === slotIdx) return true;
    return false;
  }

  zaehleHindernisse(besitzer) {
    let c = 0;
    for (const bw of this.bauwerke) if (!bw.eigen && (besitzer < 0 || bw.besitzer === besitzer)) c++;
    return c;
  }

  // Liste der Slots, an denen das Fahrzeug jetzt das Bauwerk «art» bauen dürfte.
  // Eigene Bauwerke: nächster Slot vor dem Fahrzeug zuerst. Hindernisse: nächster Slot vor dem Führenden zuerst.
  gueltigeSlots(k, art) {
    const B = CONFIG.bau, S = this.S, L = this.L, K = this.karts;
    const liste = [];
    if (!this.bauenAn || this.phase !== 'rennen' || k.rang === 1 || k.zielZeit != null) return liste;
    const eigen = BAUWERKE[BAUWERK_INDEX[art]].eigen;
    const slotArt = SLOT_ART[art];
    let fuehrer = null;
    if (!eigen) {
      if (this.zaehleHindernisse(-1) >= B.maxGesamt || this.zaehleHindernisse(k.idx) >= B.maxProSpieler) return liste;
      fuehrer = K[this.reihenfolge[0]];
    }
    const vorlauf = B.minVorlauf * CONFIG.fahren.vmax;
    const reichweite = art === 'umleitung' ? B.umleitungDauer * CONFIG.fahren.vmax * 0.75 : L * B.reichweite;
    for (const sl of S.slots) {
      if (sl.art !== slotArt || this.slotBelegt(sl.idx)) continue;
      if (eigen) {
        const vor = wegVor(k.sHaupt, sl.s, L);
        if (vor < B.minVorlaufEigen * Math.max(k.v, 16) + 4 || vor > L * 0.85) continue;
        if (k.pfad > 0 && art === 'abkuerzung' && S.slots[sl.idx].weg === k.pfad - 1) continue;
        liste.push({ slot: sl.idx, wert: vor });
      } else {
        let ok = true, erreicht = false;
        for (const bw of this.bauwerke) {
          if (!bw.eigen && Math.abs(rundenDiff(bw.s, sl.s, L)) < B.minAbstand) { ok = false; break; }
        }
        if (!ok) continue;
        for (const a of K) {
          if (a === k || a.zielZeit != null || a.strecke <= k.strecke) continue;
          const vor = wegVor(a.sHaupt, sl.s, L);
          if (vor < vorlauf) { ok = false; break; }
          if (vor < reichweite) erreicht = true;
        }
        if (!ok || !erreicht) continue;
        liste.push({ slot: sl.idx, wert: wegVor(fuehrer.sHaupt, sl.s, L) });
      }
    }
    liste.sort((a, b) => a.wert - b.wert);
    return liste.map((e) => e.slot);
  }

  // Der Slot, der dem Fahrzeug gerade für sein gewähltes Bauwerk vorgeschlagen wird (−1 = keiner)
  zielSlot(k) {
    const liste = this.gueltigeSlots(k, BAUWERKE[k.bauWahl].art);
    return liste.length ? liste[k.slotWahl % liste.length] : -1;
  }

  // Übersicht für die Bauleiste: pro Bauwerk Preis, ob es geht und warum nicht
  bauStatus(k) {
    const B = CONFIG.bau;
    return BAUWERKE.map((b, i) => {
      const preis = B.preise[b.art];
      let grund = '';
      const slots = this.gueltigeSlots(k, b.art);
      if (k.rang === 1) grund = 'Führender';
      else if (k.bp < preis) grund = 'zu wenig BP';
      else if (!slots.length) grund = 'kein Slot';
      else if (k.bauSperre > 0) grund = 'Pause';
      return { art: b.art, preis, ok: grund === '', grund, slot: slots.length ? slots[(i === k.bauWahl ? k.slotWahl : 0) % slots.length] : -1, anzahl: slots.length };
    });
  }

  // Bauwunsch eines Fahrzeugs. Der Schiedsrichter prüft und baut, Mitspieler fragen beim Host an.
  bauen(k, art, slotIdx) {
    if (slotIdx < 0 || this.phase !== 'rennen') return false;
    if (!this.schiri) { if (this.netz && k.bauSperre <= 0) { k.bauSperre = 0.5; this.netz.bauWunsch(k.idx, art, slotIdx); } return false; }
    const B = CONFIG.bau, preis = B.preise[art];
    if (k.rang === 1 || k.bauSperre > 0 || k.bp < preis || k.zielZeit != null) return false;
    if (this.gueltigeSlots(k, art).indexOf(slotIdx) < 0) return false;
    k.bp -= preis; k.bpAusgegeben += preis; k.bauSperre = B.wartezeit; k.gebaut++; k.slotWahl = 0;
    const bw = this.neuesBauwerk({ id: this.naechsteBauId++, art, slot: slotIdx, besitzer: k.idx, t0: this.zeit });
    // Wer ist betroffen? Alle, die jetzt vor dem Erbauer liegen.
    if (!bw.eigen) {
      const reichweite = art === 'umleitung' ? B.umleitungDauer * CONFIG.fahren.vmax : this.L * 0.9;
      for (const a of this.karts) {
        if (a === k || a.zielZeit != null || a.strecke <= k.strecke) continue;
        bw.betroffen |= 1 << a.idx;
        const vor = wegVor(a.sHaupt, bw.s, this.L);
        if (vor < reichweite) { bw.offen |= 1 << a.idx; bw.zielStrecke[a.idx] = a.strecke + vor + bw.laenge + 12; }
      }
    } else {
      bw.verfall = k.strecke + wegVor(k.sHaupt, bw.s, this.L) + (art === 'abkuerzung' ? 45 : 30);
    }
    this.bauwerke.push(bw);
    this.melde('bau', k.idx, bw.id);
    return true;
  }

  // Bauwerk aus seinen Grunddaten aufbauen (gleich bei Host und Mitspielern)
  neuesBauwerk(g) {
    const B = CONFIG.bau, W = CONFIG.wirkung, S = this.S, H = S.haupt;
    const sl = S.slots[g.slot];
    const eigen = BAUWERKE[BAUWERK_INDEX[g.art]].eigen;
    const bw = {
      id: g.id, art: g.art, slot: g.slot, besitzer: g.besitzer, t0: g.t0, eigen,
      tFest: g.t0 + (eigen ? B.aufbauZeitEigen : B.aufbauZeit), tEnde: 0, fertig: false, weg: false, benutzt: false,
      betroffen: g.betroffen || 0, offen: 0, zielStrecke: [], verfall: Infinity,
      s: sl.s, seite: sl.seite, laenge: 0, teile: null, wand: null, d0: 0, d1: 0, gestreift: [],
    };
    bw.tEnde = eigen ? g.t0 + B.eigenLebensdauer : bw.tFest + (g.art === 'umleitung' ? B.umleitungDauer : B.lebensdauer);
    const hb = sl.hb;
    if (g.art === 'pylonen') {
      // zwei versetzte Reihen; dazwischen bleibt immer eine Lücke
      const w = hb - 1.0;
      bw.teile = [];
      const reihen = [[-0.75, -0.25, 0.25, 0.75], [-0.5, 0, 0.5]];
      for (let r = 0; r < 2; r++) for (const a of reihen[r]) {
        const s = (sl.s + r * W.pylonen.reihenAbstand) % this.L;
        const o = H.ort(s, a * w, {});
        bw.teile.push({ x: o.x, z: o.z, y: o.y, d: a * w, s, reihe: r, weg: false });
      }
      bw.laenge = W.pylonen.reihenAbstand;
    } else if (g.art === 'schlamm') {
      const b = 2 * hb * W.schlamm.anteil;
      bw.d0 = sl.seite > 0 ? hb - b : -hb; bw.d1 = sl.seite > 0 ? hb : -hb + b;
      bw.laenge = W.schlamm.laenge;
    } else if (g.art === 'absperrung') {
      const b = 2 * hb * W.absperrung.anteil;
      bw.d0 = sl.seite > 0 ? hb - b : -hb; bw.d1 = sl.seite > 0 ? hb : -hb + b;
      bw.teile = [];
      for (let q = 0; q < 3; q++) bw.teile.push({ d0: bw.d0 + (b * q) / 3, d1: bw.d0 + (b * (q + 1)) / 3, weg: false });
    } else if (g.art === 'umleitung') {
      bw.wand = S.wege[sl.weg].sperre;
      bw.laenge = W.umleitungLaenge + 20;
    }
    return bw;
  }

  // Vorsprung des Führenden in Sekunden (für die Anzeige)
  rueckstand(k) {
    const f = this.karts[this.reihenfolge[0]];
    if (f === k) return 0;
    if (f.zielZeit != null && k.zielZeit != null) return k.zielZeit - f.zielZeit;
    return (f.strecke - k.strecke) / Math.max(12, f.v, k.v);
  }
}
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 6: Bots
   Ein Bot «drückt» dieselben Tasten wie ein Mensch (Lenken, Gas, Bremse, Drift,
   Bauen) und fährt mit derselben Physik. Er wird nie heimlich schneller.
   Die Stufen unterscheiden sich nur im Können (siehe CONFIG.bots).
   ══════════════════════════════════════════════════════════════════════════ */
const BOT_VORAUS = [4, 12, 22, 34, 48, 64];      // in diesen Abständen schaut ein Bot auf die Krümmung voraus

class Bot {
  constructor(R, k, stufe) {
    const p = CONFIG.bots.stufen[stufe] || CONFIG.bots.stufen.mittel;
    const z = R.zufall;
    this.p = p;
    this.stufe = stufe;
    this.mut = p.mut * (1 + (z() * 2 - 1) * CONFIG.bots.streuung);   // Tagesform
    this.versatz = (z() * 2 - 1) * p.linie * 0.5;                    // persönliche Abweichung von der Ideallinie
    this.rausch = 0; this.rauschZiel = 0; this.rauschUhr = 0;
    this.ausweich = 0;
    this.fehlerUhr = 0;
    this.driftAn = false; this.driftAusUhr = 0; this.driftLust = z() < p.drift; this.lustUhr = 0;
    this.bauUhr = 1 + z() * 2;
    this.gesehen = {};          // Hindernis-Nummer → rechtzeitig gesehen?
    this.weg = -1;              // geplanter Nebenweg (−1 = Hauptstrecke)
    this.frei = null;           // freie Lücke neben einem Hindernis voraus: { a, b }
    this.e = { lenk: 0, gas: 0, bremse: 0, drift: false, wahl: 0, bauWechsel: 0, slotWechsel: 0, bauen: false, reset: false, bauArt: null, bauSlot: -1 };
    this.o = { x: 0, z: 0, y: 0 };
  }

  // Punkt «voraus» Meter vor dem Fahrzeug entlang seiner Route. Gibt die Krümmung dort zurück.
  routenPunkt(R, k, voraus, versatz, aus) {
    const S = R.S, H = S.haupt, L = S.laenge;
    let sm;
    if (k.pfad > 0) {
      const w = S.wege[k.pfad - 1];
      const sz = k.s + voraus;
      if (sz < w.laenge) {
        const lim = Math.max(0, w.pfad.hb[0] - 1.6);
        w.pfad.ort(sz, clamp(versatz * 0.4, -lim, lim), aus);
        return w.pfad.bei(w.pfad.kr, sz);
      }
      sm = (w.bis + sz - w.laenge) % L;
    } else {
      sm = (k.s + voraus) % L;
      if (this.weg >= 0) {
        const w = S.wege[this.weg];
        let bis = wegVor(k.s, w.von, L);
        if (bis > L / 2) bis -= L;                 // negativ: Einfahrt liegt schon hinter uns
        if (voraus > bis) {
          const sz = voraus - bis;
          if (sz < w.laenge) { w.pfad.ort(sz, 0, aus); return w.pfad.bei(w.pfad.kr, sz); }
          sm = (w.bis + sz - w.laenge) % L;
        }
      }
    }
    const i = Math.floor(sm / H.ds) % H.n;
    const lim = H.hb[i] - 1.3;
    let d = clamp(S.ideal[i] + versatz, -lim, lim);
    if (this.frei) d = clamp(d, this.frei.a, this.frei.b);
    H.ort(sm, d, aus);
    return S.idealKr[i];
  }

  // Soll der Bot an der nächsten Abzweigung einen Nebenweg nehmen?
  planeWeg(R, k) {
    const S = R.S, L = S.laenge;
    this.weg = -1;
    if (k.pfad > 0) return;
    for (const w of S.wege) {
      let bis = wegVor(k.s, w.von, L);
      if (bis > L / 2) bis -= L;

        if (bw.art === 'abkuerzung' && bw.besitzer === k.idx && !bw.benutzt) this.weg = w.idx;       // eigene Abkürzung

    for (const bw of R.bauwerke) {
      if (bw.eigen || bw.art === 'umleitung' || !(bw.betroffen & (1 << k.idx))) continue;
      if (this.gesehen[bw.id] === undefined) this.gesehen[bw.id] = R.zufall() < this.p.sehen;

    else if (best.art === 'absperrung') { for (const p of best.teile) if (!p.weg) zu.push([p.d0 - 1.35, p.d1 + 1.35]); }
    else if (best.art === 'pylonen') {
      const reihe = bestVor > -2 ? 0 : 1;
      for (const p of best.teile) if (!p.weg && p.reihe === reihe) zu.push([p.d - 1.5, p.d + 1.5]);
    }
    zu.sort((a, b) => a[0] - b[0]);
    // freie Lücken dazwischen
    const luecken = [];
    let von = -lim;
    for (const z of zu) { if (z[0] > von) luecken.push([von, Math.min(z[0], lim)]); von = Math.max(von, z[1]); }
    if (von < lim) luecken.push([von, lim]);
    if (!luecken.length) return;
    const wunsch = clamp(S.ideal[i] + this.versatz, -lim, lim);
    let wahl = null, wahlD = Infinity;
    for (const l of luecken) {
      if (l[1] < l[0]) continue;
      const dist = wunsch < l[0] ? l[0] - wunsch : wunsch > l[1] ? wunsch - l[1] : 0;
      const wert = dist + Math.abs(k.d - (l[0] + l[1]) / 2) * 0.15 - Math.min(l[1] - l[0], 3) * 0.3;
      if (wert < wahlD) { wahlD = wert; wahl = l; }
    }
    if (wahl) this.frei = { a: wahl[0], b: wahl[1] };
  }

  // Wird pro Zeitschritt aufgerufen und liefert die «gedrückten Tasten»
  steuere(R, k, dt) {

    e.bauArt = null;
    this.planeWeg(R, k);
    this.sucheLuecke(R, k);

    // kleine Ungenauigkeiten und gelegentliche Fahrfehler
    this.rauschUhr -= dt;
    if (this.rauschUhr <= 0) { this.rauschUhr = 1 + z() * 1.6; this.rauschZiel = (z() * 2 - 1) * this.p.linie; }
    if (this.fehlerUhr > 0) this.fehlerUhr -= dt;
    else if (z() < (this.p.fehler / 60) * dt) { this.fehlerUhr = 1.1; this.rauschZiel = (z() < 0.5 ? -1 : 1) * 2.6; }

    // anderen Fahrzeugen ausweichen oder ihren Windschatten suchen

    let seit = 0;
    if (k.zielZeit == null) {
      for (const o of R.karts) {
        if (o === k || o.pfad !== k.pfad) continue;
        const vor = k.pfad > 0 ? o.s - k.s : rundenDiff(o.sHaupt, k.sHaupt, L);
        if (vor < 0.5 || vor > 18) continue;
        const dd = o.d - k.d;
        if (k.v > o.v + 0.6 && Math.abs(dd) < 2.9 && vor < 15) {

    // Lenken: auf einen Punkt voraus zielen
    const Lh = clamp(k.v * CONFIG.bots.vorausZeit, 8, 20);
    this.routenPunkt(R, k, Lh, versatz, this.o);
    const fehler = winkelDiff(Math.atan2(this.o.z - k.z, this.o.x - k.x), k.richtung);
    const omegaSoll = ((2 * Math.sin(fehler)) / Lh) * Math.max(k.v, 5);
    const omegaMax = lerp(F.lenkrateLangsam, F.lenkrateSchnell, clamp(k.v / F.vmax, 0, 1));
    const driftAnteil = (omegaSoll * k.drift) / omegaMax;
    if (k.drift) e.lenk = clamp((driftAnteil - D.lenkMitte) / D.lenkBereich, -1, 1) * k.drift;
    else e.lenk = clamp(omegaSoll / omegaMax, -1, 1);

    // Tempo: so schnell, wie es die Kurven voraus erlauben (rechtzeitig bremsen)

    const c = mut * (this.driftLust ? D.lenkMitte + D.lenkBereich * 0.75 : 1);
    let vZiel = 99;
    for (const dist of BOT_VORAUS) {
      const kr = Math.abs(this.routenPunkt(R, k, dist, versatz, this.o));
      if (kr < 1e-4) continue;
      const vKurve = (c * F.lenkrateLangsam) / (kr + (c * (F.lenkrateLangsam - F.lenkrateSchnell)) / F.vmax);
      const vJetzt = Math.sqrt(vKurve * vKurve + 2 * 22 * Math.max(0, dist - 4));
      if (vJetzt < vZiel) vZiel = vJetzt;
    }

    e.bremse = k.v > vZiel + 2 ? 1 : 0;
    if (Math.abs(fehler) > 1.2 && k.v > 8) { e.gas = 0; e.bremse = 1; }

    // Driften: in engen, längeren Kurven halten, am Kurvenausgang loslassen (Mini-Turbo)
    const krNah = this.routenPunkt(R, k, 7, versatz, this.o);
    const krWeit = this.routenPunkt(R, k, 7 + k.v * 0.8, versatz, this.o);
    if (!k.drift) {
      this.driftAn = false; this.driftAusUhr = 0;
      this.lustUhr -= dt;
      if (Math.abs(krNah) < 0.004 && this.lustUhr <= 0) { this.lustUhr = 1.5; this.driftLust = z() < this.p.drift; }
      const bedarf = (Math.abs(krNah) * k.v) / omegaMax;
      if (this.driftLust && k.zielZeit == null && k.v > D.minTempo + 4 && bedarf > 0.6 && krNah * krWeit > 0 && (Math.abs(krWeit) * k.v) / omegaMax > 0.5
          && !k.luft && k.aufStrasse && !k.driftGesperrt && e.lenk * krNah > 0 && Math.abs(e.lenk) > 0.3) this.driftAn = true;
    } else {
      if (driftAnteil < D.lenkMitte - D.lenkBereich - 0.12) this.driftAusUhr += dt; else this.driftAusUhr = 0;
      this.driftAn = !(this.driftAusUhr > 0.14 || krNah * k.drift < 0.004);
    }
    e.drift = this.driftAn;

    this.denkeBau(R, k, dt);
    return e;
  }

  // Einfache, sinnvolle Bau-Taktik
  denkeBau(R, k, dt) {
    this.bauUhr -= dt;
    if (this.bauUhr > 0) return;
    this.bauUhr = 0.5 + R.zufall() * 0.6;
    if (!R.bauenAn || R.phase !== 'rennen' || k.rang === 1 || k.bauSperre > 0 || k.bp < 2 || k.zielZeit != null || k.typ !== 'bot') return;
    if (R.zufall() > this.p.bauen) return;
    const P = CONFIG.bau.preise, L = R.L, z = R.zufall;
    let best = null, bestWert = 0;
    const pruefe = (art, wert, maxVor) => {
      if (k.bp < P[art]) return;
      const slots = R.gueltigeSlots(k, art);
      if (!slots.length) return;
      if (maxVor && wegVor(k.sHaupt, R.S.slots[slots[0]].s, L) > maxVor) return;
      const w = wert + z() * 1.5;
      if (w > bestWert) { bestWert = w; best = { art, slot: slots[0] }; }
    };
    let vorne = 0;
    for (const o of R.karts) if (o.strecke > k.strecke && o.zielZeit == null) vorne++;
    const m = Math.min(vorne, 4);
    pruefe('abkuerzung', 9, 300);                 // lohnt sich am meisten: spart rund 2 s
    pruefe('rampe', 4.2, 240);
    pruefe('umleitung', 4.4 + m * 0.7, 0);
    pruefe('absperrung', 3.6 + m * 0.5, 0);
    pruefe('schlamm', 3.0 + m * 0.4, 0);
    pruefe('pylonen', 2.2 + m * 0.3, 0);
    if (!best) return;
    // Sparen: Kommt bald eine freie Abkürzung, hebt der Bot seine Punkte manchmal dafür auf
    if (best.art !== 'abkuerzung' && k.bp < P.abkuerzung + 2 && z() < 0.5) {
      for (const sl of R.S.slots) {
        if (sl.art !== 'abkuerzung' || R.slotBelegt(sl.idx)) continue;
        const vor = wegVor(k.sHaupt, sl.s, L);
        if (vor > 60 && vor < 520) return;
      }
    }
    this.e.bauArt = best.art; this.e.bauSlot = best.slot;
  }
}
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 7: Simulation (?sim=200)
   Lässt Bot-Rennen ohne Grafik im Zeitraffer laufen und misst, ob das Balancing
   stimmt. Dieselbe Logik wie im echten Spiel – nur ohne Bild und Ton.
   ══════════════════════════════════════════════════════════════════════════ */
const SOLL_CACHE = {};

// Vergleichs-Fahrt: Wie lange braucht ein ungestörter Bot dieser Stufe von jedem Punkt der Strecke aus?
function sollZeiten(streckenId, stufe) {
  const key = streckenId + '/' + stufe;
  if (SOLL_CACHE[key]) return SOLL_CACHE[key];
  const S = holeStrecke(streckenId);
  const n = S.haupt.n, ds = S.haupt.ds;
  const R = new Rennen(S, [{ typ: 'bot', stufe, platz: 0 }], { seed: 4711, runden: 4, bauen: false, meldungen: false });
  const tau = new Float64Array(n).fill(-1);
  const k = R.karts[0];
  let start = null;
  while (!R.fertig && R.zeit < 600) {
    R.step(SCHRITT, null);
    if (k.runde === 2 && k.zielZeit == null) {
      if (start == null) start = R.zeit;
      const i = Math.floor(k.sHaupt / ds) % n;
      if (tau[i] < 0) tau[i] = R.zeit - start;
    }
  }
  const runde = k.rundenZeiten[2] || 60;
  // Lücken füllen
  let letzter = 0;
  for (let i = 0; i < n; i++) { if (tau[i] < 0) tau[i] = letzter; else letzter = tau[i]; }
  const soll = { tau, runde, n, ds, L: S.laenge, rundenZeiten: k.rundenZeiten.slice() };
  SOLL_CACHE[key] = soll;
  return soll;
}

// Zeit, die der Vergleichs-Bot für die Strecke von «von» bis «bis» (Gesamtmeter) braucht
function sollDauer(soll, von, bis) {
  const f = (m) => {
    const runde = Math.floor(m / soll.L);
    const rest = m - runde * soll.L;
    return runde * soll.runde + soll.tau[Math.min(soll.n - 1, Math.floor(rest / soll.ds))];
  };
  return f(bis) - f(von);
}

// Ein einzelnes Bot-Rennen. opt: { strecke, stufen: ['mittel', …], seed, runden, bauen }
function simRennen(opt) {
  const S = holeStrecke(opt.strecke);
  const z = zufallsGenerator(opt.seed * 2654435761 + 17);
  const n = opt.stufen.length;
  const plaetze = opt.stufen.map((_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(z() * (i + 1)); const t = plaetze[i]; plaetze[i] = plaetze[j]; plaetze[j] = t; }
  const fahrer = opt.stufen.map((st, i) => ({ name: BOT_NAMEN[i % BOT_NAMEN.length], typ: 'bot', stufe: st, platz: plaetze[i], fahrzeug: FAHRZEUGE[i % FAHRZEUGE.length].id, farbe: i % FARBEN.length }));
  const R = new Rennen(S, fahrer, { seed: opt.seed * 7919 + 3, runden: opt.runden, bauen: opt.bauen, meldungen: false });
  const messungen = [], verluste = [];
  let logPos = 0;
  const FENSTER = 5;
  while (!R.fertig && R.zeit < 900) {
    R.step(SCHRITT, null);
    while (logPos < R.trefferLog.length) {
      const t = R.trefferLog[logPos++];
      messungen.push({ k: t.k, art: t.art, t0: R.zeit, s0: t.strecke });
    }
    for (let q = messungen.length - 1; q >= 0; q--) {
      const m = messungen[q];
      if (R.zeit >= m.t0 + FENSTER) {
        const k = R.karts[m.k];
        if (k.zielZeit == null) {
          const soll = sollZeiten(opt.strecke, k.stufe);
          verluste.push({ art: m.art, verlust: FENSTER - sollDauer(soll, Math.max(0, m.s0), Math.max(0, k.strecke)) });
        }
        messungen.splice(q, 1);
      }
    }
  }
  const sieger = R.reihenfolge[0];
  let letzte = 0, erste = Infinity, alleImZiel = true, maxSteh = 0, resets = 0, bpV = 0, bpA = 0, gebaut = 0, ueberholt = 0, treffer = 0, rundenSumme = 0, rundenAnz = 0;
  for (const k of R.karts) {
    if (k.zielZeit == null) alleImZiel = false; else { letzte = Math.max(letzte, k.zielZeit); erste = Math.min(erste, k.zielZeit); }
    maxSteh = Math.max(maxSteh, k.maxStehZeit); resets += k.resets;
    bpV += k.bpVerdient; bpA += k.bpAusgegeben; gebaut += k.gebaut; ueberholt += k.ueberholt; treffer += k.treffer;
    for (const t of k.rundenZeiten) { rundenSumme += t; rundenAnz++; }
  }
  return {
    sieger, siegerStufe: R.karts[sieger].stufe, siegerStart: R.karts[sieger].startRang, fuehrerRunde1: R.fuehrerRunde1,
    fuehrerGewinnt: R.fuehrerRunde1 === sieger, streuung: alleImZiel ? letzte - erste : null, siegerZeit: erste,
    maxSteh, resets, bpVerdient: bpV / n, bpAusgegeben: bpA / n, gebaut, ueberholt, treffer, verluste,
    rundenZeit: rundenAnz ? rundenSumme / rundenAnz : 0, dauer: R.zeit, raenge: R.reihenfolge.slice(),
  };
}

// Auswertung vieler Rennen
function simAuswertung(liste) {
  const N = liste.length;
  const A = { rennen: N, fuehrerGewinnt: 0, streuungMedian: 0, streuungUnter8: 0, maxSteh: 0, resets: 0, bpVerdient: 0, bpAusgegeben: 0,
    gebaut: 0, ueberholt: 0, treffer: 0, rundenZeit: 0, verlust: {}, siegNachStufe: {}, siegNachStart: {} };
  const streu = [];
  for (const r of liste) {
    if (r.fuehrerGewinnt) A.fuehrerGewinnt++;
    if (r.streuung != null) { streu.push(r.streuung); if (r.streuung <= 8) A.streuungUnter8++; }
    A.maxSteh = Math.max(A.maxSteh, r.maxSteh); A.resets += r.resets;
    A.bpVerdient += r.bpVerdient; A.bpAusgegeben += r.bpAusgegeben; A.gebaut += r.gebaut; A.ueberholt += r.ueberholt; A.treffer += r.treffer;
    A.rundenZeit += r.rundenZeit;
    A.siegNachStufe[r.siegerStufe] = (A.siegNachStufe[r.siegerStufe] || 0) + 1;
    A.siegNachStart[r.siegerStart] = (A.siegNachStart[r.siegerStart] || 0) + 1;
    for (const v of r.verluste) { (A.verlust[v.art] = A.verlust[v.art] || []).push(v.verlust); }
  }
  streu.sort((a, b) => a - b);
  A.streuungMedian = streu.length ? streu[streu.length >> 1] : 0;
  A.streuungUnter8 = streu.length ? A.streuungUnter8 / streu.length : 0;
  A.fuehrerGewinnt /= N;
  for (const key of ['resets', 'bpVerdient', 'bpAusgegeben', 'gebaut', 'ueberholt', 'treffer', 'rundenZeit']) A[key] /= N;
  for (const art in A.verlust) {
    const v = A.verlust[art].sort((a, b) => a - b);
    A.verlust[art] = { anzahl: v.length, mittel: v.reduce((a, b) => a + b, 0) / v.length, p95: v[Math.floor(v.length * 0.95)], max: v[v.length - 1] };
  }
  return A;
}

// Die beiden Mess-Reihen aus der Aufgabenstellung
const SIM_SZENARIEN = {
  gleich: ['mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel'],   // 8 gleich starke Bots
  stark: ['schwer', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel'],    // 1 deutlich besserer gegen 7
};
function simEinzel(szenario, nr, opt) {
  const ids = Object.keys(STRECKEN);
  return simRennen({ strecke: (opt && opt.strecke) || ids[nr % ids.length], stufen: SIM_SZENARIEN[szenario], seed: nr + 1 + (szenario === 'stark' ? 100000 : 0),
    runden: (opt && opt.runden) || CONFIG.rennen.runden, bauen: !(opt && opt.bauen === false) });
}

// Sammelt Dreiecke (Position + Farbe) und macht daraus ein einziges Netz
