    const vm = k.vordermann >= 0 ? R.karts[k.vordermann] : null;
    const pruefe = (art, wert, maxVor) => {
      if (k.bp < P[art]) return;
      const slots = R.gueltigeSlots(k, art);
      if (!slots.length) return;
      let slot = slots[0];
      // Hindernisse: meist dem direkten Gegner in den Weg bauen, nicht immer dem Führenden
      if (vm && !BAUWERKE[BAUWERK_INDEX[art]].eigen && z() < CONFIG.bots.zielVordermann) {
        let nah = 1e9;
        for (const i of slots) { const d = wegVor(vm.sHaupt, R.S.slots[i].s, L); if (d < nah) { nah = d; slot = i; } }
      }
      if (maxVor && wegVor(k.sHaupt, R.S.slots[slot].s, L) > maxVor) return;
      const w = wert + z() * 1.5;
      if (w > bestWert) { bestWert = w; best = { art, slot }; }
    };
    let vorne = 0;
    for (const o of R.karts) if (o.strecke > k.strecke && o.zielZeit == null) vorne++;
    const m = Math.min(vorne, 4);
    // Die Stärke des eigenen Autos zählt mit: Geländewagen lieben Abkürzungen, Rallye-Autos Rampen, Sportwagen meiden Kies
    pruefe('abkuerzung', 9 + (k.w.abkuerzung > 1 ? 3 : k.w.abkuerzung < 1 ? -3.5 : 0), 300);      // lohnt sich am meisten: spart rund 2 s
    pruefe('rampe', 4.2 + (k.w.rampe > 1 ? 3.5 : 0), 240);
    pruefe('umleitung', 4.4 + m * 0.7, 0);
    pruefe('absperrung', 3.6 + m * 0.5, 0);
    pruefe('schlamm', 3.0 + m * 0.4, 0);
    pruefe('pylonen', 2.2 + m * 0.3, 0);
    if (!best) return;
    // Sparen: Kommt bald eine freie Abkürzung, hebt der Bot seine Punkte manchmal dafür auf
    if (best.art !== 'abkuerzung' && k.bp < P.abkuerzung + 2 && z() < 0.5) {
      for (const sl of R.S.slots) {
        if (sl.art !== 'abkuerzung' || R.slotBelegt(sl.idx)) continue;
        const vor = wegVor(k.sHaupt, sl.s, L);
        if (vor > 60 && vor < 520) return;
      }
    }
    this.e.bauArt = best.art; this.e.bauSlot = best.slot;
  }
}
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 7: Simulation (?sim=200)
   Lässt Bot-Rennen ohne Grafik im Zeitraffer laufen und misst, ob das Balancing
   stimmt. Dieselbe Logik wie im echten Spiel – nur ohne Bild und Ton.
   ══════════════════════════════════════════════════════════════════════════ */
const SOLL_CACHE = {};

// Vergleichs-Fahrt: Wie lange braucht ein ungestörter Bot dieser Stufe von jedem Punkt der Strecke aus?
function sollZeiten(streckenId, stufe, fahrzeug) {
  const key = streckenId + '/' + stufe + '/' + fahrzeug;
  if (SOLL_CACHE[key]) return SOLL_CACHE[key];
  const S = holeStrecke(streckenId);
  const n = S.haupt.n, ds = S.haupt.ds;
  const R = new Rennen(S, [{ typ: 'bot', stufe, platz: 0, fahrzeug }], { seed: 4711, runden: 4, bauen: false, meldungen: false });
  const tau = new Float64Array(n).fill(-1);
  const k = R.karts[0];
  let start = null;
  while (!R.fertig && R.zeit < 600) {
    R.step(SCHRITT, null);
    if (k.runde === 2 && k.zielZeit == null) {
      if (start == null) start = R.zeit;
      const i = Math.floor(k.sHaupt / ds) % n;
      if (tau[i] < 0) tau[i] = R.zeit - start;
    }
  }
  const runde = k.rundenZeiten[2] || 60;
  // Lücken füllen
  let letzter = 0;
  for (let i = 0; i < n; i++) { if (tau[i] < 0) tau[i] = letzter; else letzter = tau[i]; }
  const soll = { tau, runde, n, ds, L: S.laenge, rundenZeiten: k.rundenZeiten.slice() };
  SOLL_CACHE[key] = soll;
  return soll;
}

// Zeit, die der Vergleichs-Bot für die Strecke von «von» bis «bis» (Gesamtmeter) braucht
function sollDauer(soll, von, bis) {
  const f = (m) => {
    const runde = Math.floor(m / soll.L);
    const rest = m - runde * soll.L;
    return runde * soll.runde + soll.tau[Math.min(soll.n - 1, Math.floor(rest / soll.ds))];
  };
  return f(bis) - f(von);
}

// Ein einzelnes Bot-Rennen. opt: { strecke, stufen: ['mittel', …], seed, runden, bauen }
function simRennen(opt) {
  const S = holeStrecke(opt.strecke);
  const z = zufallsGenerator(opt.seed * 2654435761 + 17);
  const n = opt.stufen.length;
  const plaetze = opt.stufen.map((_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(z() * (i + 1)); const t = plaetze[i]; plaetze[i] = plaetze[j]; plaetze[j] = t; }
  const autos = opt.autos || loseFahrzeuge(n, z);      // wie im Spiel: jedem Fahrer wird ein Auto zugelost
  const fahrer = opt.stufen.map((st, i) => ({ name: BOT_NAMEN[i % BOT_NAMEN.length], typ: 'bot', stufe: st, platz: plaetze[i], fahrzeug: autos[i], farbe: i % FARBEN.length }));
  const R = new Rennen(S, fahrer, { seed: opt.seed * 7919 + 3, runden: opt.runden, bauen: opt.bauen, meldungen: false });
  const messungen = [], verluste = [];
  let logPos = 0;
  const FENSTER = 5;
  while (!R.fertig && R.zeit < 900) {
    R.step(SCHRITT, null);
    while (logPos < R.trefferLog.length) {
      const t = R.trefferLog[logPos++];
      messungen.push({ k: t.k, art: t.art, t0: R.zeit, s0: t.strecke });
    }
    for (let q = messungen.length - 1; q >= 0; q--) {
      const m = messungen[q];
      if (R.zeit >= m.t0 + FENSTER) {
        const k = R.karts[m.k];
        if (k.zielZeit == null) {
          const soll = sollZeiten(opt.strecke, k.stufe, k.fahrzeug);
          verluste.push({ art: m.art, verlust: FENSTER - sollDauer(soll, Math.max(0, m.s0), Math.max(0, k.strecke)) });
        }
        messungen.splice(q, 1);
      }
    }
  }
  const sieger = R.reihenfolge[0];
  let letzte = 0, erste = Infinity, alleImZiel = true, maxSteh = 0, resets = 0, bpV = 0, bpA = 0, gebaut = 0, ueberholt = 0, treffer = 0, rundenSumme = 0, rundenAnz = 0;
  for (const k of R.karts) {
    if (k.zielZeit == null) alleImZiel = false; else { letzte = Math.max(letzte, k.zielZeit); erste = Math.min(erste, k.zielZeit); }
    maxSteh = Math.max(maxSteh, k.maxStehZeit); resets += k.resets;
    bpV += k.bpVerdient; bpA += k.bpAusgegeben; gebaut += k.gebaut; ueberholt += k.ueberholt; treffer += k.treffer;
    for (const t of k.rundenZeiten) { rundenSumme += t; rundenAnz++; }
  }
  return {
    sieger, siegerStufe: R.karts[sieger].stufe, siegerStart: R.karts[sieger].startRang, fuehrerRunde1: R.fuehrerRunde1,
    fuehrerGewinnt: R.fuehrerRunde1 === sieger, streuung: alleImZiel ? letzte - erste : null, siegerZeit: erste,
    maxSteh, resets, bpVerdient: bpV / n, bpAusgegeben: bpA / n, gebaut, ueberholt, treffer, verluste,
    rundenZeit: rundenAnz ? rundenSumme / rundenAnz : 0, dauer: R.zeit, raenge: R.reihenfolge.slice(),
    autos: R.karts.map((k) => k.fahrzeug), siegerAuto: R.karts[sieger].fahrzeug,
  };
}

// Auswertung vieler Rennen
function simAuswertung(liste) {
  const N = liste.length;
  const A = { rennen: N, fuehrerGewinnt: 0, streuungMedian: 0, streuungUnter8: 0, maxSteh: 0, resets: 0, bpVerdient: 0, bpAusgegeben: 0,
    gebaut: 0, ueberholt: 0, treffer: 0, rundenZeit: 0, verlust: {}, siegNachStufe: {}, siegNachStart: {}, autos: {} };
  const streu = [];
  for (const f of FAHRZEUGE) A.autos[f.id] = { rennen: 0, siege: 0, rang: 0 };      // pro Auto: Starts, Siege, mittlerer Platz
  for (const r of liste) {
    r.raenge.forEach((kIdx, platz) => { const a = A.autos[r.autos[kIdx]]; if (a) { a.rennen++; a.rang += platz + 1; if (platz === 0) a.siege++; } });
    if (r.fuehrerGewinnt) A.fuehrerGewinnt++;
    if (r.streuung != null) { streu.push(r.streuung); if (r.streuung <= 8) A.streuungUnter8++; }
    A.maxSteh = Math.max(A.maxSteh, r.maxSteh); A.resets += r.resets;
    A.bpVerdient += r.bpVerdient; A.bpAusgegeben += r.bpAusgegeben; A.gebaut += r.gebaut; A.ueberholt += r.ueberholt; A.treffer += r.treffer;
    A.rundenZeit += r.rundenZeit;
    A.siegNachStufe[r.siegerStufe] = (A.siegNachStufe[r.siegerStufe] || 0) + 1;
    A.siegNachStart[r.siegerStart] = (A.siegNachStart[r.siegerStart] || 0) + 1;
    for (const v of r.verluste) { (A.verlust[v.art] = A.verlust[v.art] || []).push(v.verlust); }
  }
  for (const id in A.autos) { const a = A.autos[id]; a.siegAnteil = a.rennen ? a.siege / a.rennen : 0; a.rang = a.rennen ? a.rang / a.rennen : 0; }
  streu.sort((a, b) => a - b);
  A.streuungMedian = streu.length ? streu[streu.length >> 1] : 0;
  A.streuungUnter8 = streu.length ? A.streuungUnter8 / streu.length : 0;
  A.fuehrerGewinnt /= N;
  for (const key of ['resets', 'bpVerdient', 'bpAusgegeben', 'gebaut', 'ueberholt', 'treffer', 'rundenZeit']) A[key] /= N;
  for (const art in A.verlust) {
    const v = A.verlust[art].sort((a, b) => a - b);
    A.verlust[art] = { anzahl: v.length, mittel: v.reduce((a, b) => a + b, 0) / v.length, p95: v[Math.floor(v.length * 0.95)], max: v[v.length - 1] };
  }
  return A;
}

// Die beiden Mess-Reihen aus der Aufgabenstellung
const SIM_SZENARIEN = {
  gleich: ['mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel'],   // 8 gleich starke Bots
  stark: ['schwer', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel', 'mittel'],    // 1 deutlich besserer gegen 7
};
function simEinzel(szenario, nr, opt) {
  const ids = Object.keys(STRECKEN);
  return simRennen({ strecke: (opt && opt.strecke) || ids[nr % ids.length], stufen: SIM_SZENARIEN[szenario], seed: nr + 1 + (szenario === 'stark' ? 100000 : 0),
    runden: (opt && opt.runden) || CONFIG.rennen.runden, bauen: !(opt && opt.bauen === false) });
}

/* ══════════════════════════════════════════════════════════════════════════
   TEIL 8: Grafik (three.js, Low-Poly)
   Die Logik rechnet in der Ebene (x, z) mit z «nach links». three.js schaut

   Alle festen Dinge einer Strecke landen in wenigen grossen Netzen (schnell).

// Sammelt Dreiecke (Position + Farbe) und macht daraus ein einziges Netz
class Geo {

  tri(a, b, c, f) {

    m.makeRotationFromEuler(e.set(rx || 0, ry || 0, rz || 0, 'YZX'));

    this.quad(P[2], P[6], P[7], P[3], f);            // oben

  baueWelt(S) {

    const zuf = zufallsGenerator(12345);

    // Alle befahrbaren Pfade mit ihren Rändern (für «liegt dieser Punkt in einem Korridor?»)

// ── Deko-Bausteine (alles aus Quadern, Zylindern und Kegeln) ──────────────
const Deko = {
  baum(g, x, y, z, zuf) {
    if (Grafik.qualitaet !== 'niedrig') return Leben.pflanze('fichte', x, y, z, zuf);     // ab «Mittel»: Fichte mit Astschichten, die im Wind wiegt (Teil 7d)
    const h = 4.5 + zuf() * 4, f = Geo.farbe;
    g.zyl(x, y + h * 0.15, z, 0.35, 0.28, h * 0.3, 5, f(0x6b4a2b));
    const gruen = [0x3d7a3a, 0x4c8c3f, 0x2f6b3a][Math.floor(zuf() * 3)];
    g.zyl(x, y + h * 0.5, z, h * 0.34, 0, h * 0.55, 6, f(gruen), null, zuf() * 3);

  },
  haufen(g, x, y, z, zuf, farbe) {
    const r = 2.5 + zuf() * 4;
    g.zyl(x, y + r * 0.3, z, r, r * 0.12, r * 0.62, 7, Geo.farbe(farbe, 0.9 + zuf() * 0.2), null, zuf() * 3);
  },
  fels(g, x, y, z, zuf) {
    const r = 0.8 + zuf() * 1.8;
    g.box(x, y + r * 0.35, z, r * 1.5, r, r * 1.2, Geo.farbe(0x8d8a82, 0.85 + zuf() * 0.3), zuf() * 3, zuf() * 0.5, zuf() * 0.5);
  },
  pylone(g, x, y, z) {
    const f = Geo.farbe;
    g.box(x, y + 0.05, z, 0.6, 0.1, 0.6, f(0xff7a1a));
    g.zyl(x, y + 0.45, z, 0.24, 0.05, 0.75, 6, f(0xff7a1a));
    g.zyl(x, y + 0.5, z, 0.185, 0.14, 0.18, 6, f(0xf5f1e6));
  },
  zaun(g, x, y, z, dreh) {
    const f = Geo.farbe, c = Math.cos(dreh), s = Math.sin(dreh);
    for (let q = -1; q <= 1; q++) {
      const px = x + c * q * 3.2, pz = z - s * q * 3.2;
      g.box(px, y + 1.0, pz, 3.0, 1.7, 0.06, f(0x9aa3ab), dreh);
      g.box(px - c * 1.5, y + 0.12, pz + s * 1.5, 0.3, 0.24, 0.7, f(0x6d7278), dreh);
      g.box(px, y + 1.9, pz, 3.0, 0.08, 0.08, f(0xff7a1a), dreh);
    }
  },
  kran(g, x, y, z, dreh) {
    const f = Geo.farbe, gelb = f(0xffc61a), h = 34;
    if (Grafik.qualitaet !== 'niedrig') Leben.bauarbeiter(x, z, dreh, 3, zufallsGenerator(Math.round(x * 13 + z * 7)));   // Arbeiter am Fuss des Krans (Teil 7d)
    if (Grafik.qualitaet !== 'niedrig') return Leben.kran(g, x, y, z, dreh);                // ab «Mittel»: Gittermast und drehender Ausleger (Teil 7d)
    g.box(x, y + 0.6, z, 5, 1.2, 5, f(0x8d8472));
    for (let q = 0; q < 9; q++) g.box(x, y + 1.2 + (q + 0.5) * (h / 9), z, 1.5, h / 9 - 0.3, 1.5, q % 2 ? gelb : f(0xffc61a, 0.85));
    const c = Math.cos(dreh), s = Math.sin(dreh);
    g.box(x + c * 9, y + h + 1.8, z - s * 9, 30, 1.1, 1.1, gelb, dreh);          // Ausleger
    g.box(x - c * 6, y + h + 1.2, z + s * 6, 3, 2.2, 2.2, f(0x6d7278), dreh);    // Gegengewicht
    g.box(x, y + h + 3.4, z, 2, 2.2, 2, f(0xf5f1e6), dreh);                      // Kabine
    g.box(x + c * 17, y + h - 5, z - s * 17, 0.12, 12, 0.12, f(0x2a2d31));       // Seil
    g.box(x + c * 17, y + h - 11.5, z - s * 17, 1.4, 1, 1.4, f(0xe0362c), dreh); // Haken mit Last
  },
  bagger(g, x, y, z, dreh) {

    this.quad([a[0], a[1], -a[3]], [b[0], b[1], -b[3]], [b[0], b[1], b[3]], [a[0], a[1], a[3]], mal(c, 0.5));       // unten
    this.quad([a[0], a[1], a[3]], [b[0], b[1], b[3]], [b[0], b[2], b[4]], [a[0], a[2], a[4]], mal(s, 0.95));        // Seite links

  this.quad([b[0], b[1], b[3]], [b[0], b[1], -b[3]], [b[0], b[2], -b[4]], [b[0], b[2], b[4]], c);                   // Bug

// Malt ein Rundum-Bild des Himmels (Verlauf, Sonne mit Schein, Wolken). Es dient als Hintergrund und für die Spiegelungen auf Lack und Glas.
// fein: doppelte Auflösung (ab «Hoch»), dann sind Wolken und Sonne auch auf grossen Bildschirmen scharf
function himmelBild(st, fein) {
  const s = fein ? 2 : 1, B = 1024 * s, H = 512 * s, c = document.createElement('canvas'); c.width = B; c.height = H;
  const x = c.getContext('2d'), zuf = zufallsGenerator(77);

  x.fillStyle = g; x.fillRect(0, 0, B, H / 2);

  g.addColorStop(0, hexCss(st.dunst)); g.addColorStop(0.12, hexCss(st.boden)); g.addColorStop(1, hexCss(st.boden));
  x.fillStyle = g; x.fillRect(0, H / 2, B, H / 2);

  for (const dx of [-B, 0, B]) {
    g = x.createRadialGradient(sx + dx, sy, 0, sx + dx, sy, sr);
    g.addColorStop(0, 'rgba(255,252,240,1)'); g.addColorStop(0.05, 'rgba(255,246,214,.96)'); g.addColorStop(0.16, hexCss(st.schein) + '77'); g.addColorStop(1, hexCss(st.schein) + '00');

    x.fillStyle = '#fff';

    x.globalAlpha = 1;

    g.addColorStop(0, 'rgba(255,250,235,1)'); g.addColorStop(0.2, 'rgba(255,248,230,.95)'); g.addColorStop(0.24, 'rgba(240,235,255,.22)'); g.addColorStop(1, 'rgba(240,235,255,0)');

  }

  // (Wolkenfarbe mit Himmelsfarbe gemischt), dann die beleuchtete Oberseite. Am Tag dazu feine Schleierwolken weit oben.
  const rgb = (h) => hexRgb(h), wl = rgb(st.wolke), hm = rgb(st.mitte);
  const hell = 'rgba(' + wl.map((v) => Math.round(v * 0.65 + 255 * 0.35)).join(',') + ',', schatten = 'rgba(' + wl.map((v, i) => Math.round((v * 0.5 + hm[i] * 0.5) * 0.7)).join(',') + ',';   // Oberseite heller als der Himmel, Unterseite dunkler

    gr2.addColorStop(0, farbe + a + ')'); gr2.addColorStop(0.62, farbe + (a * 0.5).toFixed(3) + ')'); gr2.addColorStop(1, farbe + '0)');
    x.fillStyle = gr2; x.fillRect(px - r, py - r, 2 * r, 2 * r);

    const wx = zuf() * B, wy = (105 + zuf() * 118) * s, gr = (18 + zuf() * 36) * s * (st.wolken > 10 ? 0.8 : 1), n = 10 + Math.floor(zuf() * 10), flach = 0.5 + zuf() * 0.3, baelle = [];
    for (let t = 0; t < n; t++) { const u = (zuf() * 2 - 1) * 0.9; baelle.push([u * gr * 2.2, -(1 - u * u) * gr * flach * (0.6 + zuf() * 0.8), gr * (0.45 + (1 - Math.abs(u)) * 0.45 + zuf() * 0.2)]); }

      for (const b of baelle) puff(b[0], b[1] - b[2] * 0.14, b[2] * 0.9, hell, 0.8);

    const cx = zuf() * B, cy = (24 + zuf() * 60) * s, l = (90 + zuf() * 170) * s, w = (zuf() - 0.5) * 0.16, d = 0.05 + zuf() * 0.05;

  }

}

// ── Showroom: das gewählte Auto gross und langsam drehend ─────────────────

  max: 420, grenze: 260, n: 0,
  init(szene) {

    this.f = new Float32Array(this.max * 3);

    this.netz.frustumCulled = false; this.netz.count = 0;

  },
  neu(x, y, z, vx, vy, vz, leben, groesse, hex, schwer) {
    let i = this.n;

    d[o] = x; d[o + 1] = y; d[o + 2] = -z; d[o + 3] = vx; d[o + 4] = vy; d[o + 5] = -vz; d[o + 6] = leben; d[o + 7] = groesse; d[o + 8] = schwer;
    const c = Geo.farbe(hex);

  },
  // Wolke aus «anzahl» Teilchen
  wolke(x, y, z, anzahl, tempo, hex, groesse, leben, schwer) {
    for (let q = 0; q < anzahl; q++) {
      const w = Math.random() * TAU, t = tempo * (0.3 + Math.random() * 0.7);
      this.neu(x, y, z, Math.cos(w) * t, Math.random() * tempo * 0.8, Math.sin(w) * t, leben * (0.6 + Math.random() * 0.6), groesse * (0.6 + Math.random() * 0.8), hex, schwer);
    }
  },
  update(dt) {
    const d = this.d, f = this.f, h = this.hilf, farben = this.netz.instanceColor.array;

    this.netz.instanceColor.needsUpdate = true;
  },

Object.assign(Grafik, {

  // Weich auslaufend und leicht unregelmässig (zerknautscht); jeder Punkt höchstens CONFIG.grafik.delle.max von der ursprünglichen Form.
  delle(o, k, phi, staerke) {
    const H = o && o.haut, D = CONFIG.grafik.delle;
    if (!H || this.qualitaet === 'niedrig' || staerke < D.ab || this.zeit - o.delleZeit < 0.3) return;
    o.delleZeit = this.zeit;
    const pa = H.attributes.position, A = pa.array, ur = o.hautUr || (o.hautUr = Float32Array.from(A));
    if (o.hautY == null) { let lo = 1e9, hi = -1e9; for (let i = 1; i < ur.length; i += 3) { lo = Math.min(lo, ur[i]); hi = Math.max(hi, ur[i]); } o.hautY = [lo + (hi - lo) * 0.12, lo + (hi - lo) * 0.55]; }
    const w = phi - (o.blickAlt != null ? o.blickAlt : k.richtung), dx = Math.cos(w), dz = -Math.sin(w);       // Stossrichtung im Auto (vorne +x)
    let best = -1e9, px = 0, py = 0, pz = 0;
    for (let i = 0; i < A.length; i += 3) {                      // Aufschlagpunkt: äusserster Punkt der Flanke in Stossrichtung
      if (A[i + 1] < o.hautY[0] || A[i + 1] > o.hautY[1]) continue;
      const d = A[i] * dx + A[i + 2] * dz;
      if (d > best) { best = d; px = A[i]; py = A[i + 1]; pz = A[i + 2]; }

const Ton = {
  ctx: null, master: null, fx: null, musikGain: null, hallEin: null, rauschen: null, motoren: [], fremdStimmen: [], jubelGain: null,
  stumm: false, laut: 0.7, musikLaut: 0.4, musikGewollt: false, musikTakt: null, musikZeit: 0, musikSchritt: 0, art: 'menue',

  // Browser erlauben Ton erst nach der ersten Eingabe – darum wird start() bei jedem Klick/Tastendruck gerufen
  start() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    const grenze = c.createDynamicsCompressor(); grenze.threshold.value = -14; grenze.ratio.value = 6; grenze.connect(c.destination);
    this.master = c.createGain(); this.master.connect(grenze);
    this.fx = c.createGain(); this.fx.connect(this.master);
    this.musikGain = c.createGain(); this.musikGain.connect(this.master);
    const buf = c.createBuffer(1, c.sampleRate, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.rauschen = buf;
    // Hall-Raum: ausklingendes Rauschen als Raum-Antwort
    const n = Math.floor(c.sampleRate * 1.3), raum = c.createBuffer(2, n, c.sampleRate);
    for (let k = 0; k < 2; k++) { const r = raum.getChannelData(k); for (let i = 0; i < n; i++) r[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); }
    const hall = c.createConvolver(); hall.buffer = raum;
    this.hallEin = c.createGain(); this.hallEin.gain.value = 0.05; this.hallEin.connect(hall); hall.connect(this.fx);
    // Publikum: Rauschen in zwei Bändern, wird bei Start, Zieldurchfahrt und Ziel laut
    this.jubelGain = c.createGain(); this.jubelGain.gain.value = 0; this.jubelGain.connect(this.fx);
    for (const hz of [700, 1500]) { const q = this.quelle(), f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = hz; f.Q.value = 0.7; q.connect(f); f.connect(this.jubelGain); }
    this.setze();
    if (this.musikGewollt) this.musik(true);
  },
  quelle() { const q = this.ctx.createBufferSource(); q.buffer = this.rauschen; q.loop = true; q.start(0, Math.random()); return q; },
  // laut = Effekte, musikLaut = Musik, stumm = alles aus
  setze() {
    if (!this.ctx) return;
    this.master.gain.value = this.stumm ? 0 : 1;
    this.fx.gain.value = this.laut;
    this.musikGain.gain.value = this.musikLaut * 0.55;
  },

  // einzelner Ton mit Hüllkurve
  ton(freq, dauer, typ, laut, zielFreq, wann, ziel, anstieg) {
    const c = this.ctx; if (!c) return;
    const t = Math.max(c.currentTime, c.currentTime + (wann || 0));
    const o = c.createOscillator(), g = c.createGain();
    o.type = typ || 'square'; o.frequency.setValueAtTime(freq, t);
    if (zielFreq) o.frequency.exponentialRampToValueAtTime(zielFreq, t + dauer);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(laut || 0.2, t + (anstieg || 0.012)); g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
    o.connect(g); g.connect(ziel || this.fx); o.start(t); o.stop(t + dauer + 0.03);
  },
  // Rauschen (Krach, Zischen, Schläge)
  krach(dauer, laut, filter, wann, ziel, zielFilter, guete) {
    const c = this.ctx; if (!c) return;
    const t = Math.max(c.currentTime, c.currentTime + (wann || 0));
    const q = c.createBufferSource(); q.buffer = this.rauschen; q.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(filter || 1200, t); f.Q.value = guete || 0.8;
    if (zielFilter) f.frequency.exponentialRampToValueAtTime(zielFilter, t + dauer);
    const g = c.createGain(); g.gain.setValueAtTime(laut || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
    q.connect(f); f.connect(g); g.connect(ziel || this.fx); q.start(t, Math.random() * 0.5); q.stop(t + dauer + 0.03);
  },
  // Publikum jubelt (staerke 0…1.2)
  jubel(staerke) {
    if (!this.ctx) return;
    const g = this.jubelGain.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setTargetAtTime(0.16 * staerke, t, 0.15); g.setTargetAtTime(0.1 * staerke, t + 0.7, 0.3); g.setTargetAtTime(0, t + 1.6 + staerke, 0.9);
    for (let i = 0; i < 5; i++) this.ton(700 + Math.random() * 500, 0.25, 'triangle', 0.02 * staerke, 900 + Math.random() * 700, 0.1 + i * 0.17 + Math.random() * 0.1);     // einzelne Pfiffe und Rufe
  },

  spiele(name) {
    if (!this.ctx) return;
    switch (name) {
      case 'klick': this.ton(620, 0.05, 'triangle', 0.09); this.ton(930, 0.04, 'sine', 0.05, 0, 0.02); break;
      case 'tick': this.ton(440, 0.18, 'square', 0.16); this.ton(880, 0.12, 'sine', 0.1); break;
      case 'los': this.ton(880, 0.6, 'square', 0.2); this.ton(1320, 0.6, 'triangle', 0.14); this.ton(1760, 0.5, 'sine', 0.08); break;
      case 'turbo': this.krach(0.45, 0.3, 600, 0, null, 3200); this.ton(220, 0.3, 'sawtooth', 0.12, 660); break;
      case 'boost': this.krach(0.8, 0.34, 400, 0, null, 2600); this.ton(160, 0.6, 'sawtooth', 0.14, 520); break;
      case 'treffer': this.krach(0.4, 0.55, 800); this.krach(0.12, 0.4, 3200); this.ton(170, 0.32, 'square', 0.2, 55); break;
      case 'wand': this.krach(0.18, 0.34, 420); this.krach(0.06, 0.2, 2600); this.ton(110, 0.14, 'square', 0.14, 60); break;       // dumpfer Schlag und Blech
      case 'rempler': this.krach(0.12, 0.3, 900); this.ton(150, 0.1, 'triangle', 0.14, 90); break;
      case 'landung': this.krach(0.22, 0.3, 240); this.ton(70, 0.2, 'sine', 0.3, 40); break;
      case 'bp': this.ton(784, 0.09, 'triangle', 0.16); this.ton(1175, 0.14, 'triangle', 0.16, 0, 0.08); break;
      case 'vorbei': this.ton(523, 0.08, 'triangle', 0.16); this.ton(784, 0.08, 'triangle', 0.16, 0, 0.07); this.ton(1047, 0.16, 'triangle', 0.16, 0, 0.14); break;     // selbst überholt
      case 'ueberholt': this.ton(392, 0.12, 'sawtooth', 0.1, 262); this.krach(0.3, 0.12, 1800, 0, null, 500); break;                                                    // wurde überholt
      case 'bau':       // Hämmern und Bohren
        for (let i = 0; i < 4; i++) { this.krach(0.06, 0.3, 2400, i * 0.15); this.ton(300, 0.05, 'square', 0.12, 0, i * 0.15); }
        this.ton(190, 0.45, 'sawtooth', 0.07, 260, 0.62); this.krach(0.45, 0.1, 3400, 0.62, null, 0, 4); break;
      case 'fertig': this.ton(392, 0.1, 'square', 0.13); this.ton(523, 0.1, 'square', 0.13, 0, 0.1); this.ton(659, 0.2, 'square', 0.13, 0, 0.2); break;
      case 'warnung': this.ton(988, 0.11, 'square', 0.15); this.ton(740, 0.11, 'square', 0.15, 0, 0.14); this.ton(988, 0.11, 'square', 0.15, 0, 0.28); break;
      case 'nein': this.ton(160, 0.14, 'sawtooth', 0.14, 110); break;
      case 'runde': this.ton(660, 0.1, 'square', 0.14); this.ton(990, 0.2, 'square', 0.14, 0, 0.1); break;
      case 'letzte': [659, 784, 988, 1319].forEach((f, i) => this.ton(f, 0.16, 'square', 0.15, 0, i * 0.09)); this.ton(1319, 0.5, 'triangle', 0.14, 0, 0.4); break;      // letzte Runde
      case 'ziel': [523, 659, 784, 1047].forEach((f, i) => this.ton(f, 0.24, 'square', 0.16, 0, i * 0.13)); this.ton(1568, 0.7, 'triangle', 0.12, 0, 0.55); break;
      case 'reset': this.ton(300, 0.3, 'sine', 0.2, 900); break;
    }
  },

  // ── Motoren: pro lokalem Spieler ein mehrschichtiger Motor samt Fahrgeräuschen ──
  // autos: Liste der Auto-Kennungen der lokalen Spieler
  motorAn(autos) {
    this.motorAus();
    const c = this.ctx; if (!c) return;
    if (typeof autos === 'number') autos = new Array(autos).fill('sport');
    const kurve = new Float32Array(257); for (let i = 0; i < 257; i++) { const x = i / 128 - 1; kurve[i] = Math.tanh(x * 2.4); }      // leichte Verzerrung: macht den Motor kernig
    const rausch = (typ, hz, q) => { const f = c.createBiquadFilter(), g = c.createGain(); f.type = typ; f.frequency.value = hz; f.Q.value = q; g.gain.value = 0; const s = this.quelle(); s.connect(f); f.connect(g); g.connect(this.fx); return { s, f, g }; };
    for (const id of autos) {
      const M = MOTOREN[id] || MOTOREN.sport;
      const o1 = c.createOscillator(), o2 = c.createOscillator(), o3 = c.createOscillator(), g3 = c.createGain(), form = c.createWaveShaper(), f = c.createBiquadFilter(), g = c.createGain();
      o1.type = M.w1; o2.type = M.w2; o3.type = 'sawtooth'; g3.gain.value = 0.35; form.curve = kurve; f.type = 'lowpass'; f.frequency.value = M.f; f.Q.value = 1.2; g.gain.value = 0;
      o1.connect(form); o2.connect(form); o3.connect(g3); g3.connect(form); form.connect(f); f.connect(g); g.connect(this.fx); g.connect(this.hallEin);
      const pf = c.createOscillator(), pg = c.createGain(); pf.type = 'sine'; pg.gain.value = 0; pf.connect(pg); pg.connect(this.fx);
      o1.start(); o2.start(); o3.start(); pf.start();
      this.motoren.push({ M, o1, o2, o3, f, g, pf, pg, ansaug: rausch('bandpass', 420, 0.9), quietsch: rausch('bandpass', 2300, 5), roll: rausch('lowpass', 320, 0.6), wind: rausch('highpass', 2600, 0.4),
        gang: 0, schalt: 0, drehzahl: 0.2, teiler: Math.sqrt(autos.length) });
    }
    // Stimmen für die drei nächsten fremden Autos (nur wenn ein Spieler allein am Gerät fährt)
    if (autos.length === 1 && c.createStereoPanner) for (let i = 0; i < 3; i++) {
      const o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), p = c.createStereoPanner();
      o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(p); p.connect(this.fx); p.connect(this.hallEin); o1.start(); o2.start();
      this.fremdStimmen.push({ o1, o2, f, g, p, abstand: 0 });
    }
  },
  // tempo 0…1.3; aus = stumm (Pause); hall 0…1 (Brücke, zwischen Bauwerken)
  motor(i, tempo, gas, drift, boost, gelaende, aus, hall) {
    const m = this.motoren[i]; if (!m) return;
    const t = this.ctx.currentTime, M = m.M, dt = 1 / 60;
    // Gänge: die Drehzahl steigt in jedem Gang an und fällt beim Hochschalten zurück
    const lage = clamp(tempo, 0, 1.25) * M.gaenge * 0.8, gang = Math.min(M.gaenge - 1, Math.floor(lage));
    if (gang !== m.gang) { if (tempo > 0.12 && !aus) { m.schalt = 0.13; this.krach(0.03, 0.05 / m.teiler, 1700); } m.gang = gang; }
    m.schalt = Math.max(0, m.schalt - dt);
    const ziel = 0.22 + 0.78 * clamp(lage - gang, 0, 1) * (gang === M.gaenge - 1 ? 1 : 0.92) + (gas ? 0.06 : -0.05) + (boost ? 0.12 : 0);
    m.drehzahl += (ziel - m.drehzahl) * (gas ? 0.2 : 0.09);
    const hz = M.hz * (1 + m.drehzahl * M.spanne);
    m.o1.frequency.setTargetAtTime(hz, t, 0.03); m.o2.frequency.setTargetAtTime(hz * 0.5, t, 0.03); m.o3.frequency.setTargetAtTime(hz * 1.503, t, 0.03);
    m.f.frequency.setTargetAtTime(M.f * (0.7 + m.drehzahl * 2.2 + (gas ? 0.9 : 0)), t, 0.06);
    const last = (gas ? 1 : 0.5) * (m.schalt > 0 ? 0.45 : 1);
    m.g.gain.setTargetAtTime(aus ? 0 : (M.laut * (0.035 + m.drehzahl * 0.045) * last) / m.teiler, t, 0.05);
    m.ansaug.f.frequency.setTargetAtTime(300 + m.drehzahl * 900, t, 0.05);
    m.ansaug.g.gain.setTargetAtTime(aus ? 0 : (M.rau * (gas ? 0.05 : 0.015) * (0.4 + m.drehzahl)) / m.teiler, t, 0.05);
    m.pf.frequency.setTargetAtTime(2400 + m.drehzahl * 5200, t, 0.08);
    m.pg.gain.setTargetAtTime(aus || !gas ? 0 : (M.pfeif * 0.012 * m.drehzahl) / m.teiler, t, 0.1);
    // Fahrgeräusche: Reifenquietschen, Abrollen (Asphalt oder Kies), Fahrtwind
    m.quietsch.f.frequency.setTargetAtTime(2100 + tempo * 500 + Math.sin(t * 9) * 120, t, 0.04);
    m.quietsch.g.gain.setTargetAtTime(aus || !drift || gelaende ? 0 : (0.05 + tempo * 0.05) / m.teiler, t, 0.05);
    m.roll.f.type = gelaende ? 'bandpass' : 'lowpass';
    m.roll.f.frequency.setTargetAtTime(gelaende ? 800 + Math.sin(t * 31) * 300 : 300, t, 0.04);
    m.roll.g.gain.setTargetAtTime(aus ? 0 : ((gelaende ? 0.11 : 0.05) * Math.min(1, tempo * 1.5)) / m.teiler, t, 0.06);
    m.wind.g.gain.setTargetAtTime(aus ? 0 : (0.03 * tempo * tempo) / m.teiler, t, 0.1);
    if (i === 0) this.hallEin.gain.setTargetAtTime(0.05 + 0.5 * (hall || 0), t, 0.2);
  },
  // Andere Autos: aus der richtigen Richtung, leiser mit dem Abstand, Tonhöhe ändert sich beim Vorbeifahren
  fremde(R, ich, dt, aus) {
    const S = this.fremdStimmen, O = Grafik.kartObjekte;
    if (!S.length || !O[ich]) return;
    const t = this.ctx.currentTime, p0 = O[ich].gruppe.position, w = O[ich].gruppe.rotation.y, liste = [];
    for (let i = 0; i < R.karts.length; i++) {
      if (i === ich || !O[i]) continue;
      const p = O[i].gruppe.position, dx = p.x - p0.x, dz = p.z - p0.z, d = Math.hypot(dx, dz);
      if (d < 60) liste.push({ i, d, rechts: dx * Math.sin(w) + dz * Math.cos(w) });
    }
    liste.sort((a, b) => a.d - b.d);
    for (let q = 0; q < S.length; q++) {
      const s = S[q], l = liste[q];
      if (!l || aus) { s.g.gain.setTargetAtTime(0, t, 0.1); s.kart = -1; continue; }
      const k = R.karts[l.i], M = MOTOREN[k.fahrzeug] || MOTOREN.sport, tempo = clamp(Math.abs(k.v) / CONFIG.fahren.vmax, 0, 1.3);
      const radial = s.kart === l.i && dt > 0 ? (l.d - s.abstand) / dt : 0;                // nähert sich (negativ) oder entfernt sich
      s.kart = l.i; s.abstand = l.d;
      const hz = M.hz * (1 + (0.25 + tempo * 0.65) * M.spanne) * clamp(1 - radial / 120, 0.82, 1.2);
      s.o1.frequency.setTargetAtTime(hz, t, 0.06); s.o2.frequency.setTargetAtTime(hz * 0.5, t, 0.06);
      s.f.frequency.setTargetAtTime(M.f * (0.8 + tempo * 1.6) / (1 + l.d / 25), t, 0.1);
      s.g.gain.setTargetAtTime((0.06 * M.laut) / (1 + (l.d * l.d) / 90), t, 0.08);
      s.p.pan.setTargetAtTime(clamp(l.rechts / (l.d + 3), -1, 1), t, 0.08);
    }
  },
  motorAus() {
    for (const m of this.motoren) {
      try { m.o1.stop(); m.o2.stop(); m.o3.stop(); m.pf.stop(); for (const r of [m.ansaug, m.quietsch, m.roll, m.wind]) { r.s.stop(); r.g.disconnect(); } } catch (e) { /* schon gestoppt */ }
      m.g.disconnect(); m.pg.disconnect();
    }
    for (const s of this.fremdStimmen) { try { s.o1.stop(); s.o2.stop(); } catch (e) { /* schon gestoppt */ } s.p.disconnect(); }
    this.motoren = []; this.fremdStimmen = [];
  },

  // ── Musik (eigene Tonfolgen): «menue» ruhig, «rennen» treibend, «final» schneller und dichter für die letzte Runde ──
  musikArt(art) { if (this.art !== art) { this.art = art; this.musikSchritt = 0; } },
  musik(an) {
    this.musikGewollt = an;
    if (!this.ctx) return;
    if (this.musikTakt) { clearInterval(this.musikTakt); this.musikTakt = null; }
    if (!an) return;
    this.musikZeit = this.ctx.currentTime + 0.1; this.musikSchritt = 0;
    this.musikTakt = setInterval(() => this.musikPlane(), 100);
  },
  musikPlane() {
    const c = this.ctx, A = this.art, Z = this.musikGain;
    const dauer = 60 / (A === 'menue' ? 92 : A === 'final' ? 142 : 128) / 4;               // eine Sechzehntelnote
    const GRUND = [110, 87.31, 130.81, 98], TERZ = [1.189, 1.26, 1.26, 1.26];              // a-Moll, F-Dur, C-Dur, G-Dur
    const MEL = [[4, 0, 3, 0, 2, 0, 3, 4, 0, 0, 5, 0, 4, 0, 2, 0], [2, 0, 3, 0, 4, 0, 3, 2, 0, 0, 1, 0, 2, 0, 4, 0], [4, 0, 5, 0, 6, 0, 5, 4, 0, 0, 3, 0, 4, 0, 6, 0], [3, 0, 4, 0, 5, 0, 4, 3, 0, 0, 2, 0, 3, 5, 6, 0]];
    if (this.musikZeit < c.currentTime - 0.5) this.musikZeit = c.currentTime + 0.05;       // nach einer Pause (Tab im Hintergrund) neu ansetzen
    while (this.musikZeit < c.currentTime + 0.3) {
      const n = this.musikSchritt, i = n % 16, takt = Math.floor(n / 16), ak = takt % 4, g = GRUND[ak], wann = this.musikZeit - c.currentTime;
      const dreiklang = [g * 2, g * 2 * TERZ[ak], g * 3, g * 4];
      if (A === 'menue') {
        if (i === 0) for (const f of dreiklang.slice(0, 3)) { this.ton(f, dauer * 15, 'sine', 0.07, 0, wann, Z, 0.5); this.ton(f * 1.003, dauer * 15, 'triangle', 0.04, 0, wann, Z, 0.7); }     // Flächen
        if (i % 4 === 0) this.ton(dreiklang[(i / 4 + takt) % 4] * 2, dauer * 3, 'triangle', 0.07, 0, wann, Z);                                                                             // perlende Töne
        if (i === 0 || i === 10) this.ton(g, dauer * 5, 'sine', 0.2, 0, wann, Z, 0.03);
        if (i % 8 === 4) this.krach(0.05, 0.03, 5000, wann, Z);
      } else {
        const fin = A === 'final';
        if (i % 2 === 0) this.ton(g * (i % 8 === 6 ? 2 : 1), dauer * 1.7, 'square', 0.13, 0, wann, Z);                               // Bass
        if (i % 4 === 0) this.ton(130, 0.13, 'sine', 0.34, 42, wann, Z);                                                              // Pauke
        if (i % 8 === 4) { this.krach(0.11, 0.16, 1800, wann, Z); this.ton(190, 0.08, 'triangle', 0.1, 120, wann, Z); }               // Schlag auf 2 und 4
        if (fin || i % 4 === 2) this.krach(0.03, i % 4 === 2 ? 0.1 : 0.05, 7000, wann, Z);                                            // Hi-Hat
        if ((fin || takt % 8 >= 4) && MEL[ak][i]) this.ton(g * 4 * Math.pow(2, [0, 0, 2, 3, 5, 7, 8, 10][MEL[ak][i]] / 12) * (ak === 0 ? 1 : 1), dauer * 1.8, 'triangle', 0.11, 0, wann, Z);    // Melodie
        if (fin && i % 2 === 1) this.ton(dreiklang[((i - 1) / 2) % 4] * 2, dauer * 0.9, 'square', 0.035, 0, wann, Z);                 // schnelle Begleitung in der letzten Runde
      }
      this.musikZeit += dauer; this.musikSchritt++;
    }
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   TEIL 8e: Boost-Felder – leuchtende Pfeile auf der Fahrbahn, die nach vorn laufen
   (Lage und Wirkung: Strecke.baueBoostfelder, Rennen.orte, CONFIG.boostfeld)
   ══════════════════════════════════════════════════════════════════════════ */
const Boostfelder = {
  // ein Pfeil pro Kachel auf dunkler, halb durchsichtiger Platte mit hellblauem Rand (oben im Bild = vorn)
  bild() {
    const N = 64, c = document.createElement('canvas'); c.width = c.height = N;
    const x = c.getContext('2d');
    x.fillStyle = 'rgba(6,16,36,0.6)'; x.fillRect(0, 0, N, N);
    x.fillStyle = 'rgba(90,225,255,0.95)'; x.fillRect(0, 0, 4, N); x.fillRect(N - 4, 0, 4, N);
    x.strokeStyle = '#ffd43a'; x.lineWidth = 10; x.lineJoin = 'miter';
    x.beginPath(); x.moveTo(11, 47); x.lineTo(32, 21); x.lineTo(53, 47); x.stroke();
    x.strokeStyle = 'rgba(255,250,210,0.9)'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(15, 44); x.lineTo(32, 23); x.lineTo(49, 44); x.stroke();
    return c;
  },
  baue(G, S, W) {
    this.tex = null;
    if (!S.boostfelder || !S.boostfelder.length) return;
    const t = new THREE.CanvasTexture(this.bild());
    t.wrapS = THREE.ClampToEdgeWrapping; t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = G.qualitaet === 'niedrig' ? 1 : 4;

  karussell(b, x, y, z) {

    for (let q = 0; q < 12; q++) {
      const w = (q / 12) * TAU, cx = x + Math.cos(w) * 3.8, cz = z + Math.sin(w) * 3.8;
      F.rohr(cx, y + 0.3, cz, cx, y + 3.9, cz, 0.05, 0.05, Geo.farbe(0xd8b060), 4);

/* ══════════════════════════════════════════════════════════════════════════
   TEIL 8g: Nachbearbeitung des Bildes (ab Grafik «Mittel»)
   Die Szene wird zuerst in ein Zwischenbild mit grossem Helligkeitsumfang
   gezeichnet (mit Kantenglättung). Daraus entsteht das fertige Bild:
   · Leuchten (Bloom): Helle Stellen wie Lampen, Fenster, Sonne und Glanzlichter
     strahlen weich über ihre Ränder.
   · Umgebungsverdeckung (nur «Ultra»): Ecken und Fugen werden leicht abgedunkelt.
   · Farbabstimmung je Ort (BILDSTIL): Sättigung, Kontrast, Farbstich, dunkle Bildecken.
   Alles sind eigene, kleine Shader; es braucht keine weitere Bibliothek.
   ══════════════════════════════════════════════════════════════════════════ */

// Bildstil pro Ort. leuchten: Stärke des Leuchtens · schwelle: ab dieser Helligkeit leuchtet etwas (1 = weiss im Sonnenlicht)
// saettigung/kontrast: 1 = unverändert · tonung: Farbstich [rot, grün, blau] · vignette: Abdunkeln der Bildecken (0 = aus)
const BILDSTIL = {
  standard:  { leuchten: 0.45, schwelle: 1.0,  saettigung: 1.08, kontrast: 1.05, tonung: [1.0, 1.0, 1.0],    vignette: 0.28 },
  kiesgrube: { leuchten: 0.5,  schwelle: 1.0,  saettigung: 1.1,  kontrast: 1.06, tonung: [1.03, 1.0, 0.96],  vignette: 0.3 },    // warmes Abendlicht
  bergpass:  { leuchten: 0.35, schwelle: 1.1,  saettigung: 1.14, kontrast: 1.05, tonung: [0.99, 1.0, 1.03],  vignette: 0.24 },   // klarer Morgen
  paris:     { leuchten: 0.55, schwelle: 1.2,  saettigung: 1.08, kontrast: 1.06, tonung: [1.04, 0.99, 0.96], vignette: 0.34 },   // Abend mit Lichtern; hohe Schwelle, sonst glüht der angestrahlte Eisenturm
  himalaya:  { leuchten: 0.22, schwelle: 1.9,  saettigung: 1.12, kontrast: 1.08, tonung: [0.98, 1.0, 1.04],  vignette: 0.3 },    // kalt und klar; Schnee ist sehr hell, darum hohe Schwelle (sonst überstrahlt er den Himmel)
  aegypten:  { leuchten: 0.35, schwelle: 1.2,  saettigung: 1.12, kontrast: 1.08, tonung: [1.02, 1.0, 0.97],  vignette: 0.26 },   // Mittagshitze, nur leicht warm, damit der Himmel blau bleibt
  newyork:   { leuchten: 0.8,  schwelle: 0.85,  saettigung: 1.16, kontrast: 1.08, tonung: [0.97, 1.0, 1.06],  vignette: 0.4 },    // Nacht mit Leuchtreklamen
};

const Nach = {
  an: false, ao: false, glaetten: 0, stufen: 5, ziel: null, kette: [], aoZiel: null, breite: 0, hoehe: 0, stil: BILDSTIL.standard, bereit: false,

  init() {
    if (this.bereit) return;
    const R = Grafik.renderer, gl = R.getContext();
    // Zwischenbilder mit grossem Helligkeitsumfang brauchen eine Erweiterung; fehlt sie, bleibt die Nachbearbeitung aus
    this.moeglich = !!(R.capabilities.isWebGL2 && (R.extensions.has('EXT_color_buffer_float') || R.extensions.has('EXT_color_buffer_half_float')));
    this.kam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const g = new THREE.BufferGeometry();      // ein Dreieck, das den ganzen Bildschirm bedeckt
    g.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));
    this.netz = new THREE.Mesh(g, null); this.netz.frustumCulled = false;
    this.szene = new THREE.Scene(); this.szene.add(this.netz);
    const vs = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
    const M = (fs, u, mehr) => new THREE.ShaderMaterial(Object.assign({ vertexShader: vs, fragmentShader: fs, uniforms: u, depthTest: false, depthWrite: false, toneMapped: false, fog: false }, mehr || {}));
    const kopf = 'uniform sampler2D tBild; uniform vec2 px; varying vec2 vUv;\n';
    // 1 helle Stellen herausholen und dabei auf halbe Grösse verkleinern
    this.mHell = M(kopf + `uniform float schwelle;
      vec3 hell(vec2 uv) { vec3 c = min(texture2D(tBild, uv).rgb, vec3(16.0)); float l = max(c.r, max(c.g, c.b)); return c * (max(l - schwelle, 0.0) / max(l, 1e-4)); }
      void main() { gl_FragColor = vec4((hell(vUv + px * vec2(-1.0, -1.0)) + hell(vUv + px * vec2(1.0, -1.0)) + hell(vUv + px * vec2(-1.0, 1.0)) + hell(vUv + px * vec2(1.0, 1.0))) * 0.25, 1.0); }`,
      { tBild: { value: null }, px: { value: new THREE.Vector2() }, schwelle: { value: 1 } });
    // 2 weich verkleinern …
    this.mKlein = M(kopf + `void main() { vec3 s = texture2D(tBild, vUv).rgb * 4.0;
        s += texture2D(tBild, vUv + px * vec2(-1.0, -1.0)).rgb + texture2D(tBild, vUv + px * vec2(1.0, -1.0)).rgb + texture2D(tBild, vUv + px * vec2(-1.0, 1.0)).rgb + texture2D(tBild, vUv + px * vec2(1.0, 1.0)).rgb;
        gl_FragColor = vec4(s / 8.0, 1.0); }`, { tBild: { value: null }, px: { value: new THREE.Vector2() } });
    // 3 … und weich wieder vergrössern, dabei aufaddieren
    this.mGross = M(kopf + `uniform float anteil;
      void main() { vec3 s = texture2D(tBild, vUv + vec2(-2.0 * px.x, 0.0)).rgb + texture2D(tBild, vUv + vec2(2.0 * px.x, 0.0)).rgb + texture2D(tBild, vUv + vec2(0.0, 2.0 * px.y)).rgb + texture2D(tBild, vUv + vec2(0.0, -2.0 * px.y)).rgb;
        s += (texture2D(tBild, vUv + px * vec2(-1.0, 1.0)).rgb + texture2D(tBild, vUv + px * vec2(1.0, 1.0)).rgb + texture2D(tBild, vUv + px * vec2(-1.0, -1.0)).rgb + texture2D(tBild, vUv + px * vec2(1.0, -1.0)).rgb) * 2.0;
        gl_FragColor = vec4(s / 12.0 * anteil, 1.0); }`, { tBild: { value: null }, px: { value: new THREE.Vector2() }, anteil: { value: 1 } },
      { blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, transparent: true });
    // Umgebungsverdeckung aus dem Tiefenbild (halbe Auflösung)
    this.mAO = M(`uniform sampler2D tTiefe; uniform vec2 px; uniform mat4 projInv; uniform vec2 mass; uniform float radius; varying vec2 vUv;
      vec3 ort(vec2 uv) { float z = texture2D(tTiefe, uv).x; vec4 p = projInv * vec4(uv * 2.0 - 1.0, z * 2.0 - 1.0, 1.0); return p.xyz / p.w; }
      void main() {
        if (texture2D(tTiefe, vUv).x >= 0.99995) { gl_FragColor = vec4(1.0); return; }
        vec3 p = ort(vUv), r = ort(vUv + vec2(px.x, 0.0)), l = ort(vUv - vec2(px.x, 0.0)), o = ort(vUv + vec2(0.0, px.y)), u = ort(vUv - vec2(0.0, px.y));
        vec3 dx = abs(r.z - p.z) < abs(p.z - l.z) ? r - p : p - l, dy = abs(o.z - p.z) < abs(p.z - u.z) ? o - p : p - u;
        vec3 n = normalize(cross(dx, dy));
        float w0 = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))) * 6.2831853, summe = 0.0;
        vec2 rs = radius * mass / max(-p.z, 0.5);      // Radius auf dem Bildschirm
        for (int i = 0; i < 10; i++) {
          float f = (float(i) + 0.5) / 10.0, a = w0 + f * 15.08;
          vec3 v = ort(vUv + vec2(cos(a), sin(a)) * rs * (0.15 + 0.85 * f)) - p;
          float d2 = dot(v, v);
          summe += max(dot(n, v) - 0.03 - 0.004 * -p.z, 0.0) / (d2 + 0.06) * smoothstep(radius * radius * 1.5, radius * radius * 0.5, d2);
        }
        float ao = clamp(1.0 - summe * 0.28, 0.0, 1.0);
        gl_FragColor = vec4(vec3(mix(ao, 1.0, smoothstep(70.0, 240.0, -p.z))), 1.0);      // in der Ferne ausblenden (dort liegt Dunst)
      }`, { tTiefe: { value: null }, px: { value: new THREE.Vector2() }, projInv: { value: new THREE.Matrix4() }, mass: { value: new THREE.Vector2() }, radius: { value: 1.4 } });
    // Schlussbild: alles zusammensetzen, Helligkeit auf den Bildschirm abbilden, Farben abstimmen
    this.mFertig = M(`uniform sampler2D tBild, tLeucht, tAO; uniform vec2 px; uniform float leuchten, saettigung, kontrast, vignette, aoKraft; uniform vec3 tonung; varying vec2 vUv;
      void main() {
        vec3 c = texture2D(tBild, vUv).rgb;
        if (aoKraft > 0.0) {
          float ao = (texture2D(tAO, vUv).r * 2.0 + texture2D(tAO, vUv + px * vec2(3.0, 3.0)).r + texture2D(tAO, vUv + px * vec2(-3.0, 3.0)).r + texture2D(tAO, vUv + px * vec2(3.0, -3.0)).r + texture2D(tAO, vUv + px * vec2(-3.0, -3.0)).r) / 6.0;
          c *= mix(1.0, ao, aoKraft);
        }
        c += texture2D(tLeucht, vUv).rgb * leuchten;
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        vec3 f = gl_FragColor.rgb;
        f = mix(vec3(dot(f, vec3(0.2126, 0.7152, 0.0722))), f, saettigung);
        f = (f - 0.5) * kontrast + 0.5;
        f *= tonung;
        vec2 q = vUv - 0.5;
        f *= 1.0 - vignette * smoothstep(0.18, 0.75, dot(q, q) * 1.6);
        f += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;      // feines Rauschen gegen Farbstufen
        gl_FragColor = vec4(clamp(f, 0.0, 1.0), 1.0);
      }`, { tBild: { value: null }, tLeucht: { value: null }, tAO: { value: null }, px: { value: new THREE.Vector2() }, leuchten: { value: 0.5 }, saettigung: { value: 1 }, kontrast: { value: 1 },
      vignette: { value: 0.3 }, aoKraft: { value: 0 }, tonung: { value: new THREE.Vector3(1, 1, 1) } }, { toneMapped: true });
    this.bereit = true;
  },

  // Stufe einstellen: glaetten = Kantenglättung (Anzahl Abtastpunkte), ao = Umgebungsverdeckung, stufen = Weite des Leuchtens
  setze(an, glaetten, ao, stufen) {
    this.init();
    this.an = an && this.moeglich; this.glaetten = glaetten; this.ao = ao; this.stufen = stufen;
    this.raeume(); this.breite = 0;
  },
  setzeStil(id) { this.stil = BILDSTIL[id] || BILDSTIL.standard; },
  raeume() {
    if (this.ziel) { if (this.ziel.depthTexture) this.ziel.depthTexture.dispose(); this.ziel.dispose(); this.ziel = null; }
    for (const z of this.kette) z.dispose();
    this.kette = [];
    if (this.aoZiel) { this.aoZiel.dispose(); this.aoZiel = null; }
  },
  // Zwischenbilder in der Grösse des Fensters anlegen
  baue(w, h) {
    this.raeume();
    this.breite = w; this.hoehe = h;
    const art = Grafik.renderer.extensions.has('EXT_color_buffer_float') || Grafik.renderer.extensions.has('EXT_color_buffer_half_float') ? THREE.HalfFloatType : THREE.UnsignedByteType;
    this.ziel = new THREE.WebGLRenderTarget(w, h, { type: art, samples: this.glaetten, depthBuffer: true, stencilBuffer: false });
    if (this.ao) { this.ziel.depthTexture = new THREE.DepthTexture(w, h); this.ziel.depthTexture.type = THREE.UnsignedIntType; }
    let bw = w, bh = h;
    for (let i = 0; i < this.stufen; i++) {
      bw = Math.max(2, Math.round(bw / 2)); bh = Math.max(2, Math.round(bh / 2));
      const z = new THREE.WebGLRenderTarget(bw, bh, { type: art, depthBuffer: false, stencilBuffer: false });
      z.texture.minFilter = z.texture.magFilter = THREE.LinearFilter;
      this.kette.push(z);
    }
    if (this.ao) { this.aoZiel = new THREE.WebGLRenderTarget(Math.round(w / 2), Math.round(h / 2), { depthBuffer: false, stencilBuffer: false }); }
  },
  durchlauf(mat, ziel) {
    const R = Grafik.renderer;
    this.netz.material = mat;
    R.setRenderTarget(ziel);
    R.render(this.szene, this.kam);
  },

  // Zeichnet alle Ansichten (Split-Screen) ins Zwischenbild und dann das fertige Bild auf den Bildschirm.
  // jeAnsicht(a) wird vor jeder Ansicht aufgerufen (Sichtbarkeiten, Kamera).
  zeichne(szene, ansichten, jeAnsicht) {
    const R = Grafik.renderer, gr = R.getDrawingBufferSize(this._gr || (this._gr = new THREE.Vector2())), W = gr.x, H = gr.y;
    if (W < 2 || H < 2) return;
    if (W !== this.breite || H !== this.hoehe) this.baue(W, H);
    const Z = this.ziel, S = this.stil, auto = R.autoClear;
    R.autoClear = true;
    for (const a of ansichten) {
      const w = Math.round(a.w * W), h = Math.round(a.h * H), x = Math.round(a.x * W), y = H - Math.round(a.y * H) - h;
      Z.viewport.set(x, y, w, h); Z.scissor.set(x, y, w, h); Z.scissorTest = ansichten.length > 1;
      jeAnsicht(a, w, h);
      R.setRenderTarget(Z);
      R.render(szene, a.kamera);
    }
    Z.scissorTest = false;
    // Leuchten: helle Stellen verkleinern, verwischen, wieder vergrössern
    const K = this.kette, n = K.length;
    this.mHell.uniforms.tBild.value = Z.texture; this.mHell.uniforms.px.value.set(0.5 / W, 0.5 / H); this.mHell.uniforms.schwelle.value = S.schwelle;
    this.durchlauf(this.mHell, K[0]);
    for (let i = 1; i < n; i++) {
      this.mKlein.uniforms.tBild.value = K[i - 1].texture; this.mKlein.uniforms.px.value.set(0.5 / K[i - 1].width, 0.5 / K[i - 1].height);
      this.durchlauf(this.mKlein, K[i]);
    }
    R.autoClear = false;
    for (let i = n - 1; i > 0; i--) {
      this.mGross.uniforms.tBild.value = K[i].texture; this.mGross.uniforms.px.value.set(0.5 / K[i].width, 0.5 / K[i].height); this.mGross.uniforms.anteil.value = 1;
      this.durchlauf(this.mGross, K[i - 1]);
    }
    R.autoClear = true;
    // Umgebungsverdeckung (nur mit einer einzigen Ansicht)
    const F = this.mFertig.uniforms;
    let aoKraft = 0;
    if (this.ao && this.aoZiel && Z.depthTexture && ansichten.length === 1) {
      const k = ansichten[0].kamera, U = this.mAO.uniforms;
      U.tTiefe.value = Z.depthTexture; U.px.value.set(2 / W, 2 / H); U.projInv.value.copy(k.projectionMatrixInverse);
      U.mass.value.set(k.projectionMatrix.elements[0] / 2, k.projectionMatrix.elements[5] / 2);
      this.durchlauf(this.mAO, this.aoZiel);
      F.tAO.value = this.aoZiel.texture; aoKraft = 0.85;
    }
    F.tBild.value = Z.texture; F.tLeucht.value = K[0].texture; F.px.value.set(1 / W, 1 / H); F.aoKraft.value = aoKraft;
    F.leuchten.value = S.leuchten / Math.max(1, n * 0.42); F.saettigung.value = S.saettigung; F.kontrast.value = S.kontrast; F.vignette.value = ansichten.length > 1 ? 0 : S.vignette;
    F.tonung.value.set(S.tonung[0], S.tonung[1], S.tonung[2]);
    R.setRenderTarget(null);
    R.setScissorTest(false);
    R.setViewport(0, 0, window.innerWidth, window.innerHeight);
    this.netz.material = this.mFertig;
    R.render(this.szene, this.kam);
    R.autoClear = auto;
  },
};
/* ══════════════════════════════════════════════════════════════════════════
   Teil 7d: Leben in der Landschaft
   · Grasbüschel und Blumen neben der Strecke. Es sind viele tausend, aber jede Art braucht nur einen
     Zeichenaufruf (InstancedMesh). Sie wachsen nur, wo der Boden grün ist, in Flecken, nicht auf Wegen
     und nicht im Wasser. Weit weg von der Kamera schrumpfen sie weg (spart Arbeit und flimmert nicht).
   · Steine in der Farbe des Bodens auf Kies, Erde und Fels.
   · Wind: ein kleiner Zusatz im Shader lässt Halme und Blumen wiegen; Böen wandern über die Wiese.
   · Bäume und Büsche (Kiesgrube, Bergpass, Platanen in Paris, Parkbäume in New York): Fichten aus sieben gezackten Astschichten, Laubbäume mit Ästen
     und einer Krone aus vielen Blätterbüscheln (Karten mit einem im Code gemalten Blätterbild). Alle wiegen im Wind.
   · Zuschauer auf den Tribünen jubeln, Bauarbeiter mit Helm und Warnweste schaufeln bei Kran und Bagger.
   · Vögel: kleine Schwärme ziehen Kreise über der Strecke, schlagen mit den Flügeln und gleiten (nicht nachts).
   Zahlen pro Grafik-Stufe: CONFIG.grafik.leben
   ══════════════════════════════════════════════════════════════════════════ */

// Farben der Blüten: weiss, gelb, mohnrot, violett, blau, orange
const BLUETEN = [0xf4f1ea, 0xf6d23a, 0xd8322e, 0x9a6ad8, 0x5f86e8, 0xf08a2a];

const Leben = {
  zeit: { value: 0 },          // gemeinsame Uhr für Wind und Flügelschlag (Sekunden)
  netze: [], voegel: null, mats: {},

  // Shader-Zusatz für Gras, Blumen und Bäume: Wind (oben mehr als unten, Böen wandern über die Fläche),
  // Gras und Blumen schrumpfen in der Ferne weg. art: gras | blumen | wald
  windStoff(art) {
    if (this.mats[art]) return this.mats[art];
    const weit = CONFIG.grafik.leben.weit, wald = art === 'wald';
    const mat = new THREE.MeshStandardMaterial(wald ? { map: this.blattBild(), vertexColors: true, alphaTest: 0.5, alphaToCoverage: true, side: THREE.DoubleSide, roughness: 0.92, metalness: 0 } : { vertexColors: true, side: THREE.DoubleSide, roughness: 0.95, metalness: 0 });   // Standard wie die Umgebung: bekommt dasselbe Himmelslicht
    const staerke = wald ? '0.012 + 0.02 * boe' : '0.1 + 0.22 * boe';
    mat.onBeforeCompile = (sh) => {
      sh.uniforms.uZeit = this.zeit;
      sh.vertexShader = 'uniform float uZeit;\n' + sh.vertexShader
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          vec3 wo = vec3(0.0); float gross = 1.0;
          #ifdef USE_INSTANCING
            wo = instanceMatrix[3].xyz; gross = length(instanceMatrix[1].xyz);
          #endif
          float hoch = max(position.y, 0.0);
          float boe = 0.5 + 0.5 * sin(uZeit * 0.8 - wo.x * 0.03 - wo.z * 0.021);
          float zappeln = 0.75 + 0.25 * sin(uZeit * ${wald ? '1.7' : '3.4'} + wo.x * 1.3 + wo.z * 0.9);
          vec2 windWelt = vec2(${staerke}, ${wald ? '0.006' : '0.05'} * sin(uZeit * 2.1 + wo.z * 0.7)) * zappeln * hoch * hoch * gross;
          ${wald ? 'transformed.y += 0.007 * sin(uZeit * 5.0 + position.x * 31.0 + position.z * 17.0 + wo.x) * step(0.45, position.y);      // Blätter zittern' : `transformed *= 1.0 - smoothstep(${(weit * 0.7).toFixed(1)}, ${weit.toFixed(1)}, distance(wo, cameraPosition));`}`)
        .replace('#include <project_vertex>', `vec4 mvPosition = vec4(transformed, 1.0);
          #ifdef USE_INSTANCING
            mvPosition = instanceMatrix * mvPosition;
